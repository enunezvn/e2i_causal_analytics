name: Tier 1B Gate B2 Experiment (G2)

# Plan v4 Gate G2 — CI-controlled execution of the Tier 1B Gate B2
# pre-specified ΔAUC + ECE + CV-stability experiment. The first green
# run from S_prespec is the LOAD-BEARING G2 result.
#
# Trigger: tags matching `tier1b-b2-experiment-*`. The workflow:
#   1. Checks out the tag SHA.
#   2. Verifies the experiment commit is a CHILD of S_prespec via
#      scripts/check_g2_commit_graph.py.
#   3. Verifies the dataset content hashes match the pinned values in
#      docs/specs/tier1b_b2_prespec_20260510.md via
#      scripts/verify_g2_prespec_dataset_hashes.py.
#   4. Runs scripts/run_tier1b_b2_experiment.py against the named
#      cohort.
#   5. Uploads the run manifest as a CI artifact.
#
# Lifecycle state: `LIFECYCLE_STATE_G2 = ADVISORY` until the first
# green run lands. Promotion to ENFORCED requires the signed
# `docs/calibration/g2_completion_signoff_<date>.md` per N3.
#
# Pre-spec memo: `docs/specs/tier1b_b2_prespec_20260510.md`. Editing
# the memo's load-bearing values requires a NEW memo at a fresh date
# per the v3 §8 anti-threshold-shopping protocol.
#
# H3 SECURITY ADVISORY (mirrors the methodology_signoff_guard pattern):
# this workflow currently runs the verifier scripts FROM the tag
# checkout — i.e. the tagged commit can also weaken the verifiers.
# Production deployments MUST add CODEOWNERS gating on:
#   - scripts/check_g2_commit_graph.py
#   - scripts/verify_g2_prespec_dataset_hashes.py
#   - scripts/run_tier1b_b2_experiment.py
#   - .github/workflows/tier1b_b2_experiment.yml
# OR move the verifiers to a separate protected repository and reference
# them via `uses: org/governance-actions/g2-verifier@<sha>`.

on:
  push:
    tags:
      - 'tier1b-b2-experiment-*'
  workflow_dispatch:
    inputs:
      cohort_label:
        description: 'Cohort identifier (default: optum_initiation_default)'
        required: false
        default: 'optum_initiation_default'
        type: choice
        options:
          - optum_initiation_default
          - optum_initiation_relaxed
      allow_data_snooped:
        description: 'Allow runs against data_snooped=true cohorts (informational only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  PYTHON_VERSION: '3.12'
  PRE_SPEC_PATH: 'docs/specs/tier1b_b2_prespec_20260510.md'

jobs:
  g2-experiment:
    name: G2 Experiment Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history needed so check_g2_commit_graph.py can run
          # `git log --diff-filter=A --follow` to discover S_prespec.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          pip install --upgrade pip
          # Minimal dependency set the harness imports + verifiers use.
          # The verifier scripts are stdlib-only by design; the harness
          # needs sklearn/numpy/pandas + the project's local packages.
          pip install -e .

      - name: Verify cohort dataset hashes vs pre-spec memo
        # First gate: data must not have drifted between memo-lock and
        # tag. Mismatch is a hard failure (the threshold-shopping
        # defense's data-content half).
        run: |
          set -euo pipefail
          python scripts/verify_g2_prespec_dataset_hashes.py

      - name: Verify commit-graph parent constraint
        # Second gate: the experiment commit (= the tagged commit)
        # MUST be a CHILD of S_prespec. Anything else is a parent-
        # constraint violation.
        run: |
          set -euo pipefail
          python scripts/check_g2_commit_graph.py \
            --prespec-path "$PRE_SPEC_PATH" \
            --experiment-sha HEAD

      - name: Verify tag commit references S_prespec
        # Third gate: the tag's commit message MUST mention S_prespec
        # (either by full SHA or short SHA), making the parent
        # relationship visible in the tag annotation.
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Discover S_prespec by inspecting the introducing commit of
          # the pre-spec memo (matches check_g2_commit_graph.py logic).
          S_PRESPEC=$(git log --diff-filter=A --follow --format=%H -- "$PRE_SPEC_PATH" | tail -n 1 || true)
          if [ -z "$S_PRESPEC" ]; then
            echo "::error::could not discover S_prespec by introducing-commit lookup"
            exit 1
          fi
          S_PRESPEC_SHORT=$(git rev-parse --short=8 "$S_PRESPEC")
          echo "S_prespec=$S_PRESPEC ($S_PRESPEC_SHORT)"
          # Tag annotation message — `git for-each-ref` retrieves the
          # annotation body; falls back to the commit message for
          # lightweight tags.
          TAG_NAME="${GIT_REF#refs/tags/}"
          MSG=$(git for-each-ref "refs/tags/$TAG_NAME" --format='%(contents)' 2>/dev/null || true)
          if [ -z "$MSG" ]; then
            MSG=$(git log -1 --format=%B HEAD)
          fi
          echo "::group::Tag/commit message"
          printf '%s\n' "$MSG"
          echo "::endgroup::"
          if printf '%s' "$MSG" | grep -q -E "$S_PRESPEC|$S_PRESPEC_SHORT"; then
            echo "[OK] Tag references S_prespec ($S_PRESPEC_SHORT)"
          else
            echo "::error::Tag commit/annotation does NOT reference S_prespec ($S_PRESPEC_SHORT). Add the S_prespec SHA (long or short) to the tag annotation OR commit message."
            exit 1
          fi

      - name: Resolve experiment inputs
        id: inputs
        # workflow_dispatch may pass cohort_label/allow_data_snooped;
        # tag-triggered runs default to optum_initiation_default
        # (data-snooped cohorts are not load-bearing per pre-spec §2.2).
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COHORT="${{ inputs.cohort_label }}"
            ALLOW_SNOOPED="${{ inputs.allow_data_snooped }}"
          else
            COHORT="optum_initiation_default"
            ALLOW_SNOOPED="false"
          fi
          echo "cohort=$COHORT" >> "$GITHUB_OUTPUT"
          echo "allow_snooped=$ALLOW_SNOOPED" >> "$GITHUB_OUTPUT"

      - name: Run experiment harness
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          ARGS=(--cohort-label "${{ steps.inputs.outputs.cohort }}")
          ARGS+=(--manifest-out g2_run_manifest.json)
          if [ "${{ steps.inputs.outputs.allow_snooped }}" = "true" ]; then
            ARGS+=(--allow-data-snooped)
          fi
          python scripts/run_tier1b_b2_experiment.py "${ARGS[@]}" \
            | tee g2_stdout.log

      - name: Upload run manifest as CI artifact
        # The manifest is the load-bearing record. Always upload it,
        # even on failure, so the operator can inspect which threshold
        # failed and on what observed value.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-run-manifest
          path: |
            g2_run_manifest.json
            g2_stdout.log
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          echo "## Gate G2 Experiment Run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f g2_run_manifest.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat g2_run_manifest.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No manifest produced — see run logs._" >> "$GITHUB_STEP_SUMMARY"
          fi
