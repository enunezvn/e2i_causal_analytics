# Model Endpoints Configuration (production)
# ============================================
# This file configures HTTP model endpoints consumed by prediction_synthesizer.
#
# F-012 (#430): mock_model was removed from this file and moved to
# config/dev_model_endpoints.yaml. In production (ENVIRONMENT=production)
# only this file is loaded; selecting a model_id not declared here raises
# ValueError at orchestration time instead of silently returning fabricated
# predictions. Set ENVIRONMENT=development (or unset) and ensure
# config/dev_model_endpoints.yaml is present to use mock clients.

# Default settings for all endpoints
default_base_url: ${BENTOML_SERVICE_URL:-http://localhost:3000}
default_timeout: 5.0
default_max_retries: 3

# Model endpoint definitions
endpoints:
  # Churn prediction model
  churn_model:
    url: ${BENTOML_SERVICE_URL:-http://localhost:3000}/churn_model
    client_type: http
    timeout: 5.0
    max_retries: 3
    enabled: true

  # Conversion prediction model
  conversion_model:
    url: ${BENTOML_SERVICE_URL:-http://localhost:3000}/conversion_model
    client_type: http
    timeout: 5.0
    max_retries: 3
    enabled: true

  # Adoption prediction model
  adoption_model:
    url: ${BENTOML_SERVICE_URL:-http://localhost:3000}/adoption_model
    client_type: http
    timeout: 5.0
    max_retries: 3
    enabled: true

  # Causal effect model
  causal_model:
    url: ${BENTOML_SERVICE_URL:-http://localhost:3000}/causal_model
    client_type: http
    timeout: 10.0  # Higher timeout for causal models
    max_retries: 3
    enabled: true

  # ROI prediction model
  roi_model:
    url: ${BENTOML_SERVICE_URL:-http://localhost:3000}/roi_model
    client_type: http
    timeout: 5.0
    max_retries: 3
    enabled: true
