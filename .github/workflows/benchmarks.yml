name: Performance Benchmarks

# Issue #391 PERFORMANCE slice (boxes 1-4):
#   1. Cascade BFS latency        → tests/benchmarks/test_cascade_latency.py
#   2. HybridRetriever fused      → tests/benchmarks/test_hybrid_retriever_latency.py
#   3. BM25 rebuild-time curve    → tests/benchmarks/test_bm25_rebuild_time.py
#   4. Postgres slow log (config) → config/postgres_slow_log.md + .yaml
#
# Trigger semantics: paths-filtered so the workflow only fires when a
# performance-relevant surface changes. Avoids running benchmarks against
# unrelated changes (e.g., frontend, docs).
#
# Tolerances are codified in tests/benchmarks/baselines/performance.json
# (NOT in this workflow — keep tolerances next to the baseline so they
# version together). Baseline strategy is ci-blessed-median for all 6
# baselines: cascade + bm25 × 3 (issue #403), and the 2 HybridRetriever
# baselines (p50/p95) against a local pgvector substrate (issue #414;
# deterministic embedder + the real hybrid_*_search SQL fns, no
# Supabase/OpenAI) — see each entry's _ci_observation in the baseline JSON.
#
# Re-bless methodology (issue #403, fleet-aware per issue #1502):
# trigger ≥6 workflow_dispatch runs in waves of 2 spread over hours
# (ideally days) so distinct runner hardware classes are sampled — 3
# back-to-back runs can all land on similar hardware and under-state
# fleet variance ~5x. Download the performance-benchmark-results
# artifact from each (contains measurements.json — each record carries
# `runs[]` raw per-iteration timings plus a primary scalar identified by
# `statistic` ∈ {"median","p50","p95"} and stored in `value_ms`). For
# the cascade + bm25 boxes (statistic="median"), take median-of-value_ms
# across runs. For the hybrid p95 box (GH #414), take median-of-value_ms
# across runs where statistic="p95". Refresh the baseline JSON's
# _ci_observation + run-id list fields with the result, and re-derive
# each abs band ONE-SIDED (the gate auto-passes improvements): 2x the
# max run-median elevation above the new center, min 5ms, rounded up
# to the nearest 5ms.

on:
  push:
    branches: [main]
    paths:
      - 'src/rag/**'
      - 'src/memory/**'
      - 'database/memory/**'  # codex iter-0 M2: BM25 + cascade benchmarks
                              # cover migrations 021/022/024/026 surface.
      - 'tests/benchmarks/**'
      - 'scripts/benchmarks/**'
      - 'scripts/run_benchmarks.sh'
      - '.github/workflows/benchmarks.yml'
      - 'config/postgres_slow_log.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'src/rag/**'
      - 'src/memory/**'
      - 'database/memory/**'  # codex iter-0 M2: see push paths above.
      - 'tests/benchmarks/**'
      - 'scripts/benchmarks/**'
      - 'scripts/run_benchmarks.sh'
      - '.github/workflows/benchmarks.yml'
      - 'config/postgres_slow_log.yaml'
  schedule:
    # Weekly run on Sunday 02:00 UTC. Issue #391 PERFORMANCE box 3 calls
    # for "monitor BM25 index rebuild time as finding count grows" — a
    # scheduled cadence catches drift from changes that don't touch the
    # paths-filtered surfaces.
    - cron: '0 2 * * 0'
  workflow_dispatch: {}

jobs:
  performance-benchmarks:
    name: Performance benchmarks (cascade / hybrid / BM25)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Local pgvector substrate for box 2 (issue #414). Lets the HybridRetriever
    # latency benchmark run the REAL SQL functions against a seeded local DB —
    # no Supabase/OpenAI secrets. See tests/benchmarks/substrate/.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        python-version: ['3.12']

    env:
      # Disable rate limiting on the shared CI surface (mirrors
      # retrieval-benchmarks.yml).
      DISABLE_RATE_LIMITING: '1'
      # E2I_TESTING_MODE matches pyproject.toml [tool.pytest.ini_options]
      # env block so auth bypass is consistent with the unit-test sweep.
      E2I_TESTING_MODE: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        # Full project deps are required because:
        #   - the cascade benchmark imports src.memory.lifecycle.invalidator
        #     (which pulls supabase + redis on the get_*_client paths)
        #   - the hybrid-retriever benchmark imports src.rag.retriever
        #     (which pulls supabase + pgvector)
        # The benchmarks themselves stub these via in-memory fakes when
        # executed in CI, but the imports still need to resolve.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-timeout pytest-asyncio

      # Box 1-3 steps each have `if: always()` so a single benchmark
      # failure does not skip the remaining benchmarks. The "Install
      # dependencies" step's success is a precondition; if that step
      # fails the job is unrecoverable. Codex iter-0 M1 closure: paired
      # with `scripts/run_benchmarks.sh` failure-isolation (no `set -e`
      # on the all-path, worst-exit propagation), CI signal is preserved
      # while every benchmark still emits its junit-xml artifact.
      - name: Run cascade BFS latency benchmark (box 1)
        # Box 1 runs against an in-memory _FakeSupabaseGraph — no service
        # dependencies needed in CI; the test runs unconditionally.
        run: scripts/run_benchmarks.sh cascade

      - name: Provision hybrid-retriever substrate (box 2)
        if: always()  # codex audit LOW: don't skip provisioning if box 1 failed
        env:
          PGPASSWORD: bench
          BENCH_PG_DSN: postgresql://postgres:bench@localhost:5432/postgres
        # Load the minimal schema + the REAL hybrid_vector_search /
        # hybrid_fulltext_search SQL functions into the pgvector service
        # container, then seed a deterministic corpus. This lets box 2 run
        # the live retriever path against a local substrate — no Supabase /
        # OpenAI secrets, no network. See tests/benchmarks/substrate/.
        run: |
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          psql "$BENCH_PG_DSN" -v ON_ERROR_STOP=1 \
            -f tests/benchmarks/substrate/bench_schema.sql \
            -f database/memory/011_hybrid_search_functions_fixed.sql \
            -f database/memory/022_hybrid_search_max_staleness.sql
          python -m tests.benchmarks.substrate.seed

      - name: Run HybridRetriever latency benchmark (box 2)
        if: always()
        # Box 2 runs the live HybridRetriever against the seeded local
        # pgvector substrate (BENCH_SUBSTRATE=local_pg) — deterministic
        # embedder, no Supabase/OpenAI secrets, no network. The benchmark
        # FAILS CLOSED if the substrate is broken/unseeded (direct-connector
        # preflight in test_hybrid_retriever_latency.py).
        env:
          BENCH_SUBSTRATE: local_pg
          BENCH_PG_DSN: postgresql://postgres:bench@localhost:5432/postgres
        run: scripts/run_benchmarks.sh hybrid

      - name: Run BM25 rebuild-time benchmark (box 3)
        if: always()
        # Box 3 runs against the in-process reference BM25 builder — no
        # service dependencies needed in CI.
        run: scripts/run_benchmarks.sh bm25

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-benchmark-results
          path: test-results/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "## Performance Benchmark Results (issue #391)"
            echo
            echo "Tolerances (from tests/benchmarks/baselines/performance.json):"
            echo
            echo "| Box | Target | Tolerance |"
            echo "|-----|--------|-----------|"
            echo "| 1. Cascade 5-hop BFS | < 500ms | 10% rel OR 45ms abs |"
            echo "| 2. HybridRetriever p50 / p95 | < 200ms / < 500ms | 50% rel OR 8ms / 12ms abs (local-substrate fixed-threshold ~3x guard; GH #414) |"
            echo "| 3. BM25 build 1k / 5k / 10k | curve (no absolute target) | 10% rel OR 5/20/60ms abs (fleet-aware per GH #1502) |"
            echo "| 4. Postgres slow log | config-only (see config/postgres_slow_log.md) | n/a — operational gate |"
            echo
            echo "Improvements (observed < baseline) always pass; the PR body"
            echo "must document any intentional re-bless of the baseline."
            echo
            echo "Baseline strategy: ci-blessed-median for all 6 boxes — cascade +"
            echo "bm25 × 3 (issue #403) and the 2 HybridRetriever baselines against"
            echo "the local pgvector substrate (issue #414; no Supabase/OpenAI)."
            echo "To re-bless, trigger ≥6 workflow_dispatch runs in waves of 2"
            echo "spread over hours/days (fleet-aware per GH #1502 — 3"
            echo "back-to-back runs can all land on similar hardware) and"
            echo "consume the performance-benchmark-results artifact's"
            echo "measurements.json — each record carries runs[] raw timings"
            echo "plus a (statistic, value_ms) primary-scalar tuple. For median"
            echo "boxes take median-of-value_ms across runs; for p95 boxes (GH"
            echo "#414) take median-of-value_ms where statistic=\"p95\"."
            echo "Re-derive abs bands one-sided: 2x the max run-median"
            echo "elevation above the new center, min 5ms, rounded up to 5ms."
          } >> "$GITHUB_STEP_SUMMARY"
