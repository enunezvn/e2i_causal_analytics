# =============================================================================
# Deliberately NOT modeled (v1)
# =============================================================================
# - actionTypes / writeback flows (read-only ontology; deferred)
# - interfaces (no cross-type abstraction need yet)
# - inferred graph edges (HIGH_POTENTIAL_PRESCRIBER, INDIRECTLY_INFLUENCES,
#   TRANSITIONED_TO journey state machine) — computed artifacts, not source
#   relationships
# - utility tables: ml_preprocessing_metadata, ml_leakage_audit,
#   user_sessions, data_source_tracking, ml_annotations,
#   etl_pipeline_metrics, territory_metrics, memory/RAG/chat/audit schemas,
#   and the ~40 ML-pipeline tables beyond the modeled set (HPO, A/B testing,
#   digital twin, tool composer, observability spans)
# - vector properties (RAG embeddings stay in Supabase/pgvector; if surfaced
#   later, Foundry vector properties are KNN-only and capped at 2048 dims)
