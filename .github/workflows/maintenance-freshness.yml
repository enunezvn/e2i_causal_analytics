name: Maintenance Freshness

# Is the e2i-maintenance cron layer on the droplet actually running? (#1798)
#
# On 2026-06-30 `/etc/cron.d/e2i-maintenance` silently stopped executing (root's
# password entered a forced-change state; PAM rejected every job) and nothing said
# so for EIGHT WEEKS -- including memory_monitor.sh --auto-cleanup, the memory
# relief valve on a box that runs production and development on the same host.
#
# `scripts/maintenance/check_maintenance_freshness.sh` (#1799/#1802) answers the
# question from the jobs' SUCCESS STAMPS, with each interval derived from the
# crontab itself. It must NOT run from the crontab it audits (dead exactly when
# the thing it watches is dead), and its only caller so far, `health_check.sh`
# (#1803), is manual -- in no crontab, not in deploy.yml. So the next silent stop
# would still be found only when a human happens to run a script.
#
# This workflow is the UNATTENDED caller, independent of the box's cron: it SSHes
# in with the deploy secrets, runs the check, and on failure files/updates a
# labelled issue -- the same reporter shape slow-tests.yml uses, which is a
# surface that is demonstrably read (#1804 reached a human the morning it fired).
#
# The check runs the script from the box's checkout, which is also what the
# crontab invokes -- so the workflow audits the exact code that is scheduled.
#
# Live-certifying the alarm without touching the box:
#   gh workflow run maintenance-freshness.yml                     # expect green, output visible
#   gh workflow run maintenance-freshness.yml -f tolerance=0      # every job reads STALE -> red
#   gh workflow run maintenance-freshness.yml -f tolerance=0 -f file_issue=true
#                                                                 # ...and exercise the reporter
# A scheduled run always files; a dispatch files only when asked, so a forced-red
# certification does not spam issues.

on:
  schedule:
    # 07:30 UTC daily -- off the midnight-UTC herd, after slow-tests (07:00) has
    # started so a shared-runner queue cannot make the two contend. Job intervals
    # are 5m/15m/weekly with 2x tolerance, so daily detection bounds a silent
    # stop at ~1 day instead of ~8 weeks.
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      tolerance:
        description: 'Override --tolerance (multiples of each interval; default from the script = 2). Use 0 to force every job STALE for certification.'
        required: false
        default: ''
        type: string
      file_issue:
        description: 'On failure, file/update the tracking issue as a scheduled run would'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write  # report-failure files/updates the tracking issue

concurrency:
  group: maintenance-freshness
  cancel-in-progress: false

jobs:
  check:
    name: Maintenance cron freshness (droplet)
    runs-on: ubuntu-latest
    # The script itself runs in well under a second; the budget is for SSH setup.
    timeout-minutes: 5
    outputs:
      # stale | unreachable | fresh | unknown -- read by report-failure so an SSH
      # outage is never filed as "the cron is stale" (codex iter-1 HIGH).
      verdict: ${{ steps.classify.outputs.verdict }}
    steps:
      # Two SSH steps on purpose. If THIS one fails (auth, network, box down,
      # checkout moved, crontab unreadable to enunez) the check never ran and the
      # verdict is `unreachable`; only a failure of the NEXT step means the
      # script itself said STALE. One combined step could not tell them apart.
      - name: Preflight -- reach the box and print what is being audited
        id: preflight
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            cd /home/enunez/Projects/e2i_causal_analytics
            # A green run must never be silent: show the checkout the crontab
            # invokes, the crontab itself, and the stamps the check will read.
            echo "==> checkout: $(git rev-parse --short HEAD) ($(git branch --show-current))"
            echo "==> crontab: /etc/cron.d/e2i-maintenance"
            sed -n '/^[^#]/p' /etc/cron.d/e2i-maintenance | grep -v '^[A-Z_]*='
            echo "==> stamps:"
            ls -la --time-style=+%FT%TZ /var/log/e2i/.*.success 2>/dev/null || echo "    (no stamps)"

      - name: Run check_maintenance_freshness.sh on the droplet
        id: freshness
        uses: appleboy/ssh-action@v1
        env:
          # Empty on a scheduled run -> the script's own default (2x) applies.
          # Pass through env, not inline ${{ }} in the script (expression injection).
          TOLERANCE: ${{ inputs.tolerance }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 2m
          # `env:` does not cross the SSH boundary on its own -- appleboy forwards
          # only what `envs:` names (deploy.yml learned this with ROLLOUT_OUTCOME).
          envs: TOLERANCE
          # appleboy/ssh-action@v1 has no `script_stop` input any more; `set -e`
          # below is what stops the script on the first failure.
          script: |
            set -euo pipefail
            cd /home/enunez/Projects/e2i_causal_analytics
            echo "==> check_maintenance_freshness.sh${TOLERANCE:+ --tolerance $TOLERANCE}"
            # Non-zero (1 = a job is stale/never completed, 2 = crontab unreadable,
            # i.e. maintenance is uninstalled) fails this step and wakes the reporter.
            ./scripts/maintenance/check_maintenance_freshness.sh ${TOLERANCE:+--tolerance "$TOLERANCE"}

      - name: Classify the outcome
        id: classify
        if: always()
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          FRESHNESS: ${{ steps.freshness.outcome }}
        run: |
          # Step outcomes are success | failure | cancelled | skipped. The
          # freshness step is skipped (not failed) when the preflight fails.
          if [ "$PREFLIGHT" != "success" ]; then
            verdict=unreachable
          elif [ "$FRESHNESS" = "success" ]; then
            verdict=fresh
          elif [ "$FRESHNESS" = "failure" ]; then
            verdict=stale
          else
            verdict=unknown
          fi
          echo "preflight=$PREFLIGHT freshness=$FRESHNESS -> verdict=$verdict"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

  # Files/updates a labelled tracking issue when the check fails, titled from the
  # check job's verdict (stale vs. unreachable). Same shape as slow-tests.yml's
  # report-failure, including its two #615 lessons: no checkout
  # here, so `gh` needs GH_REPO; and `gh issue create --label` does NOT create a
  # missing label, so self-heal it first. `if: always()` because a `needs`-
  # dependent job is otherwise SKIPPED when its dependency fails -- which is the
  # one moment this job exists for.
  report-failure:
    name: Report stale maintenance cron
    runs-on: ubuntu-latest
    needs: [check]
    if: always() && needs.check.result == 'failure' && (github.event_name == 'schedule' || inputs.file_issue == true)
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          VERDICT: ${{ needs.check.outputs.verdict }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)

          # Title and diagnosis follow the check job's own classification. A
          # failure to REACH the box is filed as exactly that -- it says nothing
          # about the cron layer, and must not send anyone to PAM and stamps.
          case "$VERDICT" in
            stale)
              TITLE="Droplet maintenance cron is stale (${DATE})"
              DETAIL="The check RAN on the box (the SSH preflight had just succeeded) and reported that at least one job in \`/etc/cron.d/e2i-maintenance\` has not completed on schedule, or that the crontab is unreadable. Which job, and how stale, is in the run log. First things to look at (#1798): \`grep 'Authentication token is no longer valid' /var/log/syslog\` (PAM refusing the job's account), \`chage -l root\`, and \`ls -la /var/log/e2i/.*.success\`. A stamp that is MISSING right after a rebuild is expected until that job's first scheduled run."
              ;;
            unreachable)
              TITLE="Maintenance freshness check could not reach the droplet (${DATE})"
              DETAIL="The check DID NOT RUN: the SSH preflight (connect as the deploy user, cd to the checkout, read the crontab) failed. This says nothing about whether the cron layer is running. Look at the preflight step's error in the run log: SSH auth (DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY), the box being down, or the checkout/crontab having moved."
              ;;
            *)
              TITLE="Maintenance freshness check failed without a verdict (${DATE})"
              DETAIL="The check job failed but its classify step produced '${VERDICT:-<empty>}' (a cancelled step, or the workflow's own wiring). Read the run log."
              ;;
          esac

          gh label create maintenance-freshness-failure \
            --color B60205 \
            --description "Auto-filed by maintenance-freshness.yml when the droplet maintenance cron freshness check fails (#1798)" \
            2>/dev/null || true

          EXISTING=$(gh issue list \
            --state open \
            --label maintenance-freshness-failure \
            --json number \
            --jq '.[0].number // empty' \
            --limit 1)

          BODY="$(printf "**%s** -- verdict: \`%s\` (%s run, %s)\n\n%s\n\nRun: %s" "$TITLE" "${VERDICT:-unknown}" "$EVENT_NAME" "$DATE" "$DETAIL" "$RUN_URL")"

          if [ -n "$EXISTING" ]; then
            echo "Commenting on existing issue #${EXISTING} (verdict=${VERDICT:-unknown})"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Creating new tracking issue (verdict=${VERDICT:-unknown})"
            gh issue create \
              --title "$TITLE" \
              --label maintenance-freshness-failure \
              --body "$(printf "%s\n\n_Auto-created by .github/workflows/maintenance-freshness.yml. Later failures of either kind are added as comments with their own verdict; close manually once the next scheduled run is green._" "$BODY")"
          fi
