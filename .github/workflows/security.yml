            --ignore-vuln PYSEC-2025-183 `# pyjwt 2.12.0 (CVE-2025-45768; weak-encryption note disputed by supplier — "key length is chosen by application"); no fix. Mitigated — we generate keys with cryptographically-secure RNGs at >=256 bits.` \
            --ignore-vuln PYSEC-2025-217 `# transformers 4.57.3 (CVE-2025-14929; X-CLIP checkpoint conversion deserialization RCE); no upstream fix as of 2026-05. Mitigated — we don't run X-CLIP checkpoint conversion.` \
