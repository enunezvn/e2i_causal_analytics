name: Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'docker/Dockerfile'
      # Compose files ARE deploy inputs: the SSH script runs
      # `docker compose -f docker/docker-compose.yml -f <overlay> ... up`,
      # so a compose-only change (tmpfs perms, volumes, env, ulimits — cf. PR #527's
      # own hardening, which would NOT have auto-deployed) must trigger a deploy. The
      # in-script rebuild detector recreates from compose, but only after this fires.
      # docker-compose.secure.yml is intentionally excluded: the deploy script does not -f it.
      # #528-A: the deploy now consumes the slim docker-compose.frontend-dev.yml overlay
      # (frontend-only) for the forward path; docker-compose.dev.yml stays listed as the
      # pre-flip rollback fallback (the deploy may -f it when rolling back to a commit
      # that predates the slim overlay).
      - 'docker/docker-compose.yml'
      - 'docker/docker-compose.dev.yml'
      - 'docker/docker-compose.frontend-dev.yml'
      - 'docker/frontend/**'
      - 'frontend/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      # pip path-installs baked into the image (Dockerfile: COPY patches/ ./patches/,
      # requirements.txt: ./patches/ag-ui-langgraph + ./patches/copilotkit). Kept in
      # sync with the in-script rebuild detector so a patch-only change still deploys.
      - 'patches/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/e2i-api

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/backend-tests.yml

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            PROJECT_DIR="/home/enunez/Projects/e2i_causal_analytics"

            # #528-A: pick the compose overlay by file existence. The prod deploy now
            # runs the slim FRONTEND-ONLY overlay (docker-compose.frontend-dev.yml) so
            # api/workers/scheduler use the base prod target instead of the full dev
            # overlay (the #527 dev-in-prod incident: target:development, --reload,
            # ENVIRONMENT=development). docker-compose.dev.yml stays the fallback for
            # commits that predate the slim overlay — so a rollback to a pre-flip commit
            # cleanly reverts the flip instead of failing on a missing -f target.
            # COMPOSE_CMD is (re)computed after EVERY checkout, since the tree changes.
            pick_overlay() {
              if [ -f docker/docker-compose.frontend-dev.yml ]; then
                echo docker/docker-compose.frontend-dev.yml
              else
                echo docker/docker-compose.dev.yml
              fi
            }

            cd "$PROJECT_DIR"
            PREV_SHA=$(git rev-parse HEAD)
            echo "==> Pre-deploy SHA: ${PREV_SHA:0:7}"

            # Hard-sync to origin/main — droplet is a deploy target, not a dev box.
            # Abort if there are uncommitted changes (someone is hot-patching live).
            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: droplet has uncommitted changes; refusing to reset --hard"
              git status --short
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
            NEW_SHA=$(git rev-parse HEAD)
            echo "==> Deploying ${NEW_SHA:0:7}"

            # Tree is now at NEW_SHA — select the overlay that exists at this commit.
            COMPOSE_CMD="docker compose -f docker/docker-compose.yml -f $(pick_overlay)"
            echo "==> Compose overlay: $(pick_overlay)"

            # Run migrations only when the DB URL is present in the deploy env;
            # run_migrations.sh hard-exits otherwise, which `set -e` would abort on.
            if [ -n "${SUPABASE_DB_URL:-}" ]; then
              bash scripts/run_migrations.sh
            else
              echo "==> Skipping migrations: SUPABASE_DB_URL unset"
            fi

            # The /app/.venv anon-volume mask is gone, so a forward recreate carries
            # the image's current deps; the anon-volume renewal flag is not needed here.
            # Decide rebuild by EXCLUSION, not enumeration: rebuild unless every
            # changed file is still BIND-MOUNTED at runtime. #528-A flipped the app
            # services to the prod target, so src/ + config/ are now COPYed into the
            # image (Dockerfile production stage) — a change to either is a baked image
            # input and MUST force a rebuild, so they are NO LONGER excluded. The paths
            # that remain bind-mounted (recreate, not rebuild) are: tests/ (not in the
            # prod image at all), feature_repo/ (bind-mounted into feast + the
            # materializer), and frontend/src|public|index.html (the frontend stays
            # dev/Vite via the slim overlay until #528-B). Any other path is a baked
            # image input — Dockerfile, requirements*, pyproject, patches/, frontend
            # build config (vite.config.ts, tailwind.config.js, tsconfig*), package
            # manifests, etc. — so it forces a rebuild without us enumerating each one.
            # A no-delta re-run (PREV==NEW, e.g. a retry after a partial/interrupted
            # build) also rebuilds, since we cannot prove the local image is current.
            # Capture changed files that are NOT dev-overlay bind mounts. Use a
            # captured-output emptiness test rather than the quiet-invert (-qv) exit
            # status: the droplet's grep may be ugrep, whose quiet-invert exit code is
            # unreliable and would risk a false-negative (skipping a needed rebuild).
            # `|| true` keeps set -e happy when every changed file IS bind-mounted
            # (grep then exits non-zero).
            CHANGED_BAKED=$(git diff --name-only "$PREV_SHA" "$NEW_SHA" \
              | grep -vE '^(tests/|feature_repo/|frontend/src/|frontend/public/|frontend/index\.html$)' \
              || true)
            if [ "$PREV_SHA" = "$NEW_SHA" ] || [ -n "$CHANGED_BAKED" ]; then
              echo "==> Rebuilding image (no-delta re-run or a non-bind-mounted image input changed)"
              BUILD_FLAG="--build"
            else
              echo "==> Bind-mounted code-only change — recreating from current image"
              BUILD_FLAG=""
            fi
            # #528-A ordered rollout — a FRESH online store BEFORE the prod-target API
            # serves. The flip makes the fail-loud #532 Feast read path authoritative,
            # so serving against a stale/empty store would return null features or 503.
            # Recreate the feast sidecar + materializer FIRST, wait until the materializer
            # has completed a FRESH materialize in THIS deploy, and only THEN flip
            # api/workers/scheduler to the prod target. A single `up -d` of everything
            # gated solely on API health would let the prod API serve a stale store.
            #
            # Freshness signal: docker/feast/materializer-entrypoint.sh writes
            # /tmp/materializer_heartbeat (unix seconds) ONLY after its first successful
            # materialize, and --force-recreate clears that tmpfs — so a heartbeat whose
            # value is >= this deploy's start time proves a materialize just succeeded.
            # We poll the file directly (via docker exec), NOT the Docker health status:
            # the materializer healthcheck interval is 5m, so the status would not tick
            # to "healthy" within the wait window (a false-negative gate failure).
            GATE_START=$(date -u +%s)
            $COMPOSE_CMD up -d $BUILD_FLAG --no-deps --force-recreate feast feast-materializer

            echo "==> Waiting for feast-materializer to complete a fresh materialize..."
            MAT_FRESH=false
            for i in $(seq 1 60); do
              HB=$(docker exec e2i_feast_materializer cat /tmp/materializer_heartbeat 2>/dev/null || echo 0)
              case "$HB" in ''|*[!0-9]*) HB=0 ;; esac
              if [ "$HB" -ge "$GATE_START" ]; then
                MAT_FRESH=true
                echo "==> feast-materializer completed a fresh materialize on attempt ${i} (heartbeat ${HB})"
                break
              fi
              sleep 10
            done
            if [ "$MAT_FRESH" = false ]; then
              # The store is NOT proven fresh. The app services were NOT flipped (still on
              # their pre-deploy containers), but `feast` itself was just recreated at
              # NEW_SHA and the still-serving old API depends on it
              # (FEAST_URL=http://feast:6566). Roll feast + feast-materializer back to
              # PREV_SHA so the old API keeps the known-good Feast it ran against, then
              # fail loud.
              echo "==> feast-materializer did not complete a fresh materialize in time."
              echo "==> Rolling feast + feast-materializer back to ${PREV_SHA:0:7} (app services were"
              echo "==> never flipped — they keep serving the pre-deploy version). Deploy FAILED."
              docker logs --tail 50 e2i_feast_materializer 2>&1 || true
              git checkout "$PREV_SHA"
              COMPOSE_CMD="docker compose -f docker/docker-compose.yml -f $(pick_overlay)"
              $COMPOSE_CMD up -d --build --no-deps --force-recreate feast feast-materializer
              exit 1
            fi

            # Store is fresh — now flip the app services to the prod target.
            $COMPOSE_CMD up -d $BUILD_FLAG --no-deps --force-recreate \
              api frontend worker_light worker_medium scheduler

            # Health check
            echo "==> Waiting for health check..."
            HEALTHY=false
            for i in $(seq 1 30); do
              if curl -sf --connect-timeout 3 --max-time 5 http://localhost:8000/health >/dev/null 2>&1; then
                HEALTHY=true
                echo "==> Health check passed on attempt ${i}"
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" = false ]; then
              echo "==> Health check failed — rolling back to ${PREV_SHA:0:7}"
              git checkout "$PREV_SHA"
              # PREV_SHA may predate the slim frontend overlay (#528-A) — recompute
              # COMPOSE_CMD so the rollback -f's the overlay that exists at this commit.
              # Rolling back to a pre-flip commit therefore REVERTS the flip (falls back
              # to docker-compose.dev.yml: dev target, --reload, the recoverable state).
              COMPOSE_CMD="docker compose -f docker/docker-compose.yml -f $(pick_overlay)"
              echo "==> Rollback compose overlay: $(pick_overlay)"
              # Rollback rebuilds from PREV_SHA AND renews anonymous volumes: the
              # rolled-back commit may predate this hotfix and still carry the
              # /app/.venv mask, so renewing repopulates the venv from the freshly
              # rebuilt PREV_SHA image instead of reusing a stale anon volume.
              # Correctness over speed on the failure path.
              $COMPOSE_CMD up -d --build --no-deps --force-recreate --renew-anon-volumes \
                api frontend worker_light worker_medium scheduler
              sleep 10
              echo "==> Rollback complete. Deploy FAILED."
              exit 1
            fi

      - name: Deployment summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo "## Deployment Succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Deployment Failed — Rollback Triggered" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Commit:** \`$COMMIT_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** $BRANCH_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actor:** $ACTOR" >> "$GITHUB_STEP_SUMMARY"
