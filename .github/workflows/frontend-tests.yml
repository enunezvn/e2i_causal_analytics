name: Frontend Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'
  workflow_dispatch:  # Allow manual triggers

env:
  NODE_VERSION: 20

jobs:
  quarantine-ratchet:
    name: Quarantine ratchet (one-way down)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Compare on-disk manifest to base ref
        working-directory: frontend
        run: |
          set -e
          python3 - <<'PY'
          import json, os, subprocess, sys

          head = json.load(open('e2e/.quarantine.json'))
          budget = head.get('budget')
          specs  = head.get('specs', [])

          # Invariant 1: budget must equal len(specs).
          if not isinstance(budget, int) or budget != len(specs):
              print(f"::error::budget ({budget}) must equal len(specs) ({len(specs)})")
              print("::error::Edit e2e/.quarantine.json so both stay in sync.")
              sys.exit(1)

          # Invariant 2: the smoke spec is never quarantined.
          if '_smoke.spec.ts' in specs:
              print("::error::_smoke.spec.ts MUST NOT be quarantined — it's the floor signal.")
              sys.exit(1)

          # Invariant 3: ratchet is one-way down vs the base ref's manifest.
          base_ref = os.environ.get('GITHUB_BASE_REF') or 'main'
          try:
              subprocess.check_call(
                  ['git', 'fetch', '--depth=1', 'origin', base_ref],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              )
              base_raw = subprocess.check_output(
                  ['git', 'show', f'origin/{base_ref}:frontend/e2e/.quarantine.json'],
                  stderr=subprocess.DEVNULL,
              )
          except subprocess.CalledProcessError:
              print(f"Base ref origin/{base_ref} has no quarantine manifest yet; allowing.")
              sys.exit(0)

          base = json.loads(base_raw)
          if budget > base['budget']:
              print(f"::error::Quarantine budget grew ({base['budget']} -> {budget}).")
              print("::error::A new spec was added to quarantine. Either fix it OR")
              print("::error::confirm in the PR body why the bump is unavoidable.")
              sys.exit(1)
          print(f"Ratchet OK: budget {base['budget']} -> {budget}")
          PY

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linting
        working-directory: frontend
        run: npm run lint

      - name: Run type check
        working-directory: frontend
        # `tsc -b` (build mode) follows the project references in tsconfig.json
        # (app + node), so it actually type-checks the source. Plain
        # `tsc --noEmit` resolves to the references-only root config
        # (`"files": []`) and silently checks nothing. `--noEmit` keeps this a
        # pure type-check (no JS; the configs are already noEmit). See the
        # `build` script, which uses the same `tsc -b`.
        run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build for production (CopilotKit disabled for E2E testing)
        working-directory: frontend
        run: npm run build
        env:
          # Disable CopilotKit in E2E test builds since there's no backend
          VITE_COPILOT_ENABLED: 'false'

      - name: Assert production bundle is clean (no MSW / dev artifacts)
        working-directory: frontend
        # Mirrors the docker/frontend/Dockerfile guard (PR #908) in CI so the
        # invariant is enforced on every PR, not only when the prod image builds.
        run: npm run check:dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  e2e-tests:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Shard E2E tests for faster execution (4 shards for ~95 tests each)
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

      - name: Run E2E tests (shard ${{ matrix.shard }}/4)
        working-directory: frontend
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  e2e-report:
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()
    steps:
      - name: Download all test reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-shard-*
          path: all-reports
          merge-multiple: true

      - name: Merge test reports
        run: |
          echo "Test reports downloaded:"
          ls -la all-reports/ || echo "No reports found"

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: all-reports/
          retention-days: 30

  # Summary job to ensure all tests pass
  ci-success:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, build, e2e-tests, quarantine-ratchet]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" ]]; then
            echo "Lint/typecheck failed"
            exit 1
          fi
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
            echo "E2E tests failed"
            exit 1
          fi
          if [[ "${{ needs.quarantine-ratchet.result }}" != "success" ]]; then
            echo "Quarantine ratchet failed"
            exit 1
          fi
          echo "All jobs passed successfully!"
