# =============================================================================
# E2I Causal Analytics - Production Docker Compose
# =============================================================================
# 21-Agent 6-Tier Architecture | Tri-Memory System | MLOps Integration
#
# Usage:
#   Production:  docker compose -f docker/docker-compose.yml up -d
#   With debug:  docker compose -f docker/docker-compose.yml --profile debug up -d
#
# External Dependencies:
#   - Self-hosted Supabase (PostgreSQL + pgvector)
#   - Anthropic API (Claude for agents)
# =============================================================================

name: e2i-causal-analytics

# =============================================================================
# EXTENSION FIELDS (Shared configuration)
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common-env: &common-env
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_KEY: ${SUPABASE_KEY}
  SUPABASE_ANON_KEY: ${SUPABASE_KEY}
  SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
  # Direct PostgreSQL connection for inside-network DB clients (the
  # Block 6B-infra-2* ETLs in src/etl/*, plus any ad-hoc psycopg2 caller).
  # The host-side .env file's SUPABASE_DB_URL points at the Supavisor pooler
  # on 127.0.0.1:5432 which only accepts the `postgres.<project-ref>` user
  # format; inside the docker network we connect directly to the supabase-db
  # container as the vanilla `postgres` user. SUPABASE_POSTGRES_PASSWORD must
  # be set in the host .env (it mirrors /opt/supabase/docker/.env's
  # POSTGRES_PASSWORD value).
  SUPABASE_DB_URL: postgresql://postgres:${SUPABASE_POSTGRES_PASSWORD:?SUPABASE_POSTGRES_PASSWORD must be set}@supabase-db:5432/postgres
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
  FALKORDB_URL: redis://:${FALKORDB_PASSWORD:?FALKORDB_PASSWORD must be set}@falkordb:6379/0
  MLFLOW_TRACKING_URI: http://mlflow:5000
  BENTOML_SERVICE_URL: http://bentoml:3000
  FEAST_URL: http://feast:6566
  OPIK_URL: http://opik-backend:8080
  # Forward the canonical OPIK_ENABLED opt-out switch (default "true") from the
  # host .env into api + workers. Opik is intentionally STOPPED on this droplet,
  # so OPIK_ENABLED=false lets the health_score tracer + opik_connector skip
  # client construction — no forever-retrying uploader threads against the dead
  # opik-backend on every health check (#952 follow-up). Was previously unset on
  # the containers (the .env value never reached them), so it defaulted to on.
  OPIK_ENABLED: ${OPIK_ENABLED:-true}
  # 4-stage ClassificationPipeline mode (off | shadow | active). shadow runs
  # the classifier + logs to classification_logs without touching routing;
  # active hands routing authority to it when confident. Must be forwarded
  # here or the in-code default governs regardless of the host .env.
  ORCHESTRATOR_CLASSIFIER_MODE: ${ORCHESTRATOR_CLASSIFIER_MODE:-shadow}
  # #1448 agent-registry completeness gate. DISARMED by default: a partial registry
  # is a degradation (the dispatcher already fails closed per missing agent, #814),
  # so hard-failing on it would trade "18 of 21 agents work" for "no orchestrator at
  # all". Arm it (true) to turn a partial registry into a raised
  # PartialAgentRegistryError — use for a post-deploy verification boot, not as a
  # steady-state setting. Must be forwarded here or the host .env never reaches the
  # containers and the in-code default governs (the OPIK_ENABLED lesson above).
  E2I_REQUIRE_FULL_AGENT_REGISTRY: ${E2I_REQUIRE_FULL_AGENT_REGISTRY:-false}
  # #1454 chatbot cold-start warming. ON by default: each worker pre-builds the
  # DSPy LM config, the retrieval clients, the orchestrator registry and the
  # intent classifier in a fail-open background task, so the ~30s cold init does
  # not land on the first user request. Set false to disable (e.g. to isolate a
  # startup problem) — must be forwarded here or the host .env never reaches the
  # containers and the in-code default governs (the OPIK_ENABLED lesson above).
  CHATBOT_STARTUP_WARM_ENABLED: ${CHATBOT_STARTUP_WARM_ENABLED:-true}
  # Routing-label loop (#1341 Phase 1): nightly Celery labeler for
  # classification_logs. Must be forwarded here or host-.env overrides never
  # reach the worker containers and the in-code defaults govern.
  ROUTING_LABEL_MIN_NEW_ROWS: ${ROUTING_LABEL_MIN_NEW_ROWS:-10}
  ROUTING_LABEL_JUDGE_CAP: ${ROUTING_LABEL_JUDGE_CAP:-50}
  ROUTING_LABEL_JUDGE_MODEL: ${ROUTING_LABEL_JUDGE_MODEL:-claude-haiku-4-5-20251001}
  ROUTING_LABEL_LOOKBACK_DAYS: ${ROUTING_LABEL_LOOKBACK_DAYS:-30}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/2
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  # Embedding primary (FallbackEmbeddingService -> OpenAIEmbeddingService unless
  # E2I_ENVIRONMENT=aws_production). Was never forwarded, so episodic embeddings
  # failed ("All embedding services unavailable") and episodic_memories stayed
  # empty — starving the whole consolidation/crystallization lifecycle.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # LLM model selection (model refresh 2026-07-18). src/utils/llm_factory reads
  # LLM_PROVIDER (factory lane provider) and LLM_MODEL (OpenAI workhorse pin);
  # src/optimization/dspy_lm reads DSPY_LM_MODEL (verbatim litellm model string,
  # takes precedence) so the GEPA-tuned DSPy path can stay pinned independently
  # of a provider flip. Same never-forwarded gap as OPIK_ENABLED/OPENAI_API_KEY
  # above: the host .env values silently never reached the containers, so the
  # in-code defaults governed. ANTHROPIC_MODEL is deliberately NOT forwarded —
  # its in-code defaults resolve to current models, while the host .env pins an
  # opus-tier id meant for interactive use, not the platform lanes.
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_MODEL: ${LLM_MODEL:-}
  DSPY_LM_MODEL: ${DSPY_LM_MODEL:-}
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  # Layer-4 adaptive-validity audit-trail persistence (Plan
  # .claude/plans/layer4_evaluator_audit_consumer.md). Producer
  # (src/agents/ml_foundation/data_preparer/graph.py:write_adaptive_verdicts_sidecar)
  # silently no-ops when this var is unset; setting it here propagates to
  # every service that merges *common-env. Operator opt-in for the Haiku
  # evaluator itself is still ADAPTIVE_VALIDITY_EVALUATOR_ENABLED=1.
  ADAPTIVE_VALIDITY_ARTIFACTS_DIR: /app/data/audit_artifacts
  # KPI synthetic-visibility (demo/review). Default OFF -> production's
  # migration-066 synthetic-exclusion gate stands. A synthetic-gold-only
  # instance opts in by setting E2I_KPI_INCLUDE_SYNTHETIC=true in its host .env:
  # KPI reads then swap to the *_include_synthetic twins and the FE badges the
  # figures as synthetic. Forwarded to api + scheduler + workers via *common-env.
  E2I_KPI_INCLUDE_SYNTHETIC: ${E2I_KPI_INCLUDE_SYNTHETIC:-0}
  # WS-SYNTH: deployment-wide synthetic showcase switch. Default OFF -> the strict
  # real-mode provenance gate stands at every reader. A synthetic-gold-only instance
  # sets E2I_INCLUDE_SYNTHETIC=true in its host .env: every read-path chokepoint
  # (apply_provenance_filter) and orchestrator resolver then INCLUDES synthetic so
  # the platform runs at full potential — synthetic is a badge, not a gate.
  # Generalizes the KPI-only flag above; reversible (unset -> strict gate returns).
  E2I_INCLUDE_SYNTHETIC: ${E2I_INCLUDE_SYNTHETIC:-0}

x-common-worker: &common-worker
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: production
  # #528-B: GHCR-pull tag for the shared api image. The deploy pulls this from GHCR
  # (built+pushed in CI for the deployed commit) instead of building on the droplet;
  # the `build:` above remains the local-build fallback. IMAGE_OWNER/IMAGE_TAG are
  # exported by deploy.yml; the defaults keep local `docker compose` working.
  image: ghcr.io/${IMAGE_OWNER:-local}/e2i-api:${IMAGE_TAG:-latest}
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - e2i_network
    - mlops_network
    # Reach supabase-db for materialize jobs (Feast offline pull) and ETL tasks
    # that hit the canonical Feast tables (Block 6B-infra-4).
    - supabase-network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  # Persistent volumes (state - survives container restarts)
  redis_data:
    driver: local
    name: e2i_redis_data
  falkordb_data:
    driver: local
    name: e2i_falkordb_data
  mlflow_db:
    driver: local
    name: e2i_mlflow_db
  mlflow_artifacts:
    driver: local
    name: e2i_mlflow_artifacts
  bentoml_models:
    driver: local
    name: e2i_bentoml_models

  # Shared volumes (inter-container data exchange)
  ml_artifacts:
    driver: local
    name: e2i_ml_artifacts
  model_registry:
    driver: local
    name: e2i_model_registry
  causal_outputs:
    driver: local
    name: e2i_causal_outputs
  feature_cache:
    driver: local
    name: e2i_feature_cache
  # Shared Feast registry (data/registry.db will live inside this volume once
  # the api-side consumer is migrated off the feature_repo bind mount).
  #
  # INFRASTRUCTURE-ONLY (Block 6B-infra-4): feast_registry is plumbed as a
  # named volume ready to host the canonical registry, but the api-side
  # consumer migration is staged for a follow-up sub-block. Today the parity
  # test (tests/integration/test_feast_offline_online_parity.py:160) still
  # resolves the registry via the feature_repo bind mount — both the feast
  # container and the api container bind-mount feature_repo, and `feast apply`
  # writes feature_repo/data/registry.db (Block 3B pattern).
  #
  # The volume is in place so the consumer migration is one yaml-config edit
  # away: flip feature_store.yaml.tmpl `registry: data/registry.db` to a path
  # under /app/feast_registry, run `feast apply` to populate, and update the
  # parity test fixture to override repo_path. Until then, the volume is
  # mounted but not consumed by the api container.
  feast_registry:
    driver: local
    name: e2i_feast_registry
  agent_outputs:
    driver: local
    name: e2i_agent_outputs
  # Layer-4 adaptive-validity audit sidecars (Plan
  # .claude/plans/layer4_evaluator_audit_consumer.md). Mounted on every
  # service that mounts agent_outputs; backed up by scripts/backup_data_stores.sh.
  audit_artifacts:
    driver: local
    name: e2i_audit_artifacts
  experiment_designs:
    driver: local
    name: e2i_experiment_designs
  # DSPy self-improvement artifact roots (dspy_lane_ab_20260718.md §7 prod
  # gap): both are CWD-relative under /app in code and were previously
  # container-ephemeral. worker_medium produces (daily beat), api consumes
  # (pattern_analyzer + startup install_all_prompt_bundles). Guard:
  # tests/integration/test_optimized_artifacts_compose_wiring.py.
  optimized_modules:
    driver: local
    name: e2i_optimized_modules
  optimized_prompts:
    driver: local
    name: e2i_optimized_prompts

  # Observability volumes
  prometheus_data:
    driver: local
    name: e2i_prometheus_data
  loki_data:
    driver: local
    name: e2i_loki_data
  grafana_data:
    driver: local
    name: e2i_grafana_data
  promtail_positions:
    driver: local
    name: e2i_promtail_positions

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  e2i_network:
    driver: bridge
    name: e2i_network
  # Isolated network for MLOps services
  mlops_network:
    driver: bridge
    name: e2i_mlops_network
  # External Supabase network — feast (offline store), api (parity test
  # invocation), and postgres-exporter (Supabase DB metrics scrape) need to
  # reach supabase-db on this network.
  supabase-network:
    external: true
    name: supabase-network

# =============================================================================
# SERVICES
# =============================================================================
services:
  # ===========================================================================
  # TIER 0: CONFIGURATION VALIDATION
  # ===========================================================================

  config-check:
    image: alpine:3.19
    container_name: e2i_config_check
    entrypoint: /bin/sh
    command:
      - -c
      - |
        FAIL=0
        for VAR_NAME in REDIS_PASSWORD FALKORDB_PASSWORD; do
          eval VAL="\$$VAR_NAME"
          if [ "$$VAL" = "changeme" ] || [ -z "$$VAL" ]; then
            if [ "$$ENVIRONMENT" = "production" ]; then
              echo "ERROR: $$VAR_NAME must be set to a secure value in production"
              FAIL=1
            else
              echo "WARNING: $$VAR_NAME is unset or default - acceptable for development only"
            fi
          fi
        done
        if [ "$$FAIL" = "1" ]; then exit 1; fi
        echo "Configuration validation passed"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:?FALKORDB_PASSWORD must be set}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    restart: "no"
    networks: []

  # ===========================================================================
  # TIER 1: INFRASTRUCTURE (Memory Systems)
  # ===========================================================================

  # Redis - Working Memory + LangGraph Checkpointing + Celery Broker
  redis:
    image: redis:7-alpine
    container_name: e2i_redis
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:6382:6379"  # 6382 external to avoid conflict with host Redis on 6379
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - e2i_network
    security_opt:
      - no-new-privileges:true
    depends_on:
      config-check:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - "e2i.service=infrastructure"
      - "e2i.memory=working"

  # FalkorDB - Semantic Memory (Graphity Auto-Extraction)
  falkordb:
    image: falkordb/falkordb:v4.14.11
    container_name: e2i_falkordb
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:6381:6379"  # 6381 external to avoid conflict with Redis
    volumes:
      - falkordb_data:/data
    environment:
      - FALKORDB_ARGS=--maxmemory 1gb --requirepass ${FALKORDB_PASSWORD:?FALKORDB_PASSWORD must be set}
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "-a", "${FALKORDB_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - e2i_network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    labels:
      - "e2i.service=infrastructure"
      - "e2i.memory=semantic"

  # FalkorDB Browser - Interactive Graph Visualization (debug only)
  falkordb-browser:
    image: falkordb/falkordb-browser:v1.7.1
    container_name: e2i_falkordb_browser
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - debug
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:?FALKORDB_PASSWORD must be set}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - e2i_network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      falkordb:
        condition: service_healthy
    labels:
      - "e2i.service=infrastructure"
      - "e2i.memory=semantic-browser"

  # ===========================================================================
  # TIER 2: MLOPS SERVICES
  # ===========================================================================

  # MLflow - Experiment Tracking & Model Registry
  # Pinned to v3.15.1 in lockstep with requirements.txt mlflow line (#1476;
  # supersedes #442 / #362). The 3.15.x line is the first whose cryptography
  # cap is <50, unlocking cryptography 49.0.0 (clears GHSA-537c-gmf6-5ccf +
  # CVE-2026-69248 + CVE-2026-69249 — entries dropped from
  # .github/workflows/security.yml in the #1476 PR).
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    container_name: e2i_mlflow
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_db:/mlflow/db
      - mlflow_artifacts:/mlflow/artifacts
      - ml_artifacts:/mlflow/ml_artifacts      # Shared: receives from training
      - model_registry:/mlflow/model_registry  # Shared: sends to BentoML
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///mlflow/db/mlflow.db
      - MLFLOW_ARTIFACT_ROOT=/mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/db/mlflow.db
      --default-artifact-root mlflow-artifacts:
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - e2i_network
      - mlops_network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    labels:
      - "e2i.service=mlops"
      - "e2i.component=experiment-tracking"

  # BentoML - Model Serving (Decoupled from Agents)
  bentoml:
    build:
      context: ..
      dockerfile: docker/bentoml/Dockerfile
      target: production
    container_name: e2i_bentoml
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - bentoml_models:/home/bentoml/bentos
      - model_registry:/models:ro  # Read-only: receives from MLflow
      # Gold-standard cohort serving (2026-06-23 deploy-failure fix). The deploy
      # FORCE-RECREATES bentoml under THIS base compose (pick_overlay() returns ""
      # once the frontend has an `AS production` stage, #528-B — no overlay), so the
      # 12 cohort bundles must be reachable from the base service, not only the dev
      # overlay. Without these the recreated container boots degraded (0 models),
      # fails the deploy /model_info readiness gate, and the rollback runs the
      # OOM-prone frontend build (#563 double-fault). Both read-only:
      #   * the FS-fallback discovery (_discover_goldstd_bundles_from_fs) walks
      #     data/ml_artifacts/shap_serving relative to /home/bentoml; and
      #   * pickle.load needs gold_standard_eval (FeatureBuilder + its cohort_spec
      #     dep) — NOT baked into the prod image — to deserialize each bundle.
      # The bundles are gitignored + re-materialized by scripts/sync_goldstd_serving
      # and survive `git reset --hard` (untracked), so the bind stays populated.
      - ../src/mlops/gold_standard_eval:/home/bentoml/src/mlops/gold_standard_eval:ro
      - ../data/ml_artifacts/shap_serving:/home/bentoml/data/ml_artifacts/shap_serving:ro
    environment:
      - BENTOML_HOME=/home/bentoml
      - BENTOML_PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - e2i_network
      - mlops_network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    depends_on:
      mlflow:
        condition: service_healthy
    labels:
      - "e2i.service=mlops"
      - "e2i.component=model-serving"

  # Feast - Feature Store (Online + Offline Serving)
  feast:
    build:
      context: .
      dockerfile: Dockerfile.feast
    container_name: e2i_feast
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:6567:6566"
    volumes:
      - ../feature_repo:/feast-src:ro  # Source: entities.py, data_sources.py, features/, feature_store.yaml.tmpl
      # Registry + materialization output (writable, persistent). Block 6B-infra-4
      # carved this out of feature_cache into its own named volume so the
      # registry has explicit ownership; the api-side consumer migration off
      # the feature_repo bind mount is staged for a follow-up (see the
      # feast_registry volume comment in the volumes: block).
      - feast_registry:/feast/data
    environment:
      - FEAST_OFFLINE_STORE_TYPE=file
      - FEAST_ONLINE_STORE_TYPE=redis
      - FEAST_REDIS_HOST=redis
      - FEAST_REDIS_PORT=6379
      # Required by docker/feast/entrypoint.sh to render feature_store.yaml from
      # feature_store.yaml.tmpl. The rendered file is written into the writable
      # container layer at /feast/feature_store.yaml — never the host bind mount.
      - SUPABASE_POSTGRES_PASSWORD=${SUPABASE_POSTGRES_PASSWORD:?SUPABASE_POSTGRES_PASSWORD must be set}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6566/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - e2i_network
      - mlops_network
      - supabase-network  # Reach supabase-db (Postgres offline store)
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - "e2i.service=mlops"
      - "e2i.component=feature-store"

  # ---------------------------------------------------------------------------
  # Feast materializer (#556) - keeps the Redis ONLINE store populated
  # ---------------------------------------------------------------------------
  # Same image as `feast` (the only one that can import feast); overrides the
  # entrypoint to a materialize-only loop. The app/worker image cannot import
  # feast (#307), so the Celery materialize beats are structural no-ops — this
  # service is the real scheduled materialize. Shares the feast_registry volume
  # (reads the registry `feast` applies; writes feature values to Redis) and
  # mounts the materialization config read-only for its cadence.
  feast-materializer:
    build:
      context: .
      dockerfile: Dockerfile.feast
    container_name: e2i_feast_materializer
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/materializer-entrypoint.sh"]
    volumes:
      - ../feature_repo:/feast-src:ro
      - feast_registry:/feast/data
      # Cadence + per-view config (read-only). #556: the in-sidecar materializer
      # cannot read config/ from the app image (not mounted there), so mount it
      # directly here.
      - ../config/feast_materialization.yaml:/feast/feast_materialization.yaml:ro
    environment:
      - FEAST_OFFLINE_STORE_TYPE=file
      - FEAST_ONLINE_STORE_TYPE=redis
      - FEAST_REDIS_HOST=redis
      - FEAST_REDIS_PORT=6379
      - SUPABASE_POSTGRES_PASSWORD=${SUPABASE_POSTGRES_PASSWORD:?SUPABASE_POSTGRES_PASSWORD must be set}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    healthcheck:
      # Flag unhealthy if the loop heartbeat goes stale (hung loop). Threshold is
      # one interval (default 6h) + 1h buffer = 25200s; a crash-loop is already
      # visible via container restarts. Tune via MATERIALIZER_MAX_HEARTBEAT_AGE_SECONDS.
      # $$ escapes a literal $ for compose (so it is not interpolated); the
      # MAX_HEARTBEAT_AGE_SECONDS default (25200s = 6h interval + 1h buffer) is a
      # real compose variable and stays single-$.
      test:
        - "CMD-SHELL"
        - "test -f /tmp/materializer_heartbeat && [ $$(( $$(date -u +%s) - $$(cat /tmp/materializer_heartbeat) )) -lt ${MATERIALIZER_MAX_HEARTBEAT_AGE_SECONDS:-25200} ]"
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30m
    networks:
      - e2i_network
      - mlops_network
      - supabase-network  # Reach supabase-db (Postgres offline store)
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      redis:
        condition: service_healthy
      # Wait for the serving sidecar to apply the registry before the first
      # materialize (materialize-only relies on `feast`'s apply on the shared volume).
      feast:
        condition: service_healthy
    labels:
      - "e2i.service=mlops"
      - "e2i.component=feast-materializer"

  # Opik - LLM & Agent Observability
  # Real Opik requires 7+ services (MySQL, ClickHouse, ZooKeeper, MinIO, etc.)
  # Defined in docker-compose.opik.yml as a separate overlay file
  # Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.opik.yml up -d

  # ===========================================================================
  # TIER 3: APPLICATION SERVICES
  # ===========================================================================

  # FastAPI Backend - 21-Agent Orchestration Layer
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    # #528-B: GHCR-pull tag (built+pushed in CI); `build:` is the local fallback.
    image: ghcr.io/${IMAGE_OWNER:-local}/e2i-api:${IMAGE_TAG:-latest}
    container_name: e2i_api
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8000:8000"
    volumes:
      - ml_artifacts:/app/data/ml_artifacts
      - causal_outputs:/app/data/causal_outputs
      - agent_outputs:/app/data/agent_outputs
      - audit_artifacts:/app/data/audit_artifacts
      - experiment_designs:/app/data/experiment_designs
      - feature_cache:/app/data/feature_cache:ro  # Read from Feast
      # DSPy optimization artifacts (dspy_lane_ab_20260718.md §7): api is a
      # pure consumer — pattern_analyzer loads optimized_modules, startup
      # install_all_prompt_bundles reads optimized_prompts. Producer is
      # worker_medium (daily beat). :ro is intentional; an api-side writer
      # (dormant chatbot GEPA path) must consciously flip this + the guard
      # test (tests/integration/test_optimized_artifacts_compose_wiring.py).
      - optimized_modules:/app/optimized_modules:ro
      - optimized_prompts:/app/optimized_prompts:ro
    environment:
      <<: *common-env
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3002}
      # OOM guard: each inline-heavy request peaks ~1.3 GiB; 4 workers x 1 heavy
      # op ~= 5.2 GiB tripped the 5G api cgroup. Halved to 2 (paired with the
      # per-worker heavy-compute slot in src/api/dependencies/compute.py).
      WORKERS: 2
      ENABLE_HSTS: "true"
    command: >
      gunicorn src.api.main:app
      --config /app/config/gunicorn.conf.py
      --workers 2
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
      --graceful-timeout 30
      --keep-alive 5
      --max-requests 1000
      --max-requests-jitter 50
      --access-logfile -
      --error-logfile -
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - e2i_network
      - mlops_network
      - supabase-network  # Reach supabase-db for Feast offline-online parity test
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /app/tmp:size=100M,uid=1000,gid=1000,mode=0700
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 5G
        reservations:
          cpus: '1'
          memory: 2G
    depends_on:
      redis:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    labels:
      - "e2i.service=application"
      - "e2i.component=api"

  # ---------------------------------------------------------------------------
  # Celery Workers - Multi-Tier Architecture
  # ---------------------------------------------------------------------------

  # Worker Light - Quick tasks (API calls, cache updates, notifications)
  worker_light:
    <<: *common-worker
    logging: *default-logging
    volumes:
      - ml_artifacts:/app/data/ml_artifacts
      - causal_outputs:/app/data/causal_outputs
      - agent_outputs:/app/data/agent_outputs
      - audit_artifacts:/app/data/audit_artifacts
      - experiment_designs:/app/data/experiment_designs
      - feature_cache:/app/data/feature_cache:ro
    tmpfs:
      - /app/tmp:size=256M,uid=1000,gid=1000,mode=0700
    environment:
      <<: *common-env
      WORKER_TYPE: light
    command: >
      celery -A src.workers.celery_app worker
      --loglevel=INFO
      --concurrency=2
      --queues=default,quick,api
      --prefetch-multiplier=2
      --max-tasks-per-child=100
      --max-memory-per-child=524288
      --hostname=worker_light@%h
    healthcheck:
      test: ["CMD", "celery", "-A", "src.workers.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2'
          # #565: each prefork child loads the full autodiscovered app (~400MB);
          # a faithful c=2 boot probe of this image peaked at 905MB / idled at
          # 607MB. 1.5G clears that boot spike (the all-children + healthcheck +
          # page-cache transient) so the cgroup OOM-killer cannot fire. Steady
          # use stays ~607MB (limits are ceilings, not reservations), bounded by
          # --max-tasks-per-child=100. Was 1G @ --concurrency=4 → OOM-churn.
          memory: 1.5G
        reservations:
          cpus: '1'
          memory: 512M
      replicas: 2  # Always run 2 light workers
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    labels:
      - "e2i.service=application"
      - "e2i.component=worker"
      - "e2i.worker_tier=light"

  # Worker Medium - Standard analytics (reports, aggregations, dashboards)
  worker_medium:
    <<: *common-worker
    logging: *default-logging
    volumes:
      - ml_artifacts:/app/data/ml_artifacts
      - causal_outputs:/app/data/causal_outputs
      - agent_outputs:/app/data/agent_outputs
      - audit_artifacts:/app/data/audit_artifacts
      - experiment_designs:/app/data/experiment_designs
      - feature_cache:/app/data/feature_cache:ro
      # Producer side of the DSPy optimization artifacts: the daily
      # dspy-prompt-optimization-daily beat task (analytics queue) writes GEPA
      # module saves + .trigger_state.json (optimized_modules) and recipient
      # bundles (optimized_prompts). Read-write required — every writer
      # catches-and-warns, so a :ro mount would break saves SILENTLY.
      - optimized_modules:/app/optimized_modules
      - optimized_prompts:/app/optimized_prompts
    tmpfs:
      - /app/tmp:size=2G,uid=1000,gid=1000,mode=0700
    environment:
      <<: *common-env
      WORKER_TYPE: medium
    command: >
      celery -A src.workers.celery_app worker
      --loglevel=INFO
      --concurrency=2
      --queues=analytics,reports,aggregations
      --prefetch-multiplier=1
      --max-tasks-per-child=50
      --hostname=worker_medium@%h
    healthcheck:
      test: ["CMD", "celery", "-A", "src.workers.celery_app", "inspect", "ping"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
      replicas: 1  # Start with 1, can scale 0-3
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    labels:
      - "e2i.service=application"
      - "e2i.component=worker"
      - "e2i.worker_tier=medium"

  # Worker Heavy - Compute-intensive tasks (SHAP, causal refutation, ML, twins)
  worker_heavy:
    <<: *common-worker
    logging: *default-logging
    volumes:
      - ml_artifacts:/app/data/ml_artifacts
      - causal_outputs:/app/data/causal_outputs
      - agent_outputs:/app/data/agent_outputs
      - audit_artifacts:/app/data/audit_artifacts
      - experiment_designs:/app/data/experiment_designs
      - feature_cache:/app/data/feature_cache:ro
    tmpfs:
      # P2: right-sized for the 16GB box (was 8G). Scratch for one heavy task.
      - /app/tmp:size=2G,uid=1000,gid=1000,mode=0700
    environment:
      <<: *common-env
      WORKER_TYPE: heavy
      # P2: thread tuning right-sized for the 16GB/8vCPU box (was 16). Matches
      # the cpus:'2' limit so numpy/scipy/BLAS don't oversubscribe the box.
      OMP_NUM_THREADS: 2  # OpenMP threads for numpy/scipy
      OPENBLAS_NUM_THREADS: 2  # BLAS parallelization
      MKL_NUM_THREADS: 2  # Intel MKL if available
    command: >
      celery -A src.workers.celery_app worker
      --loglevel=INFO
      --concurrency=1
      --queues=shap,causal,ml,twins
      --prefetch-multiplier=1
      --max-tasks-per-child=10
      --max-memory-per-child=2097152
      --time-limit=3600
      --soft-time-limit=3300
      --hostname=worker_heavy@%h
    healthcheck:
      test: ["CMD", "celery", "-A", "src.workers.celery_app", "inspect", "ping"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        # P2: right-sized for the 16GB/8vCPU box (was 32G/16cpus, sized for a
        # hypothetical big box). One heavy SHAP/twin task peaks ~1.3 GiB; 3G with
        # c=1 leaves graceful-recycle headroom (--max-memory-per-child=2G).
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 2G
      # KEEP replicas: 0 — the heavy-offload feature flag (HEAVY_OFFLOAD_ENABLED)
      # ships DARK. The 16GB box has NO headroom to run worker_heavy yet (see the
      # 2026-05-30 droplet memory audit: ~10.5/16GB used + 7GB swap). Enabling the
      # offload requires scaling this up (replicas>=1) which needs box headroom or
      # the $48 second box. Until then this stays 0 and the API uses the P1 inline
      # path regardless of the flag.
      replicas: 0  # Start with 0, scale on-demand (0-4) — see headroom note above
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    labels:
      - "e2i.service=application"
      - "e2i.component=worker"
      - "e2i.worker_tier=heavy"
      - "e2i.autoscale=true"

  # Celery Beat - Scheduled Tasks (Drift Monitoring, Health Checks)
  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    # #528-B: same shared api image, GHCR-pull tag; `build:` is the local fallback.
    image: ghcr.io/${IMAGE_OWNER:-local}/e2i-api:${IMAGE_TAG:-latest}
    container_name: e2i_scheduler
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - causal_outputs:/app/data/causal_outputs:ro  # Read-only for monitoring
    environment:
      # #528-A: the scheduler does NOT inherit <<: *common-env (unlike api/workers),
      # so set ENVIRONMENT=production explicitly. Pre-flip the dev overlay supplied
      # ENVIRONMENT=development; once the prod deploy drops that overlay, celery beat
      # must schedule with the same prod config the workers execute under (avoids a
      # half-flip). Local dev still overrides this to development via
      # docker-compose.dev.yml's scheduler block.
      ENVIRONMENT: production
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/2
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
    command: >
      celery -A src.workers.celery_app beat
      --loglevel=INFO
      --scheduler=celery.beat:PersistentScheduler
      --schedule=/tmp/celerybeat-schedule
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.workers.celery_app inspect ping --timeout 10 2>/dev/null | grep -q pong || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    networks:
      - e2i_network
      # Reach supabase-db for scheduled Feast materialize-incremental beats
      # and ETL drift checks that hit the canonical tables (Block 6B-infra-4).
      - supabase-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=50M,mode=1777
      # beat autodiscovers src.mlops/src.agents, which transitively import shap ->
      # matplotlib writes its cache to MPLCONFIGDIR (/app/tmp) at import time; the
      # rootfs is read_only, so provide a writable e2i-owned tmpfs here too.
      - /app/tmp:size=64M,uid=1000,gid=1000,mode=0700
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    depends_on:
      redis:
        condition: service_healthy
      worker_light:
        # #565: celery-beat only PUBLISHES scheduled tasks to the redis broker — it
        # does not need a HEALTHY worker_light. A service_healthy edge let a flapping
        # worker_light (OOM-churn / slow inspect-ping) strand the scheduler in
        # "Created" and red the deploy (compose `up` exit 1, no rollback path).
        # service_started keeps the start-ordering without coupling beat to worker health.
        condition: service_started
    labels:
      - "e2i.service=application"
      - "e2i.component=scheduler"

  # Frontend - React Dashboard (Production Build)
  # Note: Vite env vars (VITE_*) are baked at build time, not runtime.
  # The frontend defaults to /api for API requests (see frontend/src/config/env.ts),
  # which is correct when served behind nginx.
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      target: production
    # #528-B: GHCR-pull tag for the nginx frontend image (built+pushed in CI by the
    # frontend build-push job); `build:` is the local fallback.
    image: ghcr.io/${IMAGE_OWNER:-local}/e2i-frontend:${IMAGE_TAG:-latest}
    container_name: e2i_frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3002:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - e2i_network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # #528-B: the nginx production stage runs as the non-root e2i user (uid 1000)
      # under a read_only rootfs, so these scratch tmpfs must be owned by uid 1000 —
      # else nginx dies at startup with `mkdir() "/var/cache/nginx/client_temp"
      # failed (13: Permission denied)` (a root-owned mode-0770 tmpfs is unwritable to
      # uid 1000). Verified out-of-band: without uid= the container emerg-exits; with
      # it nginx serves /health. Same non-root-tmpfs lesson as api/scheduler /app/tmp
      # in #527.
      - /var/cache/nginx:size=10M,mode=0770,uid=1000,gid=1000
      - /var/run:size=5M,mode=0770,uid=1000,gid=1000
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "e2i.service=application"
      - "e2i.component=frontend"

  # ===========================================================================
  # TIER 5: OBSERVABILITY STACK
  # ===========================================================================

  # Prometheus - Metrics Collection & Alerting
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: e2i_prometheus
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:9091:9090"  # 9090 taken by Opik MinIO
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - e2i_network
      - mlops_network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=10M,mode=1770
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      - "e2i.service=observability"
      - "e2i.component=prometheus"

  # Alertmanager - Alert Routing & Notification
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: e2i_alertmanager
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - e2i_network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    labels:
      - "e2i.service=observability"
      - "e2i.component=alertmanager"

  # Node Exporter - Host System Metrics
  node-exporter:
    image: prom/node-exporter:v1.9.0
    container_name: e2i_node_exporter
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - e2i_network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    labels:
      - "e2i.service=observability"
      - "e2i.component=node-exporter"

  # Postgres Exporter - Supabase Database Metrics
  # Connects directly to supabase-db via the external supabase-network
  # (bypasses the pooler, which is important for system catalog queries).
  # Block 6B-infra-4 moved this off the legacy `supabase_default` network
  # (used by docker/docker-compose.monitoring.yml's standalone deploy) onto
  # `supabase-network`, the canonical Supabase Docker network.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: e2i_postgres_exporter
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATA_SOURCE_NAME: "postgresql://supabase_admin:${SUPABASE_POSTGRES_PASSWORD:?SUPABASE_POSTGRES_PASSWORD must be set}@supabase-db:5432/postgres?sslmode=disable"
    networks:
      - e2i_network
      - supabase-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    labels:
      - "e2i.service=observability"
      - "e2i.component=postgres-exporter"

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:3.4.2
    container_name: e2i_loki
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3101:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - e2i_network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      - "e2i.service=observability"
      - "e2i.component=loki"

  # Promtail - Log Collector (ships to Loki)
  promtail:
    image: grafana/promtail:3.4.2
    container_name: e2i_promtail
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/positions
    command: -config.file=/etc/promtail/config.yml
    networks:
      - e2i_network
    security_opt:
      - no-new-privileges:true
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    labels:
      - "e2i.service=observability"
      - "e2i.component=promtail"

  # Grafana - Dashboards & Visualization
  grafana:
    image: grafana/grafana:11.5.2
    container_name: e2i_grafana
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3200:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3200
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - e2i_network
      - mlops_network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=10M,mode=1770
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      - "e2i.service=observability"
      - "e2i.component=grafana"
