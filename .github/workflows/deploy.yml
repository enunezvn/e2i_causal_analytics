name: Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'docker/Dockerfile'
      # Compose files ARE deploy inputs: the SSH script runs
      # `docker compose -f docker/docker-compose.yml -f <overlay> ... up`,
      # so a compose-only change (tmpfs perms, volumes, env, ulimits — cf. PR #527's
      # own hardening, which would NOT have auto-deployed) must trigger a deploy. The
      # in-script rebuild detector recreates from compose, but only after this fires.
      # docker-compose.secure.yml is intentionally excluded: the deploy script does not -f it.
      # #528-A: the deploy now consumes the slim docker-compose.frontend-dev.yml overlay
      # (frontend-only) for the forward path; docker-compose.dev.yml stays listed as the
      # pre-flip rollback fallback (the deploy may -f it when rolling back to a commit
      # that predates the slim overlay).
      - 'docker/docker-compose.yml'
      - 'docker/docker-compose.dev.yml'
      - 'docker/docker-compose.frontend-dev.yml'
      - 'docker/frontend/**'
      - 'frontend/**'
      - 'requirements.txt'
      # The hash-pinned lock (#534) is the actual dependency source the
      # Dockerfile installs from under --require-hashes; a lock-only change
      # (e.g. a regenerated lock after a security bump) must rebuild + deploy.
      - 'requirements.lock'
      - 'pyproject.toml'
      # pip path-installs baked into the image (Dockerfile: COPY patches/ ./patches/,
      # requirements.txt: ./patches/ag-ui-langgraph + ./patches/copilotkit). Kept in
      # sync with the in-script rebuild detector so a patch-only change still deploys.
      - 'patches/**'
      # T5: the BentoML serving entrypoint + image live OUTSIDE src/, so a
      # serving-SCHEMA change (scripts/bentoml/e2i_serving_service.py) or a build
      # input (docker/bentoml/**) would NOT trigger a deploy under the paths above —
      # the live serving schema then drifts from the API client until the next
      # unrelated deploy. List them so a serving change deploys (and the in-script
      # bentoml recreate below refreshes the container). src/mlops/bentoml_* is
      # already covered by 'src/**'.
      - 'scripts/bentoml/**'
      - 'docker/bentoml/**'
  workflow_dispatch:

# Serialize production deploys: at most one run of THIS workflow proceeds at a
# time, and a newer run is QUEUED rather than cancelled. GitHub keeps a single
# pending run per group and auto-supersedes older *pending* runs, so a batch
# merge to main no longer produces a droplet-side deploy pileup — the shared box
# gets git/compose collisions and a feast force-recreate SIGKILL (exit 137, NOT
# kernel OOM) when concurrent SSH deploys race, all concluding `failure` while
# the droplet nonetheless converges healthy (cf. #1412's 6-way 2026-07-31 pileup).
# Whole-workflow (top-level) group, not job-level on `deploy`: it supersedes an
# older pending run BEFORE it burns a test+build cycle, and folds workflow_dispatch
# into the same lane so a manual deploy also serializes against a push deploy.
# cancel-in-progress is deliberately false: cancelling a mid-flight SSH deploy is
# exactly how a REAL partial state gets created. Newest queued SHA still wins — the
# deploy script hard-resets to origin/main and the checkout-SHA tag mechanic converges.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/e2i-api
  IMAGE_NAME_FRONTEND: ${{ github.repository_owner }}/e2i-frontend

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/backend-tests.yml

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # #528-B: full-length sha so the droplet can pull this exact commit's image
          # by `$(git rev-parse HEAD)` (immutable, no short-sha ambiguity). `latest`
          # is kept for humans/manual pulls.
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # #528-B: build + push the frontend nginx production image so the droplet can pull
  # it instead of building Vite/nginx on the box. Mirrors build-and-push (api).
  build-and-push-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    needs: [build-and-push, build-and-push-frontend]
    environment: production
    # #528-B: packages:read so the job's GITHUB_TOKEN can pull the images it just
    # pushed; the token is forwarded to the droplet for `docker login ghcr.io`.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # #528-B: forwarded to the droplet for the GHCR pull. IMAGE_OWNER names the
          # GHCR namespace; GHCR_USER/GHCR_TOKEN authenticate the pull (GITHUB_TOKEN is
          # valid for the life of this job, which is when the droplet pulls).
          IMAGE_OWNER: ${{ github.repository_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          envs: IMAGE_OWNER,GHCR_USER,GHCR_TOKEN
          script: |
            set -e

            PROJECT_DIR="/home/enunez/Projects/e2i_causal_analytics"

            # Pick the compose overlay for the CHECKED-OUT commit, driven by what that
            # commit actually provides (so both forward deploys and rollbacks pick the
            # right one across all three eras):
            #   * #528-B onward — the frontend Dockerfile has an `AS production` (nginx)
            #     stage, so the frontend runs the base prod target like the app services
            #     → NO overlay at all (base compose alone, everything prod).
            #   * #528-A era — frontend has no prod stage; the slim frontend-only overlay
            #     keeps just the frontend on dev/Vite while app services are base prod.
            #   * pre-flip — neither exists; the full dev overlay (the #527 dev-in-prod
            #     model) is the rollback target.
            # Echoes the full `-f <file>` flag, or empty for the no-overlay case.
            # COMPOSE_CMD is (re)computed after EVERY checkout, since the tree changes.
            pick_overlay() {
              if grep -q 'AS production' docker/frontend/Dockerfile 2>/dev/null; then
                echo ""
              elif [ -f docker/docker-compose.frontend-dev.yml ]; then
                echo "-f docker/docker-compose.frontend-dev.yml"
              else
                echo "-f docker/docker-compose.dev.yml"
              fi
            }

            # Roll the named services back to PREV_SHA; the caller then `exit 1`s.
            # Shared by all failure paths (the feast recreate, the app-services flip, the
            # health check, and the bentoml refresh) so the rollback contract lives in ONE
            # place — previously inline copies drifted (one carried --renew-anon-volumes,
            # the other did not). Every `up` is BEST-EFFORT (`|| echo WARN`) so `set -e` can
            # NEVER abort mid-rollback before the caller's `exit 1`. Recompute COMPOSE_CMD
            # after the reset so the overlay matches the PREV_SHA tree (a pre-flip commit
            # falls back to the dev overlay).
            #
            # #563 double-fault avoidance: the GHCR-backed app/frontend tier
            # (api/frontend/worker_*/scheduler) is PULLED at PREV_SHA and recreated
            # --no-build, so the rollback does NOT locally rebuild the frontend — that
            # React/esbuild build is the OOM that turned the 2026-06-23 rollback into a
            # double-fault (the rollback `up --build` OOM-killed esbuild, leaving a PARTIAL
            # state). If the pull is unavailable (no IMAGE_OWNER, a registry hiccup, or a
            # pre-flip PREV_SHA whose frontend image was never pushed) we FALL BACK to the
            # prior `--build`, so a rollback is never WORSE than before. Locally-built
            # sidecars (feast/feast-materializer/bentoml — never pushed to GHCR) always
            # `--build`. --renew-anon-volumes on every up: a pre-flip PREV_SHA may still
            # carry the /app/.venv anon-volume mask, so renew repopulates it from the
            # PREV_SHA image; harmless no-op for the sidecars (named volume + ro binds only).
            rollback_to_prev() {
              # `reset --hard`, NOT `git checkout "$PREV_SHA"`: a raw-sha checkout DETACHES
              # HEAD, and the forward path's `reset --hard origin/main` moves a detached
              # HEAD without ever reattaching — the 2026-07-21 rollback left the droplet
              # checkout detached for two days, during which the unheld `main` branch got
              # silently taken over by `gh pr merge --delete-branch` runs in worktrees.
              # The droplet's main is a pure mirror of origin/main (never pushed from),
              # so rewinding the branch ref is safe — the next successful deploy's
              # `reset --hard origin/main` moves it forward again. The pre-deploy dirty-
              # tracked-files guard has already run, so there is nothing to clobber.
              git reset --hard "$PREV_SHA" \
                || echo "==> WARN: rollback reset to ${PREV_SHA:0:7} failed"
              COMPOSE_CMD="docker compose -f docker/docker-compose.yml $(pick_overlay)"
              # Partition the requested services into the GHCR-backed app/frontend tier
              # (pull, never local-build) and the locally-built sidecars (--build). No
              # `local` (portable to a plain /bin/sh); the helper is never re-entrant, and
              # both vars are reset on entry.
              rb_ghcr=""; rb_local=""
              for s in "$@"; do
                case "$s" in
                  api|frontend|worker_light|worker_medium|worker_heavy|scheduler) rb_ghcr="$rb_ghcr $s" ;;
                  *) rb_local="$rb_local $s" ;;
                esac
              done
              if [ -n "$rb_ghcr" ]; then
                export IMAGE_OWNER="$(echo "${IMAGE_OWNER:-}" | tr '[:upper:]' '[:lower:]')"
                export IMAGE_TAG="$PREV_SHA"
                if [ -n "$IMAGE_OWNER" ] \
                   && echo "${GHCR_TOKEN:-}" | docker login "${REGISTRY:-ghcr.io}" -u "${GHCR_USER:-$IMAGE_OWNER}" --password-stdin >/dev/null 2>&1 \
                   && $COMPOSE_CMD pull $rb_ghcr; then
                  $COMPOSE_CMD up -d --no-build --no-deps --force-recreate --renew-anon-volumes $rb_ghcr \
                    || echo "==> WARN: rollback 'up' (pulled app tier) failed — droplet may be in a PARTIAL state; manual intervention required"
                else
                  # GHCR unavailable / pre-flip target — fall back to the prior local build
                  # (never worse than before; the React build OOM risk is the same as old).
                  $COMPOSE_CMD up -d --build --no-deps --force-recreate --renew-anon-volumes $rb_ghcr \
                    || echo "==> WARN: rollback 'up' (local-build app tier) failed — droplet may be in a PARTIAL state; manual intervention required"
                fi
              fi
              if [ -n "$rb_local" ]; then
                $COMPOSE_CMD up -d --build --no-deps --force-recreate --renew-anon-volumes $rb_local \
                  || echo "==> WARN: rollback 'up' (sidecars) failed — droplet may be in a PARTIAL state; manual intervention required"
              fi
            }

            cd "$PROJECT_DIR"
            PREV_SHA=$(git rev-parse HEAD)
            echo "==> Pre-deploy SHA: ${PREV_SHA:0:7}"

            # Hard-sync to origin/main — droplet is a deploy target, not a dev box.
            # Abort only if a TRACKED file was hot-patched live: that is the change
            # `git reset --hard` would silently clobber, so refusing protects it.
            # Untracked files (-uno excludes them) are NOT touched by reset --hard,
            # so they must not block the deploy — an ops scratch file left in the
            # checkout (e.g. an audit script) previously aborted every deploy here.
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "ERROR: droplet has uncommitted changes to tracked files; refusing to reset --hard"
              git status --short --untracked-files=no
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
            NEW_SHA=$(git rev-parse HEAD)
            echo "==> Deploying ${NEW_SHA:0:7}"

            # Tree is now at NEW_SHA — select the overlay this commit needs (may be none).
            COMPOSE_CMD="docker compose -f docker/docker-compose.yml $(pick_overlay)"
            echo "==> Compose overlay: $(pick_overlay) (empty = base prod only)"

            # Apply DB migrations. run_migrations.sh auto-detects the connection:
            # SUPABASE_DB_URL when set (CI/remote), else `docker exec` into the
            # supabase-db container. The droplet's self-hosted Supabase exposes
            # no SUPABASE_DB_URL (REST creds only), so this step USED to skip
            # every deploy — leaving database/memory/ (lifecycle/sentinels/
            # crystallization) and database/migrations/ backlogs unapplied. The
            # runner now covers both dirs and tracks via public.schema_migrations.
            bash scripts/run_migrations.sh

            # The /app/.venv anon-volume mask is gone, so a forward recreate carries
            # the image's current deps; the anon-volume renewal flag is not needed here.
            # Decide rebuild by EXCLUSION, not enumeration: rebuild unless every
            # changed file is still BIND-MOUNTED at runtime. #528-A flipped the app
            # services to the prod target, so src/ + config/ are now COPYed into the
            # image (Dockerfile production stage) — a change to either is a baked image
            # input and MUST force a rebuild, so they are NO LONGER excluded. The paths
            # that remain bind-mounted (recreate, not rebuild) are: tests/ (not in the
            # prod image at all), feature_repo/ (bind-mounted into feast + the
            # materializer), and frontend/src|public|index.html (the frontend stays
            # dev/Vite via the slim overlay until #528-B). Any other path is a baked
            # image input — Dockerfile, requirements*, pyproject, patches/, frontend
            # build config (vite.config.ts, tailwind.config.js, tsconfig*), package
            # manifests, etc. — so it forces a rebuild without us enumerating each one.
            # A no-delta re-run (PREV==NEW, e.g. a retry after a partial/interrupted
            # build) also rebuilds, since we cannot prove the local image is current.
            # Capture changed files that are NOT dev-overlay bind mounts. Use a
            # captured-output emptiness test rather than the quiet-invert (-qv) exit
            # status: the droplet's grep may be ugrep, whose quiet-invert exit code is
            # unreliable and would risk a false-negative (skipping a needed rebuild).
            # `|| true` keeps set -e happy when every changed file IS bind-mounted
            # (grep then exits non-zero).
            CHANGED_BAKED=$(git diff --name-only "$PREV_SHA" "$NEW_SHA" \
              | grep -vE '^(tests/|feature_repo/|frontend/src/|frontend/public/|frontend/index\.html$)' \
              || true)
            if [ "$PREV_SHA" = "$NEW_SHA" ] || [ -n "$CHANGED_BAKED" ]; then
              echo "==> Rebuilding image (no-delta re-run or a non-bind-mounted image input changed)"
              BUILD_FLAG="--build"
            else
              echo "==> Bind-mounted code-only change — recreating from current image"
              BUILD_FLAG=""
            fi

            # #528-B: pull the pre-built app + frontend images from GHCR instead of
            # building on the droplet. The build-and-push jobs are a `needs:` of this
            # deploy, so the images for THIS commit ($NEW_SHA) are already pushed and
            # ALREADY INCLUDE any baked-input change — pulling is correct regardless of
            # the local rebuild detector, and it avoids running the OOM-prone React
            # production build on the droplet. So the pull is INDEPENDENT of BUILD_FLAG:
            # try login+pull first; fall back to a local build ONLY if login or pull
            # fails (registry hiccup / missing image) so a deploy is never wedged.
            # feast/feast-materializer are sidecar images NOT pushed to GHCR — they keep
            # building locally below, governed by $BUILD_FLAG.
            #   image: refs in docker-compose.yml resolve ghcr.io/$IMAGE_OWNER/<img>:$IMAGE_TAG
            export IMAGE_OWNER="$(echo "${IMAGE_OWNER:-}" | tr '[:upper:]' '[:lower:]')"
            export IMAGE_TAG="$NEW_SHA"
            if [ -n "$IMAGE_OWNER" ] \
               && echo "${GHCR_TOKEN:-}" | docker login "${REGISTRY:-ghcr.io}" -u "${GHCR_USER:-$IMAGE_OWNER}" --password-stdin >/dev/null 2>&1 \
               && $COMPOSE_CMD pull api worker_light worker_medium scheduler frontend; then
              echo "==> Pulled app images from GHCR at ${IMAGE_TAG:0:7} — using them (no local build)"
              APP_BUILD_FLAG="--no-build"
            else
              echo "==> GHCR pull unavailable — falling back to a local build for app images"
              APP_BUILD_FLAG="--build"
            fi

            # #528-A ordered rollout — a FRESH online store BEFORE the prod-target API
            # serves. The flip makes the fail-loud #532 Feast read path authoritative,
            # so serving against a stale/empty store would return null features or 503.
            # Recreate the feast sidecar + materializer FIRST, wait until the materializer
            # has completed a FRESH materialize in THIS deploy, and only THEN flip
            # api/workers/scheduler to the prod target. A single `up -d` of everything
            # gated solely on API health would let the prod API serve a stale store.
            #
            # Freshness signal: docker/feast/materializer-entrypoint.sh writes
            # /tmp/materializer_heartbeat (unix seconds) ONLY after its first successful
            # materialize, and --force-recreate clears that tmpfs — so a heartbeat whose
            # value is >= this deploy's start time proves a materialize just succeeded.
            # We poll the file directly (via docker exec), NOT the Docker health status:
            # the materializer healthcheck interval is 5m, so the status would not tick
            # to "healthy" within the wait window (a false-negative gate failure).
            GATE_START=$(date -u +%s)
            # #563: guard the feast forward-recreate. If THIS `up` fails, set -e would
            # otherwise abort BEFORE the materializer gate's rollback below (that gate fires
            # on the heartbeat poll, not on a failed `up`), stranding a half-recreated feast
            # that the still-old API points at via FEAST_URL. Roll feast back and fail loud.
            if ! $COMPOSE_CMD up -d $BUILD_FLAG --no-deps --force-recreate feast feast-materializer; then
              echo "==> feast/feast-materializer recreate at ${NEW_SHA:0:7} failed — rolling back to ${PREV_SHA:0:7}. Deploy FAILED."
              rollback_to_prev feast feast-materializer
              exit 1
            fi

            echo "==> Waiting for feast-materializer to complete a fresh materialize..."
            MAT_FRESH=false
            for i in $(seq 1 60); do
              HB=$(docker exec e2i_feast_materializer cat /tmp/materializer_heartbeat 2>/dev/null || echo 0)
              case "$HB" in ''|*[!0-9]*) HB=0 ;; esac
              if [ "$HB" -ge "$GATE_START" ]; then
                MAT_FRESH=true
                echo "==> feast-materializer completed a fresh materialize on attempt ${i} (heartbeat ${HB})"
                break
              fi
              sleep 10
            done
            if [ "$MAT_FRESH" = false ]; then
              # The store is NOT proven fresh. The app services were NOT flipped (still on
              # their pre-deploy containers), but `feast` itself was just recreated at
              # NEW_SHA and the still-serving old API depends on it
              # (FEAST_URL=http://feast:6566). Roll feast + feast-materializer back to
              # PREV_SHA so the old API keeps the known-good Feast it ran against, then
              # fail loud.
              echo "==> feast-materializer did not complete a fresh materialize in time."
              echo "==> Rolling feast + feast-materializer back to ${PREV_SHA:0:7} (app services were"
              echo "==> never flipped — they keep serving the pre-deploy version). Deploy FAILED."
              docker logs --tail 50 e2i_feast_materializer 2>&1 || true
              rollback_to_prev feast feast-materializer
              exit 1
            fi

            # Store is fresh — now flip the app services to the prod target, using the
            # GHCR-pulled images (--no-build) or a local build on fallback (#528-B).
            # #563: guard the flip. If this `up` fails (e.g. the #528-B GHCR pull-fallback
            # takes a local --build and the OOM-prone React build dies), set -e would abort
            # BEFORE the health-check rollback below, stranding feast at NEW_SHA (recreated
            # above) while the still-old API points at it via FEAST_URL=http://feast:6566 —
            # the same store/app incoherence the materializer-gate rollback guards. So roll
            # BOTH feast and the app services back to PREV_SHA, then fail loud.
            if ! $COMPOSE_CMD up -d $APP_BUILD_FLAG --no-deps --force-recreate \
                 api frontend worker_light worker_medium scheduler; then
              echo "==> App-services flip failed — rolling back feast + app services to ${PREV_SHA:0:7}. Deploy FAILED."
              rollback_to_prev feast feast-materializer api frontend worker_light worker_medium scheduler
              exit 1
            fi

            # Health check
            echo "==> Waiting for health check..."
            HEALTHY=false
            for i in $(seq 1 30); do
              if curl -sf --connect-timeout 3 --max-time 5 http://localhost:8000/health >/dev/null 2>&1; then
                HEALTHY=true
                echo "==> Health check passed on attempt ${i}"
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" = false ]; then
              echo "==> Health check failed — rolling back app services to ${PREV_SHA:0:7}"
              # Unchanged pre-#563 semantics: recreate ONLY the app services at PREV_SHA.
              # feast/feast-materializer materialized fresh and passed their gate, and the
              # app DID flip, so only the just-flipped app tier reverts (feast stays at
              # NEW_SHA). rollback_to_prev recomputes the overlay for the PREV_SHA tree
              # (a pre-flip commit falls back to docker-compose.dev.yml: dev target,
              # --reload, recoverable) and rebuilds with --renew-anon-volumes (PREV_SHA may
              # predate the /app/.venv anon-volume-mask removal).
              rollback_to_prev api frontend worker_light worker_medium scheduler
              sleep 10
              echo "==> Rollback complete. Deploy FAILED."
              exit 1
            fi

            # T5: refresh the BentoML serving container when THIS deploy changed a
            # serving input. The app + feast tiers are recreated above, but the
            # `bentoml` service is NOT — so the live serving schema (baked from
            # scripts/bentoml/e2i_serving_service.py in the prod target, or bind-mounted
            # in the dev overlay) silently drifts from the API client every deploy,
            # surfacing as a 400 on the cohort-scoring path. Recreate it ONLY when an
            # input changed: bentoml has a 60s start_period, so a needless restart is a
            # per-deploy serving blip. A no-delta re-run (PREV==NEW) also recreates,
            # since we cannot prove the running container is current. `|| true` keeps
            # set -e happy when grep matches nothing (mirrors the CHANGED_BAKED detector).
            # gold_standard_eval is bind-mounted into bentoml in the dev overlay
            # (FeatureBuilder unpickling for the cohort bundles), so a change there is
            # also a serving input.
            BENTOML_CHANGED=$(git diff --name-only "$PREV_SHA" "$NEW_SHA" \
              | grep -E '^(scripts/bentoml/|docker/bentoml/|src/mlops/bentoml_|src/mlops/gold_standard_eval/)' \
              || true)
            if [ "$PREV_SHA" = "$NEW_SHA" ] || [ -n "$BENTOML_CHANGED" ]; then
              echo "==> BentoML serving inputs changed — recreating bentoml so the live schema matches the client"
              # --build is correct for BOTH overlays: it re-bakes the prod image and is a
              # harmless no-op for the dev bind-mount (the fresh container re-reads it anyway).
              # On ANY bentoml failure below, roll the APP TIER back TOO (not just bentoml):
              # the app was already flipped to NEW_SHA above, so leaving app@NEW talking to
              # bentoml@PREV is the exact client/server schema drift this step exists to
              # prevent. Rolling both to PREV_SHA restores a coherent client+server pair
              # (feast stays at NEW_SHA, matching the app-health rollback above).
              if ! $COMPOSE_CMD up -d --build --no-deps --force-recreate bentoml; then
                echo "==> bentoml recreate at ${NEW_SHA:0:7} failed — rolling app tier + bentoml back to ${PREV_SHA:0:7}. Deploy FAILED."
                rollback_to_prev api frontend worker_light worker_medium scheduler bentoml
                exit 1
              fi
              # Readiness gate: a bare /healthz only proves the server is ALIVE. The
              # gold-standard cohort bundles that actually serve /predict_batch live in
              # self._models, whereas /health reports self._model (the LEGACY single default,
              # frequently absent) and would FALSE-fail a healthy multi-model service. POST
              # /model_info enumerates available_models (sorted self._models keys); require it
              # non-empty so the gate proves the serving substrate the cohort path uses is
              # actually loaded. curl -sf fails (-> empty) until the server is up, so this
              # single probe also covers the 60s start_period. 30x5s = 150s budget.
              BENTO_OK=false
              for i in $(seq 1 30); do
                INFO=$(curl -sf --connect-timeout 3 --max-time 5 -X POST \
                  -H 'Content-Type: application/json' -d '{}' \
                  http://localhost:3000/model_info 2>/dev/null || true)
                # Strip all whitespace first so the match is robust to compact OR
                # pretty-printed JSON (a line-oriented grep would otherwise miss a `[`
                # and the first quoted model name on separate lines). A non-empty array
                # starts `["`; an empty `[]` does not match.
                if printf '%s' "$INFO" | tr -d '[:space:]' | grep -q '"available_models":\["'; then
                  BENTO_OK=true
                  echo "==> bentoml is serving the cohort bundles on attempt ${i}"
                  break
                fi
                sleep 5
              done
              if [ "$BENTO_OK" = false ]; then
                echo "==> bentoml has no cohort bundles loaded at /model_info — rolling app tier + bentoml back to ${PREV_SHA:0:7}. Deploy FAILED."
                $COMPOSE_CMD logs --tail 50 bentoml 2>&1 || true
                rollback_to_prev api frontend worker_light worker_medium scheduler bentoml
                exit 1
              fi
            fi

            # Post-deploy prune (only reached when the health check passed). The
            # rebuild above re-tags :latest onto a new image and orphans the prior
            # build; under BuildKit those layers stay pinned by the build cache, so
            # `docker image prune` alone frees ~0 bytes — the builder-cache prune is
            # what actually reclaims them. Without this, dangling builds + build cache
            # grew to 100% disk on 2026-05-29 (~33x 19.4GB orphaned images + 146GB
            # build cache). Dangling/cache-only (never -a): no live or tagged image
            # and no running container is touched. Best-effort (|| true) so a prune
            # hiccup never fails an otherwise-successful deploy.
            # #565 recurrence fix: old SHA-tagged e2i-{api,frontend,worker,scheduler}
            # images are NOT dangling, so `docker image prune -f` (no -a) never removed
            # them and they accumulated every deploy (~33×19.4GB orphaned images by
            # 2026-05-29). `-a` removes images with NO associated container in ANY state,
            # so opik (intentionally stopped — its containers still exist) and every
            # active sidecar are protected; only truly-orphaned old-SHA images are
            # reclaimed. The rollback path rebuilds/repulls from source and runs BEFORE
            # this step, so dropping old SHA images cannot break a rollback.
            echo "==> Post-deploy prune (unreferenced images + full build cache)"
            docker image prune -a -f || true
            docker builder prune -a -f || true

      - name: Deployment summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo "## Deployment Succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Deployment Failed — Rollback Triggered" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Commit:** \`$COMMIT_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** $BRANCH_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actor:** $ACTOR" >> "$GITHUB_STEP_SUMMARY"
