name: Tier 1-5 Agent Harness

# Runs the integration harness that walks every Tier 1-5 agent
# (scripts/run_tier1_5_test.py) against a cached Tier 0 pipeline output. Acts
# as a forcing function against schema drift between tier0 state, the
# Tier0OutputMapper, and per-agent contracts.
#
# The job boots the core ML infra from docker/docker-compose.yml (Redis,
# FalkorDB, MLflow) so agents that lazy-init those backends find real
# services on 127.0.0.1. Supabase is not in scope for this workflow — its
# self-hosted compose lives under docker/supabase/ and takes long enough to
# bring up that it's better handled by a committed tier0 cache or a
# follow-up self-hosted-runner workflow.

on:
  pull_request:
    paths:
      - "src/agents/**"
      - "src/testing/**"
      - "scripts/run_tier0_test.py"
      - "scripts/run_tier1_5_test.py"
      - "config/agents/**"
      - ".github/workflows/tier1-5-test.yml"
      - "docker/docker-compose.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tier1-5-harness:
    name: Tier 1-5 agent harness
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Hard-fail mode (flipped 2026-05-16 per issue #263) — the dispatcher
    # wrapped-input fix landed in PR #275 (commit ac68ae41), and the
    # boot-stack + install-deps steps have been stable on consecutive
    # runs. Graceful-skip on missing tier0 cache is still honoured via
    # ``steps.restore-cache.outputs.found`` ``if:`` gating below — that's
    # a legitimate skip path, not a soft-fail.

    env:
      # CI-only dummy passwords. docker-compose.yml uses ${VAR:?msg} syntax
      # which evaluates ALL such refs at parse time (not just for services
      # being started), so every required var must be set even though we
      # only boot redis / falkordb / mlflow below.
      REDIS_PASSWORD: "ci-only-changeme"
      FALKORDB_PASSWORD: "ci-only-changeme"
      GRAFANA_ADMIN_PASSWORD: "ci-only-changeme"
      SUPABASE_POSTGRES_PASSWORD: "ci-only-changeme"
      # Service endpoints the harness should point agents at.
      REDIS_URL: "redis://:ci-only-changeme@127.0.0.1:6382/0"
      FALKORDB_HOST: "127.0.0.1"
      FALKORDB_PORT: "6381"
      FALKORDB_PASSWORD_ENV: "ci-only-changeme"
      MLFLOW_TRACKING_URI: "http://127.0.0.1:5000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Boot Redis + FalkorDB + MLflow from docker-compose
        id: boot-stack
        # Graceful-skip: ``set +e`` + explicit ``exit 0`` + ``ok=false``
        # output keeps a transient compose issue (image pull rate-limit,
        # healthcheck timeout) from being mistaken for a real regression.
        # Real regressions (compose-file parse errors, network conflicts)
        # still surface as a non-zero exit via shell defaults. Downstream
        # steps inspect ``steps.boot-stack.outputs.ok`` to gate the
        # harness, and the failure() guard below captures logs.
        run: |
          set +e
          # docker-compose.yml references an external 'supabase-network'
          # (used by api / feast / scheduler — not by our 3 services). Even
          # when only starting a subset, compose validates external networks
          # exist, so pre-create it as an empty bridge to satisfy the
          # declaration without bringing Supabase up.
          docker network inspect supabase-network >/dev/null 2>&1 \
            || docker network create supabase-network
          if ! docker compose -f docker/docker-compose.yml up -d redis falkordb mlflow; then
            echo "::warning::docker compose up failed; harness will be skipped"
            echo "ok=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Waiting for services to report healthy..."
          ALL_HEALTHY=true
          for svc in redis falkordb mlflow; do
            HEALTHY=false
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "e2i_${svc}" 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                echo "  $svc: healthy ($i tries)"
                HEALTHY=true
                break
              fi
              sleep 2
            done
            if [ "$HEALTHY" = "false" ]; then
              echo "::warning::$svc did not become healthy within 60s (last status: $status)"
              docker logs "e2i_${svc}" --tail 80 || true
              ALL_HEALTHY=false
            fi
          done
          docker compose -f docker/docker-compose.yml ps
          if [ "$ALL_HEALTHY" = "true" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Install runtime + dev dependencies
        id: install-deps
        # Hard-fail (#263 flip-off 2026-05-16): a pip resolver / build
        # regression must trip the check; the harness cannot meaningfully
        # run on a broken dep set. Downstream ``if:`` still gates the
        # harness run on ``steps.install-deps.outcome == 'success'`` so
        # the skip-summary path remains coherent if a future contributor
        # re-introduces structured graceful-skip here.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Restore tier0 cache (if committed to repo)
        id: restore-cache
        run: |
          if [ -f scripts/tier0_output_cache/latest.pkl ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Tier 0 cache present at scripts/tier0_output_cache/latest.pkl"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No tier0 cache committed — harness will be skipped with a"
            echo "success status. The docker stack still came up so any"
            echo "container-image / compose-config regression would have"
            echo "surfaced in the boot step above."
          fi

      - name: Run Tier 1-5 harness
        if: |
          steps.install-deps.outcome == 'success' &&
          steps.boot-stack.outputs.ok == 'true' &&
          steps.restore-cache.outputs.found == 'true'
        env:
          E2I_TESTING_MODE: "true"
          DISABLE_PANDERA_IMPORT_WARNING: "True"
        run: |
          make tier1-5-test

      - name: Summarize skip reasons
        if: |
          steps.install-deps.outcome != 'success' ||
          steps.boot-stack.outputs.ok != 'true' ||
          steps.restore-cache.outputs.found != 'true'
        run: |
          REASONS=""
          if [ "${{ steps.install-deps.outcome }}" != "success" ]; then
            REASONS="${REASONS}pip-install failed; "
          fi
          if [ "${{ steps.boot-stack.outputs.ok }}" != "true" ]; then
            REASONS="${REASONS}docker stack unhealthy; "
          fi
          if [ "${{ steps.restore-cache.outputs.found }}" != "true" ]; then
            REASONS="${REASONS}no tier0 cache committed; "
          fi
          echo "::notice title=Tier 1-5 harness skipped::${REASONS}A skip is currently emitted only on missing tier0 cache or unhealthy infra; pip-install failures hard-fail (#263)."

      - name: Capture docker logs on failure
        if: failure()
        run: |
          for svc in redis falkordb mlflow; do
            echo "::group::e2i_${svc} logs"
            docker logs "e2i_${svc}" --tail 200 || true
            echo "::endgroup::"
          done

      - name: Tear down docker stack
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml down -v --remove-orphans || true

      - name: Upload results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-5-results-${{ github.run_id }}
          path: docs/results/tier1_5_pipeline_latest.json
          if-no-files-found: ignore
          retention-days: 14
