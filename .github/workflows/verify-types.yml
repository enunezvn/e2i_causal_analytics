name: Verify OpenAPI Types

on:
  pull_request:
    paths:
      # Any Python source can affect the OpenAPI schema — API routes import
      # Pydantic models from src/kpi/, src/memory/, src/feature_store/,
      # src/mlops/, src/rag/, src/agents/, etc. Narrowing to src/api/** misses
      # those schema-affecting changes.
      - "src/**/*.py"
      - "frontend/src/types/generated/**"
      - ".spectral.yml"
      - ".github/workflows/verify-types.yml"
  push:
    branches: [main]
    paths:
      - "src/**/*.py"
      - ".spectral.yml"
      - ".github/workflows/verify-types.yml"

jobs:
  verify-types:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This job installs BOTH the full frontend (npm ci) and the heavy ML
      # backend (pip install -r requirements.txt) on one runner, which can
      # exhaust the ~14 GB default disk ([Errno 28] No space left on device
      # during pip install). Purge preinstalled SDKs we don't use to reclaim
      # ~20 GB before the installs. Each removal is non-fatal (|| true).
      - name: Free up runner disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
            /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "Disk after cleanup:"; df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Export OpenAPI spec (static — no server required)
        run: |
          python -m scripts.export_openapi --output openapi.json

      # There is deliberately NO drift diff here: its baseline
      # (frontend/src/types/generated/api.ts) was untracked in 5aa69163 and
      # gitignored — hand-written types in frontend/src/types/*.ts are the
      # compiler's source of truth, and generated types are a local diff aid
      # (see frontend/README.md "Generated types"). The former "Check for
      # type drift" step diffed against that nonexistent file, warning
      # "may be out of sync" on every run. What CI can certify instead,
      # as hard gates: the current backend schema must generate, and the
      # generated TypeScript must compile.
      - name: Generate types from exported spec
        working-directory: frontend
        run: |
          npx openapi-typescript ../openapi.json -o src/types/generated/api.ts

      - name: Compile-check generated types
        working-directory: frontend
        run: |
          npx tsc --noEmit --strict --skipLibCheck src/types/generated/api.ts

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Lint OpenAPI spec
        run: spectral lint openapi.json --ruleset .spectral.yml

      - name: Generate Redoc HTML
        run: |
          npx --yes @redocly/cli build-docs openapi.json \
            --output redoc.html \
            --title "E2I Causal Analytics API"

      - name: Upload Redoc HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: redoc-html
          path: redoc.html
          retention-days: 30
