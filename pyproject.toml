[project]
name = "e2i-causal-analytics"
version = "4.2.1"
description = "Healthcare Engagement Intelligence - Multi-agent causal analytics platform for pharmaceutical drug adoption analysis"
authors = [
    {name = "E2I Team"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
keywords = ["causal-inference", "healthcare", "ai-agents", "rag", "mlops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core AI Framework
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "anthropic>=0.39.0",

    # Database & Storage
    "supabase>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "pgvector>=0.3.0",
    "falkordb>=1.0.0",

    # Causal Inference
    # dowhy < 0.13 calls nx.algorithms.d_separated, removed in networkx 3.5
    # (#869); 0.13+ imports is_d_separator with a d_separated fallback, so it
    # works against every networkx this spec admits. Floor guarded by
    # tests/test_requirements_lock.py::test_pyproject_dowhy_floor_is_networkx35_compatible.
    "dowhy>=0.13",
    "econml>=0.15.0",
    "networkx>=3.0",
    "causalml>=0.15.0",
    "causal-learn>=0.1.3.8",          # Structure learning (GES, PC, FCI, LiNGAM)

    # ML & Data Science
    "scikit-learn>=1.6.1,<1.7",    # Joint window: econml 0.16 needs <1.7; sksurv 0.26 needs >=1.6.1,<1.8. See backlog #36 codex pass-1 MEDIUM.
    "scikit-survival>=0.26,<0.27", # Cox PH + Random Survival Forest (v5 B2); 0.26 lifts osqp constraint to >=1.0.2 (matches cvxpy 1.7.5) while staying under sklearn<1.8 (preserves econml 0.16 sklearn<1.7 pin). 0.27 requires sklearn>=1.8 — incompatible with econml. See backlog #36.
    "lifelines>=0.30.0",           # Kaplan-Meier, log-rank, time-to-event utilities
    "pandas>=2.2.0",
    "numpy>=2.0.0",  # Generator.spawn() (reseed RNG stream split, T11) requires NumPy 2.0+
    "scipy>=1.13.0",

    # MLOps Stack (7 Tools)
    "mlflow>=3.15.1,<3.16.0",      # Experiment tracking — lockstep with requirements.txt (#442; range bumped by #1476 for cryptography 49)
    "opik>=0.2.0",                 # LLM/Agent observability
    # ``feast`` is NOT installable into this project's venv. Every feast
    # release (0.43..0.63) pins ``tenacity<9``, which is unsatisfiable
    # against the ``tenacity>=9.0.0`` pin below (required by graphiti-core,
    # which has declared ``tenacity>=9.0.0`` since 0.15). pip's resolver
    # therefore refuses both ``pip install feast`` into the project venv
    # and any ``[project.optional-dependencies]`` feast extra. Production
    # runs feast as a separate service container — see
    # ``docker/Dockerfile.feast`` (``feastdev/feature-server:0.43.0``).
    # For dev work that needs to call the feast SDK from Python: install
    # feast into a *dedicated* venv distinct from this project's venv.
    # All ``src/`` feast imports are guarded (TYPE_CHECKING /
    # try-inside-method) so the app starts cleanly without the SDK.
    # See issue #307 for the layered-conflict diagnosis.
    "great-expectations>=1.0.0",   # Data quality validation
    "optuna>=3.6.0",               # Hyperparameter optimization
    "bentoml>=1.3.0",              # Model serving
    "shap>=0.46.0",                # Model interpretability

    # NLP & Embeddings
    "fasttext>=0.9.3",
    "rapidfuzz>=3.10.0",
    "sentence-transformers>=3.0.0",
    "tiktoken>=0.8.0",
    "openai>=1.54.0",

    # RAG & Prompt Engineering
    "ragas>=0.1.0",                # RAG evaluation
    "dspy>=3.0.0",                 # Prompt optimization (post-3.0 canonical name; legacy alias 'dspy-ai' removed 2026-05-14)

    # Knowledge Graph
    "graphiti-core[falkordb,anthropic]>=0.10.0",  # Temporal knowledge graph

    # API & Web
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",

    # Data Validation
    "pyyaml>=6.0",
    "jsonschema>=4.23.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",  # Floor set by graphiti-core (every version since 0.15 declares ``tenacity>=9.0.0``). Unsatisfiable against feast's ``tenacity<9`` — feast cannot be co-installed; see the feast-comment block above + issue #307.
    "tqdm>=4.66.0",
    "python-json-logger>=2.0.7",

    # Dependency version pins to resolve conflicts
    "multiprocess>=0.70.16,<0.70.18",  # Pin to avoid dill>=0.4.0 requirement (conflicts with feast's dill~=0.3.0)

    # Task Queue & Workers
    "celery>=5.3.0",
    "kombu>=5.3.0",

    # Production Server
    "gunicorn>=22.0.0",

    # Visualization
    "matplotlib>=3.8.0",

    # Excel file reading
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "black>=24.8.0",
    # ruff's formatter output is version-sensitive and gated exactly in CI
    # (ruff==0.14.10 in backend-tests.yml, requirements*.txt, .pre-commit-config.yaml).
    # Pin it here too so a pyproject-based dev install can't drift onto a newer ruff
    # that reformats differently and fails the lint gate. Bump all five in lockstep.
    "ruff==0.14.10",
    "mypy>=1.11.0",
    "pre-commit>=3.7.0",
    "detect-secrets>=1.5.0",
    "ipython>=8.27.0",
    "jupyter>=1.1.0",
    "types-PyYAML>=6.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "E402",  # module-import-not-at-top (common in conditional imports)
    "E711",  # none-comparison (SQLAlchemy uses `== None`)
    "E721",  # type-comparison
    "E741",  # ambiguous-variable-name (e.g., l, O)
    "B007",  # unused-loop-control-variable
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise-without-from-inside-except
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["B017", "E722", "F811"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Per-module strict overrides — modules cleaned to zero errors
[[tool.mypy.overrides]]
module = "src.utils.type_helpers"
disallow_untyped_defs = true

[tool.pytest.ini_options]
# Load environment variables from .env file
env_files = [".env"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Global timeout: 30 seconds per test (safety net against hanging)
timeout = 30
timeout_method = "thread"
# Custom markers for test categorization
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires external services)",
    "e2e: End-to-end tests (full stack)",
    "slow: Tests that take longer than 10 seconds",
    "requires_redis: Test requires Redis connection",
    "requires_falkordb: Test requires FalkorDB connection",
    "requires_supabase: Test requires Supabase connection",
    "heavy_ml: Tests with heavy ML imports (dspy, econml, dowhy) - grouped on single worker",
    "xdist_group(name): Group tests to run on same worker (prevents DSPy import race conditions)",
    "real_data: Test requires real cohort data (CSU/Optum) on disk - skips when absent",
    "benchmark: Retrieval-quality (Recall@10 / MRR) benchmark — excluded from default unit-test sweep, run via .github/workflows/retrieval-benchmarks.yml (issue #377)",
    "live_llm: Live LLM smoke (real Anthropic SDK call) — skipped unless ANTHROPIC_API_KEY starts with 'sk-ant-' (issue #376 e2e)",
    "live_lm: Plan-239 §5.3 Tier-2 — MIPROv2 byte-identical reproducibility requires a live LM key; CI-skipped without ANTHROPIC_API_KEY",
    "real_supabase: Opt-out of the unit-tree dead-Supabase pin (#1420) — ONLY for reachability-gated READ-ONLY faithful checks; never for tests that write",
]
# Filter warnings
filterwarnings = [
    "ignore::DeprecationWarning:asyncio",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
# Add custom options
# IMPORTANT: Limit parallel workers to prevent memory exhaustion
# System has 7.5GB RAM, heavy ML imports use ~500MB/worker
# Safe default: 4 workers = ~2GB for tests + ~4GB for OS/services
addopts = "-v --tb=short -n 4 --dist=loadscope"
# Enable test authentication bypass mode
env = [
    "E2I_TESTING_MODE=true",
]

# =============================================================================
# COVERAGE CONFIGURATION
# =============================================================================
[tool.coverage.run]
# Source directories to measure coverage for
source = ["src"]
# Branch coverage (track if/else branches)
branch = true
# Parallel mode for xdist workers
parallel = true
# Omit patterns from coverage measurement
omit = [
    "src/*/__init__.py",
    "src/*/migrations/*",
    "src/api/routes/__init__.py",
    "src/agents/*/__init__.py",
]

[tool.coverage.report]
# Minimum coverage threshold (fail if below).
# Aspirational target: 70 (achieved Feb 2026 via Phase 6 batches 1-3).
# Current reality: ~25% — net new code (Tier-0/feast/causal stack)
# landed faster than tests. Re-baselined to 20 (with buffer) until
# coverage backfill catches up, so the gate still catches drops below
# current rather than blocking PRs unconditionally. Track follow-up
# tickets to incrementally lift back toward 70.
fail_under = 20
# Show missing line numbers in report
show_missing = true
# Skip files with 100% coverage in report (reduces noise)
skip_covered = false
# Exclude patterns from coverage report
exclude_lines = [
    # Standard exclusions
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "raise AssertionError",
    # Debug-only code
    "if __name__ == .__main__.:",
    "if settings.DEBUG:",
    # Abstract methods
    "@abstractmethod",
    # Defensive assertions
    "assert False",
]
# Precision for coverage percentages
precision = 2

[tool.coverage.html]
# HTML report output directory
directory = "htmlcov"
# Show contexts in HTML report
show_contexts = true

[tool.coverage.xml]
# XML report output for CI/CD integration
output = "coverage.xml"
