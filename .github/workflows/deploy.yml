name: Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'docker/Dockerfile'
      - 'docker/frontend/**'
      - 'frontend/**'
      - 'requirements.txt'
      - 'pyproject.toml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/e2i-api

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/backend-tests.yml

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            PROJECT_DIR="/home/enunez/Projects/e2i_causal_analytics"
            COMPOSE_CMD="docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml"

            cd "$PROJECT_DIR"
            PREV_SHA=$(git rev-parse HEAD)
            echo "==> Pre-deploy SHA: ${PREV_SHA:0:7}"

            # Hard-sync to origin/main — droplet is a deploy target, not a dev box.
            # Abort if there are uncommitted changes (someone is hot-patching live).
            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: droplet has uncommitted changes; refusing to reset --hard"
              git status --short
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
            NEW_SHA=$(git rev-parse HEAD)
            echo "==> Deploying ${NEW_SHA:0:7}"

            # Run migrations only when the DB URL is present in the deploy env;
            # run_migrations.sh hard-exits otherwise, which `set -e` would abort on.
            if [ -n "${SUPABASE_DB_URL:-}" ]; then
              bash scripts/run_migrations.sh
            else
              echo "==> Skipping migrations: SUPABASE_DB_URL unset"
            fi

            # Rebuild + recreate app services so dependency/code changes in the
            # image actually land. `restart` alone reuses the stale baked venv
            # (the anonymous /app/.venv volume), which silently dropped new deps
            # and caused the 2026-05-26 outage. --renew-anon-volumes discards the
            # stale venv; --build picks up requirements + code changes.
            $COMPOSE_CMD up -d --build --no-deps --force-recreate --renew-anon-volumes \
              api frontend worker_light worker_medium scheduler

            # Health check
            echo "==> Waiting for health check..."
            HEALTHY=false
            for i in $(seq 1 30); do
              if curl -sf --connect-timeout 3 --max-time 5 http://localhost:8000/health >/dev/null 2>&1; then
                HEALTHY=true
                echo "==> Health check passed on attempt ${i}"
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" = false ]; then
              echo "==> Health check failed — rolling back to ${PREV_SHA:0:7}"
              git checkout "$PREV_SHA"
              $COMPOSE_CMD up -d --build --no-deps --force-recreate --renew-anon-volumes \
                api frontend worker_light worker_medium scheduler
              sleep 10
              echo "==> Rollback complete. Deploy FAILED."
              exit 1
            fi

      - name: Deployment summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo "## Deployment Succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Deployment Failed — Rollback Triggered" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Commit:** \`$COMMIT_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** $BRANCH_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actor:** $ACTOR" >> "$GITHUB_STEP_SUMMARY"
