name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggers

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # =============================================================================
  # Secrets Scanning - Detect hardcoded secrets and credentials
  # =============================================================================
  secrets-scan:
    name: Secrets Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional for full features

      - name: Upload Gitleaks results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: results.sarif
          retention-days: 30

  # =============================================================================
  # SAST - Static Application Security Testing for Python
  # =============================================================================
  sast-python:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit security scan
        run: |
          bandit -r src/ \
            -f json \
            -o bandit-results.json \
            --severity-level medium \
            --confidence-level medium \
            -x '**/test_*.py,**/*_test.py,**/tests/**' \
            || true  # Don't fail CI, just report

      - name: Check for HIGH/CRITICAL findings
        run: |
          if [ -f bandit-results.json ]; then
            HIGH_COUNT=$(python -c "
          import json, sys
          data = json.load(open('bandit-results.json'))
          results = data.get('results', [])
          high_crit = [r for r in results if r.get('issue_severity') in ('HIGH', 'CRITICAL')]
          print(len(high_crit))
          " 2>/dev/null || echo "0")
            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "::error::Bandit found $HIGH_COUNT HIGH/CRITICAL severity findings"
              exit 1
            fi
          fi

      - name: Upload Bandit JSON results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-results
          path: bandit-results.json
          retention-days: 30

      - name: Display Bandit summary
        if: always()
        run: |
          echo "## Bandit Security Scan Results" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit-results.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat bandit-results.json | python -m json.tool | head -100 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # SAST - Semgrep for comprehensive pattern matching
  # =============================================================================
  sast-semgrep:
    name: Multi-language SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        # --config auto dropped: non-deterministic across runs.
        # --severity ERROR scopes the gate to high-confidence findings;
        # WARNING-level rules remain visible in artifacts for triage.
        # Local-dev noise reduction lives in .semgrepignore + .semgrep.yml.
        run: |
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --severity ERROR \
            --json \
            --json-output=semgrep-results.json \
            --exclude='**/test_*.py' \
            --exclude='**/*_test.py' \
            --exclude='**/tests/**' \
            --exclude='**/.venv/**' \
            --exclude='**/node_modules/**' \
            --exclude='**/.worktrees/**' \
            || true

      - name: Check for ERROR/WARNING findings
        run: |
          if [ -f semgrep-results.json ]; then
            FINDING_COUNT=$(python3 -c "
          import json
          data = json.load(open('semgrep-results.json'))
          results = data.get('results', [])
          severe = [r for r in results if r.get('extra', {}).get('severity') in ('ERROR', 'WARNING')]
          print(len(severe))
          " 2>/dev/null || echo "0")
            if [ "$FINDING_COUNT" -gt 0 ]; then
              echo "::error::Semgrep found $FINDING_COUNT ERROR/WARNING findings"
              exit 1
            fi
          fi

      - name: Upload Semgrep artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30

  # =============================================================================
  # Dependency Scanning - Check for vulnerable Python packages
  # =============================================================================
  dependency-scan:
    name: Dependency Scanning (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        # --ignore-vuln carve-outs documented inline below. Each entry
        # captures the package, the upstream-fix version (or "no fix"),
        # and the reason we're holding off. Re-evaluate at every quarterly
        # dep upgrade pass — see TODO note in CHANGELOG / DEPENDENCY_AUDIT.md.
        run: |
          pip-audit \
            --requirement requirements.txt \
            --format json \
            --output pip-audit-results.json \
            --desc on \
            --ignore-vuln GHSA-w8v5-vhqr-4h9v `# diskcache 5.6.3 has no upstream fix as of 2026-04` \
            --ignore-vuln GHSA-gg5m-55jj-8m5g `# graphiti-core 0.24.3 -> 0.28.2 multi-minor; depends on memory backend test pass` \
            `# === 2026-08-04 (#1476, parent #1456): mlflow bumped 3.11.1 -> 3.15.1, whose cryptography cap is <50 — cryptography bumped 46.0.7 -> 49.0.0, CLEARING 3 of the 4 advisories held by the 2026-08-03 CVE drop: GHSA-537c-gmf6-5ccf (bundled OpenSSL, fix 48.0.1) + CVE-2026-69248 (fix 49.0.0) + CVE-2026-69249 (fix 49.0.0), all removed from this allowlist (both dated blocks). The 1 entry below is the residual: its fix is 50.0.0, and NO mlflow release admits cryptography>=50 yet (3.15.1 pins cryptography<50,>=43.0.0 — verified on PyPI 2026-08-04). NOTE cryptography IS a direct pin (requirements.txt), but our own code never IMPORTS it — zero hits repo-wide for cryptography imports and zero for the affected APIs (pkcs7 / EnvelopedData). ===` \
            --ignore-vuln CVE-2026-69247 `# cryptography 49.0.0 (HIGH; PKCS#7 EnvelopedData Bleichenbacher oracle via distinguishable errors/timing); fix 50.0.0 — BLOCKED: mlflow 3.15.1 (latest) caps cryptography<50, so a 50.x pin is unsatisfiable. Mitigated — zero pkcs7/EnvelopedData usage repo-wide (re-grep-verified 2026-08-04; the repo never imports cryptography directly). Re-evaluate when an mlflow release admits cryptography>=50 (#1456).` \
            `# === mlflow >=3.15.1,<3.16.0 (post-#1476 upgrade; supersedes #442 / #362): bumped to the 3.15.x line for its cryptography<50 cap (see the cryptography block above). The 1 entry below is the residual: 1 advisory with no upstream fix (first_patched_version=null; advisory range <=3.10.1 — kept listed so local and CI advisory DBs agree). v3.15.1 is the target image tag (ghcr manifest verified 2026-08-04). ===` \
            --ignore-vuln GHSA-7qhf-v65m-g5f3 `# mlflow 3.15.1 (CVE-2026-0545; /ajax-api/3.0/jobs/* unauth bypass when basic-auth+job execution enabled); first_patched_version=null per gh api /advisories/GHSA-7qhf-v65m-g5f3, re-checked 2026-08-04 (advisory range <=3.10.1; kept listed so local and CI advisory DBs agree). Mitigated — MLFLOW_SERVER_ENABLE_JOB_EXECUTION is unset in our deployment, so /jobs/* endpoints are not active.` \
            `# === 2026-09-01 CVE-drop (#1870; 1 package, fresh pip-audit CVE-DB refresh — first red on the 20:11Z security run of PR #1869 and on every branch since, all changing ZERO dependencies; main was still green at 13:36Z the same day). NO upstream fix exists for ANY release — the affected range is >=3.13.0,<=3.15.2 and 3.15.2 is the newest PyPI release as of 2026-09-01 — so this is a hold, not a deferred bump. Reachability-verified mitigation below; re-check for a fixed release at every mlflow bump / quarterly dep pass. ===` \
            --ignore-vuln CVE-2026-71211 `# mlflow 3.15.2 CI-resolved / 3.15.1 image (GHSA-h7x2-h6g9-p789; HIGH 7.1 — AI Gateway SSRF: CreateGatewaySecret stores an unvalidated auth_config.api_base and POST /gateway/proxy/{endpoint}/{path} (gateway_router prefix=/gateway, gateway_api.py:89; the secrets CRUD is Flask-side at /ajax-api/3.0/mlflow/gateway/secrets/*) then issues a server-side HTTP request to it and returns the body; _validate_webhook_url is never applied on that path); fix_versions=[] per pip-audit (pypi AND osv services) and first_patched_version=null per gh api /advisories/GHSA-h7x2-h6g9-p789, checked 2026-09-01. NOT an unused optional component: in 3.15.1 server/fastapi_app.py calls include_router(gateway_router) unconditionally and our server runs without --app-name basic-auth, so the gateway API is live and unauthenticated on mlflow:5000 (verified 2026-09-01: GET .../gateway/secrets/list -> 200 {} on 127.0.0.1:5000). Mitigated by REACHABILITY, not absence: the container publishes 127.0.0.1:5000 only and the sole external path is the host-nginx /mlflow/ location behind auth_basic (public probe -> 401); we never use the gateway (zero mlflow.gateway / deployments references repo-wide), so no legitimate traffic reaches these routes. Residual accepted with #1870: a holder of the /mlflow/ basic-auth credential (or a foothold on the compose network) could SSRF from the mlflow container to in-network HTTP (api:8000, bentoml:3000, feast:6566 all answered from that container) and to the DigitalOcean metadata service (169.254.169.254 answered 200) — recommended hardening on #1870: a host-nginx deny for BOTH /mlflow/gateway/ and /mlflow/ajax-api/*/mlflow/gateway/ (host nginx proxy_passes /mlflow/ -> 127.0.0.1:5000/ so both prefixes are public behind auth_basic) plus a DOCKER-USER egress block for 169.254.169.254. Drop this row when an mlflow release publishes a fix.` \
            --ignore-vuln GHSA-95ww-475f-pr4f `# ragas 0.4.1 has no upstream fix as of 2026-04` \
            --ignore-vuln GHSA-69w3-r845-3855 `# transformers 4.57.3 fix only in 5.0.0rc3 (refuse rc); revisit when 5.0 GA lands` \
            `# === 2026-07-10 allowlist sweep: mistune pinned 3.1.4->3.3.3 in requirements.txt, clearing all 5 held mistune advisories (GHSA-8mp2/8g87/58cw/v87v/qcq2 = CVE-2026-33079/44708/44896/44897/49851 — the math-plugin XSS has no first_patched_version but its vulnerable range is <=3.2.0). The same sweep removed 50 STALE entries whose packages had already been pinned at/past the fix version in earlier bumps (aiohttp 3.14.1, bentoml 1.4.39, tornado 6.5.7, litellm 1.84.0, cryptography 46.0.7, langgraph 1.2.0, pillow 12.2.0, python-multipart 0.0.32, pyjwt 2.13.0, ...). Verified by running this exact pip-audit command locally against requirements.txt: 0 findings. ===` \
            `# === 2026-05-20 CVE-drop batch — swept 2026-07-10: 49 of its entries were stale (packages since pinned at/past their fix versions) and were removed. The 1 entry below is the residual still awaiting its coordinated bump. ===` \
            --ignore-vuln GHSA-gr75-jv2w-4656 `# langchain 1.3.0 / langchain-anthropic 1.3.1 (path traversal + sandbox escape in LangChain file-search middleware and loaders); fix in langchain 1.3.9 / langchain-anthropic 1.4.6. Surfaced in the CVE DB after the 2026-05-20 batch (first failed PRs #1000-#1002). Mitigated — we use NO file-search middleware or document loaders; the entire langchain surface in src/ is chat models + messages + the @tool decorator (verified: zero FileManagementToolkit / DirectoryLoader / file-search usage). Held for the quarterly dep-bump PR.` \
            `# === 2026-05-20 PYSEC supplement (23 entries on 6 packages — same CVE-drop batch, captured after pip-audit re-pulled the PYSEC database; PYSEC-2025-183 pyjwt removed in the 2026-07-10 sweep: OSV last_affected=2.10.1, we pin 2.13.0). transformers + torch entries are all deserialization/RCE vulns in model-loading paths; we don't load untrusted .pkl / .pt files (HCP/patient data is structured DB rows, not pickle blobs). flask-cors / langchain-community / joblib PYSEC issues have NO upstream fix; pyarrow has fix in 23.0.1. ===` \
            --ignore-vuln PYSEC-2024-271 `# flask-cors 6.0.2 (CVE-2024-1681; log injection at debug level); no upstream fix. Mitigated — production runs at INFO level; debug logging gated on internal-only environments.` \
            --ignore-vuln PYSEC-2024-277 `# joblib 1.5.3 (CVE-2024-34997; numpy_pickle deserialization); no upstream fix. Mitigated — we don't load untrusted joblib artifacts; only our own MLflow-tracked models.` \
            --ignore-vuln PYSEC-2024-278 `# langchain-community 0.4.1 (CVE-2024-2057; load_local arbitrary read); no upstream fix. Mitigated — we don't call load_local on user-supplied paths.` \
            --ignore-vuln PYSEC-2026-113 `# pyarrow 21.0.0 (CVE-2026-25087; UAF in C++ when triggered); fix in 23.0.1. Mitigated — pyarrow C++ usage is limited to Arrow IPC reads from trusted MLflow artifacts.` \
            --ignore-vuln PYSEC-2025-217 `# transformers 4.57.3 (CVE-2025-14929; X-CLIP checkpoint conversion deserialization RCE); no upstream fix as of 2026-05. Mitigated — we don't run X-CLIP checkpoint conversion.` \
            --ignore-vuln PYSEC-2025-214 `# transformers 4.57.3 (CVE-2025-14926; SEW convert_config code injection); no upstream fix. Mitigated — we don't run SEW convert_config.` \
            --ignore-vuln PYSEC-2025-218 `# transformers 4.57.3 (CVE-2025-14930; GLM4 deserialization RCE); no upstream fix. Mitigated — we don't load untrusted GLM4 checkpoints.` \
            --ignore-vuln PYSEC-2025-211 `# transformers 4.57.3 (CVE-2025-14920; Perceiver model deserialization RCE); no upstream fix. Mitigated — we don't load untrusted Perceiver checkpoints.` \
            --ignore-vuln PYSEC-2025-212 `# transformers 4.57.3 (CVE-2025-14921; Transformer-XL deserialization RCE); no upstream fix. Mitigated — same as above.` \
            --ignore-vuln PYSEC-2025-213 `# transformers 4.57.3 (CVE-2025-14924; megatron_gpt2 deserialization RCE); no upstream fix. Mitigated — same as above.` \
            --ignore-vuln PYSEC-2025-215 `# transformers 4.57.3 (CVE-2025-14927; SEW-D convert_config code injection); no upstream fix. Mitigated — same as SEW above.` \
            --ignore-vuln PYSEC-2025-216 `# transformers 4.57.3 (CVE-2025-14928; HuBERT convert_config code injection); no upstream fix. Mitigated — we don't run HuBERT convert_config.` \
            --ignore-vuln PYSEC-2025-210 `# torch 2.9.1 (CVE-2025-63396; profiler.stop() omission crash); no upstream fix. Mitigated — we always call profiler.stop() in finally blocks per established pattern.` \
            --ignore-vuln PYSEC-2025-196 `# torch 2.9.1 (CVE-2025-3121; jit_module_from_flatbuffer); no upstream fix. Mitigated — we don't load untrusted flatbuffer modules.` \
            --ignore-vuln PYSEC-2025-194 `# torch 2.9.1 (CVE-2025-3000; torch.jit.script manipulation); no upstream fix. Mitigated — we don't accept user-supplied jit scripts.` \
            --ignore-vuln PYSEC-2025-195 `# torch 2.9.1 (CVE-2025-3001; torch.lstm_cell manipulation); no upstream fix. Mitigated — lstm_cell inputs are tensor-shaped, not user-controlled.` \
            --ignore-vuln PYSEC-2025-193 `# torch 2.9.1 (CVE-2025-2999; torch.nn.utils.rnn.unpack_sequence); no upstream fix. Mitigated — RNN unpack inputs not user-controlled.` \
            --ignore-vuln PYSEC-2025-192 `# torch 2.9.1 (CVE-2025-2998; torch.nn.utils manipulation); no upstream fix. Mitigated — same as above.` \
            --ignore-vuln PYSEC-2026-139 `# torch 2.9.1 (CVE-2026-4538; pt2 Loading Handler); no upstream fix. Mitigated — we don't load untrusted pt2 archives.` \
            --ignore-vuln PYSEC-2025-191 `# torch 2.9.1 (CVE-2025-2953; torch.mkldnn issue on torch 2.6.0+cu124); no upstream fix. Mitigated — affected CUDA path not on our serving stack.` \
            --ignore-vuln PYSEC-2025-197 `# torch 2.9.1 (CVE-2025-3136; torch.cuda.memory.cache); no upstream fix. Mitigated — affected CUDA cache code path not exercised.` \
            --ignore-vuln PYSEC-2025-189 `# torch 2.9.1 (CVE-2025-2148; torch.ops manipulation 2.6.0+cu124); no upstream fix. Mitigated — torch.ops not invoked on user-controlled tensors.` \
            --ignore-vuln PYSEC-2025-190 `# torch 2.9.1 (CVE-2025-2149; nnq_Sigmoid quantization 2.6.0+cu124); no upstream fix. Mitigated — quantized model path not exercised.` \
            --ignore-vuln GHSA-86qp-5c8j-p5mr `# starlette 0.50.0 (PYSEC-2026-161; Host header injection allows path-prepending in URL reconstruction → auth bypass when auth depends on reconstructed URL path); fix in starlette 1.0.1, surfaced in pip-audit 2026-05-22 CVE-DB refresh. Mitigated — Nginx normalizes Host headers upstream (same pattern as aiohttp Host CVEs above); FastAPI route matching uses the actual request path (not reconstructed URL), and auth/RBAC is enforced via dependency injection on resolved routes rather than reconstructed URL strings. Follow-up tracker: starlette 1.0.1 dep-bump (requires FastAPI compat verification).` \
            `# === 2026-06-16 CVE-drop (5 packages, fresh pip-audit CVE-DB refresh). aiohttp / tornado / python-multipart were BUMPED to patched versions in requirements.txt (3.14.1 / 6.5.7 / 0.0.32 — 14 CVEs cleared, no allowlist entries needed). This block's duplicate GHSA-537c-gmf6-5ccf entry (cryptography bundled-OpenSSL) was REMOVED 2026-08-04 by #1476 — cleared at cryptography 49.0.0. The 1 package below (starlette) needs a MAJOR bump held for the quarterly dep-bump PR; each entry carries a deployment-specific mitigation. ===` \
            --ignore-vuln CVE-2026-48818 `# starlette 0.50.0 (GHSA-wqp7-x3pw-xc5r; SSRF + NTLM credential theft via UNC paths in StaticFiles — WINDOWS ONLY); fix in 1.1.0. Mitigated — production runs on Linux only (UNC paths are a Windows construct; same Linux-only mitigation as the aiohttp NTLM CVE above). Fix requires the starlette 0.50→1.x major bump (FastAPI 0.128→0.136 compat), deferred consistent with PYSEC-2026-161 above.` \
            --ignore-vuln CVE-2026-48817 `# starlette 0.50.0 (GHSA-x746-7m8f-x49c; arbitrary HTTP method dispatched to HTTPEndpoint attributes via getattr); fix in 1.1.0. Mitigated — we use FastAPI APIRouter path operations exclusively; zero starlette.endpoints.HTTPEndpoint usage in src/ (grep-verified). Fix requires the starlette 1.x major bump, deferred as above.` \
            --ignore-vuln CVE-2026-54283 `# starlette 0.50.0 (GHSA-82w8-qh3p-5jfq; request.form() size limits silently ignored for application/x-www-form-urlencoded → DoS); fix in 1.3.1. Mitigated — Nginx caps request body size upstream (client_max_body_size) before requests reach Starlette. Fix requires the starlette 1.x major bump, deferred as above.` \
            --ignore-vuln CVE-2026-54282 `# starlette 0.50.0 (GHSA-jp82-jpqv-5vv3; unvalidated request path concatenated into authority poisons request.url.hostname); fix in 1.3.0. Mitigated — same as PYSEC-2026-161 above: Nginx normalizes Host headers upstream and auth/RBAC uses resolved routes, not reconstructed URL strings. Fix requires the starlette 1.x major bump, deferred as above.` \
            `# === 2026-06-19 CVE-drop (2 packages, fresh pip-audit CVE-DB refresh — surfaced after the 2026-06-16 batch; first red on the held #1043/#1045/#1046/#1048/#1050 batch + main, all of which change ZERO dependencies). Both are coordinated-bump holds (langsmith is pinned alongside langchain; pydantic-settings alongside the pydantic core pin) deferred to the quarterly dep-bump PR; each carries a grep-verified deployment-specific mitigation. ===` \
            --ignore-vuln GHSA-f4xh-w4cj-qxq8 `# langsmith 0.8.0 (TracingMiddleware arbitrary local-file read uploaded as a LangSmith trace attachment when the SDK middleware is mounted on an attacker-reachable server); fix in 0.8.18. Mitigated — langsmith is a transitive dep via langchain==1.3.0 / langchain-core==1.4.0; src/ never imports langsmith and never mounts its SDK TracingMiddleware (our src/api/middleware/tracing.py TracingMiddleware is an OpenTelemetry/Starlette BaseHTTPMiddleware, unrelated to the LangSmith SDK). grep-verified zero direct langsmith import repo-wide. Held — the 0.8.0->0.8.18 bump is coupled to the langchain pin, deferred to the quarterly dep-bump PR.` \
            --ignore-vuln GHSA-4xgf-cpjx-pc3j `# pydantic-settings 2.12.0 (NestedSecretsSettingsSource follows a symlink pointing outside secrets_dir when secrets_nested_subdir=True, reading files outside the configured dir); fix in 2.14.2. Mitigated — we never use the file-based secrets source: grep-verified zero NestedSecretsSettingsSource / secrets_dir / secrets_nested_subdir usage repo-wide (settings are env-var/.env based). Held — the 2.12->2.14 bump is coupled to the pydantic==2.12.5 core pin, deferred to the quarterly dep-bump PR.` \
            `# === 2026-07-01 CVE-drop (1 package, fresh pip-audit CVE-DB refresh — first red on PR #1111 and main, which change ZERO dependencies). Held for the quarterly transformers 5.x major bump; grep-verified deployment mitigation. ===` \
            --ignore-vuln CVE-2026-4372 `# transformers 4.57.3 (GHSA-29pf-2h5f-8g72; CRITICAL RCE — a malicious model config.json with _attn_implementation_internal set to an attacker-controlled dotted path loads and executes arbitrary code during model init); fix in 5.3.0. Mitigated — src/ never imports transformers or calls from_pretrained / AutoModel / AutoConfig / pipeline (grep-verified zero usage); the ONLY HuggingFace model load is the sentence-transformers CrossEncoder in src/rag/reranker.py, pinned to the fixed trusted default "cross-encoder/ms-marco-MiniLM-L-6-v2" (constructor default, never request/user-controlled), so no attacker-controlled config.json is ever loaded. Held — 4.57.3->5.3.0 is a major bump coupled with sentence-transformers==5.2.0 + torch==2.9.1 (needs full ML-stack compat re-verification); clears alongside the existing GHSA-69w3-r845-3855 transformers hold now that 5.x GA has landed. Deferred to the quarterly dep-bump PR.` \
            `# === 2026-07-13 CVE-drop (4 packages, fresh pip-audit CVE-DB refresh — first red on #1218/#1219 and main, all changing ZERO dependencies). 3 packages BUMPED to patched versions in requirements.txt (pillow 12.3.0 clearing PYSEC-2026-2253/2254/2255/2256/2257; click 8.3.3 clearing PYSEC-2026-2132; black 26.3.1 clearing PYSEC-2026-2120 AND the previously-held GHSA-3936-cmfr-pm3m, removed above — black is dev-only, make format; the ruff gate is the CI formatter baseline). The 1 entry below has NO patched version for any release (OSV last_affected=5.2.0, no fixed event). ===` \
            --ignore-vuln PYSEC-2026-2290 `# transformers 4.57.3 (CVE-2026-5241 / GHSA-fgcw-684q-jj6r; LightGlue model loading path — an attacker-controlled model repo executes arbitrary code during model init because LightGlueConfig lets untrusted config.json override trust_remote_code=False); no first_patched version in OSV as of 2026-07-13. Mitigated — same surface as CVE-2026-4372 above, re-grep-verified 2026-07-13: src/ never imports transformers or calls from_pretrained / AutoModel / AutoConfig / LightGlue; the ONLY HuggingFace load is the sentence-transformers CrossEncoder in src/rag/reranker.py with the trusted constructor-default model, so no attacker-controlled model repo is ever loaded. Held for the quarterly transformers 5.x major bump alongside CVE-2026-4372 and GHSA-69w3-r845-3855.` \
            `# === 2026-07-13 CVE-drop (2nd wave, same-day pip-audit CVE-DB refresh — surfaced after the block above; first red on #1223 and main, which change ZERO dependencies). langchain-classic is a langchain-ecosystem coordinated pin (transitive via ragas -> langchain-community); its 1.0.0->1.0.7 fix is deferred to the quarterly dep-bump PR alongside the existing langchain/langsmith holds. Grep-verified deployment mitigation below. ===` \
            --ignore-vuln PYSEC-2026-2560 `# langchain-classic 1.0.0 (GHSA-3644-q5cj-c5c7 / CVE-2026-45134; LangSmith Hub pull_prompt / pull_prompt_commit deserialize an externally-controlled public prompt manifest that can reconfigure the model with an attacker-supplied base_url / default headers / constructor args, redirecting LLM traffic or leaking credentials); fix in 1.0.7. Mitigated — langchain-classic is a TRANSITIVE-only pin (ragas -> langchain-community -> langchain-classic, per requirements.txt); src/ never imports langchain_classic and never calls pull_prompt / pull_prompt_commit / hub.pull / LangSmith Hub (grep-verified 2026-07-13 zero usage), so no external prompt manifest is ever pulled or deserialized. Held — the 1.0.0->1.0.7 bump is coupled to the langchain==1.3.0 / langchain-core==1.4.0 / langsmith==0.8.0 coordinated pins, deferred to the quarterly dep-bump PR.` \
            `# === 2026-08-19 CVE-drop (1 package, fresh pip-audit CVE-DB refresh — first red on wave-17 PRs #1728/#1729/#1730, all changing ZERO dependencies). Held for the datasets 4.x->5.x major bump; grep-verified deployment mitigation below. ===` \
            --ignore-vuln PYSEC-2026-3716 `# datasets 4.4.2 (CVE-2026-66007; path traversal — folder-based dataset builders join unvalidated file_name metadata to the dataset dir, letting a crafted dataset embed arbitrary local files into save_to_disk / push_to_hub output); fix in 5.0.1. Mitigated — the ONLY datasets usage repo-wide is the in-memory Dataset constructor in src/rag/evaluation.py (RAGAS eval rows we build ourselves); zero load_dataset / folder-based builder / save_to_disk / load_from_disk / push_to_hub usage across src/ and scripts/ (grep-verified 2026-08-19), so no untrusted file_name metadata is ever processed. Held — 4.4.2->5.0.1 is a major bump (requirements.txt + requirements.lock + requirements-dev.txt move together, ragas compat re-verification; requirements-ragas.txt separately pins datasets 4.8.5, also in the vulnerable <=5.0.0 range), deferred to the quarterly dep-bump PR.` \
            `# === 2026-09-01 CVE-drop, 2nd wave (2 packages, fresh pip-audit CVE-DB refresh — first red on the evening security runs of 2026-09-01 and on every branch since, all changing ZERO dependencies). tornado was BUMPED to the patched 6.5.8 in requirements.txt + requirements-dev.txt + requirements.lock, clearing GHSA-wwv5-g3v4-889x + GHSA-8423-8fgw-73vq with no allowlist entry needed (tornado 6.5.8 has zero deps and the resolved closure delta is tornado alone; verified 2026-09-02). The 1 entry below is the residual: its fix version exists but is YANKED. ===` \
            --ignore-vuln CVE-2026-9856 `# transformers 4.57.3 (GHSA-xrqw-3rrv-vx5w; HIGH — arbitrary file WRITE via path traversal: save_pretrained() on PreTrainedTokenizerBase / ProcessorMixin uses chat_template dict KEYS directly as filenames with no validation, so a malicious Hub repo shipping a crafted tokenizer_config.json escapes the save dir and writes attacker-controlled content anywhere the process can write; affects processors inheriting ProcessorMixin — Idefics, Florence, Gemma, Phi, Qwen-VL); fix in 5.10.0 — but 5.10.0 is YANKED on PyPI ("We pushed from a week old main branch... it is missing a bunch of fixes"), so the first INSTALLABLE fix is 5.10.1. Mitigated on BOTH ends of the chain — the SINK is never called (the ONLY textual grep match for save_pretrained/save_vocabulary in src/ + scripts/ is scripts/sync_clinical_codes.py's private \`_save_vocabulary\`, an unrelated local YAML clinical-vocab dumper with no transformers import — zero HuggingFace tokenizer/processor save calls anywhere, and src/ never imports transformers at all: no from_pretrained / AutoModel / AutoConfig / pipeline, re-grep-verified 2026-09-02), and the SOURCE is never attacker-controlled (the ONLY HuggingFace repo we fetch is the sentence-transformers CrossEncoder in src/rag/reranker.py:53, pinned to the trusted constructor-default "cross-encoder/ms-marco-MiniLM-L-6-v2", never request- or user-supplied). Held — 4.57.3->5.10.1 also forces huggingface-hub 0.36.0->1.5.0 (transformers 5.x requires huggingface-hub>=1.5.0; a single-line transformers edit is UNSATISFIABLE — uv: "Because transformers==5.10.0 depends on huggingface-hub>=1.5.0 and you require huggingface-hub==0.36.0"), a major bump of hub. Measured 2026-09-02 with uv pip compile: the resolution closure delta is ONLY those two packages — tokenizers 0.22.2, safetensors 0.7.0, datasets 4.4.2 and sentence-transformers 5.2.0 all unchanged — so this is a RUNTIME-compat hold, not a resolution hold, and the "coupled with sentence-transformers + torch, needs full ML-stack compat re-verification" note on CVE-2026-4372 above overstates it. Note hub 1.5.0 is simultaneously the CEILING our hf-xet==1.2.0 + click==8.3.3 pins allow (hub>=1.6.0 needs a newer hf-xet; hub>=1.22.0 needs click>=8.4.2), so the compatible window is exactly ONE version wide. Bumping clears ALL 11 held transformers rows at once (GHSA-69w3-r845-3855, the 8 PYSEC-2025-21x, CVE-2026-4372, PYSEC-2026-2290) — verified: pip-audit against the bumped file with those 11 rows removed reports 0 findings, 19 ignored. Deferred to the quarterly dep-bump PR, which must include a model-load smoke test of src/rag/reranker.py under huggingface-hub 1.x.` \
            || true  # Don't fail CI, just report

      - name: Check for known vulnerabilities
        run: |
          if [ -f pip-audit-results.json ]; then
            VULN_COUNT=$(python -c "
          import json
          data = json.load(open('pip-audit-results.json'))
          vulns = [d for d in data.get('dependencies', []) if d.get('vulns')]
          print(len(vulns))
          " 2>/dev/null || echo "0")
            if [ "$VULN_COUNT" -gt 0 ]; then
              echo "::error::pip-audit found $VULN_COUNT packages with known vulnerabilities"
              exit 1
            fi
          fi

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 30

      - name: Display vulnerability summary
        if: always()
        run: |
          echo "## Dependency Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          if [ -f pip-audit-results.json ]; then
            VULN_COUNT=$(cat pip-audit-results.json | python -c "import sys, json; d=json.load(sys.stdin); print(len(d.get('dependencies', [])))" 2>/dev/null || echo "0")
            echo "Found $VULN_COUNT packages with potential vulnerabilities" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat pip-audit-results.json | python -m json.tool | head -50 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # Frontend Dependency Scanning
  # =============================================================================
  frontend-audit:
    name: Frontend Security Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        run: |
          npm audit --audit-level=high --json > npm-audit-results.json || true

      - name: Upload npm audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-results
          path: frontend/npm-audit-results.json
          retention-days: 30

      - name: Display npm audit summary
        if: always()
        working-directory: frontend
        run: |
          echo "## NPM Audit Results" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=moderate || true >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Container Scanning - Scan Docker images for vulnerabilities
  # =============================================================================
  container-scan:
    name: Container Scanning (Trivy)
    runs-on: ubuntu-latest
    # Issue #233 fix part 4: pin the vuln-DB repository list at the job
    # level so transient registry rate-limits don't surface as opaque
    # non-zero exits (category D in the issue triage). Trivy supports a
    # comma-separated list of repositories and tries them in order until
    # one succeeds — set the GCR mirror FIRST (newer Trivy default,
    # higher throughput) and keep ghcr.io as fallback so we don't lose
    # the original default's redundancy by pinning. This is durable
    # across trivy-action upgrades since Trivy reads TRIVY_DB_REPOSITORY
    # directly from env.
    env:
      TRIVY_DB_REPOSITORY: 'mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2'
      TRIVY_JAVA_DB_REPOSITORY: 'mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        # The full image (Python 3.12 base + ML stack: torch, transformers,
        # scikit-learn, statsmodels, dowhy, econml, etc.) plus the build
        # context exhausts the runner's default ~14 GB free. Without this
        # cleanup the build crashes with `No space left on device` mid-way,
        # which the runner host surfaces as an unhandled IOException.
        # `jlumbroso/free-disk-space` reclaims ~30 GB by pruning preinstalled
        # caches we don't need (Android SDK, .NET, Haskell, large Docker
        # images, swap).
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false  # keep Python toolcache used by other jobs
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        id: docker-build
        continue-on-error: true
        run: |
          docker build \
            -t e2i-api:scan \
            -f docker/Dockerfile \
            .

      - name: 'Reclaim disk after build (Issue #233)'
        # Issue #233 root cause (run 25931172542): Trivy's image scan calls
        # `docker save` to materialize an uncompressed tar of every layer
        # under /var/lib/docker/tmp/docker-export-*. The heavy ML image
        # (torch + cuda + transformers + scikit-survival) overflowed the
        # ~10 MB the runner had left mid-scan and the scan died with
        # `no space left on device`.
        #
        # Right after the build finishes — but before Trivy starts —
        # purge buildx intermediate state and any dangling images so the
        # docker-export staging area has headroom. We keep e2i-api:scan
        # (the tag we're about to scan) but drop everything else.
        if: steps.docker-build.outcome == 'success'
        run: |
          docker builder prune --force --all || true
          docker image prune --force || true
          docker system df || true
          df -h / || true

      - name: Run Trivy vulnerability scanner
        if: steps.docker-build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'e2i-api:scan'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          # Issue #233 fix part 2: expand skip-dirs beyond /app/.venv to
          # keep Trivy from walking build/test/cache trees that won't
          # surface new OS- or library-CVEs but add I/O cost + disk
          # pressure. Keeps the canonical /app/.venv comment (PR #22 root
          # cause) intact:
          #
          # /app/.venv is a virtualenv baked into the production image
          # (~1k+ .pyc files in site-packages/). Trivy's library analyzer
          # chokes on pyc walking — the semaphore acquire times out at
          # 5min, the run dies with `context deadline exceeded`. Python
          # deps are already covered by pip-audit (separate job in this
          # workflow), so Trivy skipping the venv loses no coverage. The
          # OS-package scan and any libraries installed outside
          # /app/.venv still get scanned.
          skip-dirs: '/app/.venv,/app/.cache,/app/.mypy_cache,/app/.pytest_cache,/app/frontend/node_modules,/app/tests,/app/docs'
          # Issue #233 fix part 1: 15m wasn't enough for the heavy ML
          # image plus DB pull plus layer export; the failing run took
          # ~13m of scan time before hitting the disk-space wall. Give
          # 25m of headroom on slow runners.
          timeout: '25m'

      - name: Upload Trivy artifacts
        uses: actions/upload-artifact@v4
        if: steps.docker-build.outcome == 'success'
        with:
          name: trivy-results
          path: trivy-results.json
          retention-days: 30

      - name: Display Trivy summary
        if: always()
        run: |
          echo "## Container Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-results.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat trivy-results.json | python -m json.tool | head -100 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Docker build failed or was skipped - no container scan results available." >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # Dockerfile Security - Lint Dockerfiles for best practices
  # =============================================================================
  dockerfile-lint:
    name: Dockerfile Security (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint on all Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: warning
          format: json
          output-file: hadolint-results.json

      - name: Upload Hadolint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hadolint-results
          path: hadolint-results.json
          retention-days: 30

      - name: Lint all Dockerfiles
        run: |
          echo "## Dockerfile Lint Results" >> $GITHUB_STEP_SUMMARY
          for dockerfile in docker/*/Dockerfile docker/Dockerfile*; do
            if [ -f "$dockerfile" ]; then
              echo "### $dockerfile" >> $GITHUB_STEP_SUMMARY
              docker run --rm -i hadolint/hadolint < "$dockerfile" >> $GITHUB_STEP_SUMMARY 2>&1 || true
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

  # =============================================================================
  # Security Summary - Aggregate results
  # =============================================================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - sast-python
      - sast-semgrep
      - dependency-scan
      - frontend-audit
      - container-scan
      - dockerfile-lint
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-reports

      - name: Generate security summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Scan | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python SAST (Bandit) | ${{ needs.sast-python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Multi-language SAST (Semgrep) | ${{ needs.sast-semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan (pip-audit) | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Audit (npm) | ${{ needs.frontend-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan (Trivy) | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile Lint (Hadolint) | ${{ needs.dockerfile-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security reports are available as artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Upload combined security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-combined
          path: security-reports/
          retention-days: 90
