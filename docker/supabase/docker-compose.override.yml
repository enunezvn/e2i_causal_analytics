# =============================================================================
# E2I Supabase Self-Hosted Docker Compose Override
# =============================================================================
# This file extends the official Supabase docker-compose.yml to integrate
# with E2I's existing infrastructure on the DigitalOcean droplet.
#
# Usage:
#   1. Clone Supabase: git clone --depth 1 https://github.com/supabase/supabase /opt/supabase
#   2. Copy this file to /opt/supabase/docker/ or reference it with -f flag
#   3. Run: docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
#
# Documentation: docs/SUPABASE_SELF_HOSTED_MIGRATION.md
# =============================================================================

version: '3.8'

services:
  # PostgreSQL Database - expose on port 5433 to avoid conflicts
  db:
    networks:
      - default
      - e2i-network
    ports:
      - "5433:5432"  # External:Internal - use 5433 to avoid conflict with any existing postgres
    environment:
      # Additional PostgreSQL configuration for E2I workloads
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - wal_level=logical  # Enable logical replication for migrations
      - -c
      - max_connections=200  # Increased for E2I agent workloads
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=16MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Kong API Gateway - main entry point
  kong:
    networks:
      - default
      - e2i-network
    ports:
      - "54321:8000"  # HTTP API - external 54321 maps to internal 8000
      - "8443:8443"   # HTTPS API
    labels:
      - "com.e2i.service=supabase-api"
      - "com.e2i.component=gateway"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # GoTrue Authentication Service
  auth:
    networks:
      - default
      - e2i-network
    environment:
      # E2I-specific auth configuration
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"  # Auto-confirm for development; disable in production
      GOTRUE_DISABLE_SIGNUP: "true"  # Locked 2026-06-12: reviewer accounts are admin-provisioned (see docs/runbooks/reviewer-provisioning.md)
      # --- #22 SMTP scaffolding (recovery/password-reset emails) ---
      # Values interpolate from the live /opt/supabase/docker/.env — NO creds in this
      # tracked file. Until GOTRUE_SMTP_HOST is set, the recovery-email leg is inert
      # (POST /auth/v1/recover returns 500). Signup itself does NOT need SMTP because
      # GOTRUE_MAILER_AUTOCONFIRM=true and signup is locked; only password RECOVERY does.
      # Activation procedure + provider options: docs/runbooks/gotrue-smtp.md.
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:-https://eznomics.site}
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:-https://eznomics.site/reset-password}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${GOTRUE_MAILER_URLPATHS_RECOVERY:-/reset-password}
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: ${GOTRUE_SMTP_SENDER_NAME:-E2I Causal Analytics}
    labels:
      - "com.e2i.service=supabase-auth"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # PostgREST - Auto-generated REST API
  rest:
    networks:
      - default
      - e2i-network
    environment:
      # Expose additional schemas for E2I
      PGRST_DB_SCHEMAS: "public,storage,graphql_public"
    labels:
      - "com.e2i.service=supabase-rest"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Realtime - WebSocket subscriptions
  realtime:
    networks:
      - default
      - e2i-network
    labels:
      - "com.e2i.service=supabase-realtime"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Storage API - File storage
  storage:
    networks:
      - default
      - e2i-network
    labels:
      - "com.e2i.service=supabase-storage"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Supabase Studio - Database management UI
  studio:
    networks:
      - default
      - e2i-network
    ports:
      - "3001:3000"  # Use 3001 to avoid conflict with E2I frontend on 3000
    environment:
      STUDIO_PG_META_URL: "http://meta:8080"
      SUPABASE_URL: "http://kong:8000"
      SUPABASE_PUBLIC_URL: "${SUPABASE_PUBLIC_URL:-http://138.197.4.36:54321}"
    labels:
      - "com.e2i.service=supabase-studio"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Meta - Database metadata service for Studio
  meta:
    networks:
      - default
      - e2i-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Analytics - Log aggregation (Logflare/Elixir needs headroom for BEAM VM startup)
  analytics:
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Edge Functions
  functions:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Image proxy
  imgproxy:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Vector - Log collection
  vector:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Connection pooler
  supavisor:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  # Connect to E2I's existing network
  e2i-network:
    external: true
    name: e2i-backend-network

  # Default Supabase internal network
  default:
    name: supabase-network
