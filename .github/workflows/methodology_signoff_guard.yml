name: Methodology Sign-off Guard

# Validates Gate N3 methodology sign-off / rejection artifacts on PR landing.
# Triggered when a PR adds or modifies a file matching the
# docs/results/optum_methodology_signoff_*.md or
# docs/results/optum_methodology_rejection_*.md pattern (excluding the
# template files, which the validator rejects by name).
#
# Issue #192 architecture (2026-05-14):
#
#   This workflow is now a THIN CALLER. It identifies the touched
#   methodology artifacts on the PR diff and delegates the actual
#   validation to the reusable workflow at
#   `.github/workflows/methodology-signoff-validator.yml`. The reusable
#   workflow does its OWN checkout of the protected `main` ref for the
#   validator script (issue #192 H3 mitigation), so a PR cannot weaken the
#   validator and have its own copy validate itself in the same commit.
#
# H1 + H4 (registry-pinned GPG keyring + CoI body signature verify):
#   STILL DEFERRED — both require infra (per-runner GPG keyring with
#   curated reviewer public keys). Tracked in
#   `docs/governance/n3_known_limitations_20260510.md` items 1 + 4 with
#   explicit risk owner placeholder pending operator action. See the
#   sub-issue spawned from issue #192 closure for the operator scope.
#
# H2 / M1 (gh PR/review enforcement):
#   RESOLVED 2026-05-14 (issue #192). The reusable workflow now
#   provisions GH_TOKEN (via the auto-provided secrets.GITHUB_TOKEN)
#   AND exports STRICT_GH=1 so the validator returns exit code 3 when
#   any check has provenance_check_skipped=True. Local devs running
#   the script ad-hoc retain warn-only back-compat (no STRICT_GH set).
#
# H3 (validator-from-protected-ref):
#   RESOLVED 2026-05-14 (issue #192). The reusable workflow checks out
#   `main` into a SEPARATE workspace and runs the validator script from
#   that protected-ref checkout, NOT from the PR head. This closes the
#   "PR weakens validator + workflow in same commit" attack class.
#   Cross-PR weakening (land weak validator on main first, then open
#   sign-off PR) is NOT closed by this split alone — branch protection +
#   CODEOWNERS gate on `scripts/check_methodology_signoff.py` and on
#   both workflow files is the required complement. The full cross-org
#   migration to `org/governance-actions/methodology-signoff@<sha>` is
#   the future-state ideal but requires a separate-repo decision.

on:
  pull_request:
    paths:
      - 'docs/results/optum_methodology_signoff_*.md'
      - 'docs/results/optum_methodology_rejection_*.md'
      - 'docs/governance/methodology_reviewer_registry.md'
      - 'docs/governance/coi_declarations/**'
      - 'scripts/check_methodology_signoff.py'
      - '.github/workflows/methodology_signoff_guard.yml'
      - '.github/workflows/methodology-signoff-validator.yml'
  workflow_dispatch:

permissions:
  # Caller workflow only needs to read the PR diff to enumerate touched
  # artifacts. The reusable workflow declares its own (slightly broader)
  # permissions for the gh-CLI provenance queries.
  contents: read
  pull-requests: read

jobs:
  identify:
    name: Identify touched artifacts
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.touched.outputs.files }}
      has_files: ${{ steps.touched.outputs.has_files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history needed for `git diff <base>...<head>`.
          fetch-depth: 0

      - name: Identify touched artifacts
        id: touched
        # On pull_request events GH Actions exposes the merge ref. We diff
        # against the PR base to find the artifacts in scope. On
        # workflow_dispatch we fall through to scanning all dated artifacts.
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            git fetch origin "$BASE" --depth=1 || true
            CHANGED=$(git diff --name-only --diff-filter=AM "$BASE...$HEAD" -- \
              'docs/results/optum_methodology_signoff_*.md' \
              'docs/results/optum_methodology_rejection_*.md' \
              || true)
          else
            CHANGED=$(find docs/results \
              -maxdepth 1 \
              -type f \
              \( -name 'optum_methodology_signoff_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].md' \
                 -o -name 'optum_methodology_rejection_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].md' \) \
              || true)
          fi

          # Filter out template files AND collapse whitespace-only lines so
          # the downstream "are there any files?" guard isn't fooled by an
          # accidental trailing newline. (M3.)
          FILTERED=$(printf '%s\n' "$CHANGED" \
            | grep -v '_template.md$' \
            | grep -v '^[[:space:]]*$' \
            || true)

          # Persist for the downstream reusable-workflow call (multi-line
          # output uses GH's heredoc).
          {
            echo "files<<EOF"
            echo "$FILTERED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # H3 / M3: separate, explicit boolean output that the downstream
          # job's `if:` gates on. ``-n`` returns true when the string is
          # non-empty AFTER whitespace-only lines have been stripped above.
          if [ -n "$FILTERED" ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "Will delegate validation of the following artifacts to the reusable workflow:"
            echo "$FILTERED"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No methodology artifacts in scope; the reusable workflow will be skipped."
          fi

      - name: No-op summary
        if: steps.touched.outputs.has_files != 'true'
        run: |
          echo "## Methodology Sign-off Guard" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_No methodology artifacts touched by this PR — guard was a no-op._" >> "$GITHUB_STEP_SUMMARY"

  # Issue #192 H3: delegate to the reusable workflow which loads the
  # validator script from the protected `main` ref. This is the same-repo
  # equivalent of `uses: org/governance-actions/...@<sha>` until the
  # cross-org migration happens.
  validate:
    name: Delegate to protected-ref validator
    needs: identify
    if: needs.identify.outputs.has_files == 'true'
    uses: ./.github/workflows/methodology-signoff-validator.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      touched_files: ${{ needs.identify.outputs.files }}
      validator_ref: 'main'
      strict_gh: '1'
