  # ----- many-to-many links (join-dataset-backed; Foundry hard rule).
  # ----- The ds-link-* datasets are exported from FalkorDB graph edges by the
  # ----- export_falkordb_links transform (see e2i_lineage.yaml); the
  # ----- assignments link uses the real PG join table directly.
  - id: patient-split-assignments
    apiName: PatientSplitAssignments
    cardinality: MANY_TO_MANY
    objectTypeA: { objectType: patient, displayName: Patient, pluralDisplayName: Patients }
    objectTypeB: { objectType: data-split-config, displayName: Data Split Config, pluralDisplayName: Data Split Configs }
    datasources:
      - dataset: ds-curated-ml-patient-split-assignments
        branch: master
        keys: { objectTypeA: patient_id, objectTypeB: split_config_id }
    status: active
    description: >
      Patient-level split assignment via the real PG join table
      ml_patient_split_assignments (UNIQUE(split_config_id, patient_id);
      carries assigned_split payload).

  - id: patient-treated-by-hcp
    apiName: PatientTreatedByHcp
    cardinality: MANY_TO_MANY
    objectTypeA: { objectType: patient, displayName: Patient, pluralDisplayName: Patients }
    objectTypeB: { objectType: hcp, displayName: Treating HCP, pluralDisplayName: Treating HCPs }
    datasources:
      - dataset: ds-link-patient-hcp-treated-by
        branch: master
        keys: { objectTypeA: patient_id, objectTypeB: hcp_id }
    status: experimental
    description: >
      FalkorDB TREATED_BY edge (payload: is_primary_hcp, visit_count,
      relationship_status).

