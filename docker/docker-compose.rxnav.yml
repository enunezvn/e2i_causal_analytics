# Image-provenance note (codex gate-on-diff 2026-05-16, MED finding):
#
# An earlier revision of this file declared `services.rxnav.image:
# rxnavinabox/rxnavinabox:${RXNAV_IMAGE_TAG:-latest}`. That image source could
# NOT be verified as NLM-official. Evidence gathered 2026-05-16:
#   - `docker manifest inspect rxnavinabox/rxnavinabox:latest` →
#     `unauthorized: authentication required` (image absent or private).
#   - `https://hub.docker.com/v2/repositories/rxnavinabox/` → 0 public repos
#     in that namespace.
#   - Docker Hub search for "rxnav" surfaces only third-party / community
#     forks (`nbonime/rxnav-wsrx`, `farooq905/rxnav-web`) — neither is NLM.
#   - `https://hub.docker.com/v2/repositories/nlmnih/` and `.../nih/` → 0
#     repos. No NLM-affiliated Docker Hub publisher is locatable.
#   - NLM's own page
#     (https://lhncbc.nlm.nih.gov/RxNav/applications/RxNav-in-a-Box.html)
#     documents distribution as a downloadable .zip (UMLS-license-gated,
#     monthly versioned, e.g. `rxnav-in-a-box-20260504.zip`), NOT a Docker
#     Hub image.
#
# Conclusion: there is no canonical NLM Docker Hub image to pull. The
# previous `services:` block has been removed; this file is intentionally
# a documentation-stub + pointer to the official setup procedure.
#
# -----------------------------------------------------------------------------
# Official rxnav-in-a-box setup (operator workflow)
# -----------------------------------------------------------------------------
#
# 1. Accept NLM's UMLS license agreement (free, requires registration):
#       https://uts.nlm.nih.gov/uts/license
#
# 2. Download the latest monthly RxNav-in-a-Box .zip from NLM:
#       https://lhncbc.nlm.nih.gov/RxNav/applications/RxNav-in-a-Box.html
#    e.g. ``rxnav-in-a-box-20260504.zip``. The README.txt inside the .zip
#    documents system requirements + install steps.
#
# 3. Unpack and bring up NLM's bundled compose stack directly:
#       unzip rxnav-in-a-box-20260504.zip -d rxnav-in-a-box/
#       cd rxnav-in-a-box/
#       docker compose -f docker-compose.yml up -d
#    The .zip ships its own ``docker-compose.yml`` with NLM-signed image
#    references + the RxNorm/RxTerms/ATC/DailyMed data tarballs preloaded.
#
# 4. Point this application's RxNav client at the local instance. The /REST
#    path prefix is part of the env var so the client's URL concatenation
#    (``f"{base}{path}"`` where ``path`` starts with ``/rxcui.json``) lands
#    on the right routes:
#       export RXNAV_BASE_URL=http://localhost:4000/REST
#       # Note: the trailing /REST is part of the env var so the client's
#       # f"{base}{path}" concat resolves /REST/rxcui.json etc.
#    (Set in .env or the compose env block of api + worker_* services to
#    propagate cluster-wide.)
#
# 5. Confirm reachability:
#       curl -fsS http://localhost:4000/REST/version
#
# Code default is unchanged: with RXNAV_BASE_URL unset, ``src/data/kg/rxnav.py``
# continues to hit the public NLM endpoint at ``https://rxnav.nlm.nih.gov/REST``.
# See ``docs/ARCHITECTURE.md`` §4.7 for the full operator runbook.
#
# Storage budget warning (per NLM README): ~15-20 GB on disk, ~12 GB RAM
# steady-state once data tarballs ingest. Plan host capacity accordingly.
#
# References:
#   - Official docs / .zip download: https://lhncbc.nlm.nih.gov/RxNav/applications/RxNav-in-a-Box.html
#   - README.txt inside the .zip:    https://data.lhncbc.nlm.nih.gov/public/rxnav/rxnav-in-a-box/README.txt
#   - UMLS license:                  https://uts.nlm.nih.gov/uts/license
#
# Note: this file intentionally contains no ``services:`` block; it cannot
# be used as ``-f docker/docker-compose.rxnav.yml up`` like the prior draft.
# Use NLM's bundled compose file from the unpacked .zip directly.
# =============================================================================
