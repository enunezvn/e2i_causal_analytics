# Gap Analyzer Agent Configuration
# Economic assumptions and thresholds for ROI analysis
#
# This configuration file is loaded by the GapDetectorNode to externalize
# economic assumptions that were previously hard-coded.

gap_analyzer:
  # Economic assumptions for ROI calculations
  economic_assumptions:
    discount_rate: 0.10            # 10% discount rate for NPV calculations
    planning_horizon_years: 3      # 3-year planning window for ROI projections
    implementation_cost_factor: 0.15  # 15% of opportunity value as implementation cost
    confidence_adjustment: 0.85    # Risk adjustment factor (multiply by confidence)
    # Fraction of a performance gap an initiative realistically CLOSES. The ROI
    # value driver is sized on (gap_size * capture_rate), NOT the full gap — no
    # single initiative captures 100% of a gap. Source: the opportunity-sizing
    # skill the agent loads (.claude/skills/gap-analysis/opportunity-sizing.md:
    # "Capture Probability: 20-40% for most interventions", example 0.30).
    # Distinct from attribution (causal ownership of the realized closure); both
    # apply. Consumed by src/agents/gap_analyzer/nodes/roi_calculator.py
    # (_load_capture_rate / DEFAULT_CAPTURE_RATE); see docs/Archive/roi_methodology.md
    # "Capture Rate".
    capture_rate: 0.30
    # Per-brand $ value of one incremental TRx-equivalent unit. The service
    # default ($850/TRx, src/services/roi_calculation.py TRxLiftCalculator) is
    # calibrated to a solid-tumor oncology brand (Kisqali-scale, ~$200k/yr WAC).
    # A flat rate structurally zeroes rare-disease brands: Fabhalta (PNH,
    # ultra-orphan, ~$550k/yr WAC) moves ~10-25x fewer scripts than Kisqali, so
    # at $850/unit every candidate gap fell at/below the intervention cost floor
    # (~$75k saturated) and the brand could NEVER surface an opportunity — the
    # live /gap-analysis page showed "No gap opportunities available" for
    # Fabhalta on every run. Scale by annual-WAC ratio: 850 x (~550k/~200k)
    # ≈ 2350. Brands not listed use the $850 default (Kisqali IS the
    # calibration anchor; Remibrutinib launch pricing is not established, so it
    # deliberately stays on the default). Demo-scale anchors, not gross-to-net
    # figures — the RELATIVE brand magnitudes are what matter. Consumed by
    # roi_calculator.py (_load_value_per_trx_by_brand / _resolve_value_per_trx);
    # keys are case-insensitive.
    value_per_trx_by_brand:
      Fabhalta: 2350.0

  # Gap severity thresholds (as percentages)
  gap_thresholds:
    critical: 0.20   # >20% gap from target = critical severity
    major: 0.10      # >10% gap from target = major severity
    minor: 0.05      # >5% gap from target = minor severity
    # Below 5% is considered negligible

  # ROI classification thresholds
  roi_thresholds:
    minimum_viable: 1.5    # Minimum ROI to consider an opportunity viable
    target: 2.0            # Target ROI for recommended actions
    exceptional: 3.0       # Exceptional ROI for high-priority actions

  # Pharmaceutical KPI value drivers — DEAD CONFIG (not consumed at runtime).
  # NOTE: these are exposed via GapDetectorNode.value_drivers but are read
  # nowhere in the ROI math. The deterministic value path uses the per-unit
  # dollar values in src/services/roi_calculation.py ($850/TRx etc.). The
  # conversion/closure haircut is now the single `economic_assumptions.capture_rate`
  # above (a fraction-of-gap-CLOSED factor), NOT these per-metric "conversion"
  # multipliers — keeping both would double-discount and conflate distinct
  # concepts. Retained only to avoid churning the GapDetectorNode default dict;
  # do not wire these without reconciling against capture_rate.
  value_drivers:
    trx_conversion_rate: 0.12       # (unused) 12% of TRx converts to revenue impact
    nrx_conversion_rate: 0.08       # (unused) 8% of NRx converts to revenue impact
    market_share_multiplier: 1.5    # (unused) Market share impact factor
    hcp_engagement_multiplier: 0.5  # (unused) HCP engagement score impact factor
    conversion_rate_multiplier: 2.0 # (unused) Conversion rate improvement multiplier

  # Segment priorities for gap analysis
  segment_priorities:
    region:
      - Northeast
      - Southeast
      - Midwest
      - West
    specialty:
      - Oncology
      - Cardiology
      - Rheumatology
      - Neurology
    hcp_tier:
      - Tier 1
      - Tier 2
      - Tier 3

  # Default KPIs to analyze if not specified
  default_metrics:
    - trx
    - nrx
    - market_share
    - conversion_rate
    - hcp_engagement_score

  # Connector configuration
  connectors:
    use_mock: false  # Set to true for testing with mock data
    health_check_timeout_seconds: 5
    cache_ttl_seconds: 300  # 5 minute cache for benchmark data

  # Output configuration
  output:
    max_gaps_per_report: 50
    max_recommendations_per_gap: 5
    include_trend_analysis: true
    include_peer_comparison: true

  # ===========================================================================
  # Memory-graph awareness (staleness + provenance)
  # ===========================================================================
  #
  # The gap analyzer consumes findings from episodic_memories +
  # executive_insights (crystallized cross-agent narratives) when ranking
  # opportunities. Both surfaces carry lifecycle + provenance fields that
  # MUST be honored to avoid surfacing stale ROI estimates to operators.
  #
  # Source-of-truth references:
  #   - src/memory/lifecycle/consolidator.py:176-233 (Consolidator.run)
  #   - src/memory/crystallization/crystallizer.py:102-117 (Crystallizer)
  #   - database/memory/021_insight_lifecycle.sql (invalidated_at columns)
  #   - database/memory/025_crystaldigest_schema_completion.sql (lineage fields)
  #
  # Refs: issue #391 (post-implementation checklist § Documentation box 2 —
  # "Add staleness/provenance to agent system prompts so agents understand
  # the graph has these fields").
  # ===========================================================================
  memory_graph_awareness:
    description: "Lifecycle + provenance fields the gap analyzer MUST honor"

    staleness_fields:
      invalidated_at:
        type: timestamptz
        semantics: |
          Set by the cascade-invalidator when an upstream ancestor is
          overturned. A row with invalidated_at IS NOT NULL MUST be
          EXCLUDED from gap-opportunity ranking — its ROI estimate may
          be based on stale assumptions. The portfolio-summary endpoint
          enforces this filter at the SQL layer
          (src/api/routes/executive_insights.py:220 — .is_("invalidated_at", "null")).
        tables_consumed:
          - executive_insights
          - episodic_memories
          - causal_paths
        sql_filter_template: "WHERE invalidated_at IS NULL"

      staleness_score:
        type: float
        semantics: |
          PAYLOAD-ONLY field surfaced via the staleness_alert SSE bridge
          (src/api/routes/staleness_alerts.py). Per Decision 3 = KEEP
          BINARY (plan §"DECISIONS ADOPTED" 2026-05-19), staleness is
          boolean: staleness_score=1.0 means invalidated_at IS NOT NULL.
          The gap analyzer SHOULD NOT compute weighted ROI using
          staleness_score as a graded factor; it is binary by design.

    provenance_fields:
      provenance_chain_id:
        type: text
        semantics: |
          Deterministic 32-char SHA-256 hash over the BFS-resolved
          ancestor set. Two opportunities with the same
          provenance_chain_id derive from identical evidence — gap
          analyzer should DEDUPE them in ROI rankings (avoid
          double-counting the same underlying finding under two
          opportunities).
        source: src/memory/crystallization/crystallizer.py:594-600

      provenance_chain:
        type: text[]
        semantics: |
          OPERATOR-FACING TERM for the BFS-resolved ancestor list. When
          presenting an ROI opportunity to the operator, the gap
          analyzer SHOULD surface the contributing causal_path_id(s)
          and episodic memory_id(s) so the operator can JIT-verify the
          claim via the insight_edges DAG.

      provenance_depth:
        type: integer
        semantics: |
          Hop count from this opportunity to the deepest ancestor.
          provenance_depth=1 means direct episodic evidence;
          provenance_depth>=2 means causal_path traversal. Higher depth
          = more indirect chain. Gap analyzer should weight HIGHER
          confidence for shallower chains.
        source: src/memory/crystallization/crystallizer.py:602-605

      consolidation_tier:
        type: enum
        values: [working, episodic, semantic, procedural]
        semantics: |
          "Ripeness" of the underlying finding. Gap analyzer should
          ONLY rank opportunities backed by semantic or procedural
          tier crystals — episodic-tier crystals have not yet been
          confirmed (>=3 replications) and may be artifacts of a
          single agent run.
        recommended_filter: "consolidation_tier IN ('semantic', 'procedural')"

    deduplication_fields:
      dedup_counter:
        type: integer
        default: 1
        semantics: |
          Count of underlying events represented by the canonical row
          after dedup (PR #388). When the gap analyzer computes
          "replication count" for confidence_adjustment, it should use
          SUM(dedup_counter) — undeduped raw COUNT(*) would inflate
          the confidence and bias ROI projections upward.

    agent_behavior_rules:
      - id: rule_1_exclude_invalidated
        condition: "When ranking opportunities from executive_insights"
        action: "Filter invalidated_at IS NULL at the query layer; never present invalidated opportunities as live"

      - id: rule_2_dedupe_by_provenance
        condition: "When two opportunities share provenance_chain_id"
        action: "Treat as ONE opportunity; pick the higher-tier representative or merge ROI projections"

      - id: rule_3_tier_gating
        condition: "When the operator asks for actionable opportunities"
        action: "Only surface consolidation_tier IN ('semantic', 'procedural') by default; expose episodic via opt-in flag"

      - id: rule_4_surface_provenance_in_rationale
        condition: "When the ROI projection is presented"
        action: "Include the contributing provenance_chain ancestors so the operator can verify the upstream evidence"

      - id: rule_5_brand_strictness
        condition: "ALWAYS"
        action: "Brand is the tenant boundary; NEVER aggregate ROI across brands without explicit ADMIN-level override"
