name: Lifecycle State Guard

# Plan v4 Gate N2 — CI guard ensuring every gate-relevant location declares
# a `lifecycle_state` (YAML key or `LIFECYCLE_STATE_*` Python constant) AND
# any change to a lifecycle value has a corresponding signed doc at
# `docs/calibration/{slug}_lifecycle_change_{from}_to_{to}_{YYYYMMDD}.md`.
#
# The advisory invariant must guard BEHAVIOR, not SPELLING. A naive scan for
# `advisory_mode: true` misses configs that use `mode: advisory`,
# `enforcement: false`, `shadow: true`, env vars, JSON, TOML, code constants.
# This workflow runs `scripts/check_lifecycle_state.py`, which uses the
# canonical `GateLifecycleState` enum + AST/YAML/TOML/JSON parsers to
# enforce the declaration regardless of spelling.

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'config/**'
      - 'docs/calibration/**'
      - 'scripts/check_lifecycle_state.py'
      - '.github/workflows/lifecycle_state_guard.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'config/**'
      - 'docs/calibration/**'
      - 'scripts/check_lifecycle_state.py'
      - '.github/workflows/lifecycle_state_guard.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  lifecycle-state-guard:
    name: Lifecycle State Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history so the change-detection mode can diff against
          # the merge base. `fetch-depth: 0` is required because GitHub's
          # default shallow clone (`fetch-depth: 1`) breaks `git diff base..HEAD`.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install scanner dependencies
        # PyYAML + pydantic are runtime deps; the scanner imports
        # `src.lifecycle.gate_lifecycle` which uses pydantic.
        # We pin to the same versions as `requirements.txt` so the scanner
        # behaves identically locally and in CI.
        run: |
          pip install --upgrade pip
          pip install 'pydantic>=2.9.0' 'pyyaml>=6.0'

      - name: Determine base ref
        id: base-ref
        # For pull_request events, diff against the PR base branch.
        # For push events, diff against `github.event.before` (the SHA of
        # the previous tip of the pushed branch). This is correct for
        # multi-commit pushes — using HEAD~1 only checks the LAST commit
        # and silently skips lifecycle changes in earlier commits of the
        # same push (see N2 finding M3).
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> $GITHUB_OUTPUT
          else
            # github.event.before is the all-zeros SHA on the very first
            # push to a new branch. Fall back to HEAD~1 in that case.
            ZERO_SHA="0000000000000000000000000000000000000000"
            if [ -z "$EVENT_BEFORE" ] || [ "$EVENT_BEFORE" = "$ZERO_SHA" ]; then
              echo "ref=HEAD~1" >> $GITHUB_OUTPUT
            else
              echo "ref=$EVENT_BEFORE" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run lifecycle-state scanner (baseline)
        # First pass: every gate-relevant location must declare a
        # `lifecycle_state`. This pass does NOT need git diff — it audits
        # the current tree.
        #
        # Use `tee` + ${PIPESTATUS[0]} to surface the scanner's exit code:
        # `python ... > file.json` would let bash see the redirect succeed
        # even when the scanner exits non-zero (the redirect itself never
        # fails on a writable disk), so the job would print findings then
        # pass green. Capturing PIPESTATUS[0] propagates the scanner's
        # actual exit code to bash.
        run: |
          set -o pipefail
          python scripts/check_lifecycle_state.py --json | tee lifecycle_state_findings.json
          EXIT=${PIPESTATUS[0]}
          echo "::group::Scanner findings (baseline)"
          cat lifecycle_state_findings.json
          echo "::endgroup::"
          exit "$EXIT"

      - name: Run lifecycle-state scanner (change-detection)
        # Second pass: any change to a `LIFECYCLE_STATE_*` value must have
        # a corresponding signed doc. Runs against the PR base branch (or
        # the previous push SHA for direct pushes).
        run: |
          set -o pipefail
          python scripts/check_lifecycle_state.py \
            --check-changes \
            --base-ref "${{ steps.base-ref.outputs.ref }}" \
            --json | tee lifecycle_state_changes.json
          EXIT=${PIPESTATUS[0]}
          echo "::group::Scanner findings (change-detection)"
          cat lifecycle_state_changes.json
          echo "::endgroup::"
          exit "$EXIT"

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-state-findings
          path: |
            lifecycle_state_findings.json
            lifecycle_state_changes.json
          retention-days: 14
