# Imbalance strategy decision matrix (Tier-0 Block 6A, Findings #9, #16)
#
# This file replaces the LLM-based strategy selection in
# `src/agents/ml_foundation/model_trainer/nodes/detect_class_imbalance.py`
# with a deterministic, configurable lookup table.
#
# Defaults below were originally calibrated to reproduce the exact behavior of
# the pre-Block-6A `_heuristic_strategy` fallback for every (severity x
# tree/non-tree x minority_count band) combination.
#
# Re-tune 2026-06-06 (imbalance-methodology review): the severe.non_tree and
# extreme.non_tree branches were changed from SMOTE/oversampling/"combined" to
# `class_weight`. Rationale: the HPO objective already optimizes PR-AUC
# (average_precision) at severe+extreme, and synthetic oversampling is
# empirically detrimental to PR-AUC for linear models while unable to raise a
# feature-bound (separability) ceiling. Evidence: ULB fraud-detection-handbook
# Ch.6; docs/reports/tier0_imbalance_methodology_review_20260606.md (and the
# local docs/results/tier0_optum_mart_initiation_events_disproof_20260606.md).
# Tree branches and moderate.non_tree (mild imbalance, AUC objective) unchanged.
#
# To change behavior, override severity bands or any matrix entry; the
# loader (`_load_imbalance_config`) accepts an explicit path argument so
# unit tests can swap in alternate configurations.
#
# Contract enforced by `_load_imbalance_config` at load time:
#   * severity_bands["none"] > severity_bands["moderate"] >
#     severity_bands["severe"] > 0;
#   * every list-form non_tree branch declares all of
#     {min_minority_count, strategy, rationale};
#   * every list-form non_tree branch contains at least one
#     `min_minority_count: 0` rule (the catch-all). Without it,
#     low-count cases would silently fall through to "the last rule",
#     which is not a contract anyone wants to depend on.

# Severity bands keyed by minority_class_ratio (minority_count / total).
# A row with severity=X is selected when minority_ratio >= bands[X] AND
# minority_ratio is below the next-stricter band. The implicit lowest
# bucket below `severe` is "extreme".
severity_bands:
  none: 0.40        # minority_ratio >= 0.40           -> "none"
  moderate: 0.20    # 0.20 <= minority_ratio < 0.40    -> "moderate"
  severe: 0.05      # 0.05 <= minority_ratio < 0.20    -> "severe"
  # below severe -> "extreme"

# Models that natively handle class weights without resampling.
# Used to pick the `tree` vs `non_tree` branch of `strategy_matrix`.
tree_models:
  - XGBoost
  - LightGBM
  - RandomForest
  - GradientBoosting
  - CausalForest
  - ExtraTrees

# Strategy decision matrix.
# Outer key  : severity ("none" / "moderate" / "severe" / "extreme")
# Inner key  : "tree" / "non_tree" / "default"
# Inner value: either a single {strategy, rationale} dict, OR a list of
#              {min_minority_count, strategy, rationale} rules. The list
#              is evaluated by descending min_minority_count, first
#              applicable rule wins (loader sorts defensively at load
#              time so an unsorted YAML still produces the right answer).
strategy_matrix:
  none:
    default:
      strategy: none
      rationale: "Class distribution is balanced (minority >= 40%)"

  moderate:
    tree:
      strategy: class_weight
      rationale: "Moderate imbalance - tree models handle class weights efficiently"
    non_tree:
      strategy: random_oversample
      rationale: "Moderate imbalance - light oversampling recommended"

  severe:
    tree:
      strategy: class_weight
      rationale: >-
        Severe imbalance - tree models handle class weights natively,
        avoiding SMOTE synthetic sample memorization
    # Re-tune 2026-06-06: non-tree (linear) models now use cost-sensitive
    # class_weight instead of SMOTE/oversampling at severe imbalance. The HPO
    # objective already switches to average_precision (PR-AUC) at severe+extreme
    # (hyperparameter_tuner._get_default_metric), and synthetic oversampling is
    # empirically detrimental to PR-AUC for linear models (ULB fraud-handbook
    # Ch.6; tier0_optum_mart..._disproof_20260606.md). class_weight shifts the
    # boundary without fabricating points or adding SMOTE compute; pair with
    # decision-threshold tuning downstream.
    non_tree:
      strategy: class_weight
      rationale: >-
        Severe imbalance (non-tree) - cost-sensitive class_weight preferred
        over SMOTE: resampling degrades PR-AUC (the severe/extreme HPO objective)
        for linear models. Pair with decision-threshold tuning.

  extreme:
    tree:
      strategy: class_weight
      rationale: >-
        Extreme imbalance - tree models handle class weights natively,
        avoiding SMOTE synthetic sample memorization
    # Re-tune 2026-06-06: see the severe.non_tree note. At extreme imbalance the
    # prior "combined" (SMOTE->0.5 + class_weight) measured at/below the
    # no-resampling PR-AUC baseline on the feature-bound Optum mart, so the SMOTE
    # step is dropped — class_weight alone, no synthetic minority generation.
    non_tree:
      strategy: class_weight
      rationale: >-
        Extreme imbalance (non-tree) - cost-sensitive class_weight only;
        synthetic oversampling does not raise PR-AUC when the ceiling is
        feature-bound (separability), and degrades it for linear models.
