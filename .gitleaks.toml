# Gitleaks configuration — extends default rules, no rule changes.
# Every suppression below is scoped to a specific path, commit, or content
# string verified non-secret. Anything outside this allowlist still trips.
#
# Two v8 gotchas pinned here so future edits don't repeat them:
#
#   Gotcha 1 — commits = [...] needs FULL 40-char SHAs. v8.30.1 silently
#     ignores 10-char prefixes — no warning, allowlist becomes inert.
#     Use `git rev-parse <prefix>` before pasting.
#
#   Gotcha 2 — use a SINGULAR top-level [allowlist] table, NOT the plural
#     [[allowlists]] array. EMPIRICALLY VERIFIED against gitleaks 8.24.3 (the
#     version pinned by gitleaks/gitleaks-action@v2): with `[extend]
#     useDefault = true`, findings from the DEFAULT/extended rules (e.g.
#     generic-api-key) are matched ONLY against the singular [allowlist].
#     The plural [[allowlists]] blocks are parsed but NOT applied to
#     default-rule findings — every such block is silently inert (this bit
#     the T9 `persistent_180d` column-name false positive: a plural block
#     with the right path + regexes did nothing; the identical content in a
#     singular [allowlist] suppresses it). Keep ALL suppressions in the one
#     [allowlist] table below. Match condition is OR across paths / commits /
#     regexes / stopwords — any one matching allowlists the finding.
#
# Validate locally before pushing (faithful to CI — same 8.24.3, git mode):
#   docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
#     detect --source /repo -v --log-opts="--no-merges --first-parent <range>"

[extend]
useDefault = true

[allowlist]
description = "E2I verified non-secret suppressions (paths, commits, content)"

# ---------------------------------------------------------------------------
# Paths — files whose entire purpose is to contain secret-shaped data that is
# not a real secret, plus project modules the generic-api-key rule
# false-positives on.
# ---------------------------------------------------------------------------
paths = [
  # detect-secrets audit baseline. Contains hashed_secret values + filenames
  # of audited test fixtures. Not real secrets.
  '''^\.secrets\.baseline$''',

  # Test fixtures that intentionally contain fake API keys / JWTs.
  '''^tests/.*\.py$''',

  # advanced_validation.py contains Plan v3 Tier 1B step 1 docstrings listing
  # result-mapping key identifier strings (`permutation_null_p95`,
  # `permutation_null_p99`, `permutation_n_permutations`,
  # `permutation_n_effective`). The generic-api-key rule false-positives on
  # the docstring patterns. Pure Python module — no API keys, tokens, secrets.
  '''^src/agents/ml_foundation/model_trainer/nodes/advanced_validation\.py$''',

  # Lockfiles — never contain real secrets, only entropy noise. (Belt-and-
  # suspenders; the gitleaks default allowlist also covers these.)
  '''(?i).*\.lock$''',
  '''(?i)package-lock\.json$''',
  '''(?i)pnpm-lock\.yaml$''',
  '''(?i)poetry\.lock$''',
  '''(?i)uv\.lock$''',

  # Gold-standard reproducible reseed loader. The `KEY = "patient_id"`
  # constant sits next to long outcome-column names in pandas column lists
  # (`cols = [KEY, "persistent_180d", ...]`), which the generic-api-key
  # heuristic reads as a key/value pair. Pure synthetic-data relabel loader —
  # no API keys, tokens, or secrets.
  '''^scripts/regenerate_cohort_outcomes\.py$''',

  # Generated, code-verified lineage & certification reports. They embed code
  # snippets, config-key identifiers, path:line refs, and an inlined mermaid
  # JS bundle that false-positive the generic/high-entropy rules. Read-only
  # documentation — no real secrets.
  '''^docs/reports/.*''',
]

# ---------------------------------------------------------------------------
# Commits — historical commits that introduced placeholder values into files
# since removed from the tree (commit 889ff0f removed docs/ wholesale Feb
# 2026). Listed individually to keep scope tight; any FUTURE leak in any other
# commit still trips. Full 40-char SHAs required (prefixes do not match).
# ---------------------------------------------------------------------------
commits = [
  "30300294ef41a950a6d8ca09fe666839b1d63552",  # docs/AUTHENTICATION.md (4 hits)
  "d28a058d2a1af2858322bead6b815902fb2627e4",  # INFRASTRUCTURE.md (1 hit)
  "5eb76e4a8e07d97abeaf7d844eeaafd20c02db3f",  # INFRASTRUCTURE.md (1 hit)
  "b61404cec6cfe3668ab6a14d8177d442eea5d471",  # INFRASTRUCTURE.md + .env.template (3 hits)
  "3e1c70cf40efb46c0b3cf59b14e8bb27de2bd53f",  # docs/FEATURE_STORE_QUICKSTART.md (2 hits)
  "2aa69645e490ef6c522ed2f0fc0ad1e2c08212f1",  # PR #118 perm-null docstring false positive
  "58cfb93227191950a7cf77c38ffb5242e83a73b5",  # PR #119 perm-null docstring false positive (rebased SHA)
  "3cf522aa39bb16dffa50aef8a72b6d59345c2eaa",  # PR #121 perm-null docstring false positive (rebased SHA)
]

# ---------------------------------------------------------------------------
# Content — verified non-secret strings (matched against the captured secret).
# ---------------------------------------------------------------------------
regexes = [
  # Supabase frontend anon key embedded in frontend/.env.production. JWT
  # payload {"role":"anon", iss:"supabase"}. Anon keys are intended for public
  # client embedding and are gated by RLS, not secrecy.
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzY5MzUzMDYzLCJleHAiOjIwODQ3MTMwNjN9\.HB_ImkVYor5f4xBYK9kLRTfYW1aq3p-NQOurBIYWYC8''',

  # docker/supabase/start.sh echo prints the 'YOUR_ANON_KEY' literal.
  '''YOUR_ANON_KEY''',

  # Plan v3 Tier 1B step 1 permutation-null surface-key Python identifiers
  # appearing in docstrings as code-formatted result-mapping keys.
  '''permutation_null_p9[59]''',
  '''permutation_n_permutations''',
  '''permutation_n_effective''',

  # T9 patient_journeys cohort-outcome column-name identifiers appearing as
  # quoted string literals in DB update payloads (e.g.
  # `cols = [KEY, "persistent_180d", ...]`). Public DB column names, not
  # secrets — same false-positive class as the permutation-null identifiers.
  '''persistent_180d''',
  '''discontinued_180d''',
  '''comorbidity_burden''',
  '''prior_therapy_lines''',
]

# Stopwords — a finding whose captured secret CONTAINS any of these is
# allowlisted. Redundant backstop to the regexes above (the regex match
# intermittently fails on secrets captured from multi-backtick docstring
# context in gitleaks 8.24.3).
stopwords = [
  "permutation_null_p95",
  "permutation_null_p99",
  "permutation_n_permutations",
  "permutation_n_effective",
  "persistent_180d",
  "discontinued_180d",
  "comorbidity_burden",
  "prior_therapy_lines",
]
