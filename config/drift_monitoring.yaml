# Drift Monitoring Configuration
# Phase 14: Model Monitoring & Drift Detection
#
# This configuration controls drift detection thresholds, schedules, and alerting.

# Detection settings
detection:
  # Time window for comparing baseline vs current distributions:
  # baseline = [now-2w .. now-w], current = [now-w .. now].
  #
  # 28d — sized to the POST-FRONTIER-CUTOVER substrate (2026-07-04). The scv
  # substrate is frozen at its 2026-07-03 anchor; from EPOCH 2026-07-06 the
  # weekly Monday cron appends deterministic cohorts carrying ~321
  # feature_values rows/week across 15 features (~21 samples/feature/week).
  # The drift nodes silently skip any feature with < min_samples (30) per
  # window, so a 7d window (~21 samples/feature) would have gone PERMANENTLY
  # and silently dark once the rolling windows slid past the frozen bulk
  # (~2026-07-18). 28d = exactly 4 weekly cohorts regardless of sweep
  # day-of-week -> ~84 samples/feature/window, stable and above the gate.
  #
  # Consequence for reseed churn: after a destructive --full reseed the
  # windows honestly straddle the rewrite for ~2 window-lengths (~8 weeks) and
  # the transition alerts persist until then; auto_resolve_cleared() retires
  # them as the discontinuity ages out. That transient red IS the honest
  # reading — do not "fix" it by shrinking this window below the sample gate.
  time_window: "28d"

  # Statistical significance level for tests
  significance_level: 0.05

  # PSI (Population Stability Index) threshold
  # < 0.1: No significant shift
  # 0.1 - 0.25: Moderate shift (warning)
  # > 0.25: Significant shift (critical)
  psi_threshold: 0.1

  # Specific features to monitor (empty = all available)
  features_to_monitor: []

  # Minimum samples required for drift detection
  min_samples: 30

  # Enable/disable specific drift types
  enable_data_drift: true
  enable_model_drift: true
  enable_concept_drift: true

# Schedule settings
schedule:
  # How often to run drift detection (hours)
  detection_interval_hours: 6

  # Hour to run full model sweep (0-23, UTC)
  full_sweep_hour: 0

  # Day to run cleanup (0=Monday, 6=Sunday)
  cleanup_day: 6

  # How many days of history to retain
  retention_days: 90

# Alert settings
alerts:
  # Drift score thresholds for alert severity
  critical_threshold: 0.8
  warning_threshold: 0.4

  # Email recipients for alerts (comma-separated)
  email_recipients: []

  # Slack webhook URL for notifications
  slack_webhook: null

  # Enable/disable alert channels
  enable_email: false
  enable_slack: false

  # Alert aggregation window (minutes) to prevent alert storms
  aggregation_window_minutes: 60

# Performance tracking
performance:
  # Metrics to track for model performance
  tracked_metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - auc_roc

  # Performance degradation threshold (relative drop)
  degradation_threshold: 0.1

  # Rolling window for performance trending (days)
  trending_window_days: 30

# Retraining triggers
retraining:
  # Auto-trigger retraining when drift exceeds threshold
  auto_retrain: false

  # Minimum days between retraining runs
  min_days_between_retraining: 7

  # Drift score threshold to trigger retraining
  retrain_drift_threshold: 0.5

  # Maximum number of auto-retraining attempts
  max_retrain_attempts: 3
