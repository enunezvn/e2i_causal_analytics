name: Tier 1B Gate B2 Experiment (G2)

# Make the workflow run name embed the tag ref so the HIGH-5 (iter-3)
# durable prior-run check (`scripts/check_g2_prior_runs.py`) can find
# previous runs of the same S_prespec via `gh run list --json name`.
# The S_prespec short SHA is appended in the HIGH-5 step's display
# (best-effort because `run-name` cannot reference a steps.* output).
run-name: G2 ${{ github.ref }}

# Plan v4 Gate G2 — CI-controlled execution of the Tier 1B Gate B2
# pre-specified ΔAUC + ECE + CV-stability experiment. The first
# ATTEMPTED run from S_prespec is the LOAD-BEARING G2 result.
#
# Trigger: tags matching `tier1b-b2-experiment-*`. The workflow:
#   1. Checks out the tag SHA.
#   2. Checks out a SECOND copy of the verifier scripts from the
#      protected `origin/main` ref (HIGH-6 trust boundary).
#   3. Verifies the experiment commit is a CHILD of S_prespec via
#      the protected check_g2_commit_graph.py.
#   4. Verifies the dataset content hashes match the pinned values in
#      the S_prespec memo via the protected
#      verify_g2_prespec_dataset_hashes.py with --strict and
#      --prespec-sha <S_prespec_SHA>.
#   5. Enforces "first attempted run is load-bearing" via the run
#      registry at .github/g2_runs/<S_prespec>.json (HIGH-5).
#   6. Runs scripts/run_tier1b_b2_experiment.py against the
#      load-bearing default cohort.
#   7. Uploads the run manifest as a CI artifact + appends to
#      gate_history (MED-10).
#
# Lifecycle state: `LIFECYCLE_STATE_G2 = ADVISORY` until the first
# green run lands. Promotion to ENFORCED requires the signed
# `docs/calibration/g2_completion_signoff_<date>.md` per N3.
#
# Pre-spec memo: `docs/specs/tier1b_b2_prespec_20260510.md`. Editing
# the memo's load-bearing values requires a NEW memo at a fresh date
# per the v3 §8 anti-threshold-shopping protocol.
#
# HIGH-4 fix: workflow_dispatch is REMOVED from this workflow. Manual
# diagnostic runs that target snooped cohorts live in the separate
# `tier1b_b2_diagnostic.yml` workflow with non-load-bearing artifacts.
# HIGH-6 fix: verifier scripts are checked out from origin/main into
# `governance_checkout/` and run from there, so the tagged commit
# CANNOT weaken the verifiers. CODEOWNERS gating on origin/main is
# still required (the protected ref is the trust boundary).

on:
  push:
    tags:
      - 'tier1b-b2-experiment-*'

env:
  PYTHON_VERSION: '3.12'
  PRE_SPEC_PATH: 'docs/specs/tier1b_b2_prespec_20260510.md'
  GOVERNANCE_REF: 'origin/main'

jobs:
  g2-experiment:
    name: G2 Experiment Run (LOAD-BEARING)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository (tag SHA)
        uses: actions/checkout@v4
        with:
          # Full history needed so the introducing-commit lookup of
          # the pre-spec memo (S_prespec discovery) and the run
          # registry's prior-run query both have the data they need.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          pip install --upgrade pip
          # Minimal dependency set the harness imports + verifiers use.
          # The verifier scripts are stdlib-only by design; the harness
          # needs sklearn/numpy/pandas + the project's local packages.
          pip install -e .

      - name: Discover S_prespec SHA
        id: prespec
        run: |
          set -euo pipefail
          S_PRESPEC=$(git log --diff-filter=A --follow --format=%H -- "$PRE_SPEC_PATH" | tail -n 1 || true)
          if [ -z "$S_PRESPEC" ]; then
            echo "::error::could not discover S_prespec by introducing-commit lookup"
            exit 1
          fi
          S_PRESPEC_SHORT=$(git rev-parse --short=8 "$S_PRESPEC")
          echo "S_prespec=$S_PRESPEC ($S_PRESPEC_SHORT)"
          echo "sha=$S_PRESPEC" >> "$GITHUB_OUTPUT"
          echo "short=$S_PRESPEC_SHORT" >> "$GITHUB_OUTPUT"

      - name: HIGH-6 (iter-3) — Resolve governance verifier SHA from pre-spec memo
        # The pre-spec memo's `governance_verifier_sha:` field pins the
        # immutable governance commit whose verifier scripts the
        # workflow trusts. Falls back to origin/main if the memo
        # carries the placeholder (back-compat).
        id: gov_sha
        env:
          S_PRESPEC: ${{ steps.prespec.outputs.sha }}
        run: |
          set -euo pipefail
          GOV_SHA=$(python scripts/extract_governance_verifier_sha.py --prespec-sha "$S_PRESPEC")
          echo "Governance verifier SHA: ${GOV_SHA}"
          echo "sha=${GOV_SHA}" >> "$GITHUB_OUTPUT"

      - name: HIGH-6 — Stage protected verifier scripts from pinned governance SHA
        # iter-3: stage from the SHA pinned in the pre-spec memo
        # (immutable). When the memo holds the placeholder, fall back
        # to origin/main (the prior, less-strict trust boundary).
        # The SHA actually checked out is recorded into the run
        # manifest's `governance_verifier_sha` field so the audit
        # trail captures which verifier semantics gated the run.
        env:
          GOV_SHA: ${{ steps.gov_sha.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p governance_checkout/scripts
          if [ "$GOV_SHA" = "ORIGIN_MAIN_FALLBACK" ]; then
            echo "[INFO] memo placeholder set — falling back to ${GOVERNANCE_REF}"
            git fetch origin main --depth=1
            ACTUAL_REF="${GOVERNANCE_REF}"
            ACTUAL_SHA=$(git rev-parse "${GOVERNANCE_REF}")
          else
            echo "[INFO] using pinned governance SHA: ${GOV_SHA}"
            git fetch origin "${GOV_SHA}" --depth=1 || git fetch --unshallow || true
            ACTUAL_REF="${GOV_SHA}"
            ACTUAL_SHA="${GOV_SHA}"
          fi
          for s in check_g2_commit_graph.py verify_g2_prespec_dataset_hashes.py check_g2_prior_runs.py extract_governance_verifier_sha.py; do
            git show "${ACTUAL_REF}:scripts/${s}" > "governance_checkout/scripts/${s}"
            chmod +x "governance_checkout/scripts/${s}"
          done
          echo "$ACTUAL_SHA" > governance_checkout/.governance_verifier_sha
          echo "[OK] staged $(ls governance_checkout/scripts/) from ${ACTUAL_REF} (sha=${ACTUAL_SHA})"

      - name: HIGH-5 (iter-3) — Durable prior-run check via GitHub API
        # The first ATTEMPTED run from a given S_prespec is the
        # load-bearing G2 result. Threshold-shoppers must NOT be able
        # to re-tag child commits and accumulate runs until split noise
        # produces a favorable manifest.
        #
        # iter-3 fix (codex pass-2 NOT-CLOSED): the prior in-workspace
        # registry at .github/g2_runs/<S_prespec>.json was ephemeral —
        # a fresh checkout in the second run does NOT see the file.
        # The API-driven script `scripts/check_g2_prior_runs.py` queries
        # `gh run list` for prior runs of this workflow whose tag
        # commit message references the same S_prespec SHA, and FAILS
        # LOUDLY when ANY prior attempt is found.
        #
        # The "Verify tag commit references S_prespec" step (below)
        # ensures every G2 run's tag commit message contains the
        # S_prespec — so a prior run's headSha commit message is the
        # durable signal we filter on.
        env:
          S_PRESPEC: ${{ steps.prespec.outputs.sha }}
          S_PRESPEC_SHORT: ${{ steps.prespec.outputs.short }}
          TAG_REF: ${{ github.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/check_g2_prior_runs.py \
            --s-prespec "$S_PRESPEC" \
            --s-prespec-short "$S_PRESPEC_SHORT" \
            --workflow tier1b_b2_experiment.yml \
            --current-run-id "$GITHUB_RUN_ID" \
            --current-head-sha "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY"
          # Best-effort local registry write (informational; the API
          # check above is the load-bearing control).
          REGISTRY="$GITHUB_WORKSPACE/.github/g2_runs/${S_PRESPEC}.json"
          mkdir -p "$(dirname "$REGISTRY")"
          cat > "$REGISTRY" <<EOF
          {
            "s_prespec_sha": "${S_PRESPEC}",
            "tag_ref": "${TAG_REF}",
            "tag_sha": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "first_attempt_timestamp_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "[OK] no prior runs detected; registry entry written: ${REGISTRY}"

      - name: Verify commit-graph parent constraint (governance checkout)
        # Second gate: the experiment commit (= the tagged commit)
        # MUST be a CHILD of S_prespec. HIGH-6: run from the protected
        # checkout, not the tag's checkout.
        # NEW HIGH-2 (iter-3): pass --repo-root "$GITHUB_WORKSPACE" so
        # the staged copy in governance_checkout/scripts/ resolves the
        # actual worktree root, not its own staging directory.
        env:
          S_PRESPEC: ${{ steps.prespec.outputs.sha }}
          E2I_GOVERNANCE_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python governance_checkout/scripts/check_g2_commit_graph.py \
            --prespec-sha "$S_PRESPEC" \
            --experiment-sha HEAD \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Verify cohort dataset hashes vs S_prespec memo (governance checkout)
        # First gate: data must not have drifted between memo-lock and
        # tag. HIGH-2: --strict (CI=true also forces strict). HIGH-3:
        # --prespec-sha pins hashes to the immutable S_prespec content.
        # HIGH-6: run from the protected checkout.
        # NEW HIGH-2 (iter-3): pass --repo-root "$GITHUB_WORKSPACE"
        # because the staged copy under governance_checkout/scripts/
        # resolves Path(__file__).parents[1] to governance_checkout
        # without the override.
        env:
          CI: 'true'
          S_PRESPEC: ${{ steps.prespec.outputs.sha }}
          E2I_GOVERNANCE_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python governance_checkout/scripts/verify_g2_prespec_dataset_hashes.py \
            --strict \
            --prespec-sha "$S_PRESPEC" \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Verify tag commit references S_prespec
        # Third gate: the tag's commit message MUST mention S_prespec
        # (either by full SHA or short SHA), making the parent
        # relationship visible in the tag annotation.
        env:
          GIT_REF: ${{ github.ref }}
          S_PRESPEC: ${{ steps.prespec.outputs.sha }}
          S_PRESPEC_SHORT: ${{ steps.prespec.outputs.short }}
        run: |
          set -euo pipefail
          TAG_NAME="${GIT_REF#refs/tags/}"
          MSG=$(git for-each-ref "refs/tags/$TAG_NAME" --format='%(contents)' 2>/dev/null || true)
          if [ -z "$MSG" ]; then
            MSG=$(git log -1 --format=%B HEAD)
          fi
          echo "::group::Tag/commit message"
          printf '%s\n' "$MSG"
          echo "::endgroup::"
          if printf '%s' "$MSG" | grep -q -E "$S_PRESPEC|$S_PRESPEC_SHORT"; then
            echo "[OK] Tag references S_prespec ($S_PRESPEC_SHORT)"
          else
            echo "::error::Tag commit/annotation does NOT reference S_prespec ($S_PRESPEC_SHORT). Add the S_prespec SHA (long or short) to the tag annotation OR commit message."
            exit 1
          fi

      - name: Run experiment harness (load-bearing default cohort only)
        # HIGH-4: workflow_dispatch removed from this workflow, so the
        # cohort label is hardcoded to optum_initiation_default. Manual
        # diagnostic runs against snooped cohorts must use the separate
        # tier1b_b2_diagnostic.yml workflow.
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          python scripts/run_tier1b_b2_experiment.py \
            --cohort-label optum_initiation_default \
            --manifest-out g2_run_manifest.json \
            | tee g2_stdout.log

      - name: HIGH-6 (iter-3) — Inject governance_verifier_sha into manifest
        # The verifier source SHA pinned in the pre-spec memo (or the
        # origin/main fallback SHA) is recorded in the manifest so the
        # audit trail captures which verifier semantics gated the run.
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f g2_run_manifest.json ]; then
            echo "::warning::manifest missing; skipping governance_verifier_sha injection"
            exit 0
          fi
          GOV_SHA="$(cat governance_checkout/.governance_verifier_sha 2>/dev/null || echo unknown)"
          jq --sort-keys --arg sha "$GOV_SHA" \
            '.governance_verifier_sha = $sha' \
            g2_run_manifest.json > /tmp/_gov_sha_inject.json
          mv /tmp/_gov_sha_inject.json g2_run_manifest.json
          echo "[OK] injected governance_verifier_sha=$GOV_SHA into manifest"

      - name: Append G2 outcome to gate_history (MED-10)
        # MED-10 fix: the manifest is appended to the N1 audit trail
        # so the regulatory eligibility record durably captures G2's
        # pass/fail outcome alongside the commit SHA, tag, S_prespec,
        # and dataset hashes.
        if: always()
        env:
          S_PRESPEC: ${{ steps.prespec.outputs.sha }}
          TAG_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ ! -f g2_run_manifest.json ]; then
            echo "::warning::g2_run_manifest.json missing; skipping audit append"
            exit 0
          fi
          python scripts/append_g2_to_gate_history.py \
            --manifest g2_run_manifest.json \
            --tag-ref "$TAG_REF" \
            --tag-sha "$GITHUB_SHA" \
            --s-prespec-sha "$S_PRESPEC" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --output g2_gate_history_entry.json

      - name: Upload run manifest + audit entry as CI artifact
        # The manifest is the load-bearing record. Always upload it,
        # even on failure, so the operator can inspect which threshold
        # failed and on what observed value.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-run-manifest
          path: |
            g2_run_manifest.json
            g2_stdout.log
            g2_gate_history_entry.json
            .github/g2_runs/*.json
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          echo "## Gate G2 Experiment Run (LOAD-BEARING)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f g2_run_manifest.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat g2_run_manifest.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No manifest produced — see run logs._" >> "$GITHUB_STEP_SUMMARY"
          fi
