      - { apiName: mlflowModelUri, column: mlflow_model_uri, baseType: string }
      - { apiName: trainedAt, column: trained_at, baseType: timestamp }
      - { apiName: promotedAt, column: promoted_at, baseType: timestamp }
      - { sharedProperty: data-split }
      - { sharedProperty: is-synthetic }

  - id: prediction
    apiName: Prediction
    displayName: Prediction
    pluralDisplayName: Predictions
    description: >
      Individual ML prediction with explainability and causal estimates.
      Backing table ml_predictions (40+ columns; probability/feature
      importance/fairness tail omitted). The modelRegistryId property is
      DERIVED by the curate_ml_predictions transform (resolves the loose
      model_version string handle to the registry UUID, mirroring
      src/repositories/drift_monitoring.py::_resolve_model_id).
    icon: sparkles
    groups: [ml-lifecycle]
    status: active
    visibility: normal
    writeback: disabled
    primaryKey: predictionId
    titleProperty: predictionClass
    datasources:
      - dataset: ds-curated-ml-predictions
        branch: master
    properties:
      - { apiName: predictionId, column: prediction_id, baseType: string }
      - { apiName: modelVersion, column: model_version, baseType: string,
          description: "Loose string handle — NO FK to ml_model_registry in PG." }
      - { apiName: modelType, column: model_type, baseType: string }
      - { apiName: modelRegistryId, column: model_registry_id, baseType: string,
          description: "DERIVED column (curation transform): resolved ml_model_registry.id; realizes the link to MlModel." }
      - { apiName: predictionTimestamp, column: prediction_timestamp, baseType: timestamp,
          description: "NOT NULL." }
      - { apiName: patientId, column: patient_id, baseType: string, description: "NOT NULL." }
      - { apiName: hcpId, column: hcp_id, baseType: string, description: "FK to hcp_profiles." }
      - { apiName: predictionType, column: prediction_type, baseType: string,
          description: "prediction_type enum: trigger | propensity | risk | churn | next_best_action." }
      - { apiName: predictionValue, column: prediction_value, baseType: double }
      - { apiName: predictionClass, column: prediction_class, baseType: string }
      - { apiName: confidenceScore, column: confidence_score, baseType: double }
      - { apiName: shapValues, column: shap_values, baseType: struct,
          description: "Per-feature SHAP JSONB (feeds WS1-MP-007 SHAP Coverage KPI)." }
      - { apiName: treatmentEffectEstimate, column: treatment_effect_estimate, baseType: double,
          description: "ATE." }
      - { apiName: heterogeneousEffect, column: heterogeneous_effect, baseType: double,
          description: "Per-patient CATE." }
      - { apiName: actualOutcome, column: actual_outcome, baseType: double,
          description: "Ground truth; NULL until observed (concept-drift input)." }
      - { apiName: outcomeRecordedAt, column: outcome_recorded_at, baseType: timestamp }
      - { apiName: splitConfigId, column: split_config_id, baseType: string }
      - { sharedProperty: data-split }
      - { sharedProperty: is-synthetic }

  - id: data-split-config
    apiName: DataSplitConfig
    displayName: Data Split Config
    pluralDisplayName: Data Split Configs
    description: >
      ML split governance record. Backing table ml_split_registry (ratios
      CHECK-sum to 1.0; companion tables ml_patient_split_assignments,
