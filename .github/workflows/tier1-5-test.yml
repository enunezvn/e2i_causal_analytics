name: Tier 1-5 Agent Harness

# Runs the integration harness that walks every Tier 1-5 agent
# (scripts/run_tier1_5_test.py) against a cached Tier 0 pipeline output. Acts
# as a forcing function against schema drift between tier0 state, the
# Tier0OutputMapper, and per-agent contracts.
#
# The job boots the core ML infra from docker/docker-compose.yml (Redis,
# FalkorDB, MLflow) so agents that lazy-init those backends find real
# services on 127.0.0.1. Supabase is not in scope for this workflow — its
# self-hosted compose lives under docker/supabase/ and takes long enough to
# bring up that it's better handled by a committed tier0 cache or a
# follow-up self-hosted-runner workflow.

on:
  # DELIBERATELY NOT path-filtered — the filtering moved into the `changes` job.
  #
  # "Tier 1-5 agent harness" is a REQUIRED status check on main. GitHub resolves
  # a conditionally-skipped JOB as "Success", but a workflow that never starts
  # because of a `paths:` filter leaves its check "Pending" forever — so a
  # frontend-only PR could never satisfy this context and could only land via
  # `gh pr merge --admin` (hit on PR #1444). The traced path list below is
  # preserved verbatim as the `changes` job's match pattern; only the place it
  # is evaluated changed.
  pull_request:
  # Weekly backstop (issue #618): the path-gated PR trigger is
  # high-signal but cannot enumerate EVERY shared module that might one day be
  # pulled into a contract's import closure. A scheduled run guarantees schema
  # drift in ANY src/ module is still exercised at least weekly, independent of
  # which paths a given PR happened to touch.
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  changes:
    name: Detect harness-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.gate.outputs.relevant }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the merge-base diff below can resolve.
          fetch-depth: 0

      - name: Decide whether the harness must run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # This pattern IS the former `paths:` trigger list, moved here so the
          # required context still reports on PRs it does not apply to. The
          # entries below src/agents|src/testing are shared SCHEMA modules the
          # agent state/input CONTRACTS import transitively (issue #618): a
          # Pydantic/TypedDict change in any of them can break an agent contract
          # or the tier0 mapper without touching src/agents/** at all, and this
          # harness exists to catch exactly that drift. The list was TRACED, not
          # guessed — importing the AGENT_METHOD_MAP state_module + input_module
          # entries pulls in schema-bearing modules from each package (runtime
          # import-closure scan, 2026-06-02). The issue's guessed ``src/causal/``
          # is only an empty placeholder package; the real schema home is
          # ``src/causal_engine/`` (densest, incl. validation_outcome consumed by
          # feedback_learner's contract).
          PATTERN='^(src/agents/|src/testing/|scripts/run_tier0_test\.py$|scripts/run_tier1_5_test\.py$|config/agents/|\.github/workflows/tier1-5-test\.yml$|docker/docker-compose\.yml$|src/causal_engine/|src/data/|src/ml/|src/mlops/|src/repositories/|src/digital_twin/|src/optimization/|src/rag/|src/services/|src/tool_registry/|src/memory/|src/utils/|src/skills/|src/lifecycle/|src/nlp/)'

          # FAIL OPEN, always: schedule/dispatch runs and any diff failure run
          # the harness. A false "not relevant" would let agent-contract drift
          # through behind a green required check.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Event is $EVENT_NAME, not pull_request — running the harness."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "::warning::Could not diff $BASE_SHA...$HEAD_SHA — running the harness."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$files" ]]; then
            echo "::warning::Diff was empty — running the harness."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$files" | sed 's/^/  /'
          if echo "$files" | grep -qE "$PATTERN"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Harness-relevant paths changed — running the harness."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No harness-relevant paths changed — the harness job will skip."
          fi

  tier1-5-harness:
    name: Tier 1-5 agent harness
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: changes
    # GitHub reports a conditionally-skipped job as "Success", so this is what
    # lets the REQUIRED "Tier 1-5 agent harness" context resolve on a PR that
    # touches none of the traced paths (e.g. frontend-only). A path-filtered
    # workflow trigger could not do this — it would leave the check Pending.
    if: needs.changes.outputs.relevant == 'true'
    # Hard-fail mode for INFRA (flipped 2026-05-16 per issue #263) — the
    # dispatcher wrapped-input fix landed in PR #275 (commit ac68ae41), and the
    # boot-stack + install-deps steps have been stable on consecutive runs.
    # Graceful-skip on missing tier0 cache is still honoured via
    # ``steps.restore-cache.outputs.found`` ``if:`` gating below — that's a
    # legitimate skip path, not a soft-fail.
    #
    # As of issue #600 a committed tier0 fixture
    # (scripts/tier0_output_cache/latest.pkl) makes the run-harness step
    # actually execute the 13 agents on every relevant PR. Per the maintainer
    # decision, an AGENT / contract failure is a MONITORED ALARM (non-blocking
    # ::warning + results artifact), not a PR block — see the run-harness step.
    # INFRA failures (boot-stack / install-deps) remain hard-fail (#263).

    env:
      # Expected-fail allow-list (issue #616 fix#1). Comma-separated agent
      # names whose harness failure is a KNOWN, accepted condition: those stay
      # a non-blocking ::warning (the #600 monitored-alarm contract). A failure
      # of ANY agent NOT on this list is treated as a NEW regression and HARD
      # FAILS the honest-gate step below (exit 1) — so the green check can no
      # longer silently mask a fresh breakage.
      #
      # As of #606 the keyless harness is a clean 13/13 (verified against run
      # 26796583550: passed=13, failed=0), so the allow-list is intentionally
      # EMPTY — every agent failure is a regression. Re-populate it (e.g.
      # "experiment_monitor,health_score") ONLY with an issue link justifying
      # each known-failing agent, to re-arm the #600 non-blocking path for them.
      TIER1_5_EXPECTED_FAIL_AGENTS: ""
      # CI-only dummy passwords. docker-compose.yml uses ${VAR:?msg} syntax
      # which evaluates ALL such refs at parse time (not just for services
      # being started), so every required var must be set even though we
      # only boot redis / falkordb / mlflow below.
      REDIS_PASSWORD: "ci-only-changeme"
      FALKORDB_PASSWORD: "ci-only-changeme"
      GRAFANA_ADMIN_PASSWORD: "ci-only-changeme"
      SUPABASE_POSTGRES_PASSWORD: "ci-only-changeme"
      # Service endpoints the harness should point agents at.
      REDIS_URL: "redis://:ci-only-changeme@127.0.0.1:6382/0"
      FALKORDB_HOST: "127.0.0.1"
      FALKORDB_PORT: "6381"
      FALKORDB_PASSWORD_ENV: "ci-only-changeme"
      MLFLOW_TRACKING_URI: "http://127.0.0.1:5000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Free disk space on runner
        # The runtime + dev install (torch + CUDA, transformers, scikit-learn,
        # statsmodels, dowhy, econml, etc.) exhausts the runner's default
        # ~14 GB free, so pip install crashes with
        # `[Errno 28] No space left on device` mid-resolve. `jlumbroso/free-disk-space`
        # reclaims ~30 GB by pruning preinstalled caches we don't need.
        # docker-images is FALSE here: this job boots docker-compose (redis /
        # falkordb / mlflow) below, and pruning images would break those
        # running containers. tool-cache is kept (shared Python toolcache).
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false  # keep Python toolcache used by other jobs
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false  # this job boots docker-compose; keep images
          swap-storage: true

      - name: Boot Redis + FalkorDB + MLflow from docker-compose
        id: boot-stack
        # Hard-fail (#263): real compose regressions — compose-file
        # parse errors, missing services, network-create failures,
        # ``docker compose up`` errors — must trip the job. Shell defaults
        # (``set -e``-equivalent via ``run: |`` + explicit propagation
        # below) ensure that. The only graceful-skip retained is the
        # health-probe timeout path: an image pull can still rate-limit
        # transiently and we don't want that to flap the check while
        # the workflow stabilizes. That timeout signals ``ok=false``
        # via outputs; the downstream Summarize-skip-reasons step
        # emits a notice. A hard infra failure (parse error, network
        # conflict, ``compose up`` non-zero) escapes via shell defaults
        # and hard-fails the job.
        run: |
          set -euo pipefail
          # docker-compose.yml references an external 'supabase-network'
          # (used by api / feast / scheduler — not by our 3 services). Even
          # when only starting a subset, compose validates external networks
          # exist, so pre-create it as an empty bridge to satisfy the
          # declaration without bringing Supabase up.
          if ! docker network inspect supabase-network >/dev/null 2>&1; then
            docker network create supabase-network
          fi
          # docker compose up is now hard-fail: a parse error or missing
          # service definition is a real regression that the harness
          # exists to catch.
          docker compose -f docker/docker-compose.yml up -d redis falkordb mlflow
          echo "Waiting for services to report healthy..."
          ALL_HEALTHY=true
          for svc in redis falkordb mlflow; do
            HEALTHY=false
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "e2i_${svc}" 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                echo "  $svc: healthy ($i tries)"
                HEALTHY=true
                break
              fi
              sleep 2
            done
            if [ "$HEALTHY" = "false" ]; then
              echo "::warning::$svc did not become healthy within 60s (last status: $status)"
              docker logs "e2i_${svc}" --tail 80 || true
              ALL_HEALTHY=false
            fi
          done
          docker compose -f docker/docker-compose.yml ps
          # Health-probe timeout is the one retained graceful-skip: an
          # image pull can rate-limit transiently. The harness run-step
          # checks outputs.ok=='true' before invoking make tier1-5-test.
          if [ "$ALL_HEALTHY" = "true" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Install runtime + dev dependencies
        id: install-deps
        # Hard-fail (#263 flip-off 2026-05-16): a pip resolver / build
        # regression must trip the check; the harness cannot meaningfully
        # run on a broken dep set. Downstream ``if:`` still gates the
        # harness run on ``steps.install-deps.outcome == 'success'`` so
        # the skip-summary path remains coherent if a future contributor
        # re-introduces structured graceful-skip here.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Restore tier0 cache (if committed to repo)
        id: restore-cache
        run: |
          if [ -f scripts/tier0_output_cache/latest.pkl ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Tier 0 cache present at scripts/tier0_output_cache/latest.pkl"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No tier0 cache committed — harness will be skipped with a"
            echo "success status. The docker stack still came up so any"
            echo "container-image / compose-config regression would have"
            echo "surfaced in the boot step above."
          fi

      - name: Run Tier 1-5 harness
        id: run-harness
        if: |
          steps.install-deps.outcome == 'success' &&
          steps.boot-stack.outputs.ok == 'true' &&
          steps.restore-cache.outputs.found == 'true'
        env:
          E2I_TESTING_MODE: "true"
          DISABLE_PANDERA_IMPORT_WARNING: "True"
          # Sanctioned mock-allowed test context (#606 item A), matching the
          # agents-tests lane (backend-tests.yml). The harness instantiates each
          # agent generically and can't inject a connector, so without this flag
          # heterogeneous_optimizer's CATEEstimatorNode raises at construction
          # ("MockDataConnector fallback is disabled"). The agent still runs on
          # the REAL tier0 fixture data (tier0_data passthrough); the mock
          # connector only satisfies the eager constructor and is never queried.
          # NOT set in production deploy config, so prod stays fail-closed.
          E2I_ALLOW_MOCK_CONNECTOR: "1"
          # Opt-in MARKED-mock LLM for the keyless harness (#606 item C). The
          # LLM-dependent agents (orchestrator, experiment_designer, tool_composer)
          # otherwise raise at construction ("OPENAI_API_KEY not set"). With this
          # flag + no key they use a clearly-marked mock (mock_response_for_dev_only
          # =True); without it a missing key fails loud. NOT set in prod deploy.
          E2I_ALLOW_MOCK_LLM: "1"
          # experiment_designer's validity_audit node predates the shared util and
          # uses its own #471 opt-in flag for its MARKED MockValidityLLM; set it
          # too so experiment_designer runs fully keyless (#606 item C).
          EXPERIMENT_DESIGNER_USE_MOCK_LLM: "1"
        # Monitored-alarm-only on AGENT / contract failures (issue #600
        # maintainer decision). A committed tier0 fixture
        # (scripts/tier0_output_cache/latest.pkl) flips restore-cache.found to
        # true, so the harness now actually RUNS the 13 agents on every
        # relevant PR instead of graceful-skipping. An agent / contract
        # regression is surfaced as a NON-BLOCKING ::warning + the results
        # artifact — it does not block the PR. Infra failures
        # (boot-stack / install-deps) still hard-fail per #263 and gate this
        # step via the if: above, so the exit 0 below can ONLY ever mask an
        # agent failure, never an infra failure.
        #
        # The #263 forcing test forbids continue-on-error on every step, so
        # alarm-only is implemented in-shell: capture make's exit code and
        # exit 0 on the agent-failure branch. We deliberately do NOT use
        # ``set -e`` (it would abort before the ::warning + exit 0). The
        # harness keeps its own non-zero exit (main() sys.exit), so
        # ``make tier1-5-test`` stays hard-fail for local / other-workflow use.
        run: |
          set -uo pipefail
          rc=0
          make tier1-5-test || rc=$?
          echo "harness_rc=${rc}" >> "$GITHUB_OUTPUT"
          if [ "${rc}" -ne 0 ]; then
            echo "::warning title=Tier 1-5 agent/contract regression (non-blocking)::make tier1-5-test exited ${rc}. One or more Tier 1-5 agents failed contract / quality-gate validation. This is a MONITORED ALARM (issue #600 maintainer decision) and does NOT block the PR. See the uploaded tier1-5-results-* artifact (docs/results/tier1_5_pipeline_latest.json) for per-agent detail."
            exit 0
          fi
          echo "All Tier 1-5 agents passed contract + quality-gate validation."

      - name: Report agent results + enforce expected-fail allow-list
        id: report-results
        # Runs whenever the harness actually executed (cache present + infra OK),
        # regardless of the alarm-only run-harness exit code (if: always()-style
        # via the same gating the run step used). This is the HONEST signal step
        # (issue #616): it (1) writes a per-agent pass/fail table to
        # $GITHUB_STEP_SUMMARY so a reviewer sees "10/13", not a bare green, and
        # (2) HARD FAILS (exit 1) if any agent NOT on TIER1_5_EXPECTED_FAIL_AGENTS
        # failed — so a NEW regression beyond the known set can no longer hide
        # behind the #600 alarm-only exit 0. Known/allow-listed failures stay a
        # non-blocking ::warning, preserving the #600 contract for them.
        #
        # NOT continue-on-error (forbidden by #263); the exit 1 here is the
        # intended honest-gate behaviour, distinct from the alarm-only run step.
        if: |
          always() &&
          steps.install-deps.outcome == 'success' &&
          steps.boot-stack.outputs.ok == 'true' &&
          steps.restore-cache.outputs.found == 'true'
        env:
          RESULTS_JSON: docs/results/tier1_5_pipeline_latest.json
        run: |
          set -uo pipefail
          python scripts/run_tier1_5_test.py --summarize "${RESULTS_JSON}" \
            --expected-fail "${TIER1_5_EXPECTED_FAIL_AGENTS}" \
            --step-summary "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

      - name: Summarize skip reasons
        id: summarize-skip
        if: |
          steps.install-deps.outcome != 'success' ||
          steps.boot-stack.outputs.ok != 'true' ||
          steps.restore-cache.outputs.found != 'true'
        run: |
          REASONS=""
          if [ "${{ steps.install-deps.outcome }}" != "success" ]; then
            REASONS="${REASONS}pip-install failed; "
          fi
          if [ "${{ steps.boot-stack.outputs.ok }}" != "true" ]; then
            REASONS="${REASONS}docker stack unhealthy; "
          fi
          if [ "${{ steps.restore-cache.outputs.found }}" != "true" ]; then
            REASONS="${REASONS}no tier0 cache committed; "
          fi
          echo "::notice title=Tier 1-5 harness skipped::${REASONS}A skip is currently emitted only on missing tier0 cache or unhealthy infra; pip-install failures hard-fail (#263)."

      - name: Capture docker logs on failure
        if: failure()
        run: |
          for svc in redis falkordb mlflow; do
            echo "::group::e2i_${svc} logs"
            docker logs "e2i_${svc}" --tail 200 || true
            echo "::endgroup::"
          done

      - name: Tear down docker stack
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml down -v --remove-orphans || true

      - name: Upload results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-5-results-${{ github.run_id }}
          path: docs/results/tier1_5_pipeline_latest.json
          if-no-files-found: ignore
          retention-days: 14
