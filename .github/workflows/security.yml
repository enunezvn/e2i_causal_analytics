name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggers

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # =============================================================================
  # Secrets Scanning - Detect hardcoded secrets and credentials
  # =============================================================================
  secrets-scan:
    name: Secrets Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional for full features

      - name: Upload Gitleaks results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: results.sarif
          retention-days: 30

  # =============================================================================
  # SAST - Static Application Security Testing for Python
  # =============================================================================
  sast-python:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit security scan
        run: |
          bandit -r src/ \
            -f json \
            -o bandit-results.json \
            --severity-level medium \
            --confidence-level medium \
            -x '**/test_*.py,**/*_test.py,**/tests/**' \
            || true  # Don't fail CI, just report

      - name: Check for HIGH/CRITICAL findings
        run: |
          if [ -f bandit-results.json ]; then
            HIGH_COUNT=$(python -c "
          import json, sys
          data = json.load(open('bandit-results.json'))
          results = data.get('results', [])
          high_crit = [r for r in results if r.get('issue_severity') in ('HIGH', 'CRITICAL')]
          print(len(high_crit))
          " 2>/dev/null || echo "0")
            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "::error::Bandit found $HIGH_COUNT HIGH/CRITICAL severity findings"
              exit 1
            fi
          fi

      - name: Upload Bandit JSON results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-results
          path: bandit-results.json
          retention-days: 30

      - name: Display Bandit summary
        if: always()
        run: |
          echo "## Bandit Security Scan Results" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit-results.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat bandit-results.json | python -m json.tool | head -100 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # SAST - Semgrep for comprehensive pattern matching
  # =============================================================================
  sast-semgrep:
    name: Multi-language SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        # --config auto dropped: non-deterministic across runs.
        # --severity ERROR scopes the gate to high-confidence findings;
        # WARNING-level rules remain visible in artifacts for triage.
        # Local-dev noise reduction lives in .semgrepignore + .semgrep.yml.
        run: |
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --severity ERROR \
            --json \
            --json-output=semgrep-results.json \
            --exclude='**/test_*.py' \
            --exclude='**/*_test.py' \
            --exclude='**/tests/**' \
            --exclude='**/.venv/**' \
            --exclude='**/node_modules/**' \
            --exclude='**/.worktrees/**' \
            || true

      - name: Check for ERROR/WARNING findings
        run: |
          if [ -f semgrep-results.json ]; then
            FINDING_COUNT=$(python3 -c "
          import json
          data = json.load(open('semgrep-results.json'))
          results = data.get('results', [])
          severe = [r for r in results if r.get('extra', {}).get('severity') in ('ERROR', 'WARNING')]
          print(len(severe))
          " 2>/dev/null || echo "0")
            if [ "$FINDING_COUNT" -gt 0 ]; then
              echo "::error::Semgrep found $FINDING_COUNT ERROR/WARNING findings"
              exit 1
            fi
          fi

      - name: Upload Semgrep artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30

  # =============================================================================
  # Dependency Scanning - Check for vulnerable Python packages
  # =============================================================================
  dependency-scan:
    name: Dependency Scanning (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        # --ignore-vuln carve-outs documented inline below. Each entry
        # captures the package, the upstream-fix version (or "no fix"),
        # and the reason we're holding off. Re-evaluate at every quarterly
        # dep upgrade pass — see TODO note in CHANGELOG / DEPENDENCY_AUDIT.md.
        run: |
          pip-audit \
            --requirement requirements.txt \
            --format json \
            --output pip-audit-results.json \
            --desc on \
            --ignore-vuln GHSA-mhr3-j7m5-c7c9 `# langgraph-checkpoint 3.0.1 -> 4.0.0 major bump; defer until LangGraph migration` \
            --ignore-vuln GHSA-3936-cmfr-pm3m `# black 25.12.0 -> 26.3.1 major bump; coordinate with ruff/format CI baseline` \
            --ignore-vuln GHSA-w8v5-vhqr-4h9v `# diskcache 5.6.3 has no upstream fix as of 2026-04` \
            --ignore-vuln GHSA-gg5m-55jj-8m5g `# graphiti-core 0.24.3 -> 0.28.2 multi-minor; depends on memory backend test pass` \
            --ignore-vuln GHSA-v34v-rq6j-cj6p `# langsmith 0.5.0 -> 0.6.3 minor bump; couple to LangChain ecosystem upgrade` \
            --ignore-vuln GHSA-rr7j-v2q5-chgv `# langsmith 0.5.0 -> 0.7.31 multi-minor; same as above` \
            --ignore-vuln GHSA-r7w7-9xr2-qq2r `# langchain-openai 1.1.6 -> 1.1.14 blocked by openai>=2.26 (current 2.14)` \
            --ignore-vuln GHSA-53mr-6c8q-9789 `# litellm 1.80.10 -> 1.83.0 multi-minor; defer with LangChain upgrade` \
            --ignore-vuln GHSA-jjhc-v7c2-5hh6 `# litellm 1.80.10 -> 1.83.0 same upgrade window` \
            --ignore-vuln GHSA-69x8-hrgq-fjj8 `# litellm 1.80.10 -> 1.83.0 same upgrade window` \
            --ignore-vuln GHSA-xqmj-j6mv-4862 `# litellm 1.80.10 -> 1.83.7 same upgrade window` \
            --ignore-vuln GHSA-v4p8-mg3p-g94g `# litellm 1.80.10 -> 1.83.7 (CVE-2026-42271; PROXY_ADMIN gating fix); same upgrade window` \
            --ignore-vuln GHSA-xch3-2f9x-wh9f `# mlflow 3.7.0 fix only in 3.8.0rc0 (refuse rc); see mlflow 3.11.x upgrade ticket` \
            --ignore-vuln GHSA-gq3w-7jj3-x7gr `# mlflow 3.7.0 same — fix only in 3.8.0rc0` \
            --ignore-vuln GHSA-q2r8-vmq7-fpx2 `# mlflow 3.7.0 same — fix only in 3.8.0rc0` \
            --ignore-vuln GHSA-fhff-qmm8-h2fp `# mlflow 3.7.0 fix only in 3.9.0rc0` \
            --ignore-vuln GHSA-g6pg-52vf-843h `# mlflow 3.7.0 has no upstream fix as of 2026-04` \
            --ignore-vuln GHSA-vhcx-3pq2-4fvc `# mlflow 3.7.0 fix only in 3.9.0rc0` \
            --ignore-vuln GHSA-r23q-823p-vmf7 `# mlflow 3.7.0 fix in 3.8.1 — bundle with mlflow upgrade ticket` \
            --ignore-vuln GHSA-7qhf-v65m-g5f3 `# mlflow 3.7.0 has no upstream fix as of 2026-04` \
            --ignore-vuln GHSA-46r5-x6jq-v8g6 `# mlflow 3.7.0 has no upstream fix as of 2026-04` \
            --ignore-vuln GHSA-fh64-r2vc-xvhr `# mlflow 3.7.0 fix in 3.11.1 — bundle with mlflow upgrade ticket` \
            --ignore-vuln GHSA-95ww-475f-pr4f `# ragas 0.4.1 has no upstream fix as of 2026-04` \
            --ignore-vuln GHSA-69w3-r845-3855 `# transformers 4.57.3 fix only in 5.0.0rc3 (refuse rc); revisit when 5.0 GA lands` \
            --ignore-vuln GHSA-8mp2-v27r-99xp `# mistune 3.1.4 (CVE-2026-33079; LINK_TITLE_RE ReDoS); transitive dep, no upstream fix as of 2026-05` \
            --ignore-vuln GHSA-pjwx-r37v-7724 `# langchain-core 1.2.31 -> 1.3.3 (CVE-2026-44843; broad-allowlist deserialization in deprecated streaming/memory APIs we don't use); couple to LangChain ecosystem upgrade per langsmith/langchain-openai pattern. grep src/ for RunnableWithMessageHistory|astream_log|astream_events confirmed 0 usages 2026-05-08.` \
            --ignore-vuln GHSA-8g87-j6q8-g93x `# mistune 3.1.4 (CVE-2026-44708; math-plugin XSS via unescaped dollar-sign math markup); transitive dep via mlflow notebook tooling, no upstream fix as of 2026-05. We don't render user-supplied markdown with the math plugin enabled.` \
            --ignore-vuln GHSA-58cw-g322-p94v `# mistune 3.1.4 (CVE-2026-44896; render_figure() concatenates figclass/figwidth into HTML without escaping); transitive dep, no upstream fix as of 2026-05. We don't render user-supplied markdown directives.` \
            --ignore-vuln GHSA-v87v-83h2-53w7 `# mistune 3.1.4 (CVE-2026-44897; HTMLRenderer.heading() concatenates id attribute into HTML without escaping); transitive dep via mlflow notebook tooling, fix in 3.2.1 — bundle with mlflow upgrade ticket. We don't render user-supplied markdown headings.` \
            || true  # Don't fail CI, just report

      - name: Check for known vulnerabilities
        run: |
          if [ -f pip-audit-results.json ]; then
            VULN_COUNT=$(python -c "
          import json
          data = json.load(open('pip-audit-results.json'))
          vulns = [d for d in data.get('dependencies', []) if d.get('vulns')]
          print(len(vulns))
          " 2>/dev/null || echo "0")
            if [ "$VULN_COUNT" -gt 0 ]; then
              echo "::error::pip-audit found $VULN_COUNT packages with known vulnerabilities"
              exit 1
            fi
          fi

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 30

      - name: Display vulnerability summary
        if: always()
        run: |
          echo "## Dependency Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          if [ -f pip-audit-results.json ]; then
            VULN_COUNT=$(cat pip-audit-results.json | python -c "import sys, json; d=json.load(sys.stdin); print(len(d.get('dependencies', [])))" 2>/dev/null || echo "0")
            echo "Found $VULN_COUNT packages with potential vulnerabilities" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat pip-audit-results.json | python -m json.tool | head -50 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # Frontend Dependency Scanning
  # =============================================================================
  frontend-audit:
    name: Frontend Security Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        run: |
          npm audit --audit-level=high --json > npm-audit-results.json || true

      - name: Upload npm audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-results
          path: frontend/npm-audit-results.json
          retention-days: 30

      - name: Display npm audit summary
        if: always()
        working-directory: frontend
        run: |
          echo "## NPM Audit Results" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=moderate || true >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Container Scanning - Scan Docker images for vulnerabilities
  # =============================================================================
  container-scan:
    name: Container Scanning (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        # The full image (Python 3.12 base + ML stack: torch, transformers,
        # scikit-learn, statsmodels, dowhy, econml, etc.) plus the build
        # context exhausts the runner's default ~14 GB free. Without this
        # cleanup the build crashes with `No space left on device` mid-way,
        # which the runner host surfaces as an unhandled IOException.
        # `jlumbroso/free-disk-space` reclaims ~30 GB by pruning preinstalled
        # caches we don't need (Android SDK, .NET, Haskell, large Docker
        # images, swap).
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false  # keep Python toolcache used by other jobs
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        id: docker-build
        continue-on-error: true
        run: |
          docker build \
            -t e2i-api:scan \
            -f docker/Dockerfile \
            .

      - name: Run Trivy vulnerability scanner
        if: steps.docker-build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'e2i-api:scan'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          # /app/.venv is a virtualenv baked into the production image (~1k+
          # .pyc files in site-packages/). Trivy's library analyzer chokes on
          # pyc walking — the semaphore acquire times out at 5min, the run
          # dies with `context deadline exceeded`. Python deps are already
          # covered by pip-audit (separate job in this workflow), so Trivy
          # skipping the venv loses no coverage. The OS-package scan and any
          # libraries installed outside /app/.venv still get scanned.
          skip-dirs: '/app/.venv'
          timeout: '15m'

      - name: Upload Trivy artifacts
        uses: actions/upload-artifact@v4
        if: steps.docker-build.outcome == 'success'
        with:
          name: trivy-results
          path: trivy-results.json
          retention-days: 30

      - name: Display Trivy summary
        if: always()
        run: |
          echo "## Container Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-results.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat trivy-results.json | python -m json.tool | head -100 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Docker build failed or was skipped - no container scan results available." >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # Dockerfile Security - Lint Dockerfiles for best practices
  # =============================================================================
  dockerfile-lint:
    name: Dockerfile Security (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint on all Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: warning
          format: json
          output-file: hadolint-results.json

      - name: Upload Hadolint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hadolint-results
          path: hadolint-results.json
          retention-days: 30

      - name: Lint all Dockerfiles
        run: |
          echo "## Dockerfile Lint Results" >> $GITHUB_STEP_SUMMARY
          for dockerfile in docker/*/Dockerfile docker/Dockerfile*; do
            if [ -f "$dockerfile" ]; then
              echo "### $dockerfile" >> $GITHUB_STEP_SUMMARY
              docker run --rm -i hadolint/hadolint < "$dockerfile" >> $GITHUB_STEP_SUMMARY 2>&1 || true
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

  # =============================================================================
  # Security Summary - Aggregate results
  # =============================================================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - sast-python
      - sast-semgrep
      - dependency-scan
      - frontend-audit
      - container-scan
      - dockerfile-lint
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-reports

      - name: Generate security summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Scan | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python SAST (Bandit) | ${{ needs.sast-python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Multi-language SAST (Semgrep) | ${{ needs.sast-semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan (pip-audit) | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Audit (npm) | ${{ needs.frontend-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan (Trivy) | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile Lint (Hadolint) | ${{ needs.dockerfile-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security reports are available as artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Upload combined security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-combined
          path: security-reports/
          retention-days: 90
