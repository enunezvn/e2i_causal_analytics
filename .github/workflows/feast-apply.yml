name: Feast Apply & Idempotency

# Block 3B-M-3 / -M-7: extracted from backend-tests.yml so that changes
# under feature_repo/** trigger ONLY this workflow rather than the full
# Backend Tests run (which is heavy: lint + type-check + 3 test jobs).
# When src/ or tests/ change but feature_repo/ does not, this workflow
# does not run; backend-tests.yml runs without spending cycles on
# feast-apply.
#
# CI job name renamed from "Feast Registry Apply" to "Feast Apply &
# Idempotency" to better reflect that this gate covers BOTH the apply
# and the structural-idempotency probe.

on:
  push:
    branches: [main, develop]
    paths:
      - 'feature_repo/**'
      - 'database/**'
      - 'docker/Dockerfile.feast'
      - '.github/workflows/feast-apply.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'feature_repo/**'
      - 'database/**'
      - 'docker/Dockerfile.feast'
      - '.github/workflows/feast-apply.yml'
  workflow_dispatch:
  workflow_call:

env:
  PYTHON_VERSION: '3.12'

jobs:
  feast-apply:
    name: Feast Apply & Idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Guard - Feast source-query columns exist in canonical DDL
        # Hermetic (no feast, no DB): AST-parses feature_repo/data_sources.py and
        # text-parses the committed schema DDL under database/, asserting every
        # source-query column exists. This catches the #556 drift class on any
        # feature_repo/** or database/** change (backend-tests.yml intentionally
        # does NOT trigger on those paths). The live EXPLAIN + FEAST_INTEGRATION
        # parity test remain the environment-specific backstops.
        run: |
          pip install --upgrade pip
          pip install pytest
          # Run the hermetic guard in ISOLATION from the repo's pytest config:
          #   --noconftest    -> skip tests/conftest.py (it imports pytest_asyncio,
          #                      not installed in this lean job)
          #   -o addopts=""   -> drop pyproject's forced "-n 4 --dist=loadscope"
          #                      (pytest-xdist not installed here)
          # The guard is pure-stdlib + pytest; it needs neither plugin.
          pytest tests/unit/test_feature_repo/test_data_sources_columns_exist.py \
            --noconftest -o addopts="" -p no:cacheprovider

      - name: Verify CI Feast version matches production container
        # Production runs `feastdev/feature-server:0.43.0` (see
        # `docker/Dockerfile.feast`). If CI installs a different Feast version,
        # we risk: (a) green-lighting a definition that breaks 0.43 startup, or
        # (b) failing on a deprecation that 0.43 still accepts. Fail loudly
        # before installing anything if the Dockerfile pin drifts.
        run: |
          set -euo pipefail
          DOCKERFILE_VERSION=$(grep -oP 'feastdev/feature-server:\K[0-9.]+' docker/Dockerfile.feast)
          if [ "$DOCKERFILE_VERSION" != "0.43.0" ]; then
            echo "ERROR: docker/Dockerfile.feast pins $DOCKERFILE_VERSION but CI expects 0.43.0"
            echo "Update both this workflow's pip install pin and the version assertion to match."
            exit 1
          fi
          echo "Production Feast version $DOCKERFILE_VERSION matches CI pin 0.43.0."

      - name: Install Feast (with PostgreSQL offline + Redis online stores)
        # Install just the Feast SDK + the postgres offline store (used by
        # `feature_repo/data_sources.py`) + the redis online store (referenced
        # by feature_store.yaml.tmpl). Redis is required at config-load time
        # — Feast imports RedisOnlineStoreConfig even with
        # --skip-source-validation, so omitting the extras crashes apply.
        # Version pinned to the production container
        # (`feastdev/feature-server:0.43.0`) so CI tests the exact runtime;
        # drift would let CI green-light definitions that break the
        # production server (or vice versa). We deliberately do NOT pull the
        # full project requirements.txt — Feast runs in its own container in
        # production and dragging in the rest of the stack inflates CI by a
        # few minutes per run.
        run: |
          pip install --upgrade pip
          pip install 'feast[postgres,redis]==0.43.0'

      - name: Render feature_store.yaml from template
        # feature_store.yaml is gitignored (it embeds passwords). On the droplet
        # docker/feast/entrypoint.sh renders it at container start; CI must do
        # the same before `feast apply`. --skip-source-validation below means we
        # never connect to Postgres/Redis, so placeholder values are sufficient.
        env:
          SUPABASE_POSTGRES_PASSWORD: ci-placeholder
          REDIS_PASSWORD: ci-placeholder
        run: |
          python3 - <<'PY'
          import os
          src = 'feature_repo/feature_store.yaml.tmpl'
          dst = 'feature_repo/feature_store.yaml'
          content = open(src).read()
          for var in ('SUPABASE_POSTGRES_PASSWORD', 'REDIS_PASSWORD'):
              placeholder = '${' + var + '}'
              if placeholder in content:
                  content = content.replace(placeholder, os.environ[var])
          open(dst, 'w').write(content)
          print(f'rendered {dst}')
          PY

      - name: Apply feature definitions
        # --skip-source-validation lets us regenerate the registry without a
        # reachable Postgres/Redis backend. The Feast container does NOT
        # re-apply on startup (it just runs `feast serve`), so this CI step is
        # purely a "do the Python definitions parse and produce a valid
        # registry" gate; deployment scripts apply against the live registry
        # store separately.
        run: feast --chdir feature_repo apply --skip-source-validation

      - name: Verify registry is structurally idempotent
        # A second apply must produce the same entity + feature-view inventory
        # as the first. The registry file hash itself drifts every apply (it
        # embeds last_updated_timestamp), so we compare the structural
        # inventory instead. This catches non-deterministic feature defs and
        # accidental in-process state leaks.
        #
        # SCOPE LIMITATION: this gate compares entity + feature-view NAMES
        # only. It does NOT detect intra-FV changes (dtype flips, TTL drift,
        # source rename, schema-field add/remove). A schema-deep diff is
        # planned for Block 6B's Feast integration suite. Treat this as the
        # minimum-viable gate against non-deterministic apply behaviour.
        run: |
          set -euo pipefail
          cd feature_repo
          entities_before=$(feast entities list | awk 'NR>1 && NF {print $1}' | sort)
          fvs_before=$(feast feature-views list | awk 'NR>1 && NF {print $1}' | sort)
          feast apply --skip-source-validation
          entities_after=$(feast entities list | awk 'NR>1 && NF {print $1}' | sort)
          fvs_after=$(feast feature-views list | awk 'NR>1 && NF {print $1}' | sort)
          if [ "$entities_before" != "$entities_after" ]; then
            echo "ENTITY DRIFT between consecutive feast apply runs:"
            diff <(printf '%s\n' "$entities_before") <(printf '%s\n' "$entities_after") || true
            exit 1
          fi
          if [ "$fvs_before" != "$fvs_after" ]; then
            echo "FEATURE-VIEW DRIFT between consecutive feast apply runs:"
            diff <(printf '%s\n' "$fvs_before") <(printf '%s\n' "$fvs_after") || true
            exit 1
          fi
          echo "Feast registry is structurally idempotent."
