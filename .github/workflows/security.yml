            --ignore-vuln GHSA-29vq-49wr-vm6x `# werkzeug 3.1.5 (CVE-2026-27199; safe_join allows Windows device names); fix in 3.1.6. Mitigated — production runs on Linux only.` \
            --ignore-vuln GHSA-8rrh-rw8j-w5fx `# wheel 0.45.1 (CVE-2026-24049; path traversal in wheel install); fix in 0.46.2. Mitigated — wheel is a build-time transitive, not used at runtime.` \
            `# === 2026-05-20 PYSEC supplement (24 entries on 7 packages — same CVE-drop batch, captured after pip-audit re-pulled the PYSEC database). transformers + torch entries are all deserialization/RCE vulns in model-loading paths; we don't load untrusted .pkl / .pt files (HCP/patient data is structured DB rows, not pickle blobs). flask-cors / langchain-community / joblib / pyjwt PYSEC issues have NO upstream fix; pyarrow has fix in 23.0.1. ===` \
