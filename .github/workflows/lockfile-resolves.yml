name: Lockfile Resolves

# Dedicated workflow to verify pip's strict resolver can satisfy
# requirements-dev.txt end-to-end. Closes the gap that allowed PR #305
# (multiprocess) and PR #308 (feast/protobuf — and the latent
# numpy/pyarrow/tenacity conflicts PR #308 did NOT clear) to merge
# without the actual install being verified: the Tier 1-5 harness's
# ``paths:`` filter excludes requirements-dev.txt, and backend-tests.yml
# only included requirements.txt.
#
# Triggered when any requirements file or pyproject.toml changes. The
# resolver test executes ``pip install --dry-run`` in a fresh tempdir
# venv and asserts exit-0. Cold metadata fetch is ~60-180s.
#
# Also runs the #534 hash-pinned ``requirements.lock`` static guards
# (tests/test_requirements_lock.py): fast, network-free checks that every
# lock entry is hashed, mlflow stays pinned within its CVE range, no pin
# drifts from requirements.txt, and the Dockerfile installs from the lock
# under --require-hashes. The slow per-artifact hash verification downloads
# the full CUDA closure and is left to the deploy-time image build.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'requirements.txt'
      - 'requirements.lock'
      - 'requirements-dev.txt'
      - 'requirements-ragas.txt'
      - 'requirements-synthetic.txt'
      # The BentoML serving image installs this file directly (docker/bentoml/
      # Dockerfile); its dowhy floor is guarded by test_requirements_lock.py.
      - 'docker/bentoml/requirements-bentoml.txt'
      - 'pyproject.toml'
      # The two ./patches/ packages install --no-deps, so a dep added to a patch
      # without regenerating the lock must re-run the patch-dependency guard.
      - 'patches/**'
      - 'tests/test_lockfile_resolves.py'
      - 'tests/test_requirements_lock.py'
      - '.github/workflows/lockfile-resolves.yml'
  push:
    branches: [main, develop]
    paths:
      - 'requirements.txt'
      - 'requirements.lock'
      - 'requirements-dev.txt'
      - 'requirements-ragas.txt'
      - 'requirements-synthetic.txt'
      # The BentoML serving image installs this file directly (docker/bentoml/
      # Dockerfile); its dowhy floor is guarded by test_requirements_lock.py.
      - 'docker/bentoml/requirements-bentoml.txt'
      - 'pyproject.toml'
      # The two ./patches/ packages install --no-deps, so a dep added to a patch
      # without regenerating the lock must re-run the patch-dependency guard.
      - 'patches/**'
      - 'tests/test_lockfile_resolves.py'
      - 'tests/test_requirements_lock.py'
      - '.github/workflows/lockfile-resolves.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lockfile-resolves-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolves:
    name: requirements-dev.txt resolves under pip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest + pytest-timeout
        # ``--isolated --no-cache-dir`` on the bootstrap mirrors the
        # hermeticity the inner resolver subprocess already enforces
        # (see ``tests/test_lockfile_resolves.py`` for the inner venv +
        # ``--isolated`` design). Prevents user-level pip config or
        # poisoned wheel caches from leaking into the workflow runner.
        run: |
          python -m pip install --isolated --no-cache-dir --upgrade pip
          python -m pip install --isolated --no-cache-dir pytest==9.0.2 pytest-timeout packaging

      - name: Run requirements.lock static guards (#534)
        # Fast, network-free forcing functions for the hash-pinned
        # requirements.lock: every entry hashed + no bare-path/editable/URL
        # lines (the --require-hashes precondition), mlflow pinned to a single
        # concrete version WITHIN its CVE-anchored range, no version drift from
        # requirements.txt's exact pins, the local patch packages excluded, and
        # the Dockerfile/.dockerignore wired to the lock. ``-m "not slow"``
        # deselects the companion --require-hashes install test, which downloads
        # the full CUDA closure (torch + nvidia-cu12, multi-GB) — that
        # per-artifact hash VERIFICATION is exercised faithfully at image-build
        # time by the Dockerfile's `pip install --require-hashes -r
        # requirements.lock` on every deploy (the faithful target environment).
        # Same --noconftest rationale as the resolver step below.
        run: |
          pytest tests/test_requirements_lock.py \
            -v \
            --noconftest \
            -m "not slow" \
            --override-ini="addopts=" \
            --no-header

      - name: Run resolver test
        # ``--noconftest`` skips loading tests/conftest.py — the resolver
        # test is a pure subprocess wrapper that needs no fixtures and
        # no async support, and conftest pulls in pytest-asyncio which
        # isn't installed in this lightweight workflow.
        run: |
          pytest tests/test_lockfile_resolves.py \
            -v \
            --noconftest \
            -m "slow and integration" \
            --override-ini="addopts=" \
            --no-header

      - name: Faithful --require-hashes install (manual dispatch only)
        # The full per-artifact hash VERIFICATION downloads the entire locked
        # CUDA closure (torch + nvidia-cu12, multi-GB), so it is too heavy and
        # flake-prone for every PR. It is reachable here as a pre-merge faithful
        # gate a maintainer can invoke on demand (e.g. after regenerating the
        # lock), and it runs AUTOMATICALLY at every deploy via the Dockerfile's
        # `pip install --require-hashes -r requirements.lock` build step (the
        # faithful target environment). Set `workflow_dispatch` to run it.
        if: github.event_name == 'workflow_dispatch'
        run: |
          pytest tests/test_requirements_lock.py \
            -v \
            --noconftest \
            -m "slow and integration" \
            --override-ini="addopts=" \
            --no-header
