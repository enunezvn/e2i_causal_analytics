name: Backend Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'feature_repo/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'feature_repo/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:
  workflow_call:

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff==0.14.10

      - name: Run Ruff linter
        run: ruff check src/ tests/

      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/

  feast-apply:
    name: Feast Registry Apply
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Feast (with PostgreSQL offline store)
        # Install just the Feast SDK + the postgres contrib offline store used
        # by `feature_repo/data_sources.py`. We deliberately do NOT pull the
        # full project requirements.txt — Feast runs in its own container in
        # production and dragging in the rest of the stack inflates CI by a
        # few minutes per run.
        run: |
          pip install --upgrade pip
          pip install 'feast[postgres]==0.58.0'

      - name: Apply feature definitions
        # --skip-source-validation lets us regenerate the registry without a
        # reachable Postgres/Redis backend. The Feast container re-applies on
        # startup, so this CI step is purely a "do the Python definitions
        # parse and produce a valid registry" gate.
        run: feast --chdir feature_repo apply --skip-source-validation

      - name: Verify registry is structurally idempotent
        # A second apply must produce the same entity + feature-view inventory
        # as the first. The registry file hash itself drifts every apply (it
        # embeds last_updated_timestamp), so we compare the structural
        # inventory instead. This catches non-deterministic feature defs and
        # accidental in-process state leaks.
        run: |
          set -euo pipefail
          cd feature_repo
          entities_before=$(feast entities list | awk 'NR>1 && NF {print $1}' | sort)
          fvs_before=$(feast feature-views list | awk 'NR>1 && NF {print $1}' | sort)
          feast apply --skip-source-validation
          entities_after=$(feast entities list | awk 'NR>1 && NF {print $1}' | sort)
          fvs_after=$(feast feature-views list | awk 'NR>1 && NF {print $1}' | sort)
          if [ "$entities_before" != "$entities_after" ]; then
            echo "ENTITY DRIFT between consecutive feast apply runs:"
            diff <(printf '%s\n' "$entities_before") <(printf '%s\n' "$entities_after") || true
            exit 1
          fi
          if [ "$fvs_before" != "$fvs_after" ]; then
            echo "FEATURE-VIEW DRIFT between consecutive feast apply runs:"
            diff <(printf '%s\n' "$fvs_before") <(printf '%s\n' "$fvs_after") || true
            exit 1
          fi
          echo "Feast registry is structurally idempotent."

  type-check:
    name: Type Check (MyPy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy==1.15.0

      - name: Run MyPy
        run: mypy src/ --ignore-missing-imports --no-error-summary || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    env:
      E2I_TESTING_MODE: 'true'
      SUPABASE_URL: 'http://localhost:54321'
      SUPABASE_KEY: 'test-key'
      REDIS_URL: 'redis://localhost:6379'
      FALKORDB_URL: 'redis://localhost:6380'
      MLFLOW_TRACKING_URI: 'http://localhost:5000'
      OPIK_URL: 'http://localhost:5173'
      ANTHROPIC_API_KEY: 'test-key'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist pytest-timeout pytest-asyncio

      - name: Run unit tests with coverage
        run: |
          pytest \
            tests/unit/test_api/ \
            tests/unit/test_utils/ \
            tests/unit/test_repositories/ \
            tests/unit/test_workers/ \
            tests/unit/test_kpi/ \
            tests/unit/test_services/ \
            tests/unit/test_nlp/ \
            tests/unit/test_memory/ \
            tests/unit/test_database/ \
            tests/unit/test_scripts/ \
            tests/unit/api/ \
            tests/unit/security/ \
            tests/unit/observability/ \
            --ignore=tests/unit/test_api/test_chatbot_tools.py \
            --ignore=tests/unit/test_api/test_episodic_memory_bridge.py \
            --ignore=tests/unit/test_api/test_cors_configuration.py \
            --ignore=tests/unit/test_api/test_dependencies/test_auth.py \
            --ignore=tests/unit/test_api/test_routes/test_chatbot_graph.py \
            --ignore=tests/unit/test_api/test_routes/test_chatbot_tools.py \
            --ignore=tests/unit/test_api/test_routes/test_copilotkit.py \
            --ignore=tests/unit/test_api/test_routes/test_explain.py \
            --ignore=tests/unit/test_api/test_routes/test_feedback.py \
            --ignore=tests/unit/test_api/test_routes/test_resource_optimizer.py \
            --ignore=tests/unit/test_repositories/test_query_logger.py \
            --ignore=tests/unit/api/dependencies/test_auth_roles.py \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --cov-fail-under=70 \
            -n 2 \
            --dist=loadscope \
            --timeout=30 \
            -v --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 14

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2I_TESTING_MODE: 'true'
      SUPABASE_URL: 'http://localhost:54321'
      SUPABASE_KEY: 'test-key'
      SUPABASE_ANON_KEY: 'test-key'
      REDIS_URL: 'redis://localhost:6379'
      FALKORDB_URL: 'redis://localhost:6380'
      MLFLOW_TRACKING_URI: 'http://localhost:5000'
      OPIK_URL: 'http://localhost:5173'
      ANTHROPIC_API_KEY: 'test-key'
      OPENAI_API_KEY: 'test-key'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist pytest-timeout pytest-asyncio

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            --ignore=tests/integration/test_chatbot_dspy.py \
            --ignore=tests/integration/test_chatbot_graph.py \
            --ignore=tests/integration/test_cognitive_rag_orchestrator_routing.py \
            --ignore=tests/integration/test_rag_orchestrator_integration.py \
            --ignore=tests/integration/test_signal_flow/test_recipient_prompts.py \
            --ignore=tests/integration/test_signal_flow/test_sender_signals.py \
            --ignore=tests/integration/test_signal_flow/test_e2e_signal_flow.py \
            --ignore=tests/integration/test_observability_integration.py \
            --ignore=tests/integration/test_prediction_flow.py \
            --ignore=tests/integration/test_tier0_e2e.py \
            --ignore=tests/integration/test_migration/ \
            --ignore=tests/integration/test_digital_twin_workflow.py \
            --ignore=tests/integration/test_feedback_loop_integration.py \
            --ignore=tests/integration/test_agents/test_data_preparer/ \
            --ignore=tests/integration/api/test_rbac_endpoints.py \
            -n 2 \
            --dist=loadscope \
            --timeout=60 \
            -v --tb=short

  ci-success:
    name: Backend CI Success
    runs-on: ubuntu-latest
    needs: [lint, feast-apply, type-check, unit-tests, integration-tests]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint failed"
            exit 1
          fi
          if [[ "${{ needs.feast-apply.result }}" != "success" ]]; then
            echo "Feast apply failed"
            exit 1
          fi
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          echo "All backend CI jobs passed!"
