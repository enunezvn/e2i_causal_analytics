name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggers

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # =============================================================================
  # Secrets Scanning - Detect hardcoded secrets and credentials
  # =============================================================================
  secrets-scan:
    name: Secrets Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional for full features

      - name: Upload Gitleaks results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: results.sarif
          retention-days: 30

  # =============================================================================
  # SAST - Static Application Security Testing for Python
  # =============================================================================
  sast-python:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit security scan
        run: |
          bandit -r src/ \
            -f json \
            -o bandit-results.json \
            --severity-level medium \
            --confidence-level medium \
            -x '**/test_*.py,**/*_test.py,**/tests/**' \
            || true  # Don't fail CI, just report

      - name: Check for HIGH/CRITICAL findings
        run: |
          if [ -f bandit-results.json ]; then
            HIGH_COUNT=$(python -c "
          import json, sys
          data = json.load(open('bandit-results.json'))
          results = data.get('results', [])
          high_crit = [r for r in results if r.get('issue_severity') in ('HIGH', 'CRITICAL')]
          print(len(high_crit))
          " 2>/dev/null || echo "0")
            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "::error::Bandit found $HIGH_COUNT HIGH/CRITICAL severity findings"
              exit 1
            fi
          fi

      - name: Upload Bandit JSON results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-results
          path: bandit-results.json
          retention-days: 30

      - name: Display Bandit summary
        if: always()
        run: |
          echo "## Bandit Security Scan Results" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit-results.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat bandit-results.json | python -m json.tool | head -100 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # SAST - Semgrep for comprehensive pattern matching
  # =============================================================================
  sast-semgrep:
    name: Multi-language SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        # --config auto dropped: non-deterministic across runs.
        # --severity ERROR scopes the gate to high-confidence findings;
        # WARNING-level rules remain visible in artifacts for triage.
        # Local-dev noise reduction lives in .semgrepignore + .semgrep.yml.
        run: |
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --severity ERROR \
            --json \
            --json-output=semgrep-results.json \
            --exclude='**/test_*.py' \
            --exclude='**/*_test.py' \
            --exclude='**/tests/**' \
            --exclude='**/.venv/**' \
            --exclude='**/node_modules/**' \
            --exclude='**/.worktrees/**' \
            || true

      - name: Check for ERROR/WARNING findings
        run: |
          if [ -f semgrep-results.json ]; then
            FINDING_COUNT=$(python3 -c "
          import json
          data = json.load(open('semgrep-results.json'))
          results = data.get('results', [])
          severe = [r for r in results if r.get('extra', {}).get('severity') in ('ERROR', 'WARNING')]
          print(len(severe))
          " 2>/dev/null || echo "0")
            if [ "$FINDING_COUNT" -gt 0 ]; then
              echo "::error::Semgrep found $FINDING_COUNT ERROR/WARNING findings"
              exit 1
            fi
          fi

      - name: Upload Semgrep artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30

  # =============================================================================
  # Dependency Scanning - Check for vulnerable Python packages
  # =============================================================================
  dependency-scan:
    name: Dependency Scanning (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        # --ignore-vuln carve-outs documented inline below. Each entry
        # captures the package, the upstream-fix version (or "no fix"),
        # and the reason we're holding off. Re-evaluate at every quarterly
        # dep upgrade pass — see TODO note in CHANGELOG / DEPENDENCY_AUDIT.md.
        run: |
          pip-audit \
            --requirement requirements.txt \
            --format json \
            --output pip-audit-results.json \
            --desc on \
            --ignore-vuln GHSA-3936-cmfr-pm3m `# black 25.12.0 -> 26.3.1 major bump; coordinate with ruff/format CI baseline` \
            --ignore-vuln GHSA-w8v5-vhqr-4h9v `# diskcache 5.6.3 has no upstream fix as of 2026-04` \
            --ignore-vuln GHSA-gg5m-55jj-8m5g `# graphiti-core 0.24.3 -> 0.28.2 multi-minor; depends on memory backend test pass` \
            `# === mlflow >=3.11.0,<3.12.0 (post-#442 upgrade; supersedes #362): 3 prior 3.10.1 GHSAs resolved by the 3.11.x bump (46r5/fh64/75cm) and dropped from this allowlist. The 1 entry below is the post-#442 residual: 1 advisory with no upstream fix as of 2026-05. v3.11.1 chosen as target image tag because the mlflow project never published v3.11.0 GA (only rc0/rc1, then jumped to 3.11.1). ===` \
            --ignore-vuln GHSA-7qhf-v65m-g5f3 `# mlflow 3.11.1 (CVE-2026-0545; /ajax-api/3.0/jobs/* unauth bypass when basic-auth+job execution enabled); first_patched_version=null per gh api /advisories/GHSA-7qhf-v65m-g5f3 on 2026-05-22 (still unfixed upstream). Mitigated — MLFLOW_SERVER_ENABLE_JOB_EXECUTION is unset in our deployment, so /jobs/* endpoints are not active.` \
            --ignore-vuln GHSA-95ww-475f-pr4f `# ragas 0.4.1 has no upstream fix as of 2026-04` \
            --ignore-vuln GHSA-69w3-r845-3855 `# transformers 4.57.3 fix only in 5.0.0rc3 (refuse rc); revisit when 5.0 GA lands` \
            --ignore-vuln GHSA-8mp2-v27r-99xp `# mistune 3.1.4 (CVE-2026-33079; LINK_TITLE_RE ReDoS); transitive dep, no upstream fix as of 2026-05` \
            --ignore-vuln GHSA-8g87-j6q8-g93x `# mistune 3.1.4 (CVE-2026-44708; math-plugin XSS via unescaped dollar-sign math markup); transitive dep via mlflow notebook tooling, no upstream fix as of 2026-05. We don't render user-supplied markdown with the math plugin enabled.` \
            --ignore-vuln GHSA-58cw-g322-p94v `# mistune 3.1.4 (CVE-2026-44896; render_figure() concatenates figclass/figwidth into HTML without escaping); transitive dep, no upstream fix as of 2026-05. We don't render user-supplied markdown directives.` \
            --ignore-vuln GHSA-v87v-83h2-53w7 `# mistune 3.1.4 (CVE-2026-44897; HTMLRenderer.heading() concatenates id attribute into HTML without escaping); transitive dep via mlflow notebook tooling, fix in mistune 3.2.1 — held pending separate mistune-upgrade pass (mlflow 3.11.x still does not bump mistune). We don't render user-supplied markdown headings.` \
            `# === 2026-05-20 CVE-drop batch (24 packages, 41 vulns; surfaced after fresh CVE-database refresh). All have stable upstream fixes available; this batch is a HOLD pending the quarterly dep-bump PR (see DEPENDENCY_AUDIT.md). Each entry below carries pkg-current-version + fix-version + mitigation note. ===` \
            --ignore-vuln GHSA-g48c-2wqr-h844 `# langgraph 1.0.5 (CVE-2026-28277; msgpack-encoded checkpoints reconstruct Python objects during deserialization); fix in 1.0.10. Mitigated by Supabase/Redis-only persistence — no untrusted checkpoint stores.` \
            --ignore-vuln GHSA-mhr3-j7m5-c7c9 `# langgraph-checkpoint 3.0.1 (CVE-2026-27794; RCE via cache backend); fix in 4.0.0 (major). Mitigated — no cache backends enabled in our LangGraph configs.` \
            --ignore-vuln GHSA-p998-jp59-783m `# aiohttp 3.13.3 (CVE-2026-34515; Windows-only NTLMv2 path disclosure); fix in 3.13.4. Mitigated — production runs on Linux only.` \
            --ignore-vuln GHSA-hcc4-c3v8-rx92 `# aiohttp 3.13.3 (CVE-2026-34513; unbounded DNS cache → DoS); fix in 3.13.4.` \
            --ignore-vuln GHSA-m5qp-6w8w-w647 `# aiohttp 3.13.3 (CVE-2026-34516; excessive multipart headers memory); fix in 3.13.4.` \
            --ignore-vuln GHSA-3wq7-rqq7-wx6j `# aiohttp 3.13.3 (CVE-2026-34517; multipart form field buffered before client_max_size check); fix in 3.13.4.` \
            --ignore-vuln GHSA-mwh4-6h8g-pg8w `# aiohttp 3.13.3 (CVE-2026-34519; Response reason parameter header injection); fix in 3.13.4. Mitigated — Response.reason is never user-controlled in our code.` \
            --ignore-vuln GHSA-966j-vmvw-g2g9 `# aiohttp 3.13.3 (CVE-2026-34518; redirect cross-origin Cookie retention); fix in 3.13.4. Mitigated — our outbound aiohttp clients do not follow redirects across origins.` \
            --ignore-vuln GHSA-63hf-3vf5-4wqf `# aiohttp 3.13.3 (CVE-2026-34520; C parser accepts null bytes in headers); fix in 3.13.4. Mitigated — we use the Python parser path; C-parser exposure limited to incoming-untrusted traffic which is gated by Nginx.` \
            --ignore-vuln GHSA-c427-h43c-vf67 `# aiohttp 3.13.3 (CVE-2026-34525; multiple Host headers); fix in 3.13.4. Mitigated — Nginx normalizes Host headers upstream.` \
            --ignore-vuln GHSA-w2fm-2cpv-w7v5 `# aiohttp 3.13.3 (CVE-2026-22815; header/trailer uncapped memory); fix in 3.13.4.` \
            --ignore-vuln GHSA-2vrm-gr82-f7m5 `# aiohttp 3.13.3 (CVE-2026-34514; content_type header injection); fix in 3.13.4. Mitigated — Content-Type values not user-controlled in our outbound calls.` \
            --ignore-vuln GHSA-6r62-w2q3-48hf `# bentoml 1.4.30 (CVE-2026-24123; bentofile.yaml path traversal); fix in 1.4.34. Mitigated — we don't accept user-supplied bentofile.yaml; ours is committed.` \
            --ignore-vuln GHSA-m6w7-qv66-g3mf `# bentoml 1.4.30 (CVE-2026-27905; safe_extract_tarfile symlink traversal); fix in 1.4.36. Mitigated — we don't extract user-supplied tar archives at runtime.` \
            --ignore-vuln GHSA-jfjg-vc52-wqvf `# bentoml 1.4.30 (CVE-2026-33744; system_packages command injection); fix in 1.4.37. Mitigated — system_packages is hardcoded in our Dockerfile templates.` \
            --ignore-vuln GHSA-fgv4-6jr3-jgfw `# bentoml 1.4.30 (CVE-2026-35043; Dockerfile system_packages command injection follow-up); fix in 1.4.38. Same mitigation as above.` \
            --ignore-vuln GHSA-v959-cwq9-7hr6 `# bentoml 1.4.30 (CVE-2026-35044; generate_containerfile template injection); fix in 1.4.38. Same mitigation — templates not user-supplied.` \
            --ignore-vuln GHSA-r6ph-v2qm-q3c2 `# cryptography 46.0.3 (CVE-2026-26007; EllipticCurvePublicNumbers.public_key crash); fix in 46.0.5. Mitigated — we don't accept untrusted EC keys.` \
            --ignore-vuln GHSA-m959-cc7f-wv43 `# cryptography 46.0.3 (CVE-2026-34073; DNS name constraints validation gap); fix in 46.0.6. Mitigated — we don't validate certs against name-constraints chains.` \
            --ignore-vuln GHSA-p423-j2cm-9vmq `# cryptography 46.0.3 (CVE-2026-39892; non-contiguous buffer in Hash.update); fix in 46.0.7. Mitigated — we don't pass non-contiguous buffers.` \
            --ignore-vuln GHSA-7gcm-g887-7qv7 `# protobuf 6.33.2 (CVE-2026-0994; ParseDict DoS via deep recursion); fix in 5.29.6/6.33.5. Mitigated — we don't ParseDict on untrusted JSON.` \
            --ignore-vuln GHSA-gc5v-m9x4-r6x2 `# requests 2.32.5 (CVE-2026-25645; extract_zipped_paths predictable temp filename); fix in 2.33.0. Mitigated — we don't use extract_zipped_paths.` \
            --ignore-vuln GHSA-68rp-wp8r-4726 `# flask 3.1.2 (CVE-2026-27205; missing Vary: Cookie on session access → cache poisoning); fix in 3.1.3. Mitigated — Nginx in front of Flask normalizes Vary headers.` \
            --ignore-vuln GHSA-5239-wwwm-4pmq `# pygments 2.19.2 (CVE-2026-4539; AdlLexer issue); fix in 2.20.0. Mitigated — we don't lex AdaLanguage source with pygments.` \
            --ignore-vuln GHSA-2g6r-c272-w58r `# langchain-core 1.2.5 (CVE-2026-26013; ChatOpenAI SSRF in image token counting); fix in 1.2.11. Mitigated — we don't pass user-supplied image URLs to ChatOpenAI.` \
            --ignore-vuln GHSA-926x-3r5x-gfhw `# langchain-core 1.2.5 (CVE-2026-40087; f-string prompt-template validation incomplete); fix in 1.2.28. Mitigated — our prompt templates are committed source, not user input.` \
            --ignore-vuln GHSA-v34v-rq6j-cj6p `# langsmith 0.5.0 (CVE-2026-25528; distributed tracing SSRF); fix in 0.6.3. Mitigated — we don't accept external trace headers.` \
            --ignore-vuln GHSA-rr7j-v2q5-chgv `# langsmith 0.5.0 (output redaction streaming gap); fix in 0.7.31. Mitigated — we don't use hide_outputs on streaming calls today.` \
            --ignore-vuln GHSA-fv5p-p927-qmxr `# langchain-text-splitters 1.1.0 (HTMLHeaderTextSplitter.split_text_from_url SSRF via redirects); fix in 1.1.2. Mitigated — we don't call split_text_from_url on user-supplied URLs.` \
            --ignore-vuln GHSA-r7w7-9xr2-qq2r `# langchain-openai 1.1.6 (_url_to_size SSRF in image token counting); fix in 1.1.14. Mitigated — same as langchain-core path; image URLs not user-supplied.` \
            --ignore-vuln GHSA-gr75-jv2w-4656 `# langchain 1.3.0 / langchain-anthropic 1.3.1 (path traversal + sandbox escape in LangChain file-search middleware and loaders); fix in langchain 1.3.9 / langchain-anthropic 1.4.6. Surfaced in the CVE DB after the 2026-05-20 batch (first failed PRs #1000-#1002). Mitigated — we use NO file-search middleware or document loaders; the entire langchain surface in src/ is chat models + messages + the @tool decorator (verified: zero FileManagementToolkit / DirectoryLoader / file-search usage). Held for the quarterly dep-bump PR.` \
            --ignore-vuln GHSA-53mr-6c8q-9789 `# litellm 1.80.10 (CVE-2026-35029; /config/update missing admin authorization); fix in 1.83.0. Mitigated — we don't expose /config/update; LiteLLM proxy not deployed.` \
            --ignore-vuln GHSA-jjhc-v7c2-5hh6 `# litellm 1.80.10 (CVE-2026-35030; JWT OIDC userinfo cache collision); fix in 1.83.0. Mitigated — JWT auth not enabled.` \
            --ignore-vuln GHSA-69x8-hrgq-fjj8 `# litellm 1.80.10 (auth bypass chain via weak hashing); fix in 1.83.0. Mitigated — LiteLLM proxy not deployed; user-management endpoints not exposed.` \
            --ignore-vuln GHSA-xqmj-j6mv-4862 `# litellm 1.80.10 (/prompts/test SSTI); fix in 1.83.7. Mitigated — endpoint not exposed.` \
            --ignore-vuln GHSA-mf9w-mj56-hr94 `# python-dotenv 1.2.1 (CVE-2026-28684; set_key follows symlinks); fix in 1.2.2. Mitigated — we only call dotenv at startup with committed .env paths.` \
            --ignore-vuln GHSA-hx9q-6w63-j58v `# orjson 3.11.5 (CVE-2025-67221; deep-nesting DoS); fix in 3.11.6. Mitigated — orjson.dumps inputs are application-controlled, not user-controlled.` \
            --ignore-vuln GHSA-cfh3-3jmp-rvhc `# pillow 12.0.0 (CVE-2026-25990; PSD out-of-bounds write); fix in 12.1.1. Mitigated — we don't accept user-uploaded PSD images.` \
            --ignore-vuln GHSA-whj4-6x5x-4v2j `# pillow 12.0.0 (CVE-2026-40192; FITS gzip data unbounded); fix in 12.2.0. Mitigated — we don't decode FITS images.` \
            --ignore-vuln GHSA-jr27-m4p2-rc6r `# pyasn1 0.6.2 (CVE-2026-30922; uncontrolled recursion → DoS); fix in 0.6.3. Mitigated — pyasn1 inputs are certificate-shaped, gated by Nginx mTLS.` \
            --ignore-vuln GHSA-752w-5fwx-jx9f `# pyjwt 2.10.1 (CVE-2026-32597; crit header not validated); fix in 2.12.0. Mitigated — we don't accept JWTs with crit headers from external issuers.` \
            --ignore-vuln GHSA-6w46-j5rx-g56g `# pytest 9.0.2 (CVE-2025-71176; /tmp/pytest-of-{user} race on UNIX); fix in 9.0.3. Mitigated — CI runners are ephemeral single-user; dev laptops single-user too.` \
            --ignore-vuln GHSA-wp53-j4wj-2cfg `# python-multipart 0.0.21 (CVE-2026-24486; UPLOAD_DIR path traversal); fix in 0.0.22. Mitigated — we don't use UPLOAD_DIR; multipart form parsing is in-memory only.` \
            --ignore-vuln GHSA-mj87-hwqh-73pj `# python-multipart 0.0.21 (CVE-2026-40347; multipart form DoS); fix in 0.0.26. Same mitigation — in-memory parsing only.` \
