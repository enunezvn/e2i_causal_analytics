# RAGAS Fixture Regression — judge-drift sentinel on FROZEN input
#
# ⚠️  THIS JOB DOES NOT MEASURE PRODUCTION RAG QUALITY. It never invokes the
# RAG pipeline (#1485).
#
# scripts/run_ragas_eval.py calls RAGEvaluationPipeline.run_evaluation() with
# no `rag_pipeline` argument, so src/rag/evaluation.py:1499 skips
# _generate_answers. Every golden-set sample therefore keeps its HARDCODED
# `answer`, and its `retrieved_contexts` is byte-identical to its reference
# `contexts`. Consequently:
#
#   * context_precision / context_recall are 1.0-by-construction — "retrieved"
#     equals "reference" by definition, so they carry no retrieval signal;
#   * faithfulness / answer_relevancy score the FIXTURE AUTHOR'S PROSE, not the
#     generator — a generator regression cannot move them.
#
# What it IS good for: the input is frozen, so a change in these scores means
# the JUDGE STACK moved (model, prompt, ragas version, embeddings). That is a
# real and useful signal — it is just judge drift, not product quality. The
# #491/#496 threshold calibration is correct *for this fixture*.
#
# For actual production quality use the real-pipeline gate, which judges
# genuinely generated answers over genuinely retrieved contexts:
#
#   .venv/bin/python scripts/replay_golden_set.py --limit 12 \
#       --record-out /tmp/goldset_records.json
#   .venv/bin/python scripts/run_real_pipeline_ragas.py \
#       --records /tmp/goldset_records.json --fail-on-threshold
#
# That gate runs on demand from a host that can reach the pipeline (GitHub's
# ubuntu runners cannot), at n≈10-15 per #504's throughput constraint.
#
# Uses minimal requirements (requirements-ragas.txt) to avoid dependency conflicts.
#
# Required Secret: OPENAI_API_KEY must be configured in repository settings → Secrets and variables → Actions.

name: RAGAS Fixture Regression

# MANUAL-ONLY (issue #504). This gpt-4o RAGAS eval is bound by the CI OpenAI key's
# throughput: a full 30-sample run takes ~96 min, and raising concurrency to cut that
# trips ragas's per-job timeouts (faithfulness/context_precision collapse to 0.0)
# rather than going faster — the constraint is OpenAI throughput, not code (see #504
# for the investigation: batching + an async client was ~6x faster locally on a
# higher-tier key but timed out on the CI key). So it no longer runs automatically on
# every src/rag push/PR. Trigger it on demand from the Actions tab ("Run workflow")
# when you want a RAG-quality check. The golden set, calibrated thresholds, and judge
# config (#358/#491/#496) are unchanged. To restore automatic runs — e.g. on a
# higher-tier OpenAI key — re-add the push/pull_request triggers below.
on:
  workflow_dispatch:  # Manual trigger only

jobs:
  ragas-evaluation:
    name: Fixture Judge-Drift Sentinel
    runs-on: ubuntu-latest
    # Fail-fast guard (#504): real runtime is ~96 min on the CI OpenAI key tier;
    # 150 min is comfortably above that while preventing a hung run from burning
    # the 360-min GitHub Actions default. No concurrency block needed — this job
    # is manual-only (workflow_dispatch), so there are no automatic runs to
    # supersede and the timeout already caps the blast radius of any hung run.
    timeout-minutes: 150

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ragas-${{ hashFiles('requirements-ragas.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ragas-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Use minimal requirements to avoid dependency conflicts
          pip install -r requirements-ragas.txt
          # Install project in editable mode (without full deps)
          pip install -e . --no-deps

      - name: Run RAGAS fixture evaluation (frozen input — not production quality)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/run_ragas_eval.py \
            --no-mlflow \
            --fail-on-threshold \
            --output ragas-results/evaluation-report.json

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ragas-evaluation-results
          path: ragas-results/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## RAGAS Fixture Regression (judge-drift sentinel)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Scores a STATIC FIXTURE, not the RAG pipeline (#1485). Context" >> $GITHUB_STEP_SUMMARY
          echo "> precision/recall are 1.0-by-construction; faithfulness and" >> $GITHUB_STEP_SUMMARY
          echo "> answer relevancy score the fixture's own prose. A change here means" >> $GITHUB_STEP_SUMMARY
          echo "> the judge stack drifted. For production quality run" >> $GITHUB_STEP_SUMMARY
          echo "> \`scripts/run_real_pipeline_ragas.py\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ragas-results/evaluation-report.json ]; then
            echo "### Metrics" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Score | Threshold |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|-----------|" >> $GITHUB_STEP_SUMMARY
            python3 << 'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json
          with open('ragas-results/evaluation-report.json') as f:
              report = json.load(f)
          # faithfulness 0.70 (#491) + answer_relevancy 0.75 (#496): calibrated to gpt-4o judge noise floors on the golden set; mirror DEFAULT_THRESHOLDS
          thresholds = {'faithfulness': 0.70, 'answer_relevancy': 0.75, 'context_precision': 0.80, 'context_recall': 0.70}
          for metric, threshold in thresholds.items():
              score = report.get(f'avg_{metric}', 'N/A')
              if isinstance(score, float):
                  status = '✅' if score >= threshold else '❌'
                  print(f'| {metric.replace("_", " ").title()} | {score:.3f} {status} | {threshold} |')
              else:
                  print(f'| {metric.replace("_", " ").title()} | {score} | {threshold} |')
          print(f'| **Overall Score** | **{report.get("overall_score", "N/A"):.3f}** | 0.80 |')
          PYEOF
            echo "" >> $GITHUB_STEP_SUMMARY
            # Extract sample counts from JSON
            samples_info=$(python3 -c "import json; r=json.load(open('ragas-results/evaluation-report.json')); print(f\"{r.get('total_samples', 'N/A')} total, {r.get('passed_samples', 'N/A')} passed\")" 2>/dev/null || echo "N/A")
            echo "**Samples**: $samples_info" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Evaluation report not found" >> $GITHUB_STEP_SUMMARY
          fi

  # DORMANT BY DESIGN — not dead code. The workflow is dispatch-only (#504), so
  # `github.event_name` is never 'pull_request' and this job does not run today.
  # It exists for the restore path the header describes: re-adding the push /
  # pull_request triggers on a higher-tier OpenAI key brings it back. Its
  # thresholds are fixture-calibrated (#491/#496) and stay that way.
  ragas-regression:
    name: Fixture Regression Check (dormant — dispatch-only workflow)
    runs-on: ubuntu-latest
    needs: ragas-evaluation
    if: github.event_name == 'pull_request'

    steps:
      - name: Download evaluation results
        uses: actions/download-artifact@v4
        with:
          name: ragas-evaluation-results
          path: ragas-results/

      - name: Check fixture judge-drift regression
        run: |
          echo "Checking for fixture judge-drift regression..."
          if [ -f ragas-results/evaluation-report.json ]; then
            python3 << 'PYEOF'
          import json
          import sys

          with open('ragas-results/evaluation-report.json') as f:
              report = json.load(f)

          thresholds = {
              # faithfulness 0.70 (#491) + answer_relevancy 0.75 (#496):
              # calibrated to the gpt-4o judge noise floors on the golden set;
              # mirror DEFAULT_THRESHOLDS.
              'faithfulness': 0.70,
              'answer_relevancy': 0.75,
              'context_precision': 0.80,
              'context_recall': 0.70,
          }

          # Detect degenerate evaluation: every metric is exactly 0.0 across
          # the dataset. This happens when the RAGAS evaluator could not score
          # any sample (e.g. invalid OPENAI_API_KEY → 401, network failure,
          # missing model). Treat as "evaluation could not run" and warn
          # instead of false-positive regression failure.
          all_zero = all(
              report.get(f'avg_{m}') == 0.0 for m in thresholds
          )
          total = report.get('total_samples', 0)
          passed = report.get('passed_samples', 0)
          if all_zero and total > 0 and passed == 0:
              print('::warning::RAGAS evaluation produced degenerate result '
                    '(all metrics 0.0, 0/{0} samples passed). Likely missing or '
                    'invalid OPENAI_API_KEY in GitHub Actions secrets — skipping '
                    'regression check.'.format(total))
              sys.exit(0)

          # Fail closed on an unmeasured metric. The old `score is not None and
          # score < threshold` SKIPPED a missing metric and then reported
          # success, and the all-zero check above only catches the 0.0
          # fabrication mode — #1488 makes unjudged metrics None/missing
          # instead, which would dodge both. A metric we could not measure
          # makes its threshold unverifiable; that must block, never pass.
          failed = []
          for metric, threshold in thresholds.items():
              score = report.get(f'avg_{metric}')
              if score is None:
                  failed.append(f'{metric}: unmeasured — threshold unverifiable')
              elif score < threshold:
                  failed.append(f'{metric}: {score:.3f} < {threshold}')

          if failed:
              print('::error::Fixture judge-drift regression detected!')
              for f in failed:
                  print(f'  - {f}')
              sys.exit(1)
          else:
              print('::notice::All fixture judge-drift thresholds passed')
          PYEOF
          else
            echo "::warning::Evaluation report not found, skipping regression check"
          fi
