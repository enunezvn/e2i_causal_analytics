# Custom nginx config for opik-frontend container.
#
# Replaces the upstream image's bare default.conf which lacks the /api/ proxy
# block. Without this proxy, the Opik Python SDK (which hits
# http://<frontend>/api/v1/private/...) gets 404s from the static-only nginx.
# The Java backend serves at /v1/private/... directly, so we strip the /api/
# prefix before forwarding.
#
# Mounted at /etc/nginx/conf.d/default.conf via docker-compose.opik.yml.

upstream opik_backend {
    server opik-backend:8080;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Static UI
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # SDK traffic — strip the /api/ prefix and forward to the Java backend.
    # Covers /api/v1/private/* (traces, spans, projects, etc.).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://opik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 50m;
    }

    # Backend health endpoint (no /api/ prefix in the SDK).
    location /is-alive/ {
        proxy_pass http://opik_backend;
        proxy_set_header Host $host;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
