name: Backend Tests

on:
  push:
    branches: [main, develop]
    paths:
      # Note: `feature_repo/**` is intentionally excluded — Feast apply
      # has its own dedicated workflow (`feast-apply.yml`) so changes
      # under `feature_repo/` do not trigger the heavy backend test
      # matrix unnecessarily. (3B-M-3)
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:
  workflow_call:

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff==0.14.10

      - name: Run Ruff linter
        run: ruff check src/ tests/

      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/

  # NOTE: feast-apply moved to .github/workflows/feast-apply.yml so
  # changes under feature_repo/** do not trigger the full backend test
  # matrix. See "Feast Apply & Idempotency" workflow. (3B-M-3, 3B-M-7)

  type-check:
    name: Type Check (MyPy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # mypy version is pinned in requirements.txt (single source of truth).

      # Closes the P3 codex-flagged ratchet-bypass gap from PR #77 review:
      # the mypy ceiling absorbs 5 [import-untyped] yaml errors that would
      # silently return if `types-PyYAML` is dropped from requirements.txt
      # (54 + 5 = 59 < 60 → gate passes). This step makes the load-bearing
      # stub explicit so a removal trips CI before mypy even runs. Add new
      # stubs to the grep pattern when they're added to requirements.txt
      # for the same reason (i.e. to retire deterministic mypy slices).
      - name: Verify ceiling-load-bearing stub pins are present
        run: |
          set -e
          missing=0
          for stub in "types-PyYAML"; do
            if ! grep -qE "^${stub}==" requirements.txt; then
              echo "::error::${stub} was removed from requirements.txt."
              echo "::error::Stub is load-bearing for the mypy ceiling at $(grep -E '^MYPY_CEILING' .github/workflows/backend-tests.yml | head -1 | cut -d= -f2)."
              echo "::error::Removing it returns 5 [import-untyped] errors that the ceiling absorbs silently."
              echo "::error::Either (i) restore it, or (ii) follow the bump procedure in .claude/state/mypy_posture_decision_20260506.md Section 4."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then exit 1; fi
          echo "All ceiling-load-bearing stubs present."

      - name: Run MyPy (numeric ceiling = 61)
        run: |
          set -e
          # Wave 3 bumped from 60 to 61: langchain-core 1.4.0 / langgraph 1.2.0
          # type-stub change surfaces 1 new error (mypy locally confirms the
          # increment came from the bumped stubs, NOT from production-code drift
          # introduced by this PR).
          MYPY_CEILING=61
          # Use the same config file so per-module overrides apply identically.
          mypy --config-file pyproject.toml src/ > mypy_report.txt 2>&1 || true
          # Source the count from mypy's own summary line — robust against
          # path-format changes (e.g., absolute vs relative) that a prefix
          # grep would silently undercount, and against internal mypy crashes
          # that emit no summary at all.
          if grep -qE "^Found [0-9]+ errors" mypy_report.txt; then
            ERRORS=$(awk '/^Found [0-9]+ errors/{print $2; exit}' mypy_report.txt)
          elif grep -q "^Success: no issues found" mypy_report.txt; then
            ERRORS=0
          else
            echo "::error::mypy did not produce a recognized summary line — likely an internal crash. Tail of report:"
            tail -10 mypy_report.txt
            exit 1
          fi
          echo "MyPy reports $ERRORS errors (ceiling: $MYPY_CEILING)"
          grep -E "^Found|^Success" mypy_report.txt || true
          if [ "$ERRORS" -gt "$MYPY_CEILING" ]; then
            echo "::error::MyPy error count $ERRORS exceeds ceiling $MYPY_CEILING."
            echo "::error::Ceiling-bump procedure: see PR description and .claude/state/mypy_posture_decision_20260506.md."
            exit 1
          fi

      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report
          path: mypy_report.txt
          retention-days: 7

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    env:
      E2I_TESTING_MODE: 'true'
      SUPABASE_URL: 'http://localhost:54321'
      SUPABASE_KEY: 'test-key'
      REDIS_URL: 'redis://localhost:6379'
      # FALKORDB_URL intentionally unset — this lane has no FalkorDB service
      # container. Setting it would cause ``_check_redis_service`` to log a
      # noisy ECONNREFUSED on every CI run (issue #183). Tests that need
      # FalkorDB are gated on ``requires_falkordb`` and skip automatically.
      MLFLOW_TRACKING_URI: 'http://localhost:5000'
      OPIK_URL: 'http://localhost:5173'
      ANTHROPIC_API_KEY: 'test-key'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist pytest-timeout pytest-asyncio

      - name: Run unit tests with coverage
        run: |
          pytest \
            tests/unit/test_api/ \
            tests/unit/test_utils/ \
            tests/unit/test_repositories/ \
            tests/unit/test_workers/ \
            tests/unit/test_kpi/ \
            tests/unit/test_services/ \
            tests/unit/test_nlp/ \
            tests/unit/test_memory/ \
            tests/unit/test_database/ \
            tests/unit/test_scripts/ \
            tests/unit/test_benchmarks_meta/ \
            tests/unit/api/ \
            tests/unit/security/ \
            tests/unit/observability/ \
            tests/unit/test_data/ \
            tests/unit/test_etl/ \
            tests/unit/test_feature_repo/ \
            tests/unit/test_gunicorn/ \
            tests/unit/test_lifecycle/ \
            tests/unit/test_observability/ \
            tests/unit/test_optimization/ \
            tests/unit/test_serving/ \
            tests/unit/test_skills/ \
            tests/unit/test_synthetic/ \
            tests/unit/test_testing/ \
            tests/unit/test_tests_meta/ \
            tests/unit/test_tool_registry/ \
            tests/api/test_predictions_endpoints.py \
            tests/api/test_explain_endpoints.py \
            --ignore=tests/unit/test_api/test_chatbot_tools.py \
            --ignore=tests/unit/test_api/test_episodic_memory_bridge.py \
            --ignore=tests/unit/test_api/test_cors_configuration.py \
            --ignore=tests/unit/test_api/test_dependencies/test_auth.py \
            --ignore=tests/unit/test_api/test_routes/test_chatbot_graph.py \
            --ignore=tests/unit/test_api/test_routes/test_chatbot_tools.py \
            --ignore=tests/unit/test_api/test_routes/test_copilotkit.py \
            --ignore=tests/unit/test_api/test_routes/test_explain.py \
            --ignore=tests/unit/test_api/test_routes/test_feedback.py \
            --ignore=tests/unit/test_api/test_routes/test_resource_optimizer.py \
            --ignore=tests/unit/test_repositories/test_query_logger.py \
            --ignore=tests/unit/api/dependencies/test_auth_roles.py \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --cov-fail-under=20 \
            -n 2 \
            --dist=loadscope \
            --timeout=30 \
            -v --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 14

  heavy-unit-tests:
    name: Heavy Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    # Serviceless, like the unit lane, but split into its own job because these
    # dirs are slow (test_digital_twin ~8min, test_causal_engine ~5min serial):
    # bundling them into unit-tests would blow its 20-min cap. They pass with no
    # service containers (verified serviceless, #555). 60s per-test timeout for
    # the heavier ML/causal fits on slower CI runners.
    timeout-minutes: 20
    env:
      E2I_TESTING_MODE: 'true'
      SUPABASE_URL: 'http://localhost:54321'
      SUPABASE_KEY: 'test-key'
      REDIS_URL: 'redis://localhost:6379'
      # FALKORDB_URL intentionally unset (issue #183) — no FalkorDB service here.
      MLFLOW_TRACKING_URI: 'http://localhost:5000'
      OPIK_URL: 'http://localhost:5173'
      ANTHROPIC_API_KEY: 'test-key'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-xdist pytest-timeout pytest-asyncio

      - name: Run heavy unit tests
        run: |
          pytest \
            tests/unit/test_causal_engine/ \
            tests/unit/test_data_preparer/ \
            tests/unit/test_digital_twin/ \
            tests/unit/test_docker/ \
            tests/unit/test_docs/ \
            tests/unit/test_feature_store/ \
            tests/unit/test_governance/ \
            tests/unit/test_ml/ \
            tests/unit/test_mlops/ \
            tests/unit/test_ontology/ \
            tests/unit/test_rag/ \
            tests/unit/test_security/ \
            tests/unit/test_tasks/ \
            -n 2 \
            --dist=loadscope \
            --timeout=60 \
            -v --tb=short

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    # Sharded 4 ways via pytest-split so each shard runs ~a quarter of the
    # suite and stays well under the cap. Initially sharded N=2 by PR #476
    # (issue #473), but post-merge main showed 6:41 vs 14:00 imbalance
    # because pytest-split without a ``.test_durations`` file distributes by
    # test-id hash — fine for uniform suites, but integration tests have
    # heavy DB / MLflow / e2e callers that bunch onto one shard. Issue #480
    # bumps the matrix to N=4: finer hash-partitioning narrows the worst-case
    # to ~1/4 of total wall, getting the slowest shard under 10 min.
    # ``fail-fast: false`` so one shard's failure still lets the others
    # report. The 20-min cap is retained as a per-shard safety net. The
    # ``ci-success`` aggregate gates on the matrix result (all shards must
    # pass), so the required check is unaffected by the per-shard job-name
    # suffixes or the shard count itself.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2I_TESTING_MODE: 'true'
      SUPABASE_URL: 'http://localhost:54321'
      SUPABASE_KEY: 'test-key'
      SUPABASE_ANON_KEY: 'test-key'
      REDIS_URL: 'redis://localhost:6379'
      # FALKORDB_URL intentionally unset — integration-tests lane has no
      # FalkorDB service container (issue #183). The conftest now treats an
      # empty FALKORDB_URL as ``UNCONFIGURED`` instead of probing :6380 and
      # logging a noisy ECONNREFUSED.
      MLFLOW_TRACKING_URI: 'http://localhost:5000'
      OPIK_URL: 'http://localhost:5173'
      ANTHROPIC_API_KEY: 'test-key'
      OPENAI_API_KEY: 'test-key'
      # Pin BLAS/OpenMP thread counts to 1 so the synthetic baseline e2e
      # produces deterministic floating-point reductions matching the
      # local-dev measurement environment that pinned BASELINE in
      # tests/integration/test_synthetic_baseline_invariant.py. Without
      # these, multi-core BLAS reorders sums and shifts AUC/brier by ~0.08.
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      # Opt into the symmetric writer/reader skip policy for fixtures
      # that require real CSU / Optum cohort data — the GitHub Actions
      # runner has no access to those files. Without this, the producer
      # fixtures in test_csu_negative_control_20260510.py and
      # test_optum_held_out_noninferiority_20260510.py hard-fail (codex
      # pass-1 HIGH-1 default-hard-fail policy), AND the consumer
      # test_g1_lineage_audit_sweep.py::test_g1_lineage_audit_on_actual_relaxed_features
      # hard-fails because g1_artifact_registry is empty (codex pass-2
      # HIGH-4 default-hard-fail when no upstream fixture registered an
      # artifact). The env var opts CI into the documented skip path so
      # both writer and reader stay silent in the no-real-data environment.
      ALLOW_MISSING_REAL_DATA: '1'
      # Issue #221 strict-mode trip-switch: promote the asyncio-pollution
      # probe in tests/conftest.py from observational warning to a hard
      # ``pytest.exit(returncode=2)``. Sequenced after PR #222 (issue #220)
      # migrated all known bare ``asyncio.run`` callsites in tests/integration/
      # to the explicit-loop pattern, so a strict-mode trip on this lane now
      # means a NEW polluter has appeared. Restricted to the Integration
      # Tests lane — unit tests don't import RAGAS-touching code, so the
      # blast radius stays tight. Roll back by deleting this line.
      E2I_ASSERT_NO_ASYNCIO_POLLUTION: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist pytest-timeout pytest-asyncio pytest-split

      # Start a local MLflow tracking server so the synthetic baseline
      # invariant e2e (test_synthetic_baseline_invariant.py) can run with
      # MLflow enabled — preserving baseline equivalence with local-dev
      # measurements (docs/results/tier0_pipeline_run_20260428_130229.md).
      # Backed by SQLite + tmpfs artifact root; lifetime = job duration.
      - name: Start MLflow tracking server
        run: |
          mkdir -p /tmp/mlflow-artifacts
          mlflow server \
            --host 0.0.0.0 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root /tmp/mlflow-artifacts \
            > /tmp/mlflow-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ > /dev/null 2>&1; then
              echo "MLflow server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "MLflow server failed to start; tail of log:"
          tail -50 /tmp/mlflow-server.log
          exit 1

      # Integration test exclusions:
      # - chatbot/RAG/signal_flow/observability/prediction/digital_twin/feedback_loop:
      #     require live LLM/observability/RAG infra not available in CI.
      # - test_tier0_e2e + test_adaptive_criteria_e2e + test_model_trainer_evaluation_modes:
      #     long-running e2e suites (OOM / >60s timeout).
      # - test_migration/: requires Supabase/PostgREST.
      # - test_agents/test_data_preparer/: requires Supabase + feature store
      #     per commit 8f97a92e (2026-02-04). Re-evaluated 2026-05-05 during
      #     Shard A of the TypedDict→Pydantic migration; environmental reason
      #     still valid (no Supabase in GitHub Actions). DataPreparerState
      #     migration is verified instead via tests/unit/test_ml_foundation_schemas.py
      #     and tests/integration/test_agents/test_state_checkpoint_replay.py.
      # - api/test_rbac_endpoints.py: needs live API.
      # Deselect ``@pytest.mark.slow`` tests on the PR-blocking lane
      # (#481). The same tests are run off-PR via
      # ``.github/workflows/slow-tests.yml`` (Job A: ``pytest -m slow``)
      # so coverage is preserved. Drift between the two contract
      # points (this ``-m "not slow"`` flag, the slow-tests.yml
      # ``-m slow`` flag, and the ``slow`` marker registration in
      # ``pyproject.toml``) is guarded by
      # tests/integration/test_slow_marker_discipline.py.
      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            --ignore=tests/integration/test_chatbot_dspy.py \
            --ignore=tests/integration/test_chatbot_graph.py \
            --ignore=tests/integration/test_cognitive_rag_orchestrator_routing.py \
            --ignore=tests/integration/test_rag_orchestrator_integration.py \
            --ignore=tests/integration/test_signal_flow/test_recipient_prompts.py \
            --ignore=tests/integration/test_signal_flow/test_sender_signals.py \
            --ignore=tests/integration/test_signal_flow/test_e2e_signal_flow.py \
            --ignore=tests/integration/test_observability_integration.py \
            --ignore=tests/integration/test_prediction_flow.py \
            --ignore=tests/integration/test_tier0_e2e.py \
            --ignore=tests/integration/test_adaptive_criteria_e2e.py \
            --ignore=tests/integration/test_model_trainer_evaluation_modes.py \
            --ignore=tests/integration/test_migration/ \
            --ignore=tests/integration/test_digital_twin_workflow.py \
            --ignore=tests/integration/test_feedback_loop_integration.py \
            --ignore=tests/integration/test_agents/test_data_preparer/ \
            --ignore=tests/integration/api/test_rbac_endpoints.py \
            -m "not slow" \
            --splits 4 \
            --group ${{ matrix.shard }} \
            -n 2 \
            --dist=loadscope \
            --timeout=60 \
            -v --tb=short

  agents-tests:
    name: Agents Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    # tests/unit/test_agents/ (308 files) needs a service-provisioned lane
    # (#583 PR2). Unlike test_data_preparer (serviceless, #583 PR1), several
    # agent tests dynamically exercise UN-mocked mlflow.* calls — e.g.
    # causal_impact mlflow_tracker.start_analysis_run -> get_experiment_by_name
    # — that retry-backoff-hang against a dead tracking URI and, under
    # pyproject's timeout_method="thread", abort the WHOLE pytest session. A
    # real MLflow server (SQLite backend so the model registry that
    # model_deployer exercises is supported) plus a Redis service resolve it.
    # Heavy in-test ML training (xgboost/LightGBM + Optuna HPO, 5-fold CV,
    # 200x-permutation adversarial tests) runs ON-PR here under a generous
    # per-test timeout rather than being deferred to slow-tests.yml.
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2I_TESTING_MODE: 'true'
      SUPABASE_URL: 'http://localhost:54321'
      SUPABASE_KEY: 'test-key'
      SUPABASE_ANON_KEY: 'test-key'
      REDIS_URL: 'redis://localhost:6379'
      # FALKORDB_URL intentionally unset — no FalkorDB service container; the
      # conftest treats an empty FALKORDB_URL as UNCONFIGURED (no noisy probe).
      MLFLOW_TRACKING_URI: 'http://localhost:5000'
      OPIK_URL: 'http://localhost:5173'
      ANTHROPIC_API_KEY: 'test-key'
      OPENAI_API_KEY: 'test-key'
      # Pin BLAS/OpenMP thread counts to 1 — deterministic FP reductions and
      # lower memory/CPU contention for the in-test ML training under -n2.
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      # Agent tests with real-cohort fixtures skip cleanly when the data is
      # absent (no CSU/Optum files on the runner).
      ALLOW_MISSING_REAL_DATA: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist pytest-timeout pytest-asyncio

      # Real MLflow tracking server (SQLite backend → supports the model
      # registry exercised by model_deployer's registry_manager). Mirrors the
      # integration lane; lifetime = job duration.
      - name: Start MLflow tracking server
        run: |
          mkdir -p /tmp/mlflow-artifacts
          mlflow server \
            --host 0.0.0.0 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root /tmp/mlflow-artifacts \
            > /tmp/mlflow-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ > /dev/null 2>&1; then
              echo "MLflow server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "MLflow server failed to start; tail of log:"
          tail -50 /tmp/mlflow-server.log
          exit 1

      # Run the full test_agents tree. NO ``-m "not slow"`` — per #583 the
      # heavy ML-training tests run on-PR here (user decision). --timeout=180
      # gives ample headroom for the slowest (Optuna HPO / 200x-permutation)
      # under -n2 contention while still bounding any unexpected hang.
      - name: Run agent unit tests
        run: |
          pytest \
            tests/unit/test_agents/ \
            -n 2 \
            --dist=loadscope \
            --timeout=180 \
            -v --tb=short

  ci-success:
    name: Backend CI Success
    runs-on: ubuntu-latest
    needs: [lint, type-check, unit-tests, heavy-unit-tests, integration-tests, agents-tests]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint failed"
            exit 1
          fi
          if [[ "${{ needs.type-check.result }}" != "success" ]]; then
            echo "Type check failed (mypy ceiling exceeded or job error)"
            exit 1
          fi
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.heavy-unit-tests.result }}" != "success" ]]; then
            echo "Heavy unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          if [[ "${{ needs.agents-tests.result }}" != "success" ]]; then
            echo "Agent unit tests failed"
            exit 1
          fi
          echo "All backend CI jobs passed!"
