# =============================================================================
# EDGE TYPES ONTOLOGY MODULE
# =============================================================================
# File: ontology/02_edge_types.yaml
# Lines: ~200
# Maintainer: Data Architecture Team
# Purpose: 15 edge types with cardinality and properties, plus every edge type
#          the runtime writers create (description + endpoints + writer)
# Integration: schema_compiler.py, validator.py
# =============================================================================

edge_types:
  
  TREATED_BY:
    description: "Patient treated by HCP"
    source: Patient
    target: HCP
    cardinality: "N:M"  # Many patients to many HCPs
    
    properties:
      is_primary_hcp:
        type: boolean
        required: true
        default: false
        description: "Is this the primary provider?"
        
      visit_count:
        type: integer
        required: false
        min: 0
        description: "Number of visits"
        
      relationship_status:
        type: enum
        required: false
        values: [active, inactive, transferred]
        description: "Current relationship status"
        
      first_visit_date:
        type: datetime
        required: false
        description: "Date of first visit"
        
      last_visit_date:
        type: datetime
        required: false
        description: "Date of most recent visit"
  
  PRESCRIBED:
    description: "Patient prescribed brand"
    source: Patient
    target: Brand
    cardinality: "N:M"
    
    properties:
      prescription_date:
        type: datetime
        required: true
        description: "Date of prescription"
        
      is_first_line:
        type: boolean
        required: false
        default: false
        description: "Is this first-line therapy?"
        
      line_of_therapy:
        type: integer
        required: false
        min: 1
        description: "Line of therapy (1, 2, 3, ...)"
        
      status:
        type: enum
        required: true
        values: [active, discontinued, completed]
        default: "active"
        description: "Prescription status"
  
  PRESCRIBES:
    description: "HCP prescribes brand"
    source: HCP
    target: Brand
    cardinality: "N:M"
    
    properties:
      volume_monthly:
        type: integer
        required: false
        min: 0
        description: "Average monthly prescription volume"
        
      market_share:
        type: float
        required: false
        min: 0.0
        max: 1.0
        description: "Market share for this HCP [0, 1]"
        
      prescribing_status:
        type: enum
        required: false
        values: [active, lapsed, never]
        description: "Prescribing behavior"
        
      first_prescription_date:
        type: datetime
        required: false
        description: "Date of first prescription"
  
  PRACTICES_IN:
    description: "HCP practices in region"
    source: HCP
    target: Region
    cardinality: "N:1"  # Many HCPs to one region
    
    properties:
      primary_location:
        type: boolean
        required: true
        default: true
        description: "Is this the primary practice location?"
  
  LOCATED_IN:
    description: "Patient located in region"
    source: Patient
    target: Region
    cardinality: "N:1"
    
    properties:
      residence_status:
        type: enum
        required: false
        values: [permanent, temporary]
        default: "permanent"
        description: "Residence status"
  
  INFLUENCES:
    description: "HCP influences another HCP (network effects)"
    source: HCP
    target: HCP
    cardinality: "N:M"
    
    properties:
      influence_strength:
        type: float
        required: true
        min: 0.0
        max: 1.0
        description: "Strength of influence [0, 1]"
        
      network_type:
        type: enum
        required: false
        values: [peer, mentor, colleague, referral]
        description: "Type of influence relationship"
  
  RECEIVED:
    description: "HCP received trigger"
    source: HCP
    target: Trigger
    cardinality: "N:M"
    
    properties:
      delivery_date:
        type: datetime
        required: true
        description: "Date trigger was delivered"
        
      accepted:
        type: boolean
        required: false
        description: "Did HCP accept the trigger?"
        
      action_taken:
        type: string
        required: false
        description: "Description of action taken (if any)"
  
  CAUSES:
    description: "Causal relationship between any entities"
    source: any
    target: any
    cardinality: "N:M"
    
    properties:
      effect_size:
        type: float
        required: true
        description: "Quantified effect (can be negative)"
        
      confidence:
        type: float
        required: true
        min: 0.0
        max: 1.0
        description: "Confidence in causal relationship [0, 1]"
        
      method_used:
        type: enum
        required: true
        values: [dowhy_backdoor, dowhy_frontdoor, econml_dml, econml_causal_forest, causalml_uplift, causalml_metalearner, propensity_score_matching, difference_in_differences]
        description: "Causal inference method"
  
  IMPACTS:
    description: "Causal path impacts KPI"
    source: CausalPath
    target: KPI
    cardinality: "N:M"
    
    properties:
      impact_magnitude:
        type: float
        required: true
        description: "Magnitude of impact on KPI"
        
      direction:
        type: enum
        required: true
        values: [positive, negative, neutral]
        description: "Direction of impact"
  
  ANALYZES:
    description: "Agent analyzed entity"
    source: Agent
    target: any
    cardinality: "N:M"
    
    properties:
      analysis_date:
        type: datetime
        required: true
        description: "Date of analysis"
        
      analysis_type:
        type: string
        required: false
        description: "Type of analysis performed"
  
  DISCOVERED:
    description: "Agent discovered causal path"
    source: Agent
    target: CausalPath
    cardinality: "N:M"
    
    properties:
      discovery_date:
        type: datetime
        required: true
        description: "Date of discovery"
        
      discovery_method:
        type: string
        required: false
        description: "Method used for discovery"
  
  GENERATED:
    description: "Agent generated trigger"
    source: Agent
    target: Trigger
    cardinality: "N:M"
    
    properties:
      generation_date:
        type: datetime
        required: true
        description: "Date trigger was generated"
        
      reasoning:
        type: string
        required: false
        description: "Reasoning behind trigger generation"
  
  TRANSITIONED_TO:
    description: "Patient transitioned from one stage to another"
    source: Patient
    target: Patient
    cardinality: "N:N"  # Self-edge
    
    properties:
      from_stage:
        type: enum
        required: true
        values: [aware, considering, prescribed, first_fill, adherent, discontinued, maintained]
        description: "Source journey stage"
        
      to_stage:
        type: enum
        required: true
        values: [aware, considering, prescribed, first_fill, adherent, discontinued, maintained]
        description: "Target journey stage"
        
      transition_date:
        type: datetime
        required: true
        description: "Date of transition"
  
  # Inferred edges (computed by inference rules, not directly created)
  
  INDIRECTLY_INFLUENCES:
    description: "Indirect influence through transitive closure (INFERRED)"
    source: any
    target: any
    cardinality: "N:M"
    inferred: true
    inference_rule: "causal_chain"
    
    properties:
      combined_effect:
        type: float
        required: true
        description: "Combined effect through path"
        
      combined_confidence:
        type: float
        required: true
        min: 0.0
        max: 1.0
        description: "Combined confidence (product of path confidences)"
        
      path_count:
        type: integer
        required: true
        min: 1
        description: "Number of paths contributing to this inference"
  
  HIGH_POTENTIAL_PRESCRIBER:
    description: "HCP identified as high potential for brand (INFERRED)"
    source: HCP
    target: Brand
    cardinality: "N:M"
    inferred: true
    inference_rule: "hcp_influence_propagation"
    
    properties:
      potential_score:
        type: float
        required: true
        min: 0.0
        max: 1.0
        description: "Potential score [0, 1]"
        
      evidence:
        type: string
        required: false
        description: "Evidence for high potential classification"

# Cardinality definitions

  # ---------------------------------------------------------------------------
  # Edge types written by runtime code (added 2026-09-19, #2178 follow-up).
  # tests/unit/test_ontology/test_kg_writer_ontology_drift.py fails when code
  # writes edge types not declared in this file. Property schemas are not declared.
  # ---------------------------------------------------------------------------

  AFFECTS:
    description: "KPI affects KPI in the seeded causal chain."
    source: KPI
    target: KPI
    written_by:
      - scripts/seed_falkordb.py

  AFFECTS_MODEL:
    description: "Drift pattern affects a model."
    source: DriftPattern
    target: Model
    written_by:
      - src/agents/drift_monitor/memory_hooks.py

  APPLIES_TO:
    description: "Eligibility rule applies to a brand."
    source: EligibilityRule
    target: Brand
    written_by:
      - src/agents/cohort_constructor/memory_hooks.py

  BELONGS_TO:
    description: "Trained model belongs to an experiment."
    source: Model
    target: Experiment
    written_by:
      - src/agents/ml_foundation/model_trainer/memory_hooks.py

  CO_DRIFTS_WITH:
    description: "Features that drift together."
    source: Feature
    target: Feature
    written_by:
      - src/agents/drift_monitor/memory_hooks.py

  DEFINED_BY:
    description: "Experiment defined by its scope spec."
    source: Experiment
    target: ScopeSpec
    written_by:
      - src/agents/ml_foundation/scope_definer/memory_hooks.py

  DEPLOYS_FOR:
    description: "Deployment serves an experiment's model."
    source: Deployment
    target: Experiment
    written_by:
      - src/agents/ml_foundation/model_deployer/memory_hooks.py

  DETECTED:
    description: "Health snapshot detected an anomaly."
    source: HealthSnapshot
    target: Anomaly
    written_by:
      - src/agents/ml_foundation/observability_connector/memory_hooks.py

  EXPLAINS:
    description: "Causal path or agent explains a KPI (seed)."
    source: "CausalPath | Agent"
    target: KPI
    written_by:
      - scripts/seed_falkordb.py

  FOR_BRAND:
    description: "Node scoped to a brand."
    source: "CohortConfig | Feature"
    target: Brand
    written_by:
      - src/agents/cohort_constructor/memory_hooks.py
      - src/data/kg/ensemble_voter.py

  HAS_DRIFT:
    description: "Feature has a drift pattern."
    source: Feature
    target: DriftPattern
    written_by:
      - src/agents/drift_monitor/memory_hooks.py

  HAS_IMPORTANCE:
    description: "Feature carries importance in an experiment."
    source: Feature
    target: Experiment
    written_by:
      - src/agents/ml_foundation/feature_analyzer/memory_hooks.py

  HAS_QC:
    description: "Data source has a QC report."
    source: DataSource
    target: QCReport
    written_by:
      - src/agents/ml_foundation/data_preparer/memory_hooks.py

  HAS_TYPE:
    description: "Experiment has a problem type."
    source: Experiment
    target: ProblemType
    written_by:
      - src/agents/ml_foundation/scope_definer/memory_hooks.py

  INCLUDES:
    description: "Health snapshot includes an agent pattern."
    source: HealthSnapshot
    target: AgentPattern
    written_by:
      - src/agents/ml_foundation/observability_connector/memory_hooks.py

  INTERACTS_WITH:
    description: "Feature interaction (feature_analyzer)."
    source: Feature
    target: Feature
    written_by:
      - src/agents/ml_foundation/feature_analyzer/memory_hooks.py

  MONITORS:
    description: "Agent monitors a brand (seed)."
    source: Agent
    target: Brand
    written_by:
      - scripts/seed_falkordb.py

  PREDICTS:
    description: "Agent predicts a KPI (seed)."
    source: Agent
    target: KPI
    written_by:
      - scripts/seed_falkordb.py

  RECEIVES:
    description: "Patient receives a treatment (seed)."
    source: Patient
    target: Treatment
    written_by:
      - scripts/seed_falkordb.py

  ROLLED_BACK:
    description: "Rollback of a deployment."
    source: Rollback
    target: Deployment
    written_by:
      - src/agents/ml_foundation/model_deployer/memory_hooks.py

  SHARED_PATIENTS:
    description: "HCPs that share patients (HCP influence graph)."
    source: HCP
    target: HCP
    written_by:
      - scripts/persist_hcp_influence_to_falkordb.py

  SUITED_FOR:
    description: "Algorithm suited for a problem type."
    source: Algorithm
    target: ProblemType
    written_by:
      - src/agents/ml_foundation/model_selector/memory_hooks.py

  TARGETS:
    description: "Experiment targets a variable."
    source: Experiment
    target: Variable
    written_by:
      - src/agents/ml_foundation/scope_definer/memory_hooks.py

  TRACKS:
    description: "Brand tracks a KPI (seed)."
    source: Brand
    target: KPI
    written_by:
      - scripts/seed_falkordb.py

  TRAINED_WITH:
    description: "Model trained with an algorithm."
    source: Model
    target: Algorithm
    written_by:
      - src/agents/ml_foundation/model_trainer/memory_hooks.py

  USED_BY:
    description: "Hyperparameter set used by a model."
    source: Hyperparameters
    target: Model
    written_by:
      - src/agents/ml_foundation/model_trainer/memory_hooks.py

  USED_IN:
    description: "Algorithm used in an experiment; eligibility rule used in a cohort."
    source: "Algorithm | EligibilityRule"
    target: "Experiment | CohortConfig"
    written_by:
      - src/agents/cohort_constructor/memory_hooks.py
      - src/agents/ml_foundation/model_selector/memory_hooks.py

  USES:
    description: "Treatment uses a brand (seed)."
    source: Treatment
    target: Brand
    written_by:
      - scripts/seed_falkordb.py

cardinality_definitions:
  "N:1":
    description: "Many-to-one relationship"
    example: "Many patients in one region"
    
  "N:M":
    description: "Many-to-many relationship"
    example: "Many patients treated by many HCPs"
    
  "N:N":
    description: "Self-referential many-to-many"
    example: "Patient stage transitions"
