# Model Endpoints Configuration (production)
# ============================================
# This file configures HTTP model endpoints consumed by prediction_synthesizer.
#
# F-012 (#430): mock_model was removed from this file and moved to
# config/dev_model_endpoints.yaml. The dev YAML is merged ONLY when
# ENVIRONMENT is one of {development, dev, test, testing, local} —
# unset, misspelled, "production", or any other value skips the merge.
# Selecting a model_id not declared in any loaded file raises
# ValueError at orchestration time instead of silently returning
# fabricated predictions. Set ENVIRONMENT explicitly to one of the
# allowed dev values to enable config/dev_model_endpoints.yaml.

# Default settings for all endpoints
default_base_url: ${BENTOML_SERVICE_URL:-http://localhost:3000}
default_timeout: 5.0
default_max_retries: 3

# Model endpoint definitions
endpoints:
  # Churn prediction model
  churn_model:
    url: ${BENTOML_SERVICE_URL:-http://localhost:3000}/churn_model
    client_type: http
    timeout: 5.0
    max_retries: 3
    enabled: true

  # Conversion prediction model
  conversion_model:
    url: ${BENTOML_SERVICE_URL:-http://localhost:3000}/conversion_model
    client_type: http
    timeout: 5.0
    max_retries: 3
    enabled: true

  # Adoption prediction model
  adoption_model:
    url: ${BENTOML_SERVICE_URL:-http://localhost:3000}/adoption_model
    client_type: http
    timeout: 5.0
    max_retries: 3
    enabled: true

  # Causal effect model
  causal_model:
    url: ${BENTOML_SERVICE_URL:-http://localhost:3000}/causal_model
    client_type: http
    timeout: 10.0  # Higher timeout for causal models
    max_retries: 3
    enabled: true

  # ROI prediction model
  roi_model:
    url: ${BENTOML_SERVICE_URL:-http://localhost:3000}/roi_model
    client_type: http
    timeout: 5.0
    max_retries: 3
    enabled: true
