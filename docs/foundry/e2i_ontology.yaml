    displayName: Agent
    pluralDisplayName: Agents
    description: >
      One of the 21 platform agents (tiers 0-5; roster source of truth is
      src/agents/factory.py AGENT_REGISTRY_CONFIG; agent_tier_mapping is the
      authoritative agent->tier map). Backing table agent_registry. NOTE:
      agent_registry.agent_tier IS the agent_tier_type ENUM and covers
      Tiers 1-5 ONLY by design (Tier 0 has no value in it); the plain-TEXT
      6-tier column is agent_tier_mapping.tier
      (tier_0_ml_foundation..tier_5_self_improvement), per migration 057.
    icon: robot
    groups: [agentic-layer]
    status: active
    visibility: prominent
    writeback: disabled
    primaryKey: agentName
    titleProperty: displayNameText
    datasources:
      - dataset: ds-curated-agent-registry
        branch: master
    properties:
      - { apiName: agentName, column: agent_name, baseType: string,
          description: "PK; snake_case canonical name (orchestrator, causal_impact, scope_definer, ...)." }
      - { apiName: agentTier, column: agent_tier, baseType: string,
          description: "Tier 1-5 labels: coordination | causal_analytics | monitoring | ml_predictions | self_improvement. Canonical 6-tier labels (tier_0_ml_foundation..tier_5_self_improvement) live on agent_tier_mapping.tier." }
      - { apiName: displayNameText, column: display_name, baseType: string,
          description: "NOT NULL human-readable name (apiName avoids collision with the objectType displayName field)." }
      - { apiName: agentDescription, column: description, baseType: string }
      - { apiName: capabilities, column: capabilities, baseType: array<string>,
          description: "JSONB capability strings, e.g. ate_estimation, dag_construction." }
      - { apiName: routesFromIntents, column: routes_from_intents, baseType: array<string>,
          description: "Orchestrator intent keywords routed to this agent." }
      - { apiName: isActive, column: is_active, baseType: boolean }
      - { apiName: priorityOrder, column: priority_order, baseType: integer,
          description: "Lower = higher routing priority." }

  - id: agent-activity
    apiName: AgentActivity
    displayName: Agent Activity
    pluralDisplayName: Agent Activities
    description: >
      Agent execution-log record. Backing table agent_activities (JSONB
      payloads input_data/analysis_results/recommendations omitted).
      agent_name is a SOFT join to agent_registry (no FK) — modeled as an
      explicit Foundry link.
    icon: activity
    groups: [agentic-layer]
    status: active
    visibility: normal
    writeback: disabled
    primaryKey: activityId
    titleProperty: activityType
    datasources:
      - dataset: ds-curated-agent-activities
        branch: master
    properties:
      - { apiName: activityId, column: activity_id, baseType: string }
      - { apiName: agentName, column: agent_name, baseType: string,
          description: "Soft FK to agent_registry.agent_name." }
      - { apiName: agentTier, column: agent_tier, baseType: string,
          description: "agent_tier_type enum value." }
      - { apiName: activityTimestamp, column: activity_timestamp, baseType: timestamp,
          description: "NOT NULL." }
      - { apiName: activityType, column: activity_type, baseType: string,
          description: "analysis | prediction | optimization | ..." }
      - { apiName: workstream, column: workstream, baseType: string,
          description: "workstream_type enum: WS1 | WS2 | WS3." }
      - { apiName: processingDurationMs, column: processing_duration_ms, baseType: integer }
      - { apiName: recordsProcessed, column: records_processed, baseType: integer }
      - { apiName: causalPathsAnalyzed, column: causal_paths_analyzed, baseType: integer }
      - { apiName: confidenceLevel, column: confidence_level, baseType: double }
      - { apiName: impactEstimate, column: impact_estimate, baseType: double,
          description: "Estimated dollar impact." }
      - { apiName: roiEstimate, column: roi_estimate, baseType: double }
      - { apiName: status, column: status, baseType: string,
          description: "success | partial | failed | timeout." }
      - { apiName: errorMessage, column: error_message, baseType: string }
      - { apiName: splitConfigId, column: split_config_id, baseType: string }
      - { sharedProperty: data-split }
      - { sharedProperty: is-synthetic }

# =============================================================================
# LINK TYPES
# =============================================================================
# Conventions:
#   - ONE_TO_MANY links: the "one" side is listed first (objectTypeA); the
#     foreignKey property lives on objectTypeB and references objectTypeA's
#     primary key.
#   - MANY_TO_MANY links: backed by their own join dataset (datasource block)
#     whose paired key columns are mapped to each endpoint's primary key.
#   - status defaults to experimental in Foundry; links graduated to active
#     here are enforced or near-enforced (DB FK) relationships.
# =============================================================================
linkTypes:

  # ----- dimension links (enum-valued FK columns; no DB FK, values guaranteed
  # ----- by PG enum types + complete dimension datasets)
  - id: region-hcps
    apiName: RegionHcps
    cardinality: ONE_TO_MANY
    objectTypeA: { objectType: region, displayName: Region, pluralDisplayName: Regions }
    objectTypeB: { objectType: hcp, displayName: HCP, pluralDisplayName: HCPs }
    foreignKey: { objectType: hcp, property: geographicRegion, references: regionName }
    status: active
    description: HCPs practicing in a region (hcp_profiles.geographic_region).

  - id: region-patients
    apiName: RegionPatients
    cardinality: ONE_TO_MANY
    objectTypeA: { objectType: region, displayName: Region, pluralDisplayName: Regions }
    objectTypeB: { objectType: patient, displayName: Patient, pluralDisplayName: Patients }
    foreignKey: { objectType: patient, property: region, references: regionName }
    status: experimental
    description: Patients located in a region (derived patient master).

  - id: brand-patient-journeys
    apiName: BrandPatientJourneys
    cardinality: ONE_TO_MANY
    objectTypeA: { objectType: brand, displayName: Brand, pluralDisplayName: Brands }
    objectTypeB: { objectType: patient-journey, displayName: Patient Journey, pluralDisplayName: Patient Journeys }
    foreignKey: { objectType: patient-journey, property: brand, references: brandName }
    status: active
    description: Journeys for a brand (patient_journeys.brand enum column).

  - id: brand-treatment-events
    apiName: BrandTreatmentEvents
    cardinality: ONE_TO_MANY
    objectTypeA: { objectType: brand, displayName: Brand, pluralDisplayName: Brands }
    objectTypeB: { objectType: treatment-event, displayName: Treatment Event, pluralDisplayName: Treatment Events }
    foreignKey: { objectType: treatment-event, property: brand, references: brandName }
    status: active

  - id: brand-business-metrics
    apiName: BrandBusinessMetrics
    cardinality: ONE_TO_MANY
    objectTypeA: { objectType: brand, displayName: Brand, pluralDisplayName: Brands }
    objectTypeB: { objectType: business-metric, displayName: Business Metric, pluralDisplayName: Business Metrics }
    foreignKey: { objectType: business-metric, property: brand, references: brandName }
    status: active

  - id: region-business-metrics
    apiName: RegionBusinessMetrics
    cardinality: ONE_TO_MANY
    objectTypeA: { objectType: region, displayName: Region, pluralDisplayName: Regions }
    objectTypeB: { objectType: business-metric, displayName: Business Metric, pluralDisplayName: Business Metrics }
    foreignKey: { objectType: business-metric, property: region, references: regionName }
    status: active

  - id: brand-reference-universes
    apiName: BrandReferenceUniverses
    cardinality: ONE_TO_MANY
    objectTypeA: { objectType: brand, displayName: Brand, pluralDisplayName: Brands }
    objectTypeB: { objectType: reference-universe, displayName: Reference Universe, pluralDisplayName: Reference Universes }
    foreignKey: { objectType: reference-universe, property: brand, references: brandName }
    status: active

  - id: region-reference-universes
    apiName: RegionReferenceUniverses
    cardinality: ONE_TO_MANY
    objectTypeA: { objectType: region, displayName: Region, pluralDisplayName: Regions }
    objectTypeB: { objectType: reference-universe, displayName: Reference Universe, pluralDisplayName: Reference Universes }
    foreignKey: { objectType: reference-universe, property: region, references: regionName }
    status: active

  - id: brand-intent-surveys
    apiName: BrandIntentSurveys
    cardinality: ONE_TO_MANY
    objectTypeA: { objectType: brand, displayName: Brand, pluralDisplayName: Brands }
    objectTypeB: { objectType: hcp-intent-survey, displayName: HCP Intent Survey, pluralDisplayName: HCP Intent Surveys }
    foreignKey: { objectType: hcp-intent-survey, property: brand, references: brandName }
    status: active

  - id: brand-ml-experiments
    apiName: BrandMlExperiments
    cardinality: ONE_TO_MANY
    objectTypeA: { objectType: brand, displayName: Brand, pluralDisplayName: Brands }
    objectTypeB: { objectType: ml-experiment, displayName: ML Experiment, pluralDisplayName: ML Experiments }
    foreignKey: { objectType: ml-experiment, property: brand, references: brandName }
    status: active

  # ----- patient / journey / event spine
  - id: patient-patient-journeys
    apiName: PatientPatientJourneys
    cardinality: ONE_TO_MANY
    objectTypeA: { objectType: patient, displayName: Patient, pluralDisplayName: Patients }
    objectTypeB: { objectType: patient-journey, displayName: Patient Journey, pluralDisplayName: Patient Journeys }
    foreignKey: { objectType: patient-journey, property: patientId, references: patientId }
    status: experimental
    description: >
      One patient, many journeys. Experimental because Patient is a derived
      object type (no PG master table).

  - id: hcp-patient-journeys
    apiName: HcpPatientJourneys
    cardinality: ONE_TO_MANY
    objectTypeA: { objectType: hcp, displayName: HCP, pluralDisplayName: HCPs }
    objectTypeB: { objectType: patient-journey, displayName: Patient Journey, pluralDisplayName: Patient Journeys }
    foreignKey: { objectType: patient-journey, property: hcpId, references: hcpId }
    status: active
    description: >
      Treating HCP per journey. SOFT JOIN in PG (patient_journeys.hcp_id has
      no declared FK constraint) — the link is realized by Foundry, not by
      the source DB.

  - id: patient-journey-treatment-events
    apiName: PatientJourneyTreatmentEvents
    cardinality: ONE_TO_MANY
    objectTypeA: { objectType: patient-journey, displayName: Patient Journey, pluralDisplayName: Patient Journeys }
