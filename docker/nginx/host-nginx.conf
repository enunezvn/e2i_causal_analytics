# E2I Causal Analytics - Hardened Production Config
# SSL managed by Certbot - DO NOT remove "managed by Certbot" comments
#
# RECONCILIATION NOTE (fix/fe-serving-auth-build):
# This file is the canonical source for /etc/nginx/sites-available/e2i-analytics.
# It previously drifted from the live config: the Supabase proxy blocks
# (/auth/, /rest/, /realtime/, /storage/ -> Kong on 54321) were added live on
# 2026-02-09 alongside commit 373f62d7 ("fix: proxy Supabase through nginx to
# resolve mixed-content login failure") but never back-ported here. They are now
# tracked.
#
# SERVING PATH (fix/fe-serving-auth-build):
# The frontend is served by the e2i_frontend container (nginx production stage,
# compose port 3002:80) built+pushed by CI (deploy.yml build-and-push-frontend).
# The host proxies / and /assets/ to 127.0.0.1:3002 instead of serving the
# static /var/www/html snapshot (stale 2026-02-09 build; retired - see
# docs/runbooks/frontend-serving-flip.md).
#
# Depends on directives defined in the host /etc/nginx/nginx.conf http block:
#   limit_req_zone api_limit / general_limit / copilot_limit
#   map $request_uri $blocked_path

# HTTP server - redirect to HTTPS (except health check)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name eznomics.site 138.197.4.36;

    # Health check on port 80 (for load balancer probes)
    location /health {
        access_log off;
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ACME challenge for certbot renewal
    # NOTE: /var/www/html must keep existing for certbot even after the static
    # frontend snapshot is archived (only the app files are retired).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 127.0.0.1:4443 ssl;
    # listen [::]:443 ssl ipv6only=on; # disabled for sslh
    server_name eznomics.site; # managed by Certbot

    # SSL certs (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/eznomics.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/eznomics.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Frontend is proxied to the e2i_frontend container (see location / below).
    # The former static web root (/var/www/html) is retired; the root directive
    # was removed deliberately so nothing silently serves the stale snapshot.

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'self';" always;

    # Logging
    access_log /var/log/nginx/e2i-app.access.log;
    error_log /var/log/nginx/e2i-app.error.log;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Block malicious paths
    if ($blocked_path) {
        return 403;
    }

    # Health check
    location /health {
        access_log off;
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000/api/;

        # Override server-level CSP to allow Swagger UI CDN assets
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' wss: https:; frame-ancestors 'self';" always;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # CopilotKit endpoint
    location /copilotkit/ {
        limit_req zone=copilot_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/copilotkit/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # MLflow UI
    location /mlflow/ {
        auth_basic "MLflow";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        sub_filter_once off;
        sub_filter_types text/css application/javascript;
    }

    # Opik UI
    location /opik/ {
        proxy_pass http://127.0.0.1:5173/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # FalkorDB Browser
    location /falkordb/ {
        proxy_pass http://127.0.0.1:3030/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Static assets - proxied to the frontend container, which sets
    # long-lived immutable Cache-Control for hashed bundle files itself.
    # proxy_hide_header strips the container's own security headers so the
    # host-level policy above is authoritative (duplicate CSP headers would be
    # enforced as the intersection by browsers and break the app).
    location /assets/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Referrer-Policy;
    }

    # Supabase Auth API (self-hosted Kong on 54321)
    location /auth/ {
        proxy_pass http://127.0.0.1:54321/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Supabase REST API (PostgREST via Kong)
    location /rest/ {
        proxy_pass http://127.0.0.1:54321/rest/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Supabase Realtime (WebSocket)
    location /realtime/ {
        proxy_pass http://127.0.0.1:54321/realtime/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Supabase Storage
    location /storage/ {
        proxy_pass http://127.0.0.1:54321/storage/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 50M;
    }

    # Frontend SPA - proxied to the e2i_frontend container (nginx production
    # stage). The container handles try_files SPA fallback to index.html and
    # sets no-cache on index.html. See proxy_hide_header rationale above.
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Referrer-Policy;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block system paths
    location ~* /(etc|proc|sys)/ {
        deny all;
    }
}
