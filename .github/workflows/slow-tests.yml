name: Slow Tests

# Scheduled-only workflow that runs `pytest -m slow` and the heavy e2e
# suites currently --ignore'd from the integration-tests job in
# backend-tests.yml. Not gating on PR/push.
#
# Env, services, and MLflow setup MUST remain in sync with
# .github/workflows/backend-tests.yml `integration-tests` job.
# If you change one, change the other.
#
# To run manually: gh workflow run slow-tests.yml [--ref <branch>]
# To run with the heavy excluded suites: gh workflow run slow-tests.yml --field include_excluded=true

on:
  schedule:
    # 05:00 UTC daily (22:00 PT / 01:00 ET / 07:00 CET) — after the US
    # workday ends, before EU starts. Off-hour to avoid the GH Actions
    # midnight-UTC thundering herd.
    #
    # Moved from 07:00 (#1817): with GitHub's usual 30–60 min schedule delay,
    # Job A's live ChEMBL calls landed at 07:42–08:09 UTC — inside EBI's
    # measured 08:00 UTC (UK start-of-day) instability, where 4 of 11 nightlies
    # went red on the same upstream 500 while the client and prod were clean.
    # A 48 h probe found 05h–07h UTC clean on a non-outage day; the calls now
    # land ~05:40–06:40. Day-long EBI outages still go red — that is the
    # reporter's job. Pinned out of the 07–08h window by
    # tests/unit/test_tests_meta/test_slow_tests_cron_slot_1817.py.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      extra_pytest_args:
        description: 'Extra pytest args appended verbatim (e.g. -k test_name)'
        required: false
        default: ''
        type: string
      include_excluded:
        description: 'Run Job B (excluded heavies: test_tier0_e2e + test_adaptive_criteria_e2e + test_model_trainer_evaluation_modes)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write  # for the report-failure job to file/update issues

env:
  PYTHON_VERSION: '3.12'

concurrency:
  # Per-ref: separate branches don't block each other.
  # cancel-in-progress: false → an overnight scheduled run is NOT cancelled
  # by an early-morning workflow_dispatch (these are expensive runs).
  group: slow-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Job A: tracked slow tests (must-pass)
  # Runs `pytest -m slow` over tests/ with the same infra ignores as
  # the integration-tests job in backend-tests.yml. Picks up:
  # - tests/integration/test_synthetic_baseline_invariant.py (PR #69 gate)
  # - tests/integration/test_mlflow_repeated_runs_real.py
  # - tests/integration/test_adversarial_synthetic.py
  # - tests/integration/test_tier0_single_mode_snapshot.py
  # - tests/synthetic/test_synthetic_regimes.py
  # - tests/unit/.../test_performance.py (under -m slow)
  # ──────────────────────────────────────────────────────────────────
  slow-tests:
    name: Slow Tests (tracked)
    runs-on: ubuntu-latest
    # 90 min budget: this job runs ~3 tier0 e2e pipelines (synthetic
    # baseline + adverse regime + clean regime) at ~5 min each, plus
    # other slow-marked tests. The first PR-#74 validation run hit the
    # original 45-min timeout at the 55-min mark (10-min GH grace).
    timeout-minutes: 90
    # Published for report-failure's #1804/#1813 routing: on failure the
    # classify step decides upstream-transient vs real. Empty when the job
    # passed or the classify step never produced a verdict (fail-safe: the
    # reporter treats anything but 'upstream-transient' as the red alarm).
    outputs:
      outage_classification: ${{ steps.classify.outputs.classification }}
      outage_detail: ${{ steps.classify.outputs.detail }}
    env:
      E2I_TESTING_MODE: 'true'
      SUPABASE_URL: 'http://localhost:54321'
      SUPABASE_KEY: 'test-key'
      SUPABASE_ANON_KEY: 'test-key'
      REDIS_URL: 'redis://localhost:6379'
      # FALKORDB_URL intentionally unset — slow-tests lanes have no FalkorDB
      # service container (issue #183). Empty URL → conftest skips the probe
      # and reports ``FALKORDB: UNCONFIGURED`` cleanly.
      MLFLOW_TRACKING_URI: 'http://localhost:5000'
      OPIK_URL: 'http://localhost:5173'
      ANTHROPIC_API_KEY: 'test-key'
      OPENAI_API_KEY: 'test-key'
      # Real external-API credentials for the live-contract tests (#1629).
      # These are the ONLY lane that should hold them: Job A is `pytest -m
      # slow`, and every live-contract file is `slow`-marked so none of them
      # reaches the PR-blocking lane.
      #
      # Before this, CI held no external-API secret at all, so every
      # live-contract test skipped on its `skipif(not _API_KEY)` guard and had
      # never executed in CI — a green that proved nothing. Each stays
      # skip-on-absent rather than fail-on-absent, so a fork PR or an expired
      # secret degrades to "not run", never to a false red.
      UMLS_UTS_API_KEY: ${{ secrets.UMLS_UTS_API_KEY }}
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      # Pin BLAS/OpenMP thread counts to 1 — same reasoning as the
      # integration-tests job (synthetic baseline e2e is sensitive to
      # multi-core BLAS reduction order). Matches local-dev measurement.
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      # Env parity with backend-tests.yml integration-tests (issue #481).
      # Job A runs `pytest -m slow` which sweeps in real_data + slow tests
      # (test_csu_negative_control_20260510.py, test_optum_held_out_*,
      # test_g1_lineage_audit_sweep.py). Those fixtures hard-fail when
      # CSU/Optum cohort files are absent unless this env var opts into
      # the documented skip path — which is exactly the case on the GH
      # Actions runner. Without it, every scheduled run errors out (see
      # run 26355735293 and the 4 preceding nightly runs).
      ALLOW_MISSING_REAL_DATA: '1'
      # Asyncio-pollution strict-mode trip-switch (issue #221). The
      # integration-tests lane is the canonical place this gate fires;
      # mirror it here so slow-marked async tests can't quietly regress.
      E2I_ASSERT_NO_ASYNCIO_POLLUTION: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # Start Redis from the Ubuntu apt package instead of a `services:`
      # container. The container image (`redis:7-alpine`) is pulled from Docker
      # Hub when the job initializes; anonymous pulls hit Docker-Hub
      # rate-limits / registry timeouts (`docker pull ... context deadline
      # exceeded`, issue #649), failing "Initialize containers" and aborting
      # the whole job BEFORE any test runs. The apt package comes from the
      # Ubuntu mirror, never touches Docker Hub, and serves the same
      # `redis://localhost:6379` that REDIS_URL points at. If Redis were
      # somehow unavailable, `requires_redis` tests auto-skip rather than
      # erroring on `[Errno 111]`, so this step is best-effort. Mirrors the
      # ephemeral-redis pattern in backend-tests.yml.
      - name: Start Redis (apt, no Docker Hub pull)
        # Bounded + non-fatal (#1687): with no step timeout, a stalled apt ran
        # until the job `timeout-minutes` cap killed the whole job. The bound
        # plus continue-on-error makes the step match its best-effort contract
        # above — a hung/failed apt costs ≤5 min and a skip, never the job.
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo service redis-server start || redis-server --daemonize yes
          for i in $(seq 1 15); do
            if redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::warning::Redis did not respond to PING within 15s; requires_redis tests will skip."

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist pytest-timeout pytest-asyncio

      - name: Start MLflow tracking server
        run: |
          mkdir -p /tmp/mlflow-artifacts
          mlflow server \
            --host 0.0.0.0 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root /tmp/mlflow-artifacts \
            > /tmp/mlflow-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ > /dev/null 2>&1; then
              echo "MLflow server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "MLflow server failed to start; tail of log:"
          tail -50 /tmp/mlflow-server.log
          exit 1

      - name: Run slow-marked tests
        # Pass workflow_dispatch inputs through env vars (NOT direct ${{ }})
        # to avoid the github_actions.run-shell-injection semgrep finding.
        #
        # No --max-worker-restart here: the lane inherits `=0` from pyproject's
        # addopts (#1648). This step used to pass `=2`, added for #78 on the
        # premise that "pytest-xdist (without this flag) refuses to restart" a
        # dead worker. That premise is false -- xdist's
        # get_default_max_worker_restart returns numprocesses * 4, so the flag
        # was silently *reducing* an existing budget of 8 to 2, not enabling
        # restarts. Since every restart re-runs the test that killed the
        # previous worker, `=2` still let one bad test burn 3 x the 300s
        # timeout here. 0 ends the run on the first death.
        env:
          EXTRA_ARGS: ${{ inputs.extra_pytest_args }}
        run: |
          pytest tests/ -m slow \
            --ignore=tests/integration/test_chatbot_dspy.py \
            --ignore=tests/integration/test_chatbot_graph.py \
            --ignore=tests/integration/test_cognitive_rag_orchestrator_routing.py \
            --ignore=tests/integration/test_rag_orchestrator_integration.py \
            --ignore=tests/integration/test_signal_flow/test_recipient_prompts.py \
            --ignore=tests/integration/test_signal_flow/test_sender_signals.py \
            --ignore=tests/integration/test_signal_flow/test_e2e_signal_flow.py \
            --ignore=tests/integration/test_observability_integration.py \
            --ignore=tests/integration/test_prediction_flow.py \
            --ignore=tests/integration/test_tier0_e2e.py \
            --ignore=tests/integration/test_adaptive_criteria_e2e.py \
            --ignore=tests/integration/test_model_trainer_evaluation_modes.py \
            --ignore=tests/integration/test_migration/ \
            --ignore=tests/integration/test_digital_twin_workflow.py \
            --ignore=tests/integration/test_feedback_loop_integration.py \
            --ignore=tests/integration/test_agents/test_data_preparer/ \
            --ignore=tests/integration/api/test_rbac_endpoints.py \
            --ignore=tests/performance/ \
            --ignore=tests/synthetic/test_synthetic_regimes.py \
            --junitxml=/tmp/slow-tests-junit.xml \
            -o junit_logging=all \
            -n 2 \
            --dist=loadscope \
            --timeout=300 \
            --tb=short ${EXTRA_ARGS}

      # #1804/#1813: decide whether this red is an upstream provider outage
      # (the clinical-context live suite hitting a 5xx/timeout — three of those
      # in five days each cost a triage session) or a real failure. The script
      # prints its per-test derivation to stderr and a clean GITHUB_OUTPUT
      # payload to stdout; `tee` keeps the verdict visible in the run log. The
      # `junit_logging=all` flag above is load-bearing: without it the fan-out
      # degradation failures carry no HTTP evidence in the XML (measured on run
      # 32822893174) and a pure fan-out outage would mis-classify as real.
      # Fail-safe: a missing junit, a crash, or a skipped step all leave the
      # verdict blank/real, which the reporter treats as the red alarm.
      - name: Classify the failure (upstream-transient vs real)
        id: classify
        if: failure()
        run: |
          python scripts/ci/classify_slow_tests_failure.py /tmp/slow-tests-junit.xml \
            | tee -a "$GITHUB_OUTPUT"

      - name: Upload artifacts on failure or cancel
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: slow-tests-debug-${{ github.run_id }}
          path: |
            /tmp/mlflow-server.log
            mlflow.db
            /tmp/slow-tests-junit.xml
          retention-days: 14
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────
  # Job B: excluded heavies (BLOCKING since #617)
  # Runs the three e2e suites --ignore'd from integration-tests for
  # OOM/timeout reasons (test_tier0_e2e + test_adaptive_criteria_e2e +
  # test_model_trainer_evaluation_modes). These are now stabilized, so the
  # job is a hard must-pass: NO continue-on-error — a test or infra failure
  # red-Xs the workflow and trips the report-failure alarm via .result.
  # ──────────────────────────────────────────────────────────────────
  excluded-heavy-tests:
    name: Excluded Heavy E2E (blocking)
    # On schedule: always runs. On workflow_dispatch: only if user opts in.
    if: github.event_name == 'schedule' || inputs.include_excluded == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Publish the heavy test step's outcome so the SUMMARY can report the heavy
    # pytest step's granular result distinctly from a job-level infra failure.
    # (The alarm itself now keys off needs.<job>.result, which is accurate again
    # without continue-on-error masking it.)
    outputs:
      heavy_result: ${{ steps.heavy.outcome }}
    env:
      E2I_TESTING_MODE: 'true'
      SUPABASE_URL: 'http://localhost:54321'
      SUPABASE_KEY: 'test-key'
      SUPABASE_ANON_KEY: 'test-key'
      REDIS_URL: 'redis://localhost:6379'
      # FALKORDB_URL intentionally unset — slow-tests lanes have no FalkorDB
      # service container (issue #183). Empty URL → conftest skips the probe
      # and reports ``FALKORDB: UNCONFIGURED`` cleanly.
      MLFLOW_TRACKING_URI: 'http://localhost:5000'
      OPIK_URL: 'http://localhost:5173'
      ANTHROPIC_API_KEY: 'test-key'
      OPENAI_API_KEY: 'test-key'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # Start Redis from the Ubuntu apt package instead of a `services:`
      # container. The container image (`redis:7-alpine`) is pulled from Docker
      # Hub when the job initializes; anonymous pulls hit Docker-Hub
      # rate-limits / registry timeouts (`docker pull ... context deadline
      # exceeded`, issue #649), failing "Initialize containers" and aborting
      # the whole job BEFORE any test runs. The apt package comes from the
      # Ubuntu mirror, never touches Docker Hub, and serves the same
      # `redis://localhost:6379` that REDIS_URL points at. If Redis were
      # somehow unavailable, `requires_redis` tests auto-skip rather than
      # erroring on `[Errno 111]`, so this step is best-effort. Mirrors the
      # ephemeral-redis pattern in backend-tests.yml.
      - name: Start Redis (apt, no Docker Hub pull)
        # Bounded + non-fatal (#1687): with no step timeout, a stalled apt ran
        # until the job `timeout-minutes` cap killed the whole job. The bound
        # plus continue-on-error makes the step match its best-effort contract
        # above — a hung/failed apt costs ≤5 min and a skip, never the job.
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo service redis-server start || redis-server --daemonize yes
          for i in $(seq 1 15); do
            if redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::warning::Redis did not respond to PING within 15s; requires_redis tests will skip."

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist pytest-timeout pytest-asyncio

      - name: Start MLflow tracking server
        run: |
          mkdir -p /tmp/mlflow-artifacts
          mlflow server \
            --host 0.0.0.0 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root /tmp/mlflow-artifacts \
            > /tmp/mlflow-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ > /dev/null 2>&1; then
              echo "MLflow server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "MLflow server failed to start; tail of log:"
          tail -50 /tmp/mlflow-server.log
          exit 1

      - name: Run excluded heavy e2e tests
        id: heavy
        # BLOCKING since #617: no continue-on-error — a test failure fails the
        # step (steps.heavy.outcome == 'failure') AND the job, red-Xing the
        # workflow. The `id: heavy` is kept so the outcome still feeds the
        # heavy_result output for the summary; the `Upload artifacts` step below
        # uses `if: always()` so debug artifacts still upload on failure.
        env:
          EXTRA_ARGS: ${{ inputs.extra_pytest_args }}
        run: |
          pytest \
            tests/integration/test_tier0_e2e.py \
            tests/integration/test_adaptive_criteria_e2e.py \
            tests/integration/test_model_trainer_evaluation_modes.py \
            --junitxml=/tmp/heavy-tests-junit.xml \
            -n 1 \
            --timeout=600 \
            -v --tb=short ${EXTRA_ARGS}

      - name: Upload artifacts on failure or cancel
        # Post-#617 the heavy step is blocking, so a heavy failure already makes
        # failure() true; no separate steps.heavy.outcome branch is needed.
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: heavy-tests-debug-${{ github.run_id }}
          path: |
            /tmp/mlflow-server.log
            mlflow.db
            /tmp/heavy-tests-junit.xml
          retention-days: 14
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────
  # Job C: memory-heavy performance tests (must-pass, serialized)
  # tests/performance/test_digital_twin_memory.py and siblings allocate
  # 2GB peak under tracemalloc. Under `-n 2 --dist=loadscope`, two
  # concurrent allocations + glibc fragmentation pushed `ubuntu-latest`'s
  # 7GB ceiling at the first PR-#73-validation run. Serialize at -n 1
  # in this dedicated job.
  #
  # Note: pytest-xdist `--dist=loadscope` does NOT honor `xdist_group`
  # marks (those need `loadgroup`). Excising the directory and running
  # at -n 1 here is cleaner than switching dist mode.
  # ──────────────────────────────────────────────────────────────────
  memory-perf-tests:
    name: Memory & Perf Tests (serialized)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2I_TESTING_MODE: 'true'
      SUPABASE_URL: 'http://localhost:54321'
      SUPABASE_KEY: 'test-key'
      SUPABASE_ANON_KEY: 'test-key'
      REDIS_URL: 'redis://localhost:6379'
      # FALKORDB_URL intentionally unset — slow-tests lanes have no FalkorDB
      # service container (issue #183). Empty URL → conftest skips the probe
      # and reports ``FALKORDB: UNCONFIGURED`` cleanly.
      MLFLOW_TRACKING_URI: 'http://localhost:5000'
      OPIK_URL: 'http://localhost:5173'
      ANTHROPIC_API_KEY: 'test-key'
      OPENAI_API_KEY: 'test-key'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # Start Redis from the Ubuntu apt package instead of a `services:`
      # container. The container image (`redis:7-alpine`) is pulled from Docker
      # Hub when the job initializes; anonymous pulls hit Docker-Hub
      # rate-limits / registry timeouts (`docker pull ... context deadline
      # exceeded`, issue #649), failing "Initialize containers" and aborting
      # the whole job BEFORE any test runs. The apt package comes from the
      # Ubuntu mirror, never touches Docker Hub, and serves the same
      # `redis://localhost:6379` that REDIS_URL points at. If Redis were
      # somehow unavailable, `requires_redis` tests auto-skip rather than
      # erroring on `[Errno 111]`, so this step is best-effort. Mirrors the
      # ephemeral-redis pattern in backend-tests.yml.
      - name: Start Redis (apt, no Docker Hub pull)
        # Bounded + non-fatal (#1687): with no step timeout, a stalled apt ran
        # until the job `timeout-minutes` cap killed the whole job. The bound
        # plus continue-on-error makes the step match its best-effort contract
        # above — a hung/failed apt costs ≤5 min and a skip, never the job.
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo service redis-server start || redis-server --daemonize yes
          for i in $(seq 1 15); do
            if redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::warning::Redis did not respond to PING within 15s; requires_redis tests will skip."

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist pytest-timeout pytest-asyncio

      - name: Start MLflow tracking server
        run: |
          mkdir -p /tmp/mlflow-artifacts
          mlflow server \
            --host 0.0.0.0 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root /tmp/mlflow-artifacts \
            > /tmp/mlflow-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ > /dev/null 2>&1; then
              echo "MLflow server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "MLflow server failed to start; tail of log:"
          tail -50 /tmp/mlflow-server.log
          exit 1

      - name: Run memory + performance tests serially
        env:
          EXTRA_ARGS: ${{ inputs.extra_pytest_args }}
        run: |
          pytest tests/performance/ -m slow \
            --junitxml=/tmp/memory-perf-junit.xml \
            -n 1 \
            --timeout=600 \
            -v --tb=short ${EXTRA_ARGS}

      - name: Upload artifacts on failure or cancel
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: memory-perf-tests-debug-${{ github.run_id }}
          path: |
            /tmp/mlflow-server.log
            mlflow.db
            /tmp/memory-perf-junit.xml
          retention-days: 14
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────
  # Job D: synthetic regime e2e tests (must-pass, isolated, -n 1)
  # tests/synthetic/test_synthetic_regimes.py forks `run_tier0_test.py`
  # twice (adverse + clean regimes), each ~5 min wall-clock and ~500MB
  # subprocess heap. Combined with the rest of Job A's slow tests,
  # the cumulative memory footprint pushed the runner to a hard kill
  # (3 consecutive runs ended with step 7 stuck in_progress + no
  # archived output, suggesting external runner termination).
  # Isolating these into their own -n 1 job gives them a clean
  # ~7 GB runner with no concurrent slow-test memory pressure.
  # ──────────────────────────────────────────────────────────────────
  synthetic-regime-tests:
    name: Synthetic Regime E2E (isolated)
    runs-on: ubuntu-latest
    # 50 (was 30): post-#773-W2-fix the two forked tier0 runs train their
    # Step-5b alternates for real, and hosted-runner CPU variance is extreme
    # (same commit: 165s suite on run 27443822891, >600s/runner on run
    # 27444890365). Must exceed 2 × the 1200s per-runner subprocess cap in
    # test_synthetic_regimes.py plus ~8 min setup (= 48 min worst case), so
    # the per-test timeout fires with artifacts BEFORE GitHub kills the job
    # (codex r2 MEDIUM).
    timeout-minutes: 50
    env:
      E2I_TESTING_MODE: 'true'
      SUPABASE_URL: 'http://localhost:54321'
      SUPABASE_KEY: 'test-key'
      SUPABASE_ANON_KEY: 'test-key'
      REDIS_URL: 'redis://localhost:6379'
      # FALKORDB_URL intentionally unset — slow-tests lanes have no FalkorDB
      # service container (issue #183). Empty URL → conftest skips the probe
      # and reports ``FALKORDB: UNCONFIGURED`` cleanly.
      MLFLOW_TRACKING_URI: 'http://localhost:5000'
      OPIK_URL: 'http://localhost:5173'
      ANTHROPIC_API_KEY: 'test-key'
      OPENAI_API_KEY: 'test-key'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # Start Redis from the Ubuntu apt package instead of a `services:`
      # container. The container image (`redis:7-alpine`) is pulled from Docker
      # Hub when the job initializes; anonymous pulls hit Docker-Hub
      # rate-limits / registry timeouts (`docker pull ... context deadline
      # exceeded`, issue #649), failing "Initialize containers" and aborting
      # the whole job BEFORE any test runs. The apt package comes from the
      # Ubuntu mirror, never touches Docker Hub, and serves the same
      # `redis://localhost:6379` that REDIS_URL points at. If Redis were
      # somehow unavailable, `requires_redis` tests auto-skip rather than
      # erroring on `[Errno 111]`, so this step is best-effort. Mirrors the
      # ephemeral-redis pattern in backend-tests.yml.
      - name: Start Redis (apt, no Docker Hub pull)
        # Bounded + non-fatal (#1687): with no step timeout, a stalled apt ran
        # until the job `timeout-minutes` cap killed the whole job. The bound
        # plus continue-on-error makes the step match its best-effort contract
        # above — a hung/failed apt costs ≤5 min and a skip, never the job.
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo service redis-server start || redis-server --daemonize yes
          for i in $(seq 1 15); do
            if redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::warning::Redis did not respond to PING within 15s; requires_redis tests will skip."

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist pytest-timeout pytest-asyncio

      - name: Start MLflow tracking server
        run: |
          mkdir -p /tmp/mlflow-artifacts
          mlflow server \
            --host 0.0.0.0 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root /tmp/mlflow-artifacts \
            > /tmp/mlflow-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ > /dev/null 2>&1; then
              echo "MLflow server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "MLflow server failed to start; tail of log:"
          tail -50 /tmp/mlflow-server.log
          exit 1

      - name: Run synthetic regime e2e tests serially
        env:
          EXTRA_ARGS: ${{ inputs.extra_pytest_args }}
        run: |
          pytest tests/synthetic/test_synthetic_regimes.py \
            --junitxml=/tmp/synthetic-regimes-junit.xml \
            -n 1 \
            --timeout=900 \
            --tb=short ${EXTRA_ARGS}

      - name: Upload artifacts on failure or cancel
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-regime-tests-debug-${{ github.run_id }}
          path: |
            /tmp/mlflow-server.log
            mlflow.db
            /tmp/synthetic-regimes-junit.xml
          retention-days: 14
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────
  # Job E: Phase-2 twin effect recovery/calibration (must-pass, sharded)
  # tests/ml/twin_effect/test_recovery_calibration.py fits full-size
  # CausalML uplift forests (n=6000, 300 trees) across 4 synthetic DGPs to
  # PROVE the estimator recovers known ATEs within 20%. Each fit is ~100s and
  # the suite is ~7 min serial, so it is sharded 2 ways via pytest-split
  # (mirrors the agents-tests shard in backend-tests.yml) to cap per-shard
  # wall time + memory. fail-fast:false so one shard's failure still lets the
  # other report. -n 0: serial within a shard (CausalML's own joblib already
  # parallelises the forest; an extra xdist layer only adds memory pressure).
  # ──────────────────────────────────────────────────────────────────
  twin-effect-recovery:
    name: Phase-2 Twin Effect Recovery (sharded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      E2I_TESTING_MODE: 'true'
      SUPABASE_URL: 'http://localhost:54321'
      SUPABASE_KEY: 'test-key'
      SUPABASE_ANON_KEY: 'test-key'
      REDIS_URL: 'redis://localhost:6379'
      # FALKORDB_URL intentionally unset — slow-tests lanes have no FalkorDB
      # service container (issue #183). Empty URL → conftest skips the probe
      # and reports ``FALKORDB: UNCONFIGURED`` cleanly.
      MLFLOW_TRACKING_URI: 'http://localhost:5000'
      OPIK_URL: 'http://localhost:5173'
      ANTHROPIC_API_KEY: 'test-key'
      OPENAI_API_KEY: 'test-key'
      # Pin BLAS/OpenMP thread counts to 1 — deterministic FP reductions and
      # lower memory contention under the CausalML forest fit.
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Free disk space on runner
        # The requirements.txt install (torch + CUDA, transformers, etc.)
        # exhausts the runner's default ~14 GB free, so pip crashes with
        # `[Errno 28] No space left on device`. Reclaim ~30 GB of unneeded
        # preinstalled caches. docker-images is TRUE: Redis runs from the apt
        # package (no service container), so no running container depends on
        # the preinstalled images and pruning them is safe. Mirrors the
        # agents-tests shard in backend-tests.yml.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false  # keep Python toolcache used by other jobs
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # Start Redis from the Ubuntu apt package instead of a `services:`
      # container. The container image (`redis:7-alpine`) is pulled from Docker
      # Hub when the job initializes; anonymous pulls hit Docker-Hub
      # rate-limits / registry timeouts (`docker pull ... context deadline
      # exceeded`, issue #649), failing "Initialize containers" and aborting
      # the whole job BEFORE any test runs. The apt package comes from the
      # Ubuntu mirror, never touches Docker Hub, and serves the same
      # `redis://localhost:6379` that REDIS_URL points at. If Redis were
      # somehow unavailable, `requires_redis` tests auto-skip rather than
      # erroring on `[Errno 111]`, so this step is best-effort. Mirrors the
      # ephemeral-redis pattern in backend-tests.yml.
      - name: Start Redis (apt, no Docker Hub pull)
        # Bounded + non-fatal (#1687): with no step timeout, a stalled apt ran
        # until the job `timeout-minutes` cap killed the whole job. The bound
        # plus continue-on-error makes the step match its best-effort contract
        # above — a hung/failed apt costs ≤5 min and a skip, never the job.
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo service redis-server start || redis-server --daemonize yes
          for i in $(seq 1 15); do
            if redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::warning::Redis did not respond to PING within 15s; requires_redis tests will skip."

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist pytest-timeout pytest-asyncio pytest-split

      - name: Start MLflow tracking server
        run: |
          mkdir -p /tmp/mlflow-artifacts
          mlflow server \
            --host 0.0.0.0 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root /tmp/mlflow-artifacts \
            > /tmp/mlflow-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ > /dev/null 2>&1; then
              echo "MLflow server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "MLflow server failed to start; tail of log:"
          tail -50 /tmp/mlflow-server.log
          exit 1

      - name: Phase-2 twin effect recovery (sharded)
        env:
          EXTRA_ARGS: ${{ inputs.extra_pytest_args }}
        run: |
          pytest tests/ml/twin_effect/ -m slow \
            --splits 2 --group ${{ matrix.shard }} \
            --junitxml=/tmp/twin-effect-recovery-junit.xml \
            -n 0 \
            --timeout=600 \
            -v --tb=short ${EXTRA_ARGS}

      - name: Upload artifacts on failure or cancel
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: twin-effect-recovery-debug-${{ github.run_id }}-shard${{ matrix.shard }}
          path: |
            /tmp/mlflow-server.log
            mlflow.db
            /tmp/twin-effect-recovery-junit.xml
          retention-days: 14
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────
  # End-of-run summary in the GH Actions UI.
  # ──────────────────────────────────────────────────────────────────
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs:
      [
        slow-tests,
        memory-perf-tests,
        synthetic-regime-tests,
        excluded-heavy-tests,
        twin-effect-recovery,
      ]
    if: always()
    steps:
      - name: Write summary
        env:
          JOB_A_RESULT: ${{ needs.slow-tests.result }}
          JOB_C_RESULT: ${{ needs.memory-perf-tests.result }}
          JOB_D_RESULT: ${{ needs.synthetic-regime-tests.result }}
          # Job B is blocking (#617); its .result is accurate. The heavy_result
          # output is surfaced here so the summary shows the heavy pytest step's
          # granular outcome distinctly from a job-level infra failure.
          JOB_B_RESULT: ${{ needs.excluded-heavy-tests.outputs.heavy_result }}
          # Job E is the matrix aggregate across both pytest-split shards.
          JOB_E_RESULT: ${{ needs.twin-effect-recovery.result }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "# Slow Tests Run Summary"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Slow Tests (tracked)        | ${JOB_A_RESULT} |"
            echo "| Memory & Perf (serialized)  | ${JOB_C_RESULT} |"
            echo "| Synthetic Regime E2E        | ${JOB_D_RESULT} |"
            echo "| Excluded Heavy E2E          | ${JOB_B_RESULT} (blocking) |"
            echo "| Twin Effect Recovery        | ${JOB_E_RESULT} (sharded) |"
            echo ""
            echo "Trigger: \`${EVENT_NAME}\` on \`${GIT_REF}\` @ \`${GIT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────
  # Auto-create / update issue on ANY job failure (Jobs A/C/D + Job B).
  # De-dups by `nightly-slow-tests-failure` label: comments on existing
  # open issue if one exists, else creates new.
  # #1804/#1813 distinct outcome: when the ONLY red lane is Job A and its
  # classify step verdicts upstream-transient (clinical-context live suite
  # on an upstream 5xx/timeout), the report goes to the low-priority
  # `[upstream-transient]`-titled rolling issue instead of this red alarm.
  # Job B (excluded-heavy) is BLOCKING since #617 — no longer continue-on-error,
  # so its `.result` is accurate and the alarm keys off it like A/C/D. This also
  # covers a Job B INFRA failure (pip install / mlflow boot) that never reached
  # the heavy pytest step — which the heavy_result output alone would miss.
  # `if: always()` is required because a `needs`-dependent job is SKIPPED by
  # default when any dependency fails; always() forces it to evaluate the `if`
  # condition (and thus fire the alarm) even when an upstream job has failed.
  # ──────────────────────────────────────────────────────────────────
  report-failure:
    name: Report Slow Tests Failure
    runs-on: ubuntu-latest
    needs:
      [
        slow-tests,
        memory-perf-tests,
        synthetic-regime-tests,
        excluded-heavy-tests,
        twin-effect-recovery,
      ]
    if: always() && github.event_name == 'schedule' && (needs.slow-tests.result == 'failure' || needs.memory-perf-tests.result == 'failure' || needs.synthetic-regime-tests.result == 'failure' || needs.excluded-heavy-tests.result == 'failure' || needs.twin-effect-recovery.result == 'failure')
    permissions:
      issues: write
    steps:
      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has NO actions/checkout, so the runner cwd is not a git
          # repo. Without GH_REPO, `gh issue list/create` below fail with
          # "fatal: not a git repository" under `set -euo pipefail`, silently
          # breaking the only nightly-rot alarm (it failed that way unnoticed
          # for 5+ days — #615). GH_REPO lets gh resolve the repo with no checkout.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_SHA: ${{ github.sha }}
          JOB_A_RESULT: ${{ needs.slow-tests.result }}
          JOB_C_RESULT: ${{ needs.memory-perf-tests.result }}
          JOB_D_RESULT: ${{ needs.synthetic-regime-tests.result }}
          # Blocking since #617 → .result is accurate and is what fired this alarm.
          JOB_B_RESULT: ${{ needs.excluded-heavy-tests.result }}
          # Job E (twin effect recovery) is the matrix aggregate across shards.
          JOB_E_RESULT: ${{ needs.twin-effect-recovery.result }}
          # #1804/#1813: Job A's own verdict on its failure, from the classify
          # step (scripts/ci/classify_slow_tests_failure.py). Empty unless Job A
          # failed AND the classifier ran to completion.
          JOB_A_CLASSIFICATION: ${{ needs.slow-tests.outputs.outage_classification }}
          JOB_A_CLASSIFY_DETAIL: ${{ needs.slow-tests.outputs.outage_detail }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          SHA_SHORT=$(echo "${GIT_SHA}" | cut -c1-7)
          RESULTS="A(tracked)=${JOB_A_RESULT}, C(mem/perf)=${JOB_C_RESULT}, D(regimes)=${JOB_D_RESULT}, B(heavy,blocking)=${JOB_B_RESULT}, E(twin-recovery)=${JOB_E_RESULT}"

          # ── #1804/#1813 routing: upstream provider outage ≠ red alarm ──
          # When the ONLY red lane is Job A and its classifier says every
          # failure was the clinical-context live suite hitting an upstream
          # 5xx/timeout, file into a low-priority rolling issue instead of the
          # red nightly alarm. The tests still went red (the #1612 signal is
          # untouched); only the REPORTING is distinct. Any other shape — a
          # second red lane, a 'real' verdict, or NO verdict (classifier never
          # ran / crashed / output plumbing broke) — falls through to the red
          # alarm below: fail-safe is always the alarm.
          UPSTREAM_TRANSIENT=false
          if [ "${JOB_A_RESULT}" = "failure" ] \
             && [ "${JOB_C_RESULT}" != "failure" ] \
             && [ "${JOB_D_RESULT}" != "failure" ] \
             && [ "${JOB_B_RESULT}" != "failure" ] \
             && [ "${JOB_E_RESULT}" != "failure" ] \
             && [ "${JOB_A_CLASSIFICATION:-}" = "upstream-transient" ]; then
            UPSTREAM_TRANSIENT=true
          fi
          echo "routing: ${RESULTS}; classification='${JOB_A_CLASSIFICATION:-<empty>}' -> upstream_transient=${UPSTREAM_TRANSIENT}"

          if [ "${UPSTREAM_TRANSIENT}" = true ]; then
            TITLE_PREFIX="[upstream-transient] "
            TITLE="${TITLE_PREFIX}Nightly clinical-context live suite hit an upstream provider outage"

            # Self-heal the label like maintenance-freshness.yml (#1807 D3):
            # use it when it exists, create it when we can (description under
            # GitHub's 100-char limit), and SAY why when we cannot — then file
            # without it. The record landing matters more than its colour.
            LABEL=nightly-upstream-transient
            LABEL_ARGS=()
            if gh label list --search "$LABEL" --json name --jq '.[].name' | grep -qxF "$LABEL"; then
              LABEL_ARGS=(--label "$LABEL")
            elif gh label create "$LABEL" \
                   --color FBCA04 \
                   --description "Nightly Job A red auto-classified as an upstream provider outage (5xx/timeout); low priority"; then
              LABEL_ARGS=(--label "$LABEL")
            else
              echo "::warning::could not create label '$LABEL' (error above) -- filing without it"
            fi

            # Dedup on the title prefix this workflow controls, NOT the label:
            # `gh issue list --label <missing>` silently returns nothing and a
            # label-keyed dedup would file a fresh issue per outage (#1807 D3).
            EXISTING=$(gh issue list \
              --state open \
              --limit 500 \
              --json number,title \
              --jq "[.[] | select(.title | startswith(\"${TITLE_PREFIX}\"))] | .[0].number // empty")

            BODY="$(printf "Upstream provider outage on %s (commit \`%s\`).\n\nClassifier verdict: %s\n\nJob results: %s\n\nRun: %s\n\nNo action needed for a lone occurrence — the live suite is DESIGNED to go red when a provider is down (#1612), and every failure in this run matched the upstream-outage shape (5xx/timeout, plus its static_fallback echoes). If this fires on many consecutive nights, the transient story stops being credible: check the provider's status page, then the client." "$DATE" "$SHA_SHORT" "${JOB_A_CLASSIFY_DETAIL:-<no detail>}" "$RESULTS" "$RUN_URL")"

            if [ -n "$EXISTING" ]; then
              echo "Commenting on existing upstream-transient issue #${EXISTING}"
              gh issue comment "$EXISTING" --body "$BODY"
            else
              echo "Creating new upstream-transient rolling issue"
              gh issue create \
                --title "$TITLE" \
                "${LABEL_ARGS[@]}" \
                --body "$(printf "%s\n\n_Auto-created by .github/workflows/slow-tests.yml (#1813). Later outages are added as comments; close any time — the next occurrence re-files._" "$BODY")"
            fi
            exit 0
          fi

          # Self-heal: ensure the dedup label exists BEFORE `gh issue create`.
          # `gh issue create --label <L>` does NOT auto-create the label — if it
          # is missing it dies "could not add label: '<L>' not found" under
          # `set -euo pipefail`. That muted this alarm even after the GH_REPO fix
          # (#615): the label did not exist and no workflow created it, so every
          # scheduled-failure run red-Xed at issue creation and filed ZERO issues.
          # `|| true` keeps it idempotent (no-op when the label already exists).
          gh label create nightly-slow-tests-failure \
            --color B60205 \
            --description "Auto-filed by slow-tests.yml when a nightly slow-tests lane (incl. blocking heavy e2e) fails" \
            2>/dev/null || true

          # Look for an existing open tracking issue.
          EXISTING=$(gh issue list \
            --state open \
            --label nightly-slow-tests-failure \
            --json number \
            --jq '.[0].number // empty' \
            --limit 1)

          if [ -n "$EXISTING" ]; then
            echo "Commenting on existing issue #${EXISTING}"
            gh issue comment "$EXISTING" \
              --body "$(printf "Nightly slow-tests failed again on %s (commit \`%s\`).\n\nJob results: %s\n\nRun: %s" "$DATE" "$SHA_SHORT" "$RESULTS" "$RUN_URL")"
          else
            echo "Creating new tracking issue"
            gh issue create \
              --title "Nightly slow-tests failed on ${DATE} (${SHA_SHORT})" \
              --label nightly-slow-tests-failure \
              --body "$(printf "Nightly slow-tests failed on %s (commit \`%s\`).\n\nJob results: %s\n\nRun: %s\n\n_Auto-created by .github/workflows/slow-tests.yml. This issue will be commented on for subsequent failures and should be closed manually after the underlying problem is fixed. Job B (excluded-heavy e2e) is a hard must-pass since #617 — a failure means the heavy e2e suites are broken, not an expected/allowed flake._" "$DATE" "$SHA_SHORT" "$RESULTS" "$RUN_URL")"
          fi
