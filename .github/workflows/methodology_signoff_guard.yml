name: Methodology Sign-off Guard

# Validates Gate N3 methodology sign-off / rejection artifacts on PR landing.
# Triggered when a PR adds or modifies a file matching the
# docs/results/optum_methodology_signoff_*.md or
# docs/results/optum_methodology_rejection_*.md pattern (excluding the
# template files, which the validator rejects by name).
#
# Issue #192 architecture (2026-05-14):
#
#   This workflow is now a THIN CALLER. It identifies the touched
#   methodology artifacts on the PR diff and delegates the actual
#   validation to the reusable workflow at
#   `.github/workflows/methodology-signoff-validator.yml`. The reusable
#   workflow does its OWN checkout of the protected `main` ref for the
#   validator SCRIPT (issue #192 H3 partial mitigation: the validator
#   *script* always runs from main, even if the PR edits its own copy).
#
#   IMPORTANT THREAT-MODEL HONESTY (codex pass-1 HIGH-1, 2026-05-14):
#     Same-repo path-pinned `uses: ./.github/workflows/...` loads the
#     reusable workflow YAML *from the same commit as the caller* (per
#     GitHub docs). Therefore a malicious PR can edit BOTH this caller
#     YAML AND the reusable workflow YAML in the same commit, and its
#     own modified workflow can swap out / weaken / disable the
#     `actions/checkout@v4 ref: main` step that loads the validator
#     script. The script-source pin is only load-bearing if the
#     workflow YAML that performs the pin is itself trustworthy.
#     Same-repo path-pinning expands the trusted computing base from
#     {validator script} to {validator script + both workflow YAMLs}
#     — narrower than the pre-#192 state ({validator script + caller
#     YAML, all from PR head}), but NOT a complete close.
#
#     The full close requires either:
#       (a) Move both workflow YAMLs + validator to a separate
#           governance repo and call as
#           `uses: org/governance-actions/.github/workflows/...@<sha>`
#           (cross-repo SHA-pinned).
#       (b) Use `pull_request_target` from main with strict checkout-
#           by-immutable-head-SHA semantics (more complex, runs in
#           trusted context with PR data — has its own threat model).
#
#     Until (a) or (b), the operator complement is REQUIRED:
#       * Branch protection on `main` (no force-push, requires PR).
#       * CODEOWNERS gate on `scripts/check_methodology_signoff.py`
#         AND on `.github/workflows/methodology_signoff_guard.yml`
#         AND on `.github/workflows/methodology-signoff-validator.yml`
#         requiring security-team review.
#     This makes a "weakening" PR visible to the security team for
#     review — same as the pre-#192 state, but with a narrower attack
#     surface (validator script edits no longer matter; only workflow
#     YAML edits do).
#
# H1 + H4 (registry-pinned GPG keyring + CoI body signature verify):
#   PARTIALLY RESOLVED 2026-05-14 (issue #226): code-side infrastructure
#   complete. The reusable workflow now (a) imports a curated reviewer
#   keyring from the `GPG_REVIEWER_KEYS_ARMOR_BASE64` repo secret into
#   a per-job `$KEYRING_DIR`, (b) passes `--keyring-dir` to the validator,
#   and (c) the validator's new `check_keyring_present` +
#   `check_coi_body_signature_verifies` checks gate the run with a new
#   STRICT_GPG=1 fail-closed escalation (exit code 4). Operator's residual
#   job: generate reviewer pubkeys + add the `GPG_REVIEWER_KEYS_ARMOR_BASE64`
#   secret + populate the `fingerprint` column in the reviewer registry md.
#   See `docs/governance/operator_gpg_keyring_setup.md` for the operator
#   handoff workflow. Items 1 + 4 in `docs/governance/n3_known_limitations_20260510.md`
#   are now PARTIALLY RESOLVED (code-side complete; awaits operator action).
#
# H2 / M1 (gh PR/review enforcement):
#   RESOLVED 2026-05-14 (issue #192). The reusable workflow now
#   provisions GH_TOKEN (via the auto-provided secrets.GITHUB_TOKEN)
#   AND exports STRICT_GH=1 so the validator returns exit code 3 when
#   any check has provenance_check_skipped=True. Local devs running
#   the script ad-hoc retain warn-only back-compat (no STRICT_GH set).
#
# H3 (validator-from-protected-ref):
#   PARTIALLY RESOLVED 2026-05-14 (issue #192) — see threat-model
#   honesty note above. The validator *script* now always runs from
#   `main` (load-bearing), but both workflow YAMLs are still loaded
#   from caller's ref. The full close requires cross-repo SHA-pinned
#   invocation (decision pending) PLUS the operator branch-protection +
#   CODEOWNERS complement (already required pre-#192).

on:
  pull_request:
    paths:
      - 'docs/results/optum_methodology_signoff_*.md'
      - 'docs/results/optum_methodology_rejection_*.md'
      - 'docs/governance/methodology_reviewer_registry.md'
      - 'docs/governance/coi_declarations/**'
      - 'scripts/check_methodology_signoff.py'
      - '.github/workflows/methodology_signoff_guard.yml'
      - '.github/workflows/methodology-signoff-validator.yml'
  workflow_dispatch:

permissions:
  # Caller workflow only needs to read the PR diff to enumerate touched
  # artifacts. The reusable workflow declares its own (slightly broader)
  # permissions for the gh-CLI provenance queries.
  contents: read
  pull-requests: read

jobs:
  identify:
    name: Identify touched artifacts
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.touched.outputs.files }}
      has_files: ${{ steps.touched.outputs.has_files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history needed for `git diff <base>...<head>`.
          fetch-depth: 0

      - name: Identify touched artifacts
        id: touched
        # On pull_request events GH Actions exposes the merge ref. We diff
        # against the PR base to find the artifacts in scope. On
        # workflow_dispatch we fall through to scanning all dated artifacts.
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            git fetch origin "$BASE" --depth=1 || true
            CHANGED=$(git diff --name-only --diff-filter=AM "$BASE...$HEAD" -- \
              'docs/results/optum_methodology_signoff_*.md' \
              'docs/results/optum_methodology_rejection_*.md' \
              || true)
          else
            CHANGED=$(find docs/results \
              -maxdepth 1 \
              -type f \
              \( -name 'optum_methodology_signoff_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].md' \
                 -o -name 'optum_methodology_rejection_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].md' \) \
              || true)
          fi

          # Filter out template files AND collapse whitespace-only lines so
          # the downstream "are there any files?" guard isn't fooled by an
          # accidental trailing newline. (M3.)
          FILTERED=$(printf '%s\n' "$CHANGED" \
            | grep -v '_template.md$' \
            | grep -v '^[[:space:]]*$' \
            || true)

          # Persist for the downstream reusable-workflow call (multi-line
          # output uses GH's heredoc).
          {
            echo "files<<EOF"
            echo "$FILTERED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # H3 / M3: separate, explicit boolean output that the downstream
          # job's `if:` gates on. ``-n`` returns true when the string is
          # non-empty AFTER whitespace-only lines have been stripped above.
          if [ -n "$FILTERED" ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "Will delegate validation of the following artifacts to the reusable workflow:"
            echo "$FILTERED"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No methodology artifacts in scope; the reusable workflow will be skipped."
          fi

      - name: No-op summary
        if: steps.touched.outputs.has_files != 'true'
        run: |
          echo "## Methodology Sign-off Guard" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_No methodology artifacts touched by this PR — guard was a no-op._" >> "$GITHUB_STEP_SUMMARY"

  # Issue #192 H3: delegate to the reusable workflow which loads the
  # validator script from the protected `main` ref (HARDCODED inside the
  # reusable workflow per codex pass-2 LOW-1). This is the same-repo
  # equivalent of `uses: org/governance-actions/...@<sha>` until the
  # cross-org migration happens.
  validate:
    name: Delegate to protected-ref validator
    needs: identify
    if: needs.identify.outputs.has_files == 'true'
    uses: ./.github/workflows/methodology-signoff-validator.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      touched_files: ${{ needs.identify.outputs.files }}
      strict_gh: '1'
      # Issue #226 H1+H4: fail-closed when keyring is missing or CoI
      # body signature is absent. Set '0' to opt out for early-stage
      # runs before the operator has provisioned the
      # GPG_REVIEWER_KEYS_ARMOR_BASE64 secret. See
      # docs/governance/operator_gpg_keyring_setup.md.
      strict_gpg: '1'
    # Least privilege (Semgrep secrets-inherit rule): pass ONLY the secret the
    # reusable validator declares, rather than inheriting all repo secrets.
    # GITHUB_TOKEN is provided to reusable workflows automatically.
    secrets:
      GPG_REVIEWER_KEYS_ARMOR_BASE64: ${{ secrets.GPG_REVIEWER_KEYS_ARMOR_BASE64 }}
