    icon: warning
    groups: [ml-lifecycle]
    status: active
    visibility: normal
    writeback: disabled
    primaryKey: driftEventId
    titleProperty: driftType
    datasources:
      - dataset: ds-curated-ml-drift-history
        branch: master
    properties:
      - { apiName: driftEventId, column: id, baseType: string, description: "UUID PK." }
      - { apiName: modelId, column: model_id, baseType: string,
          description: "UUID FK to ml_model_registry.id (canonical post-#842)." }
      - { apiName: experimentId, column: experiment_id, baseType: string, description: "Nullable." }
      - { apiName: driftType, column: drift_type, baseType: string,
          description: "drift_type_enum: data | model | concept." }
      - { apiName: featureName, column: feature_name, baseType: string,
          description: "Affected feature; NULL for model/concept drift." }
      - { apiName: testType, column: test_type, baseType: string,
          description: "statistical_test_enum: psi | ks | chi_square | wasserstein | js_divergence | importance_correlation." }
      - { apiName: testStatistic, column: test_statistic, baseType: double }
      - { apiName: pValue, column: p_value, baseType: double }
      - { apiName: driftDetected, column: drift_detected, baseType: boolean }
      - { apiName: severity, column: severity, baseType: string,
          description: "drift_severity_enum: none | low | medium | high | critical. 'warning' is INVALID (22P02); the repo aliases warning->high. DB trigger auto-creates ml_monitoring_alerts at medium+." }
      - { apiName: baselineStart, column: baseline_start, baseType: timestamp,
          description: "NOT NULL; CHECK baseline_end <= current_start." }
      - { apiName: currentEnd, column: current_end, baseType: timestamp }
      - { apiName: baselineCount, column: baseline_count, baseType: integer }
      - { apiName: currentCount, column: current_count, baseType: integer }
      - { apiName: driftScore, column: drift_score, baseType: double, description: "Normalized 0-1." }
      - { apiName: rawResults, column: raw_results, baseType: struct }
      - { apiName: createdAt, column: created_at, baseType: timestamp }

  # ------------------------------------------------------------- agentic-layer
  - id: agent
