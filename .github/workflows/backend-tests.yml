name: Backend Tests

on:
  push:
    branches: [main, develop]
    paths:
      # Note: `feature_repo/**` is intentionally excluded — Feast apply
      # has its own dedicated workflow (`feast-apply.yml`) so changes
      # under `feature_repo/` do not trigger the heavy backend test
      # matrix unnecessarily. (3B-M-3)
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:
  workflow_call:

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff==0.14.10

      - name: Run Ruff linter
        run: ruff check src/ tests/

      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/

  # NOTE: feast-apply moved to .github/workflows/feast-apply.yml so
  # changes under feature_repo/** do not trigger the full backend test
  # matrix. See "Feast Apply & Idempotency" workflow. (3B-M-3, 3B-M-7)

  type-check:
    name: Type Check (MyPy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy==1.15.0

      - name: Run MyPy
        run: mypy src/ --ignore-missing-imports --no-error-summary || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    env:
      E2I_TESTING_MODE: 'true'
      SUPABASE_URL: 'http://localhost:54321'
      SUPABASE_KEY: 'test-key'
      REDIS_URL: 'redis://localhost:6379'
      FALKORDB_URL: 'redis://localhost:6380'
      MLFLOW_TRACKING_URI: 'http://localhost:5000'
      OPIK_URL: 'http://localhost:5173'
      ANTHROPIC_API_KEY: 'test-key'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist pytest-timeout pytest-asyncio

      - name: Run unit tests with coverage
        run: |
          pytest \
            tests/unit/test_api/ \
            tests/unit/test_utils/ \
            tests/unit/test_repositories/ \
            tests/unit/test_workers/ \
            tests/unit/test_kpi/ \
            tests/unit/test_services/ \
            tests/unit/test_nlp/ \
            tests/unit/test_memory/ \
            tests/unit/test_database/ \
            tests/unit/test_scripts/ \
            tests/unit/api/ \
            tests/unit/security/ \
            tests/unit/observability/ \
            --ignore=tests/unit/test_api/test_chatbot_tools.py \
            --ignore=tests/unit/test_api/test_episodic_memory_bridge.py \
            --ignore=tests/unit/test_api/test_cors_configuration.py \
            --ignore=tests/unit/test_api/test_dependencies/test_auth.py \
            --ignore=tests/unit/test_api/test_routes/test_chatbot_graph.py \
            --ignore=tests/unit/test_api/test_routes/test_chatbot_tools.py \
            --ignore=tests/unit/test_api/test_routes/test_copilotkit.py \
            --ignore=tests/unit/test_api/test_routes/test_explain.py \
            --ignore=tests/unit/test_api/test_routes/test_feedback.py \
            --ignore=tests/unit/test_api/test_routes/test_resource_optimizer.py \
            --ignore=tests/unit/test_repositories/test_query_logger.py \
            --ignore=tests/unit/api/dependencies/test_auth_roles.py \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --cov-fail-under=20 \
            -n 2 \
            --dist=loadscope \
            --timeout=30 \
            -v --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 14

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2I_TESTING_MODE: 'true'
      SUPABASE_URL: 'http://localhost:54321'
      SUPABASE_KEY: 'test-key'
      SUPABASE_ANON_KEY: 'test-key'
      REDIS_URL: 'redis://localhost:6379'
      FALKORDB_URL: 'redis://localhost:6380'
      MLFLOW_TRACKING_URI: 'http://localhost:5000'
      OPIK_URL: 'http://localhost:5173'
      ANTHROPIC_API_KEY: 'test-key'
      OPENAI_API_KEY: 'test-key'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist pytest-timeout pytest-asyncio

      # Start a local MLflow tracking server so the synthetic baseline
      # invariant e2e (test_synthetic_baseline_invariant.py) can run with
      # MLflow enabled — preserving baseline equivalence with local-dev
      # measurements (docs/results/tier0_pipeline_run_20260428_130229.md).
      # Backed by SQLite + tmpfs artifact root; lifetime = job duration.
      - name: Start MLflow tracking server
        run: |
          mkdir -p /tmp/mlflow-artifacts
          mlflow server \
            --host 0.0.0.0 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root /tmp/mlflow-artifacts \
            > /tmp/mlflow-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ > /dev/null 2>&1; then
              echo "MLflow server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "MLflow server failed to start; tail of log:"
          tail -50 /tmp/mlflow-server.log
          exit 1

      # Integration test exclusions:
      # - chatbot/RAG/signal_flow/observability/prediction/digital_twin/feedback_loop:
      #     require live LLM/observability/RAG infra not available in CI.
      # - test_tier0_e2e + test_adaptive_criteria_e2e + test_model_trainer_evaluation_modes:
      #     long-running e2e suites (OOM / >60s timeout).
      # - test_migration/: requires Supabase/PostgREST.
      # - test_agents/test_data_preparer/: requires Supabase + feature store
      #     per commit 8f97a92e (2026-02-04). Re-evaluated 2026-05-05 during
      #     Shard A of the TypedDict→Pydantic migration; environmental reason
      #     still valid (no Supabase in GitHub Actions). DataPreparerState
      #     migration is verified instead via tests/unit/test_ml_foundation_schemas.py
      #     and tests/integration/test_agents/test_state_checkpoint_replay.py.
      # - api/test_rbac_endpoints.py: needs live API.
      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            --ignore=tests/integration/test_chatbot_dspy.py \
            --ignore=tests/integration/test_chatbot_graph.py \
            --ignore=tests/integration/test_cognitive_rag_orchestrator_routing.py \
            --ignore=tests/integration/test_rag_orchestrator_integration.py \
            --ignore=tests/integration/test_signal_flow/test_recipient_prompts.py \
            --ignore=tests/integration/test_signal_flow/test_sender_signals.py \
            --ignore=tests/integration/test_signal_flow/test_e2e_signal_flow.py \
            --ignore=tests/integration/test_observability_integration.py \
            --ignore=tests/integration/test_prediction_flow.py \
            --ignore=tests/integration/test_tier0_e2e.py \
            --ignore=tests/integration/test_adaptive_criteria_e2e.py \
            --ignore=tests/integration/test_model_trainer_evaluation_modes.py \
            --ignore=tests/integration/test_migration/ \
            --ignore=tests/integration/test_digital_twin_workflow.py \
            --ignore=tests/integration/test_feedback_loop_integration.py \
            --ignore=tests/integration/test_agents/test_data_preparer/ \
            --ignore=tests/integration/api/test_rbac_endpoints.py \
            -n 2 \
            --dist=loadscope \
            --timeout=60 \
            -v --tb=short

  ci-success:
    name: Backend CI Success
    runs-on: ubuntu-latest
    needs: [lint, type-check, unit-tests, integration-tests]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint failed"
            exit 1
          fi
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          echo "All backend CI jobs passed!"
