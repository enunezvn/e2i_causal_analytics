name: RPC vs DDL Column Guard

# Memory-system audit 2026-06-05, Rec 5 / F1. Static guard that diffs every
# CREATE FUNCTION's `<alias>.<column>` references against the table's actual
# CREATE TABLE / ALTER TABLE ADD COLUMN DDL, for unambiguous single-source
# functions (the `016` shape). Catches the class of defect mocked unit tests
# miss — an RPC referencing columns the table does not define.
#
# Failure semantics (mirrors feature_contract_guard.yml / g3_wiring_guard.yml):
#   * exit 0 — no phantom references; build passes.
#   * exit 1 — phantom references found; stderr names each
#     `<file>: <function>() references <alias>.<col> -> table '<t>' has no column`.
#   * exit 2 — discovery error (no .sql found, parse failure). Build fails fast.
#
# Blocking: migration 031 retires the only known baseline (the `016` RPCs), and
# the guard excludes functions dropped by a later migration, so the real schema
# is clean. A new RPC that references a phantom column now FAILS the build.
#
# Validator is stdlib-only (no DB, no third-party deps); the faithful
# environment for a "does this column exist?" question is the schema source,
# which the guard reads directly.

on:
  pull_request:
    paths:
      - "database/**/*.sql"
      - "scripts/ci/rpc_ddl_column_guard.py"
      - ".github/workflows/rpc_ddl_guard.yml"
  push:
    branches: [main]
    paths:
      - "database/**/*.sql"
      - "scripts/ci/rpc_ddl_column_guard.py"

jobs:
  rpc-ddl-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run RPC↔DDL column guard (blocking)
        run: python scripts/ci/rpc_ddl_column_guard.py
